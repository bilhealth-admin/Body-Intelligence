      <h1>BIL Health legal and privacy information</h1>
      <p><strong>Last updated: 24 September 2026.</strong> These essential documents remain readable when JavaScript is unavailable. BIL is an adults-only wellness tool, not a medical device or emergency service.</p>

      <h2>Privacy policy</h2>
      <p>BIL processes account information; health and wellness records you enter or authorize; food searches; voice transcripts; meal-analysis images; AI Coach questions; profile, Community and support content; purchase verification results; and limited security, diagnostics and operational metadata. Core local logging can be used without an account. Cloud sync, remote AI, notifications, connected health, camera and microphone access remain optional and controlled by explicit choices or operating-system permissions.</p>
      <p>When you expressly use AI Coach, the text you submit and the minimum relevant context you approve can be sent through BIL's protected backend to Google Gemini to produce the requested response. When you expressly use Meal Photo analysis, the selected image and the request context needed for analysis can be sent through that backend to Google Gemini. BIL identifies the recipient and the data categories before the first transfer and asks for permission. AI data is used to provide the requested feature, safety, abuse prevention and operational reliability—not to sell personal data or personalize advertising.</p>
      <p>You may decline or withdraw remote-AI consent and continue using available local features. You may disable cloud sync and device permissions, export eligible data, or start account deletion from the app. Data is retained only for the service, legal, security and backup periods described in the full interactive policy; deletion requests remove or de-identify eligible production data after identity and legal checks. BIL applies access controls, encryption in transit, encrypted cloud-key custody where applicable, audit controls and data minimization, but no system can guarantee absolute security.</p>
      <p>Service providers include Supabase for authentication and protected backend services, Google Gemini for user-requested AI processing, USDA for fallback food search, Apple or Google for store purchases and connected platform services, Meta for optional Facebook Login, and Google Mobile Ads only where contextual advertising is enabled on supported Android builds. For privacy access, correction, export, objection, withdrawal or deletion, email <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a> from the account address.</p>

      <h2 id="terms">Terms of use</h2>
      <p>You must be at least 18. BIL provides informational wellness estimates and is not a substitute for professional medical advice, diagnosis or treatment. Do not use it for emergencies. You remain responsible for decisions based on your entries, connected-source data and AI-generated output. Do not misuse the service, violate another person's rights, attempt unauthorized access, or publish unsafe or unlawful Community content. Availability and features may change while preserving rights required by law.</p>

      <h2 id="subscription-terms">Subscription terms</h2>
      <p>Paid access is offered through Apple App Store or Google Play. The store checkout is the authoritative source for the product, price, currency, billing period, taxes, trial and renewal terms. Subscriptions renew unless cancelled through the applicable store before renewal. Cancellation stops future renewal but does not ordinarily refund the current period except where required by law or store policy. Restore Purchases and Manage Subscription use the applicable store account; entitlement is granted only after verified store/server confirmation.</p>

      <h2 id="account-deletion">Account deletion</h2>
      <p>In BIL, use <strong>More → Help → Delete Account</strong> to start full account deletion. Deleting the app alone does not delete the cloud account. If you cannot sign in, email <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a> from the account address. BIL verifies the request, removes or de-identifies eligible account and cloud data, and retains only limited records required for security, fraud prevention, legal obligations, store accounting or time-limited backups. You can separately clear local records, disconnect a source or disable cloud sync when full account deletion is not desired.</p>

      <p><a href="mailto:support@bilhealth.com">support@bilhealth.com</a> · <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a></p>
