<nav lang="ar" dir="rtl" aria-label="وثائق BIL"><ul><li><a href="/privacy?lang=ar">سياسة الخصوصية</a></li><li><a href="/terms?lang=ar">شروط الاستخدام</a></li><li><a href="/account-deletion?lang=ar">حذف حساب BIL</a></li><li><a href="/data-deletion?lang=ar">حذف البيانات وخيارات الخصوصية</a></li><li><a href="/subscription-terms?lang=ar">شروط الاشتراكات</a></li><li><a href="/health-disclaimer?lang=ar">إخلاء المسؤولية الصحي</a></li><li><a href="/support?lang=ar">الدعم</a></li><li><a href="/community-guidelines?lang=ar">إرشادات المجتمع</a></li><li><a href="/contact?lang=ar">تواصل مع BIL Health</a></li></ul></nav>
      <div lang="en" dir="ltr" data-bil-fallback-document="/privacy"><div class="page-shell"><header class="page-hero"><span class="eyebrow">TRUST CENTER</span><h1>Privacy policy</h1><p>This policy explains how BIL Health handles personal information when you use Body Intelligence Log (BIL), its cloud features, AI tools, connected-health integrations, website, and support channels.</p><div class="document-meta"><span>Official BIL Health document</span><span>Last updated: 23 October 2026</span><span>bilhealth.com</span></div></header><div class="document-layout"><aside class="toc" aria-label="On this page"><strong>On this page</strong><a href="#noscript-en-privacy-scope">Who is responsible</a><a href="#noscript-en-privacy-data">Information we process</a><a href="#noscript-en-privacy-collection">How data reaches BIL</a><a href="#noscript-en-privacy-facebook-login">Optional Facebook Login</a><a href="#noscript-en-privacy-purpose">Why we use information</a><a href="#noscript-en-privacy-ai">AI, voice, and photos</a><a href="#noscript-en-privacy-translation">Community and food-search translation</a><a href="#noscript-en-privacy-sharing">Processors and disclosure</a><a href="#noscript-en-privacy-website">Website storage and edge delivery</a><a href="#noscript-en-privacy-retention">Retention and deletion</a><a href="#noscript-en-privacy-rights">Your choices and rights</a><a href="#noscript-en-privacy-security">Security and international processing</a><a href="#noscript-en-privacy-children">Adults only and changes</a></aside><article class="document"><section class="legal-section callout" id="noscript-en-privacy-scope"><h2>Who is responsible</h2><p>BIL Health is the product publisher and data controller for developer-operated services. Contact <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a> for privacy requests. Store operators, device platforms, and services you independently choose may act under their own privacy terms.</p></section><section class="legal-section " id="noscript-en-privacy-data"><h2>Information we process</h2><ul><li><b>Account:</b> email address, optional display name, and account identifier. New account creation does not request a phone number. Phone numbers supplied through an earlier registration flow may remain in existing account metadata subject to the retention and account-deletion controls below. Supabase also processes authentication and security events, IP address, and user-agent metadata.</li><li><b>Health and wellness:</b> profile details, age range or date of birth, biological sex where supplied, dietary preferences, nutrition, meals, water, weight, measurements, activity, sleep, goals, and notes.</li><li><b>Connected sources:</b> records you authorize through HealthKit or Health Connect, plus readings from compatible external fitness devices. These records remain on the device or in the source platform by default.</li><li><b>Search:</b> after local food sources return no match, the food search text and locale can be sent through the signed-in account session to BIL’s trusted gateway and USDA. BIL does not retain a dedicated search-history record or use the text for advertising, but treats this authenticated processing as linked to the account for store privacy disclosure.</li><li><b>User and community content:</b> AI questions and recognized voice transcripts; meal-analysis images; a selected profile photo that can be uploaded and shown as your public Community avatar; Community profile/biography, post text, images and audience; access-controlled private messages; reports; food submissions, peer reviews and label/evidence images; feedback; and support requests. Community visibility follows the audience you choose. Private messages are stored with access controls but are not end-to-end encrypted.</li><li><b>Commerce and technical data:</b> store product, entitlement and receipt-verification results, a cloud-sync device identifier, product interactions, AI request/token/provider and latency records, language, app version, device platform, security diagnostics, and limited operational logs. Where contextual free-tier ads are available on supported Android and iOS builds where ads are enabled, Google Mobile Ads may automatically process IP address (which can estimate general location), product interactions, diagnostics, and device or account identifiers for advertising delivery, analytics and fraud prevention. BIL does not receive your full payment-card number.</li></ul></section><section class="legal-section " id="noscript-en-privacy-collection"><h2>How data reaches BIL</h2><p>Most information is entered by you or imported only after a platform permission. The local-first diary works without a cloud account. Cloud sync is optional and selective: profile/body settings, weight and hydration use the enabled sync scope. Nutrition and goal backup require their own explicit choices on supported builds. Saved Smart Plans stay on the device unless you separately enable plan backup; that backup sends plan settings, schedules, meal suggestions, confirmed completion state and revisions to your access-controlled Supabase account store. Plan suggestions are not logged food or completed activity. You can export or delete saved plans and stop plan backup from More → Sharing & Privacy → Saved plan data. A deletion marker may remain to prevent a deleted plan from being restored by another device. Plan backup does not automatically copy HealthKit or Health Connect records. Remote AI is separate: only after you ask the AI Coach, BIL creates a bounded context for that answer, which can include dietary preferences and recent nutrition, weight, activity, sleep, or verified connected-health summaries. Image analysis, purchases, push notifications, community tools, and device connections likewise activate only when configured and requested.</p></section><section class="legal-section " id="noscript-en-privacy-facebook-login"><h2>Optional Facebook Login</h2><p>If Facebook Login is available and you choose it, Meta authenticates you and may provide BIL and its authentication processor, Supabase, with an app-scoped Facebook user identifier and public-profile information returned by Meta, such as your name and profile picture. Your email address is received only when you grant the email permission and Meta makes it available. BIL requests only <b>public_profile</b> and <b>email</b> for this flow and uses the result only to create, sign in to, secure, or link your BIL account. BIL does not post to Facebook or use Facebook account data to personalize health, nutrition, AI, or advertising. You can disconnect the provider where available or delete the BIL account and associated eligible data through the in-app controls or the <a href="/account-deletion">Account deletion</a> page.</p></section><section class="legal-section " id="noscript-en-privacy-purpose"><h2>Why we use information</h2><ul><li>Provide logging, goals, calculations, charts, reports, synchronization, restore, and support.</li><li>Personalize requested insights and AI Coach responses.</li><li>Authenticate accounts, protect the service, prevent abuse, and verify purchases.</li><li>Meet legal obligations and resolve disputes.</li></ul><p>Where law requires a legal basis, BIL relies on performance of the service you request, consent for optional sensitive features, legitimate interests in security and reliability, and legal obligations. You may withdraw consent without affecting earlier lawful processing.</p></section><section class="legal-section " id="noscript-en-privacy-ai"><h2>AI, voice, and photos</h2><p><b>AI Coach:</b> only after a separate opt-in, BIL sends the question and the bounded categories selected for that request—such as weight, goals and measurements; nutrition, meals, water and preferences; activity and training; sleep and habits; verified connected-health summaries; and up to 12 recent conversation turns—to <b>Google Gemini, a third-party AI service operated by Google</b>, to generate the requested answer. Voice capture starts only after you press the microphone. Apple or another platform speech service may convert that initiated audio under its own terms; BIL and Google Gemini receive the recognized text, not raw microphone audio, from the current app.</p><p><b>Meal-photo analysis:</b> after a separate consent prompt, BIL sends the image you select, app language and necessary technical request metadata to Google Gemini to suggest foods and portions for your review. Nothing is added to the diary until you confirm it. You may decline either AI consent and continue using available local/manual features. Withdraw AI Coach consent in AI Coach settings and meal-photo consent in Privacy settings; withdrawal stops new transmissions. BIL retains limited AI usage, cost, security and reliability metadata, but does not add the submitted photo to a meal record unless you separately confirm the result. Provider processing is subject to BIL’s configured processor terms. AI can be wrong and is not medical advice.</p></section><section class="legal-section " id="noscript-en-privacy-translation"><h2>Community and food-search translation</h2><p>Online food search may send the search phrase and language through BIL to USDA, with Google Cloud Translation translating the phrase and food names. Your private diary and AI Coach conversations are not automatically included.</p><p>When you choose Translate, BIL sends the selected community text and target language through its authenticated service to Google Cloud Translation. Private health diaries and AI Coach context are not automatically included. Translation can be inaccurate; consult the original text.</p></section><section class="legal-section " id="noscript-en-privacy-sharing"><h2>Processors and disclosure</h2><p>BIL may use Supabase for authentication, authenticated cloud storage, support records and server functions; Apple or Google for distribution, billing, speech and connected-fitness permissions; Google Gemini for requested remote AI processing; and Google Mobile Ads for contextual, non-personalized or limited ads where enabled on supported Android and iOS builds where ads are enabled. Supabase service and authentication logs can include user ID, IP address, user agent, request/response metadata and operational diagnostics for security, abuse prevention and reliability. Ads are excluded for guests and paid users. Before any eligible registered adult Free-user ad request, Google UMP is the authoritative consent gate where required. Google Mobile Ads must never receive BIL health, nutrition, weight, profile, search, precise-location, private-community, or AI-conversation content from BIL for targeting. Health data is not sold, shared with data brokers, or used to target ads. We may disclose limited information when legally required or to protect users and the service.</p></section><section class="legal-section " id="noscript-en-privacy-website"><h2>Website storage and edge delivery</h2><p>The public BIL website stores only your language choice in browser local storage. It does not currently set BIL marketing cookies or load a BIL web-analytics beacon. Cloudflare delivers and protects the public site and may process IP address, user agent, requested URL and time, network/security signals, and operational diagnostics under its role and retention terms. The public website does not read the private diary or connected-health data from the BIL app.</p></section><section class="legal-section " id="noscript-en-privacy-retention"><h2>Retention and deletion</h2><p>Local records remain until you delete them or the app data. Cloud records remain while your account and the related feature are active, then are deleted or de-identified according to the deletion workflow, backups, fraud-prevention needs, and legal retention duties. AI usage, performance and operational logs are minimized and retained under service-security and quota requirements. Store transaction records may remain with Apple or Google under their rules.</p></section><section class="legal-section " id="noscript-en-privacy-rights"><h2>Your choices and rights</h2><ul><li>Use core local logging without creating an account.</li><li>Enable or disable remote AI, cloud synchronization, notifications, device access, camera, microphone, and connected-health permissions.</li><li>Access, correct, export, or delete eligible information in the app.</li><li>Initiate full account deletion at <a href="/account-deletion">Account deletion</a>.</li><li>Object, restrict processing, withdraw consent, or lodge a complaint with your local data-protection authority where applicable.</li></ul><p>Email <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a> from your account address so BIL can verify the request without asking you to send raw health exports.</p></section><section class="legal-section " id="noscript-en-privacy-security"><h2>Security and international processing</h2><p>BIL uses encrypted transport, platform-protected credentials, access controls, row-level authorization, redacted app diagnostics, and verified server boundaries. Supabase infrastructure still records the limited authentication, IP, user-agent and request diagnostics described above. No system is perfectly secure. Cloud providers may process data in countries outside yours under contractual and legal safeguards appropriate to the service.</p></section><section class="legal-section " id="noscript-en-privacy-children"><h2>Adults only and changes</h2><p>BIL is intended only for adults aged 18 or older and is not directed to children or minors. People under 18 must not create or use a BIL account or its local services. Material policy changes will be posted here with a new effective date and, when appropriate, surfaced in the app.</p></section></article></div></div></div>
<div lang="en" dir="ltr" data-bil-fallback-document="/subscription-terms"><div class="page-shell"><header class="page-hero"><span class="eyebrow">COMMERCE</span><h1>Subscription terms</h1><p>BIL displays only plans and prices returned by the user’s verified Apple or Google storefront. Website text does not override the store checkout screen.</p><div class="document-meta"><span>Official BIL Health document</span><span>Last updated: 23 September 2026</span><span>bilhealth.com</span></div></header><div class="document-layout"><aside class="toc" aria-label="On this page"><strong>On this page</strong><a href="#noscript-en-subscription-terms-plans">Plans and regional availability</a><a href="#noscript-en-subscription-terms-community">Community is part of BIL Free</a><a href="#noscript-en-subscription-terms-billing">Billing and renewal</a><a href="#noscript-en-subscription-terms-ai">AI allowances and Boost</a><a href="#noscript-en-subscription-terms-cancel">Cancellation and refunds</a><a href="#noscript-en-subscription-terms-restore">Restore purchases</a><a href="#noscript-en-subscription-terms-changes">Price or plan changes</a><a href="#noscript-en-subscription-terms-support">Billing support</a></aside><article class="document"><section class="legal-section callout" id="noscript-en-subscription-terms-plans"><h2>Plans and regional availability</h2><p>BIL may offer Free, BIL Premium, BIL Premium AI Coach, and BIL AI Boost. Availability differs by country and storefront economics. In some regions AI usage is offered through token-based Boost rather than an AI-inclusive subscription.</p></section><section class="legal-section " id="noscript-en-subscription-terms-community"><h2>Community is part of BIL Free</h2><p>Community, friends and private messages are included in BIL Free for signed-in adults. No Premium subscription or AI Boost purchase is required for these features. Community Guidelines, consent, privacy controls, blocking, reporting, and moderation continue to apply. This does not cancel or reprice an existing subscription, change other paid features, or alter AI token balances.</p></section><section class="legal-section " id="noscript-en-subscription-terms-billing"><h2>Billing and renewal</h2><p>The store shows the final localized price, currency, tax, billing interval, and any introductory offer before confirmation. Auto-renewable subscriptions renew unless cancelled at least as required by the store. BIL does not independently charge a card.</p></section><section class="legal-section " id="noscript-en-subscription-terms-ai"><h2>AI allowances and Boost</h2><p>AI-inclusive plans may have documented weekly and monthly token allowances. AI Boost is a separate consumable or non-expiring balance only where the store and server verify it. An unanswered or rejected request must not be represented as a paid AI response.</p></section><section class="legal-section " id="noscript-en-subscription-terms-cancel"><h2>Cancellation and refunds</h2><p>Manage or cancel through Apple App Store or Google Play using the same store account used to purchase. Cancellation normally stops future renewal while access continues through the paid period. Refund eligibility and processing follow store policy and applicable law.</p></section><section class="legal-section " id="noscript-en-subscription-terms-restore"><h2>Restore purchases</h2><p>Use Restore Purchases on the BIL plans screen. BIL checks the store and its server entitlement record; it does not unlock access from an unverified local flag. Sign in to the same store and BIL account used for the purchase.</p></section><section class="legal-section " id="noscript-en-subscription-terms-changes"><h2>Price or plan changes</h2><p>Stores provide legally required notice and consent for price changes. Feature packaging can change prospectively, but BIL will not fabricate a discount, trial, tax, or “success” state that the store has not verified.</p></section><section class="legal-section " id="noscript-en-subscription-terms-support"><h2>Billing support</h2><p>For store charges or refunds, start with Apple or Google. For an entitlement mismatch, contact <a href="mailto:support@bilhealth.com">support@bilhealth.com</a> and include the platform and approximate purchase time—but never email a full receipt token or password.</p></section></article></div></div></div>
<div lang="ar" dir="rtl" data-bil-fallback-document="/privacy"><div class="page-shell"><header class="page-hero"><span class="eyebrow">مركز الثقة</span><h1>سياسة الخصوصية</h1><p>توضح هذه السياسة كيف تتعامل BIL Health مع المعلومات الشخصية عند استخدام تطبيق BIL وميزاته السحابية والذكاء الاصطناعي والصحة المتصلة والموقع والدعم.</p><div class="document-meta"><span>وثيقة رسمية من BIL Health</span><span>آخر تحديث: 23 أكتوبر 2026</span><span>bilhealth.com</span></div></header><div class="document-layout"><aside class="toc" aria-label="في هذه الصفحة"><strong>في هذه الصفحة</strong><a href="#noscript-ar-privacy-scope">من المسؤول</a><a href="#noscript-ar-privacy-data">البيانات التي نعالجها</a><a href="#noscript-ar-privacy-collection">كيف تصل البيانات</a><a href="#noscript-ar-privacy-facebook-login">تسجيل الدخول الاختياري عبر Facebook</a><a href="#noscript-ar-privacy-purpose">لماذا نستخدمها</a><a href="#noscript-ar-privacy-ai">الذكاء والصوت والصور</a><a href="#noscript-ar-privacy-translation">ترجمة المجتمع</a><a href="#noscript-ar-privacy-sharing">المعالجون والمشاركة</a><a href="#noscript-ar-privacy-website">تخزين الموقع والتوصيل الطرفي</a><a href="#noscript-ar-privacy-retention">الاحتفاظ والحذف</a><a href="#noscript-ar-privacy-rights">حقوقك وخياراتك</a><a href="#noscript-ar-privacy-security">الأمان والمعالجة الدولية</a><a href="#noscript-ar-privacy-children">للبالغين فقط والتغييرات</a></aside><article class="document"><section class="legal-section callout" id="noscript-ar-privacy-scope"><h2>من المسؤول</h2><p>BIL Health هي ناشر المنتج والمسؤول عن الخدمات التي يديرها المطور. لطلبات الخصوصية تواصل عبر <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a>. تخضع المتاجر ومنصات الأجهزة والخدمات التي تختارها لشروطها الخاصة أيضًا.</p></section><section class="legal-section " id="noscript-ar-privacy-data"><h2>البيانات التي نعالجها</h2><ul><li><b>الحساب:</b> البريد الإلكتروني والاسم المعروض الاختياري ومعرّف الحساب. لا يطلب إنشاء الحساب الجديد رقم هاتف. قد تبقى أرقام الهاتف التي أُدخلت عبر مسار تسجيل سابق ضمن بيانات الحسابات الحالية، وفق ضوابط الاحتفاظ وحذف الحساب الموضحة أدناه. يعالج Supabase أيضًا أحداث المصادقة والأمان وعنوان IP وبيانات وكيل المستخدم.</li><li><b>الصحة والعافية:</b> الملف الشخصي والعمر أو تاريخ الميلاد والجنس البيولوجي عند إدخاله والتفضيلات الغذائية والتغذية والوجبات والماء والوزن والقياسات والنشاط والنوم والأهداف والملاحظات.</li><li><b>المصادر المتصلة:</b> السجلات التي تسمح بها من HealthKit أو Health Connect وقراءات أجهزة اللياقة الخارجية المتوافقة. تبقى هذه السجلات على الجهاز أو في منصة المصدر افتراضيًا.</li><li><b>البحث:</b> بعد عدم وجود نتيجة في المصادر المحلية، قد يُرسل نص بحث الطعام واللغة عبر جلسة الحساب المسجلة إلى بوابة BIL الموثوقة وUSDA. وقد تترجم Google Cloud Translation عبارة البحث وأسماء الأطعمة؛ لا تُضمَّن اليوميات الخاصة أو محادثات المدرب تلقائيًا. لا يحتفظ BIL بسجل بحث مخصص ولا يستخدم النص للإعلانات، لكنه يعامل هذه المعالجة الموثقة على أنها مرتبطة بالحساب في إفصاح خصوصية المتجر.</li><li><b>محتوى المستخدم والمجتمع:</b> أسئلة الذكاء والنصوص المتعرّف عليها من الصوت؛ صور تحليل الوجبات؛ صورة الملف التي قد تُرفع وتظهر علنًا كصورة مجتمع؛ ملف المجتمع ونبذته ونصوص المنشورات وصورها وجمهورها؛ الرسائل الخاصة المقيدة بالوصول؛ البلاغات؛ مساهمات الطعام والمراجعات وصور الملصقات أو الأدلة؛ الملاحظات؛ وطلبات الدعم. تتبع رؤية محتوى المجتمع الجمهور الذي تختاره. تُخزّن الرسائل الخاصة بضوابط وصول لكنها ليست مشفرة من طرف إلى طرف.</li><li><b>التجارة والتقنية:</b> المنتج والاستحقاق ونتيجة التحقق من الشراء ومعرّف جهاز للمزامنة وتفاعلات المنتج وسجلات طلبات الذكاء والتوكنات والمزود وزمن الاستجابة واللغة وإصدار التطبيق والمنصة وتشخيصات الأمان وسجلات تشغيل محدودة. حيث تتوفر إعلانات الفئة المجانية على إصدارات Android وiOS المدعومة عند تفعيل الإعلانات، قد تعالج Google Mobile Ads تلقائيًا عنوان IP الذي يمكن أن يقدّر الموقع العام وتفاعلات المنتج والتشخيصات ومعرّفات الجهاز أو الحساب لتوصيل الإعلان والتحليلات ومنع الاحتيال. لا يستلم BIL رقم بطاقتك الكامل.</li></ul></section><section class="legal-section " id="noscript-ar-privacy-collection"><h2>كيف تصل البيانات</h2><p>تأتي معظم البيانات منك أو بعد إذن واضح من النظام. تعمل اليوميات الأساسية محليًا دون حساب. المزامنة السحابية اختيارية وانتقائية: تشمل إعدادات الملف والجسم والوزن والماء حسب النطاق المفعّل. يحتاج نسخ التغذية والأهداف إلى اختيار مستقل وصريح في النسخ الداعمة. تبقى الخطط الذكية المحفوظة على الجهاز ما لم تفعّل نسخ الخطة منفصلًا؛ وعند تفعيله تُرسل إعدادات الخطة وجدولها واقتراحات الوجبات وحالة الإكمال المؤكدة والمراجعات إلى مخزن حسابك في Supabase المحمي بضوابط الوصول. الاقتراحات ليست طعامًا مسجلًا أو نشاطًا مكتملًا. يمكنك التصدير أو الحذف وإيقاف نسخ الخطة من المزيد ← المشاركة والخصوصية ← بيانات الخطط المحفوظة. قد تبقى علامة حذف لمنع استعادة الخطة المحذوفة من جهاز آخر. نسخ الخطة لا ينسخ سجلات HealthKit أو Health Connect تلقائيًا. سياق الذكاء منفصل: فقط بعد أن تطلب إجابة من المدرب ينشئ BIL سياقًا محدودًا قد يتضمن التفضيلات الغذائية وملخصات حديثة للتغذية والوزن والنشاط والنوم أو الصحة المتصلة الموثقة. ولا تعمل الصور والمشتريات والإشعارات والمجتمع والأجهزة إلا عند تهيئتها وطلبها.</p></section><section class="legal-section " id="noscript-ar-privacy-facebook-login"><h2>تسجيل الدخول الاختياري عبر Facebook</h2><p>إذا كان تسجيل الدخول عبر Facebook متاحًا واخترت استخدامه، تتحقق Meta من هويتك وقد تزود BIL ومعالج المصادقة لديه Supabase بمعرّف Facebook خاص بالتطبيق ومعلومات الملف العام التي تعيدها Meta، مثل الاسم وصورة الملف. لا يصل البريد الإلكتروني إلا إذا منحت إذن <b>email</b> وكان متاحًا لدى Meta. يطلب BIL في هذا المسار فقط <b>public_profile</b> و<b>email</b>، ويستخدم النتيجة فقط لإنشاء حساب BIL أو تسجيل الدخول إليه أو حمايته أو ربطه. لا ينشر BIL على Facebook ولا يستخدم بيانات حساب Facebook لتخصيص الصحة أو التغذية أو الذكاء الاصطناعي أو الإعلانات. يمكنك فصل المزود حيث تتوفر هذه الإمكانية، أو حذف حساب BIL وبياناته المؤهلة من أدوات التطبيق أو <a href="/account-deletion?lang=ar">صفحة حذف الحساب</a>.</p></section><section class="legal-section " id="noscript-ar-privacy-purpose"><h2>لماذا نستخدمها</h2><ul><li>لتقديم التسجيل والأهداف والحسابات والرسوم والتقارير والمزامنة والاستعادة والدعم.</li><li>لتخصيص الرؤى وإجابات المدرب التي تطلبها.</li><li>لحماية الحساب ومنع إساءة الاستخدام والتحقق من المشتريات.</li><li>للوفاء بالالتزامات القانونية وحل النزاعات.</li></ul><p>عند لزوم أساس قانوني نعتمد على تنفيذ الخدمة المطلوبة، وموافقتك للميزات الحساسة الاختيارية، والمصلحة المشروعة في الأمان والموثوقية، والالتزام القانوني.</p></section><section class="legal-section " id="noscript-ar-privacy-ai"><h2>الذكاء والصوت والصور</h2><p><b>مدرب BIL:</b> بعد موافقة منفصلة فقط، يرسل BIL السؤال والفئات المحددة اللازمة للطلب—مثل الوزن والأهداف والقياسات؛ والتغذية والوجبات والماء والتفضيلات؛ والنشاط والتدريب؛ والنوم والعادات؛ وملخصات الصحة المتصلة الموثقة؛ وما يصل إلى آخر 12 رسالة—إلى <b>Google Gemini، وهي خدمة ذكاء اصطناعي تابعة لجهة خارجية وتديرها Google</b>، لإنشاء الإجابة المطلوبة. يبدأ التقاط الصوت بعد ضغط الميكروفون؛ وقد تحول خدمة Apple أو المنصة الصوت إلى نص وفق شروطها، بينما يستلم BIL وGoogle Gemini النص المتعرف عليه لا الصوت الخام.</p><p><b>تحليل صورة الوجبة:</b> بعد موافقة منفصلة، يرسل BIL الصورة التي تختارها ولغة التطبيق وبيانات الطلب التقنية الضرورية إلى Google Gemini لاقتراح أطعمة وحصص تراجعها. لا يُضاف شيء إلى اليوميات حتى تؤكد النتيجة. يمكنك رفض أي من الموافقتين ومتابعة الميزات المحلية أو الإدخال اليدوي المتاح. اسحب موافقة المدرب من إعداداته وموافقة الصور من إعدادات الخصوصية لإيقاف الإرسال الجديد. يحتفظ BIL ببيانات تشغيل محدودة للاستخدام والتكلفة والأمان والموثوقية، ولا يضيف الصورة المقدمة إلى سجل وجبة ما لم تؤكد النتيجة بشكل منفصل. تخضع معالجة المزود لشروط المعالج المهيأة لدى BIL. قد يخطئ الذكاء ولا يُعد نصيحة طبية.</p></section><section class="legal-section " id="noscript-ar-privacy-translation"><h2>ترجمة المجتمع</h2><p>عندما تختار الترجمة، يرسل BIL نص المجتمع المحدد ولغة الترجمة عبر خدمته الموثقة إلى Google Cloud Translation. لا تُضمَّن يوميات الصحة الخاصة أو سياقات المدرب الذكي تلقائيًا. قد تكون الترجمة غير دقيقة؛ راجع النص الأصلي.</p></section><section class="legal-section " id="noscript-ar-privacy-sharing"><h2>المعالجون والمشاركة</h2><p>قد يستخدم BIL: Supabase للمصادقة والتخزين السحابي وطلبات الدعم ووظائف الخادم، وApple أو Google للتوزيع والدفع والكلام وأذونات اللياقة المتصلة، وGoogle Gemini لطلبات الذكاء، وGoogle Mobile Ads لإعلانات سياقية غير مخصصة أو محدودة حيث تُفعّل على إصدارات Android وiOS المدعومة عند تفعيل الإعلانات. قد تتضمن سجلات Supabase للمصادقة والخدمة معرّف المستخدم وعنوان IP ووكيل المستخدم وبيانات الطلب والاستجابة وتشخيصات التشغيل للأمان ومنع الإساءة والموثوقية. لا تظهر الإعلانات للضيف أو للمستخدم المدفوع، وتكون Google UMP بوابة الموافقة حيث يلزم. لا يجوز أن تتلقى Google Mobile Ads محتوى الصحة أو التغذية أو الوزن أو الملف أو البحث أو الموقع الدقيق أو المجتمع الخاص أو محادثات الذكاء من BIL للاستهداف. لا تُباع البيانات الصحية ولا تُستخدم لاستهداف الإعلانات.</p></section><section class="legal-section " id="noscript-ar-privacy-website"><h2>تخزين الموقع والتوصيل الطرفي</h2><p>يخزن موقع BIL العام اختيار اللغة فقط في التخزين المحلي للمتصفح. لا يضع حاليًا ملفات تعريف ارتباط تسويقية من BIL ولا يحمّل أداة تحليلات ويب من BIL. يوصّل Cloudflare الموقع ويحميه وقد يعالج عنوان IP ووكيل المستخدم والرابط المطلوب ووقته وإشارات الشبكة والأمان وتشخيصات التشغيل وفق دوره ومدد الاحتفاظ لديه. لا يقرأ الموقع العام اليوميات الخاصة أو بيانات الصحة المتصلة من تطبيق BIL.</p></section><section class="legal-section " id="noscript-ar-privacy-retention"><h2>الاحتفاظ والحذف</h2><p>تبقى البيانات المحلية حتى تحذفها. تبقى السجلات السحابية أثناء نشاط الحساب والميزة، ثم تُحذف أو تُزال هويتها وفق مسار الحذف والنسخ الاحتياطية ومتطلبات الأمان والقانون. تُقلّل سجلات استخدام الذكاء والأداء والتشغيل ويُحتفظ بها وفق متطلبات أمان الخدمة والحصص. قد يحتفظ Apple أو Google بسجلات المتجر وفق سياساتهما.</p></section><section class="legal-section " id="noscript-ar-privacy-rights"><h2>حقوقك وخياراتك</h2><ul><li>استخدام التسجيل المحلي دون حساب.</li><li>تشغيل أو إيقاف الذكاء والمزامنة والإشعارات والأجهزة والكاميرا والميكروفون والأذونات الصحية.</li><li>الوصول والتصحيح والتصدير وحذف البيانات المؤهلة.</li><li>بدء حذف الحساب من <a href="/account-deletion?lang=ar">صفحة حذف الحساب</a>.</li><li>سحب الموافقة أو الاعتراض أو التقييد والشكوى للجهة المختصة حيث ينطبق القانون.</li></ul><p>راسل <a href="mailto:privacy@bilhealth.com">privacy@bilhealth.com</a> من بريد الحساب، ولا ترسل ملفًا صحيًا كاملًا.</p></section><section class="legal-section " id="noscript-ar-privacy-security"><h2>الأمان والمعالجة الدولية</h2><p>نستخدم اتصالًا مشفرًا وحماية مفاتيح النظام وضوابط وصول وعزل صفوف البيانات وتشخيصات تطبيق منقحة وحدود خادم موثقة. وتبقى بنية Supabase تسجل بيانات المصادقة وIP ووكيل المستخدم وتشخيصات الطلب المحدودة الموضحة أعلاه. لا يوجد نظام آمن بالكامل. قد يعالج المزودون البيانات خارج بلدك وفق ضمانات تعاقدية وقانونية مناسبة.</p></section><section class="legal-section " id="noscript-ar-privacy-children"><h2>للبالغين فقط والتغييرات</h2><p>التطبيق مخصص فقط للبالغين بعمر 18 عامًا فأكثر، وليس موجهًا للأطفال أو القاصرين. لا يجوز لمن هم دون 18 عامًا إنشاء حساب BIL أو استخدام خدماته المحلية. ننشر التغييرات الجوهرية هنا بتاريخ سريان جديد ونظهرها داخل التطبيق عند الحاجة.</p></section></article></div></div></div>
<div lang="ar" dir="rtl" data-bil-fallback-document="/subscription-terms"><div class="page-shell"><header class="page-hero"><span class="eyebrow">التجارة</span><h1>شروط الاشتراكات</h1><p>يعرض BIL الخطط والأسعار التي يعيدها متجر Apple أو Google الموثق للمستخدم. شاشة المتجر هي المرجع النهائي.</p><div class="document-meta"><span>وثيقة رسمية من BIL Health</span><span>آخر تحديث: 23 سبتمبر 2026</span><span>bilhealth.com</span></div></header><div class="document-layout"><aside class="toc" aria-label="في هذه الصفحة"><strong>في هذه الصفحة</strong><a href="#noscript-ar-subscription-terms-plans">الخطط والتوفر الإقليمي</a><a href="#noscript-ar-subscription-terms-community">المجتمع ضمن BIL Free</a><a href="#noscript-ar-subscription-terms-billing">الفوترة والتجديد</a><a href="#noscript-ar-subscription-terms-ai">حصص الذكاء وBoost</a><a href="#noscript-ar-subscription-terms-cancel">الإلغاء والاسترداد</a><a href="#noscript-ar-subscription-terms-restore">استعادة المشتريات</a><a href="#noscript-ar-subscription-terms-changes">تغيير السعر أو الخطة</a><a href="#noscript-ar-subscription-terms-support">دعم الفوترة</a></aside><article class="document"><section class="legal-section callout" id="noscript-ar-subscription-terms-plans"><h2>الخطط والتوفر الإقليمي</h2><p>قد تتوفر Free وBIL Premium وBIL Premium AI Coach وBIL AI Boost. يختلف التوفر حسب البلد واقتصاد المتجر، وقد يتوفر الذكاء بنظام التوكينات بدل اشتراك شامل.</p></section><section class="legal-section " id="noscript-ar-subscription-terms-community"><h2>المجتمع ضمن BIL Free</h2><p>المجتمع والأصدقاء والرسائل الخاصة ضمن BIL Free للبالغين المسجلين. لا تتطلب هذه الميزات اشتراك Premium أو شراء AI Boost. تبقى إرشادات المجتمع والموافقة وضوابط الخصوصية والحظر والإبلاغ والإشراف سارية. لا يلغي ذلك أي اشتراك قائم أو يغير سعره، ولا يغير الميزات المدفوعة الأخرى أو أرصدة توكينات الذكاء الاصطناعي.</p></section><section class="legal-section " id="noscript-ar-subscription-terms-billing"><h2>الفوترة والتجديد</h2><p>يعرض المتجر السعر النهائي والعملة والضر
