import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.initialization.resolve.RepositoriesMode
import org.gradle.internal.Actions
import org.gradle.api.internal.artifacts.repositories.ArtifactRepositoryInternal
import org.gradle.api.internal.artifacts.repositories.ContentFilteringRepository
import org.gradle.api.internal.artifacts.repositories.ResolutionAwareRepository
import java.lang.reflect.InvocationTargetException
import java.lang.reflect.Proxy

// CI-only process opt-in. Add an independent transport for public Maven Central artifacts.
if (System.getenv('GITHUB_ACTIONS') == 'true') {
    def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
    def mirrorName = 'BIL_CI_GoogleCentralMirror'
    def busy = Collections.newSetFromMap(new IdentityHashMap())
    def attached = Collections.newSetFromMap(new IdentityHashMap())
    def buildSettings = null
    // Gradle 9.1 exposes a read-only snapshot of the anchor's content policy.
    // Inspect the copy so source repositories remain configurable.
    def unrestricted = { anchor ->
        def policy = anchor.repositoryDescriptorCopy
        policy.toContentFilter().is(Actions.doNothing()) &&
            policy.includedConfigurations == null && policy.excludedConfigurations == null &&
            policy.requiredAttributes == null
    }
    def publicAnchor = { repo ->
        if (!(repo instanceof MavenArtifactRepository)) return false
        def uri = repo.url
        if (uri == null || uri.scheme != 'https' || uri.userInfo != null ||
            uri.port != -1 || uri.query != null || uri.fragment != null) return false
        def path = uri.path.replaceAll('/+$','')
        def central = uri.host in ['repo.maven.apache.org', 'repo1.maven.org'] && path == '/maven2'
        def portal = uri.host == 'plugins.gradle.org' && path == '/m2'
        if ((!central && !portal) || repo.configuredCredentials.present ||
            !repo.authentication.empty || !repo.artifactUrls.empty) return false
        def metadata = repo.metadataSources
        metadata.mavenPomEnabled && !metadata.gradleMetadataEnabled && !metadata.artifactEnabled &&
            !metadata.ignoreGradleMetadataRedirectionEnabled && unrestricted(repo)
    }
    // Gradle copies plugin-repository filters and reads ordinary repository filters
    // directly. Check the source policy at those two boundaries, including rules
    // added after repository declaration. A constrained anchor keeps its own route.
    def bindPolicy = { mirror, anchor, repositories ->
        def bound
        def policy = {
            def copy = mirror.repositoryDescriptorCopy
            def slot = repositories.indexOf(anchor)
            if (slot <= 0 || !repositories[slot - 1].is(bound) || !publicAnchor(anchor)) {
                copy.excludeGroupByRegex('.*')
            }
            copy
        }
        def types = [MavenArtifactRepository, ArtifactRepositoryInternal,
                     ContentFilteringRepository, ResolutionAwareRepository] as Class[]
        bound = Proxy.newProxyInstance(this.class.classLoader, types, { proxy, method, args ->
            switch (method.name) {
                case 'getRepositoryDescriptorCopy': return policy()
                case 'getContentFilter': return policy().toContentFilter()
                case 'equals': return proxy.is(args[0])
                case 'hashCode': return System.identityHashCode(proxy)
                default:
                    try { return method.invoke(mirror, args) }
                    catch (InvocationTargetException error) { throw error.cause }
            }
        } as java.lang.reflect.InvocationHandler)
    }
    def attach = { repositories ->
        if (!attached.add(repositories)) return
        def installedMirror = null
        def maybeAdd = { repository ->
            if (busy.contains(repositories) || repository.is(installedMirror) || !publicAnchor(repository)) return
            def existing = repositories.findByName(mirrorName)
            if (existing != null) {
                if (!existing.is(installedMirror)) throw new GradleException('Unexpected CI mirror name collision')
                return
            }
            busy.add(repositories)
            try {
                def mirror = repositories.maven {
                    name = mirrorName
                    url = mirrorUrl
                }
                repositories.remove(mirror)
                installedMirror = bindPolicy(mirror, repository, repositories)
                // Insert at the public repository's slot so earlier Google and
                // private repositories retain priority and their original objects.
                repositories.add(repositories.indexOf(repository), installedMirror)
            } finally { busy.remove(repositories) }
        }
        repositories.whenObjectAdded(maybeAdd)
        repositories.toList().each(maybeAdd)
    }
    gradle.beforeSettings { settings ->
        buildSettings = settings
        attach(settings.pluginManagement.repositories)
        attach(settings.dependencyResolutionManagement.repositories)
    }
    gradle.settingsEvaluated { settings ->
        // Preserve Gradle's implicit default Portal, explicitly only if source
        // declared no plugin repositories. Critical for Flutter included build.
        def plugins = settings.pluginManagement.repositories
        if (plugins.isEmpty()) {
            plugins.gradlePluginPortal()
            plugins.mavenCentral()
        }
    }
    gradle.beforeProject { project ->
        def mode = buildSettings.dependencyResolutionManagement.repositoriesMode.get()
        if (mode == RepositoriesMode.PREFER_PROJECT) attach(project.repositories)
        // Buildscript is a separate repository scope, not project dependencies.
        attach(project.buildscript.repositories)
    }
}
