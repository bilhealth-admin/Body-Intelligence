name: BIL QA focused production-contract reconciliation
on:
  push:
    branches:
      - qa/bil-quality-ux-integration-20261009
    paths:
      - .github/workflows/bil_qa_contract_clusters_20261010.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-qa-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: contract (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - suite: dashboard-bars-first-use
            files: >-
              test/dashboard_composition_contract_test.dart test/dashboard_epic_completion_contract_test.dart
          - suite: dashboard-calorie-hierarchy
            files: >-
              test/dashboard_polish/dashboard_reference_nutrition_cards_test.dart
          - suite: watch-real-metrics
            files: >-
              test/dashboard_polish/dashboard_live_health_hub_contract_test.dart test/dashboard_polish/dashboard_p9_r15_final_visual_contract_test.dart test/dashboard_polish/live_health_watch_visibility_test.dart
          - suite: more-flat-icons-and-routing
            files: >-
              test/semantic_icon_badge_spacing_test.dart test/bil_semantic_icons_test.dart test/launch_readiness/navigation_and_more_master_closure_test.dart
          - suite: verified-optional-premium
            files: >-
              test/features/commerce/verified_entitlement_surface_contract_test.dart test/visual_closure/visual_defect_regression_test.dart
    steps:
      - name: Checkout exact QA SHA with LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Assert source, RTL, physical metrics and real interactions
        shell: pwsh
        run: |
          $targets = @("${{ matrix.files }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries))
          flutter test --no-pub --timeout=3m @targets
      - name: Save any failed visual evidence without changing baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-${{ matrix.suite }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: five-contract-clusters-aggregate
    needs: contracts
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse green on any failed cluster
        env:
          RESULT: ${{ needs.contracts.result }}
        run: |
          echo "All domain contracts: $RESULT"
          test "$RESULT" = success
