name: BIL QUALITY one-shot Dart format on isolated QA
on:
  pull_request:
    paths:
      - .github/workflows/bil_quality_temp_format_all_20261009.yml
permissions:
  contents: write
jobs:
  format-changed-quality-files:
    if: github.head_ref == 'qa/bil-stability-flicker-data-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact approved QA SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only QA changed Dart files and commit if HEAD unchanged
        shell: bash
        env:
          TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"
          git fetch origin qa/coach-community-next-20261005
          mapfile -t paths < <(git diff --name-only FETCH_HEAD HEAD -- '*.dart')
          test "${#paths[@]}" -gt 0
          echo "Formatting ${#paths[@]} changed Dart files"
          dart format "${paths[@]}"
          git diff --check
          git fetch origin qa/bil-stability-flicker-data-20261008
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_HEAD" || {
            echo "QA head advanced: leaving existing branch untouched"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "All changed Dart sources already formatted"
          else
            git commit -m 'style(quality): apply pinned Dart formatter to current QA patch'
            git push origin HEAD:qa/bil-stability-flicker-data-20261008
          fi
