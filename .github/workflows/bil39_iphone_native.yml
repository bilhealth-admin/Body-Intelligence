name: BIL iPhone native source QA

on:
  push:
    branches: [main, integration/bil-qa-media-policy-20261011, bil39/integration-20261025, codex/bil40-device-fixes-20261028, codex/bil41-android33-release-20261106, codex/bil-full-fix-batch-20261106, codex/bil43-android35-verified-20261108, codex/bil-release-ios38-android33-20261022]
  pull_request:
    branches: [main, integration/bil-qa-media-policy-20261011]
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: bil39-iphone-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/bil39_ios_native_reusable.yml
    with:
      device: iphone
