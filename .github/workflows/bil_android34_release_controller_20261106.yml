          proof.write_text(__import__('json').dumps(data,indent=2)+'\n')
          PY_DEBUG_ZIP
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/bil-s3-debug.apk" > BIL-apksigner-preflight-cli.txt
