name: BIL Android35 public English health proof
run-name: "Android35 two public English frames; no login, AI request or rebuild"
on:
  push:
    branches: [codex/bil-android35-public-health-20261110]
permissions:
  contents: read
  actions: read
concurrency:
  group: bil-android35-public-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-signed-apk-public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout immutable final application source for read-only artifact tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
