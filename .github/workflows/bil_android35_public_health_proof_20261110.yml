        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_PUBLIC_TRANSPORT'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          def check(value):
              if not value:
                  raise ValueError('REVIEWER_TRANSPORT_INTEGRITY_FAILED')
          records = json.loads('[{"name":"reviewer_contract.py","compressed_base64":"","compressed_sha256":"a0723d7c721cc739734c37ea367a40495a7cbf00b1e821de827584c04b681d0a","raw_sha256":"e94c045444240a4298e3f1cf0224946685378ed40db4ff52117098dbfe5fd2bc","raw_bytes":1130},{"name":"review_common.py","compressed_base64":"","compressed_sha256":"4979b3907929f5c434bce89421cafb6104f2b7f80e0b86c613931ef67f5f2e4b","raw_sha256":"6db4458992ab815d8a4b11edfb4bd5cb9e9f262228bea1ded5b24f5beffcfb15","raw_bytes":5881},{"name":"artifact_binding.py","compressed_base64":"","compressed_sha256":"a2bdcd0aca904015feea696dec4d3c31e5a3d2084de92f4349c952c3793b8a3f","raw_sha256":"3a64a54b0d5cfce253a7b6551539d848229ddb815ef761dd937b9dbb10a7fd08","raw_bytes":15279}]')
          allowed = ('reviewer_contract.py', 'review_common.py', 'artifact_binding.py', 'reviewer_ui.py', 'reviewer_capture.py', 'reviewer_home_probe.py', 'reviewer_onboarding.py', 'reviewer_launch_probe.py', 'prepare_native_uia2_tools.py', 'uia2_source.py', 'VerifyApkCertificate.java', 'exact-android35-pins.json', 'public_health_entrypoint.sh', 'public-shell-contract.cjs', 'pinned_emulator_install.py', 'read_only_emulator_host.py', 'pinned_emulator_guard.py', 'public_health_ui.py', 'guest_onboarding.py')
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          check(root.is_dir())
          prepared = []
          seen = set()
          for record in records:
              check(set(record) == {'name', 'compressed_base64', 'compressed_sha256', 'raw_sha256', 'raw_bytes'})
              name = record['name']
              check(name in allowed and name not in seen)
              seen.add(name)
