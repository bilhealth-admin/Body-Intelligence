              compressed = base64.b64decode(record['compressed_base64'], validate=True)
              check(hashlib.sha256(compressed).hexdigest() == record['compressed_sha256'])
              decoder = zlib.decompressobj()
              raw = decoder.decompress(compressed, record['raw_bytes'] + 1)
              check(decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail)
              check(len(raw) == record['raw_bytes'])
              check(hashlib.sha256(raw).hexdigest() == record['raw_sha256'])
              path = root / name
              check(not path.exists() and not path.is_symlink())
              prepared.append((path, raw))
          for path, raw in prepared:
              with path.open('xb') as output:
                  output.write(raw)
