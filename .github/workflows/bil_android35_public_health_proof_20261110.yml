      - name: Require isolated accelerated runner and exact API33 emulator tooling
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/bil_prepare_android_kvm.sh
          test "$(nproc)" -ge 4
          test -s "$BIL_REVIEW_EXACT_APK"
      - name: Checkout the pinned owned emulator action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: 4c44018e59b437e86cdfc41da381398f93ed8808
          path: artifacts/tooling/bil-android-emulator-action
          persist-credentials: false
      - name: Verify unchanged owned emulator bootstrap
        shell: bash
        run: >-
          python3 tool/release/prepare_android_emulator_action.py
          --action-dir artifacts/tooling/bil-android-emulator-action
          --api-level 33
          --evidence-dir artifacts/release/android_emulator_smoke/api-33
      - name: Require actual Linux public wrapper contract before emulator
        shell: bash
        run: node "$RUNNER_TEMP/public-shell-contract.cjs"
      - name: Observe two public English health information frames on exact35 APK
        uses: ./artifacts/tooling/bil-android-emulator-action
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: python3 "$RUNNER_TEMP/pinned_emulator_guard.py" --prepare --evidence "$GITHUB_WORKSPACE/artifacts/android35-reviewer-safe"
          script: |
            python3 "$RUNNER_TEMP/pinned_emulator_guard.py" --verify-before-reviewer --evidence "$GITHUB_WORKSPACE/artifacts/android35-reviewer-safe"
            bash "$RUNNER_TEMP/public_health_entrypoint.sh"
      - name: Finish bounded read-only host diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 "$RUNNER_TEMP/read_only_emulator_host.py" --stop --evidence "$GITHUB_WORKSPACE/artifacts/android35-reviewer-safe"
      - name: Preserve bounded safe public evidence for independent visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-android35-public-health-safe-2916d20612b919e126765be25b7df5b8da95eb4d-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/android35-reviewer-safe/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private local binaries
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/BIL-Android35-exact-QA.apk" "$RUNNER_TEMP/BIL-Android35-exact.aab"
