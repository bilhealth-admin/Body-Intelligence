name: BIL isolated integration focused QA

# Scope is restricted to the post-Codex media+policy integration only.
# No full 8-shard run, builds, secrets, deployment, or source writeback.
on:
  push:
    branches:
      - integration/bil-qa-media-policy-20261011
    paths:
      - .github/workflows/bil_integration_media_policy_focused.yml
      - lib/**
      - test/**
      - tool/prebuild/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-integration-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve pinned dependencies
        run: |
          git rev-parse HEAD
          flutter --version
          flutter pub get
      - name: Strict Dart formatting
        id: fmt
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/app/services/recoverable_image_picker.dart \
            lib/app/services/store_review_prompt_service.dart \
            lib/features/community/presentation/community_hub_page.dart \
            lib/features/community/presentation/community_post_composer_image_preview.dart \
            lib/features/community/presentation/community_post_composer_page.dart \
            lib/features/community/presentation/community_profile_cover_editor.dart \
            lib/features/community/presentation/community_profile_page.dart \
            lib/features/community/services/community_post_image_picker.dart \
            lib/features/daily_log/food_log_actions.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/features/profile/premium_profile_actions.dart \
            lib/features/profile/premium_profile_page.dart \
            lib/features/profile/services/profile_photo_service.dart \
            lib/shared/widgets/bil_camera_capture_page.dart \
            lib/shared/widgets/bil_media_review_sheet.dart \
            lib/app/router/bil_quick_add_presenter.dart \
            lib/app/router/bil_quick_add_sheet.dart \
            lib/app/router/responsive_app_shell.dart \
            lib/features/daily_log/daily_log_page.dart \
            lib/features/daily_log/food_log_tile_widgets.dart \
            lib/features/dashboard/widgets/dashboard_first_use_experience.dart \
            lib/features/dashboard/widgets/first_meal_celebration.dart \
            lib/features/dashboard/widgets/first_use_context_coachmark.dart \
            lib/features/dashboard/widgets/first_use_glass_surface.dart \
            lib/features/dashboard/widgets/first_food_days_guide.dart \
            lib/shared/widgets/bil_reference_bottom_bar.dart \
            lib/shared/widgets/first_use_guide_anchor.dart \
            lib/shared/widgets/first_use_target_guide.dart \
            test/features/dashboard/first_use_reference_journey_test.dart \
            test/features/dashboard/first_use_recovery_regression_test.dart \
            test/features/dashboard/first_use_actual_home_capture_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/app/services/store_review_prompt_service_test.dart \
            test/features/community/community_post_image_support_test.dart \
            test/features/profile/premium_profile_page_test.dart \
            test/features/profile/profile_photo_account_isolation_test.dart \
            test/shared/widgets/bil_media_review_sheet_test.dart
      - name: Print exact format patch without changing GitHub
        if: steps.fmt.outcome == 'failure'
        run: |
          dart format \
            lib/app/services/recoverable_image_picker.dart \
            lib/app/services/store_review_prompt_service.dart \
            lib/features/community/presentation/community_hub_page.dart \
            lib/features/community/presentation/community_post_composer_image_preview.dart \
            lib/features/community/presentation/community_post_composer_page.dart \
            lib/features/community/presentation/community_profile_cover_editor.dart \
            lib/features/community/presentation/community_profile_page.dart \
            lib/features/community/services/community_post_image_picker.dart \
            lib/features/daily_log/food_log_actions.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/features/profile/premium_profile_actions.dart \
            lib/features/profile/premium_profile_page.dart \
            lib/features/profile/services/profile_photo_service.dart \
            lib/shared/widgets/bil_camera_capture_page.dart \
            lib/shared/widgets/bil_media_review_sheet.dart \
            lib/app/router/bil_quick_add_presenter.dart \
            lib/app/router/bil_quick_add_sheet.dart \
            lib/app/router/responsive_app_shell.dart \
            lib/features/daily_log/daily_log_page.dart \
            lib/features/daily_log/food_log_tile_widgets.dart \
            lib/features/dashboard/widgets/dashboard_first_use_experience.dart \
            lib/features/dashboard/widgets/first_meal_celebration.dart \
            lib/features/dashboard/widgets/first_use_context_coachmark.dart \
            lib/features/dashboard/widgets/first_use_glass_surface.dart \
            lib/features/dashboard/widgets/first_food_days_guide.dart \
            lib/shared/widgets/bil_reference_bottom_bar.dart \
            lib/shared/widgets/first_use_guide_anchor.dart \
            lib/shared/widgets/first_use_target_guide.dart \
            test/features/dashboard/first_use_reference_journey_test.dart \
            test/features/dashboard/first_use_recovery_regression_test.dart \
            test/features/dashboard/first_use_actual_home_capture_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/app/services/store_review_prompt_service_test.dart \
            test/features/community/community_post_image_support_test.dart \
            test/features/profile/premium_profile_page_test.dart \
            test/features/profile/profile_photo_account_isolation_test.dart \
            test/shared/widgets/bil_media_review_sheet_test.dart
          git diff --stat
          git diff -- \
            lib/app/services/recoverable_image_picker.dart \
            lib/app/services/store_review_prompt_service.dart \
            lib/features/community/presentation/community_hub_page.dart \
            lib/features/community/presentation/community_post_composer_image_preview.dart \
            lib/features/community/presentation/community_post_composer_page.dart \
            lib/features/community/presentation/community_profile_cover_editor.dart \
            lib/features/community/presentation/community_profile_page.dart \
            lib/features/community/services/community_post_image_picker.dart \
            lib/features/daily_log/food_log_actions.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/features/profile/premium_profile_actions.dart \
            lib/features/profile/premium_profile_page.dart \
            lib/features/profile/services/profile_photo_service.dart \
            lib/shared/widgets/bil_camera_capture_page.dart \
            lib/shared/widgets/bil_media_review_sheet.dart \
            lib/app/router/bil_quick_add_presenter.dart \
            lib/app/router/bil_quick_add_sheet.dart \
            lib/app/router/responsive_app_shell.dart \
            lib/features/daily_log/daily_log_page.dart \
            lib/features/daily_log/food_log_tile_widgets.dart \
            lib/features/dashboard/widgets/dashboard_first_use_experience.dart \
            lib/features/dashboard/widgets/first_meal_celebration.dart \
            lib/features/dashboard/widgets/first_use_context_coachmark.dart \
            lib/features/dashboard/widgets/first_use_glass_surface.dart \
            lib/features/dashboard/widgets/first_food_days_guide.dart \
            lib/shared/widgets/bil_reference_bottom_bar.dart \
            lib/shared/widgets/first_use_guide_anchor.dart \
            lib/shared/widgets/first_use_target_guide.dart \
            test/features/dashboard/first_use_reference_journey_test.dart \
            test/features/dashboard/first_use_recovery_regression_test.dart \
            test/features/dashboard/first_use_actual_home_capture_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/app/services/store_review_prompt_service_test.dart \
            test/features/community/community_post_image_support_test.dart \
            test/features/profile/premium_profile_page_test.dart \
            test/features/profile/profile_photo_account_isolation_test.dart \
            test/shared/widgets/bil_media_review_sheet_test.dart
      - name: Flutter analyze (complete source)
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub
      - name: Run source-only privacy and policy guard
        id: policy
        continue-on-error: true
        run: |
          python -m unittest discover -s tool/prebuild -p test_store_policy_source_guard.py -v
          python tool/prebuild/store_policy_source_guard.py --json-out build/store-policy/guard.json
      - name: Recovered First Use journey, actual Home and atomic owner regressions
        id: firstuse
        if: steps.fmt.outcome == 'success' && steps.analyze.outcome == 'success' && steps.policy.outcome == 'success'
        env:
          BIL_CAPTURE_FIRST_USE: '1'
        run: |
          mkdir -p build/first-use-recovery
          set -o pipefail
          flutter test --no-pub --concurrency=1 --timeout=3m --reporter=json \
            test/features/dashboard/first_use_reference_journey_test.dart \
            test/features/dashboard/first_use_recovery_regression_test.dart \
            test/features/dashboard/first_use_actual_home_capture_test.dart \
            test/features/dashboard/dashboard_first_use_guidance_test.dart \
            test/features/dashboard/first_use_context_coachmark_test.dart \
            test/features/dashboard/first_meal_celebration_visual_test.dart \
            test/features/daily_log/food_log_first_use_coachmark_test.dart \
            test/data/repositories/first_food_milestone_commit_test.dart \
            test/shared/bil_reference_navigation_test.dart \
            test/app/router/bil_quick_add_presenter_test.dart \
            test/features/daily_log/food_log_meal_selector_test.dart \
            test/features/daily_log/food_log_page_reference_test.dart \
            test/features/daily_log/food_log_popular_ranking_test.dart \
            test/features/dashboard/dashboard_restore_source_contract_test.dart \
            | tee build/first-use-recovery/ci-first-use.jsonl
      - name: Preserve First Use logs and Flutter image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-first-use-recovery-${{ github.sha }}
          path: |
            build/first-use-recovery/ci-first-use.jsonl
            build/first-use-reference/flutter/
          if-no-files-found: ignore
          retention-days: 10
      - name: Reproduce each previously failing Community case
        id: isolated
        if: steps.fmt.outcome == 'success' && steps.analyze.outcome == 'success' && steps.policy.outcome == 'success'
        run: |
          for case_name in \
            'photo draft previews, shows upload progress, and publishes once' \
            'failed image publish retains both text and photo for retry' \
            'cancelled photo review leaves the draft without a new image'; do
            flutter test --no-pub --concurrency=1 --timeout=3m \
              test/features/community/community_post_image_support_test.dart \
              --plain-name "$case_name"
          done
      - name: Complete Community image support file
        id: community
        if: steps.isolated.outcome == 'success'
        run: |
          flutter test --no-pub --concurrency=1 --timeout=3m \
            test/features/community/community_post_image_support_test.dart
      - name: Focused media, account, review and architecture regressions
        id: regressions
        if: steps.community.outcome == 'success'
        run: |
          flutter test --no-pub --concurrency=1 --timeout=3m \
            test/shared/widgets/bil_media_review_sheet_test.dart \
            test/features/community/community_post_image_support_test.dart \
            test/features/community/community_multi_image_v1_contract_test.dart \
            test/features/community/community_draft_mosaic_repository_test.dart \
            test/features/community/community_post_gallery_behavior_test.dart \
            test/features/profile/profile_photo_account_isolation_test.dart \
            test/features/profile/premium_profile_page_test.dart \
            test/features/daily_log/meal_photo_initial_action_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/app/services/store_review_prompt_service_test.dart \
            test/architecture_source_file_size_guard_test.dart
      - name: Export source-only guard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-integration-guard-${{ github.sha }}
          path: build/store-policy/guard.json
          if-no-files-found: ignore
          retention-days: 10
      - name: Strict aggregate — failure cannot be hidden
        if: always()
        env:
          FIRSTUSE: ${{ steps.firstuse.outcome }}
          FORMAT: ${{ steps.fmt.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          ISOLATED: ${{ steps.isolated.outcome }}
          COMMUNITY: ${{ steps.community.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
        run: |
          echo "format=$FORMAT analyze=$ANALYZE policy=$POLICY isolated=$ISOLATED community=$COMMUNITY tests=$REGRESSIONS"
          test "$FIRSTUSE" = success
          test "$FORMAT" = success
          test "$ANALYZE" = success
          test "$POLICY" = success
          test "$ISOLATED" = success
          test "$COMMUNITY" = success
          test "$REGRESSIONS" = success
