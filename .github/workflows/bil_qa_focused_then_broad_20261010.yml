name: BIL QA focused then broad — no full shards

# Only run after a separately verified source + P0 green gate.
on:
  push:
    branches:
      - qa/bil-quality-ux-integration-20261009
    paths:
      - .github/workflows/bil_qa_focused_then_broad_20261010.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-qa-progressive-broad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: focused (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - suite: store-captures
            path: test/epic15_store_screenshot_golden_test.dart
          - suite: production-goldens
            path: test/visual_closure/actual_production_pages_golden_test.dart
          - suite: data-goldens
            path: test/visual_closure/actual_data_pages_golden_test.dart
          - suite: splash-golden
            path: test/premium_splash_experience_test.dart
          - suite: transaction-queue
            path: test/features/commerce/store_transaction_queue_test.dart
    steps:
      - name: Configure Windows checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Remove only stale failure image artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path test -Directory -Recurse -Filter failures |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
      - name: Assert exact current images or commerce behavior
        shell: pwsh
        run: |
          flutter test --no-pub --timeout=2m "${{ matrix.path }}"
      - name: Preserve failed Golden evidence, without accepting new baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-evidence-${{ matrix.suite }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  broad:
    name: broad (${{ matrix.suite }})
    needs: focused
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: dashboard-nutrition
            files: >-
              test/dashboard_polish/dashboard_reference_nutrition_cards_test.dart test/dashboard_polish/dashboard_polish_layout_review_test.dart test/features/dashboard/composition/dashboard_unknown_nutrition_flow_test.dart test/dashboard_polish/dashboard_current_preview_test.dart
          - suite: dashboard-contract-health
            files: >-
              test/dashboard_composition_contract_test.dart test/dashboard_epic_completion_contract_test.dart test/dashboard_polish/dashboard_live_health_hub_contract_test.dart test/dashboard_polish/dashboard_p9_r15_final_visual_contract_test.dart test/dashboard_polish/live_health_watch_layout_golden_test.dart test/dashboard_polish/live_health_watch_visibility_test.dart
          - suite: weekly-onboarding-goldens
            files: >-
              test/epic8_weekly_report_golden_test.dart test/features/onboarding/onboarding_visual_golden_test.dart test/premium_dashboard_benchmark_test.dart
          - suite: settings-language-icons
            files: >-
              test/semantic_icon_badge_spacing_test.dart test/bil_semantic_icons_test.dart test/launch_readiness/navigation_and_more_master_closure_test.dart test/localization/bil_25_locale_fallback_closure_test.dart test/visual_closure/visual_defect_regression_test.dart
          - suite: wellness-commerce
            files: >-
              test/features/commerce/verified_entitlement_surface_contract_test.dart test/features/wellness/recipe_library_polish_test.dart test/features/wellness/workout_reference_golden_test.dart
          - suite: community-cold-back
            files: >-
              test/features/community/community_chat_auth_session_test.dart
    steps:
      - name: Configure Windows checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Clear stale Golden failure output only
        shell: pwsh
        run: |
          Get-ChildItem -Path test -Directory -Recurse -Filter failures |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
      - name: Run known historical failure clusters with intact assertions
        shell: pwsh
        run: |
          $files = @("${{ matrix.files }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries))
          Write-Host "BIL: ${{ matrix.suite }} — $($files.Count) test files"
          flutter test --no-pub --timeout=3m @files
      - name: Preserve each failed Golden image for separate review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broad-evidence-${{ matrix.suite }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: qa-focused-broad-aggregate
    if: always()
    needs: [focused, broad]
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve red status if either phase fails
        env:
          FOCUSED: ${{ needs.focused.result }}
          BROAD: ${{ needs.broad.result }}
        run: |
          echo "Focused: $FOCUSED"
          echo "Broad: $BROAD"
          test "$FOCUSED" = "success"
          test "$BROAD" = "success"
