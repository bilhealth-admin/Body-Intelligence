      - name: Capture release evidence
        shell: bash
        env:
          BUILD_NUMBER: '35'
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > BIL-android-signature.txt
          ACTUAL_UPLOAD_CERT_SHA256="$(keytool -printcert -rfc -jarfile "$AAB" \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d '=' -f 2 \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_UPLOAD_CERT_SHA256"
          test "$ACTUAL_UPLOAD_CERT_SHA256" = "$EXPECTED_NORMALIZED" || {
            echo 'Signed AAB certificate does not match the expected Play upload certificate.' >&2
            exit 1
          }
          printf '%s\n' 'ANDROID_UPLOAD_CERTIFICATE_SHA256=MATCH' \
            > BIL-android-upload-certificate.txt
          python3 -m unittest discover -s tool/release \
            -p test_verify_final_artifact_identity.py -v
          python3 tool/release/verify_final_artifact_identity.py \
            --android-manifest BIL-android-16k-evidence/BIL-android-base-manifest.xml \
            --package com.bilhealth.bodyintelligencelog \
            --version 1.0.0 --build "$BUILD_NUMBER" \
            --output BIL-android-final-artifact-identity.json
          sha256sum "$AAB" | tee BIL-android-aab.sha256
          stat --printf='%s\n' "$AAB" | tee BIL-android-aab.size
          git rev-parse HEAD | tee BIL-source-head.txt
          printf '%s\n' "BUILD_NUMBER=$BUILD_NUMBER" > BIL-build-number.txt

      - name: Reject forbidden bundled crypto implementations in signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          SCAN_DIR="$RUNNER_TEMP/bil-android-crypto-scan"
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          unzip -qq "$AAB" -d "$SCAN_DIR"
          if find "$SCAN_DIR" -type f -name '*.so' \
            -exec strings {} + 2>/dev/null \
            | grep -Eiq 'pointycastle|PcAESEngine|PcPBKDF2KeyDerivator|PcHMac|GCMBlockCipher|ZipCrypto'; then
            echo 'Forbidden non-OS crypto implementation marker found in signed AAB.' >&2
            exit 1
          fi
          printf '%s\n' 'SIGNED_AAB_FORBIDDEN_CRYPTO_MARKERS=0' \
            | tee BIL-android-crypto-scan.txt

      - name: Derive a signed recording APK from the verified final AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum --check -
          SECRET_DIR="$(mktemp -d "$RUNNER_TEMP/bil-apk-secret.XXXXXX")"
          trap 'rm -f "$SECRET_DIR/store.pass" "$SECRET_DIR/key.pass"; rmdir "$SECRET_DIR"' EXIT
          printf '%s' "$STORE_PASSWORD" > "$SECRET_DIR/store.pass"
          printf '%s' "$KEY_PASSWORD" > "$SECRET_DIR/key.pass"
          mkdir -p build/app/outputs/recording-apk
          java -jar "$BUNDLETOOL_JAR" build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/bil-android35-recording.apks" --mode=universal \
            --ks=android/app/upload-keystore.jks --ks-key-alias="$KEY_ALIAS" \
            --ks-pass="file:$SECRET_DIR/store.pass" --key-pass="file:$SECRET_DIR/key.pass"
          APK=build/app/outputs/recording-apk/BIL-Android35-derived-universal.apk
          unzip -p "$RUNNER_TEMP/bil-android35-recording.apks" universal.apk > "$APK"
          APKSIGNER="${BIL_APKSIGNER:?}"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > BIL-android-recording-apk-signature.txt
          "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > BIL-android-recording-apk-manifest.xml
          python3 tool/release/verify_final_artifact_identity.py \
            --android-manifest BIL-android-recording-apk-manifest.xml \
            --package com.bilhealth.bodyintelligencelog --version 1.0.0 --build 35 \
            --output BIL-android-recording-apk-identity.json
          java -cp "$BIL_DER_VERIFIER_CLASSES:$BIL_APKSIGNER_JAR" VerifyApkCertificate \
            "$APK" BIL-android-recording-apk-der-certificate.json release
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          def digest(path):
              with pathlib.Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream,'sha256').hexdigest()
          identity=json.loads(pathlib.Path('BIL-android-recording-apk-der-certificate.json').read_text())
          expected=re.sub(r'[:\s]','',os.environ['EXPECTED_UPLOAD_CERT_SHA256']).lower()
          assert re.fullmatch('[0-9a-f]{64}',expected)
          assert identity['status']=='VERIFIED_APK_SIGNATURE_AND_DER_IDENTITY' and identity['scope']=='release'
          assert identity['apk_signature_verified'] is True and identity['current_signer_count']==1
          assert identity['distinct_verified_scheme_leaf_certificates']==1 and identity['certificate_sha256']==expected
          aab=digest('build/app/outputs/bundle/release/app-release.aab')
          assert pathlib.Path('BIL-android-aab.sha256').read_text().split()[0]==aab
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['BIL_TESTED_SOURCE_SHA'] and re.fullmatch('[0-9a-f]{40}',source)
          controller=json.loads(pathlib.Path('BIL-android35-controller-provenance.json').read_text())
          assert controller['workflow_sha']==os.environ['GITHUB_SHA']==os.environ['BIL_SIGNING_ORCHESTRATION_SHA']
          assert controller['source_sha']==source
          receipt={'status':'VERIFIED_DERIVED_SIGNED_QA_APK','source_sha':source,'signing_orchestration_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'build':35,'package':'com.bilhealth.bodyintelligencelog','aab_sha256':aab,'apk_sha256':digest('build/app/outputs/recording-apk/BIL-Android35-derived-universal.apk'),'certificate_sha256':expected,'installation_source':'not_installed','scope':'Universal APK derived from the verified final AAB and signed with the upload certificate. Not Play-delivered, not proof of Play App Signing, billing or Integrity recognition.','app_recompiled':False,'play_upload_performed':False}
          pathlib.Path('BIL-android-recording-apk-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('DERIVED_SIGNED_ANDROID35_QA_APK_IDENTITY=PASS;PLAY_DELIVERY=NOT_PROVEN')
          PY

