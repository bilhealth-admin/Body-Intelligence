name: BIL supplementary security fixture inventory
on:
  push:
    branches: [codex/bil-native-gates-diagnostic-20261023, bil39/integration-20261025, codex/bil40-device-fixes-20261028]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic or final source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bil-security-fixtures-${{ github.sha }}
  cancel-in-progress: false
jobs:
  node-fixtures:
    name: Non-live store URL reviewer and disclosure negative fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node24
        with:
          node-version: '24.18.0'
      - name: Require reviewed exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Verify Google tools refuse redirects using owned loopback servers
        timeout-minutes: 2
        # Synthetic payloads and an ephemeral RSA key only; no privileged CLI
        # main, credentials file or store endpoint is invoked. Keep this outside
        # the general fixture inventory, whose network-denial guard is unchanged.
        run: node --test --test-reporter=tap tool/store_media/google_publisher_redirect.test.mjs
      - name: Test discovery and real child isolation
        run: python3 -m unittest discover -s tools/qa -p test_bil_security_fixture_inventory.py -v
      - name: Run every discovered non-live Node unit fixture
        run: python3 tools/qa/bil_security_fixture_inventory.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/bil-security-node-fixtures" --expected-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-security-node-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/bil-security-node-fixtures/
          if-no-files-found: error
  native-circle-review:
    name: Native PostgreSQL17 circle review negative and replay assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-native-circle-fixture-only
          POSTGRES_DB: postgres
        ports: ['55479:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node24
        with:
          node-version: '24.18.0'
      - name: Require reviewed exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Install integrity-locked QA-only PostgreSQL driver
        run: npm ci --prefix tools/qa/native_pg_fixture --ignore-scripts --no-audit --no-fund
      - name: Run unchanged native review assertions on a newly created database
        env:
          BIL_NATIVE_PG_QA_PASSWORD: isolated-native-circle-fixture-only
        run: node tools/qa/bil_circle_review_native_fixture.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bil-native-circle-review" "$GITHUB_WORKSPACE/tools/qa/native_pg_fixture/package.json" "$GITHUB_SHA"
      - name: Verify bounded delete-message ownership and ACL behavior
        env:
          BIL_NATIVE_PG_QA_PASSWORD: isolated-native-circle-fixture-only
        run: node tools/qa/security_delete_message/bil_delete_message_defensive_fixture.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bil-delete-message-defensive" "$GITHUB_WORKSPACE/tools/qa/native_pg_fixture/package.json" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-delete-message-defensive-${{ github.sha }}
          path: ${{ runner.temp }}/bil-delete-message-defensive/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-native-circle-review-${{ github.sha }}
          path: ${{ runner.temp }}/bil-native-circle-review/
          if-no-files-found: error
