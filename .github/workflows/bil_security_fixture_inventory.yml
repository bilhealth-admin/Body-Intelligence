          node-version: '24.18.0'
      - name: Require reviewed exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$EXPECTED_SHA" = "$SOURCE_SHA"
      - name: Install integrity-locked QA-only PostgreSQL driver
        run: npm ci --prefix tools/qa/native_pg_fixture --ignore-scripts --no-audit --no-fund
      - name: Run unchanged native review assertions on a newly created database
        env:
          BIL_NATIVE_PG_QA_PASSWORD: isolated-native-circle-fixture-only
        run: node tools/qa/bil_circle_review_native_fixture.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bil-native-circle-review" "$GITHUB_WORKSPACE/tools/qa/native_pg_fixture/package.json" "$SOURCE_SHA"
      - name: Verify bounded delete-message ownership and ACL behavior
        env:
          BIL_NATIVE_PG_QA_PASSWORD: isolated-native-circle-fixture-only
        run: node tools/qa/security_delete_message/bil_delete_message_defensive_fixture.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bil-delete-message-defensive" "$GITHUB_WORKSPACE/tools/qa/native_pg_fixture/package.json" "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
