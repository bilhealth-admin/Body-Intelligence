name: BIL exact advertising disclosure verification
run-name: BIL disclosure with canonical and regional locale coverage
on:
  workflow_dispatch:
  push:
    branches: [fix/ad-disclosure-20261020]
    paths: [.github/workflows/bil_ad_disclosure_20261020.yml]
permissions:
  contents: read
jobs:
  focused-mobile-repairs:
    name: Exact SDK format, full analysis and all advertising regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only reviewed Dart repairs and preserve exact branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/ad-disclosure-20261020'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          dart format lib/features/ads/advertising_privacy_page.dart \
            lib/app/localization/runtime_copy_advertising_disclosure.dart \
            test/features/ads/advertising_privacy_live_consent_test.dart
          git diff --check
          git add -- lib/features/ads/advertising_privacy_page.dart \
            lib/app/localization/runtime_copy_advertising_disclosure.dart \
            test/features/ads/advertising_privacy_live_consent_test.dart
          if ! git diff --cached --quiet; then
            git config user.name 'BIL scoped exact SDK formatter'
            git config user.email 'bil-qa-format@users.noreply.github.com'
            git commit -m 'style: format scoped advertising disclosure correction'
            REMOTE="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$REMOTE" = "$GITHUB_SHA"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          mkdir -p "$RUNNER_TEMP/bil-readiness-focused"
          git rev-parse HEAD > "$RUNNER_TEMP/bil-readiness-focused/tested-source.txt"
      - name: Analyze all Flutter source without weakening any rule
        run: flutter analyze --no-pub
      - name: Exercise every advertising suite and real localized privacy page
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded --concurrency 4 \
            test/features/ads \
            2>&1 | tee "$RUNNER_TEMP/bil-readiness-focused/flutter-tests.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-readiness-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-readiness-focused/
          if-no-files-found: error
          retention-days: 30
