name: BIL final release contract fix verify

on:
  push:
    branches: [verify/release-contract-fix-20261002]
    paths:
      - .github/workflows/bil_release_contract_fix_verify.yml

permissions:
  contents: read

jobs:
  contract-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0be412776c4ba02f4fce63d9a381f4206c1dd941
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed test/features/commerce/billing_release_hardening_contract_test.dart test/launch_readiness/flutter_release_plugin_sanitizer_test.dart test/launch_readiness/release_tool_truth_contract_test.dart
      - name: Run only release contract regressions
        run: >-
          flutter test --no-pub
          test/features/commerce/billing_release_hardening_contract_test.dart
          test/launch_readiness/flutter_release_plugin_sanitizer_test.dart
          test/launch_readiness/release_tool_truth_contract_test.dart
          test/launch_readiness/clean_source_freeze_preparation_contract_test.dart
          --timeout 5m
