name: BIL Sapphire and daily history full QA
on:
  push:
    branches: [fix/community-sapphire-health-3033, fix/admob-clean-production-2026-10-02]
  workflow_dispatch:
    inputs:
      guard_only:
        description: 'Only reviewed native/Watch boundary guard; not full Sapphire evidence'
        type: boolean
        default: false
run-name: Sapphire - ${{ inputs.guard_only && 'native guard ONLY' || 'full QA' }} - ${{ github.sha }}
permissions:
  contents: read
concurrency:
  group: sapphire-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-watch-guard-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.guard_only }}
    name: Native Watch guard only (not full QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the actual protected native and reviewed declaration boundary
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/sapphire -p 'test_native_watch_guard.py' -v
          python3 tool/sapphire/check_native_watch_unchanged.py
  prepare:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.guard_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.source.outputs.sha }}
      references_ready: ${{ steps.source.outputs.references_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Check committed source without applying historical patches
        run: |
          set -euo pipefail
          flutter pub get
          python3 - <<'PY'
          import pathlib,subprocess
          paths=subprocess.check_output(['git','diff','--name-only','8ec83ed81066c324cfd7119363ab31d73a8d4b97']).decode().splitlines()
          dart=[p for p in paths if p.endswith('.dart') and pathlib.Path(p).is_file()]
          if dart: subprocess.run(['dart','format','--output=none','--set-exit-if-changed',*dart],check=True)
          PY
      - name: Enforce immutable prepared source before reference verification
        id: source
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Sapphire prepare would modify the frozen source; create a new RC instead of mutating this one.' >&2
            git status --short
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'references_ready=true' >> "$GITHUB_OUTPUT"
      - name: Export exact source evidence without font binaries
        if: always()
        run: |
          mkdir -p /tmp/sapphire-source
          git rev-parse HEAD > /tmp/sapphire-source/source-sha.txt
          git status --porcelain > /tmp/sapphire-source/worktree-status.txt
          git diff 8ec83ed81066c324cfd7119363ab31d73a8d4b97 --binary > /tmp/sapphire-source/source.patch
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'.dart','.py','.yaml','.yml','.json','.sql','.ts','.md','.txt','.lock','.kt','.swift','.xml','.plist','.entitlements','.xcconfig','.pbxproj','.sh','.kts','.properties'}
          with zipfile.ZipFile('/tmp/sapphire-source/source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for name in paths:
                  p=pathlib.Path(name)
                  if p.is_file() and p.stat().st_size<4000000 and (p.suffix in allowed or name.startswith('assets/images/community/')):
                      out.write(p,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-source-${{ github.run_id }}
          path: /tmp/sapphire-source/
          retention-days: 14
  analyze-and-focused:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify native Watch and current-value UI remain unchanged
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/sapphire -p 'test_native_watch_guard.py' -v
          python3 tool/sapphire/check_native_watch_unchanged.py
      - name: Analyze and run focused cases and unchanged performance budgets
        run: |
          set -euo pipefail
          mkdir -p /tmp/sapphire-focused
          flutter pub get
          flutter analyze --no-pub 2>&1 | tee /tmp/sapphire-focused/analyze.log
          flutter test --no-pub --concurrency 1 --timeout 90s --reporter expanded test/features/connected_health test/connected_health test/features/community/community_sapphire_contract_test.dart test/features/community/community_welcome_responsive_test.dart test/features/community/community_review_regression_test.dart test/features/community/community_social_v2_ui_test.dart test/features/analytics/weekly_report_history_navigation_test.dart test/features/analytics/nutrition_entry_and_recipe_transition_contract_test.dart test/features/analytics/nutrition_empty_log_food_navigation_test.dart test/features/settings/more_premium_polish_contract_test.dart test/features/settings/more_section_headings_test.dart test/semantic_icon_badge_spacing_test.dart test/responsive_shell_test.dart 2>&1 | tee /tmp/sapphire-focused/focused.log
          flutter test --no-pub --concurrency 1 --timeout 30s --reporter expanded test/performance_budget_test.dart 2>&1 | tee /tmp/sapphire-focused/performance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-focused-${{ github.run_id }}
          path: /tmp/sapphire-focused/
          retention-days: 14
  community-reference-preparation:
    needs: [prepare, analyze-and-focused]
    if: (github.event_name != 'workflow_dispatch' || !inputs.guard_only) && needs.prepare.outputs.references_ready != 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact committed catalog bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Prepare only Community references for review, not acceptance
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/sapphire/prepare_community_goldens.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-community-references-${{ github.run_id }}
          path: ${{ runner.temp }}/sapphire-community-reference/
          retention-days: 14
  full-tests:
    needs: [prepare, analyze-and-focused]
    if: (github.event_name != 'workflow_dispatch' || !inputs.guard_only) && needs.prepare.outputs.references_ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact committed catalog bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Run all discovered tests with strict comparators and no exclusions
        env:
          SHARD: ${{ matrix.shard }}
        run: python tool/sapphire/run_full_shard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-full-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sapphire-shard/
          retention-days: 14
  visual-and-cloud-contracts:
    needs: [prepare, analyze-and-focused]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.guard_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: community_qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Capture all Community surfaces with synthetic identities
        env:
          BIL_COMMUNITY_CAPTURE_DIR: /tmp/sapphire-visual/ui
        run: |
          set -euo pipefail
          mkdir -p /tmp/sapphire-visual
          flutter pub get
          flutter test --no-pub --reporter expanded test/features/community/community_polish_visual_test.dart --timeout 2m 2>&1 | tee /tmp/sapphire-visual/visual.log
          cp assets/images/community/community_welcome_athletes.webp /tmp/sapphire-visual/welcome-asset.webp
      - name: Install pinned Deno 2.5.1
        if: ${{ !cancelled() }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.1
      - name: Run isolated PostgreSQL and mocked provider contract tests
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: isolated-fixture-only
        run: |
          set -euo pipefail
          mkdir -p /tmp/sapphire-visual
          psql -h 127.0.0.1 -U postgres -d community_qa -f tool/release/test_community_attention_isolated.sql 2>&1 | tee /tmp/sapphire-visual/sql.log
          deno test --allow-env --allow-read --allow-net supabase/functions/push-provider-gateway supabase/functions/community-push-dispatch 2>&1 | tee /tmp/sapphire-visual/push.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-visual-${{ github.run_id }}
          path: /tmp/sapphire-visual/
          retention-days: 14
