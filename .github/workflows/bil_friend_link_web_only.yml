name: BIL independent friend-link website only

on:
  push:
    branches: [web/bil-friend-link-20261005]
    paths:
      - web_bridge/friend_link/**
      - .github/workflows/bil_friend_link_web_only.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-independent-friend-link-web-only
  cancel-in-progress: false

jobs:
  test-and-publish-only-new-website:
    if: github.ref == 'refs/heads/web/bil-friend-link-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Enforce isolated website-only scope
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib,subprocess
          base='1eca2b39bd50591930e5c8f0eccdd96932745317'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          if not changed or any(not (p.startswith('web_bridge/friend_link/') or p=='.github/workflows/bil_friend_link_web_only.yml') for p in changed):
              raise SystemExit('OUT_OF_SCOPE_FILE_CHANGE')
          pathlib.Path('evidence/scope.json').write_text(json.dumps({'base':base,'changed_paths':changed,'app_files_changed':False,'existing_site_files_changed':False},indent=2))
          print('WEBSITE_ONLY_SCOPE=PASS')
          PY
      - name: Test bridge without native build tools or production credentials
        run: node --test web_bridge/friend_link/worker.test.mjs | tee evidence/tests.log
      - name: Check the existing Cloudflare credential for a new isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 web_bridge/friend_link/cloud_preflight.py
      - name: Publish only the new website, not bilhealth or the mobile app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: false
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config web_bridge/friend_link/wrangler.jsonc --no-bundle 2>&1 | tee evidence/deploy.log
      - name: Verify real HTTPS response and unchanged deep-link target
        run: python3 web_bridge/friend_link/verify_live.py
      - name: Preserve evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bil-friend-web-bridge-${{ github.sha }}
          path: evidence/
          retention-days: 7
