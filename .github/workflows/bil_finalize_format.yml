name: BIL finalize canonical Dart formatting

on:
  push:
    branches: [fix/community-sapphire-health-3033]
    paths:
      - .github/workflows/bil_finalize_format.yml

permissions:
  contents: write

jobs:
  finalize-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/community-sapphire-health-3033
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Apply canonical formatter output only
        shell: bash
        run: |
          set -euo pipefail
          dart format             tool/release/defer_ios_simple_barcode_scanner.dart             tool/release/sanitize_flutter_release_plugins.dart
          git diff --check

      - name: Commit canonical formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bil_finalize_format.yml
          git add             tool/release/defer_ios_simple_barcode_scanner.dart             tool/release/sanitize_flutter_release_plugins.dart             .github/workflows/bil_finalize_format.yml
          if git diff --cached --quiet; then
            echo 'No formatting delta remained; refusing an empty finalizer.'
            exit 1
          fi
          git config user.name 'bil-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'style: finish canonical Dart formatting for final RC'
          git push origin HEAD:fix/community-sapphire-health-3033
