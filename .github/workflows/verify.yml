name: verify

on:
  push:
    branches:
      - phase-3-product-excellence
      - fix/admob-clean-production-2026-10-02
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            $baseSha = git rev-parse "origin/${{ github.base_ref }}"
            $targets = git diff --name-only $baseSha HEAD -- '*.dart' |
              Where-Object {
                (Test-Path $_) -and (
                  $_ -like 'lib/*' -or
                  $_ -like 'test/*' -or
                  $_ -like 'integration_test/*'
                )
              }
            if (-not $targets) {
              Write-Host "No changed Dart files to format-check."
              exit 0
            }
            Write-Host "Format-checking $($targets.Count) changed Dart files."
            dart format --output=none --set-exit-if-changed @targets
          } else {
            $targets = @('lib', 'test')
            if (Test-Path integration_test) { $targets += 'integration_test' }
            dart format --output=none --set-exit-if-changed @targets
          }

      - name: Diagnose exact formatter diff on failure
        if: failure()
        shell: pwsh
        run: |
          # Diagnostic only; source-checks remains FAILED on formatting errors.
          # Show the exact SDK patch for the known scoped sources and tests.
          $formatTargets = @(
            'lib/features/settings/settings_page.dart',
            'lib/features/settings/help_center_page.dart',
            'test/visual_closure/actual_data_pages_golden_test.dart',
            'test/epic15_store_screenshot_golden_test.dart',
            'test/premium_splash_experience_test.dart',
            'lib/data/repositories/meal_repository.dart',
            'lib/features/connected_health/widgets/live_health_watch.dart',
            'lib/features/dashboard/dashboard_page.dart',
            'lib/features/dashboard/widgets/dashboard_first_use_experience.dart',
            'lib/features/dashboard/widgets/dashboard_grid.dart',
            'lib/features/dashboard/widgets/dashboard_header.dart',
            'lib/features/dashboard/widgets/dashboard_reference_goal_components.dart',
            'lib/features/dashboard/widgets/dashboard_reference_phone_components.dart',
            'lib/features/dashboard/widgets/first_meal_celebration.dart',
            'test/data/repositories/first_food_milestone_commit_test.dart',
            'test/features/dashboard/dashboard_first_use_guidance_test.dart'
          )
          dart format @formatTargets
          git diff -- @formatTargets

      - name: Analyze complete source
        # Report analyzer failures in the *same* run if formatting is red.
        # The source job still fails; this never bypasses any required gate.
        if: ${{ always() && !cancelled() }}
        run: flutter analyze --no-pub

      - name: Verify first-food commits, optional Skip and reviewer entitlement
        if: ${{ success() }}
        shell: pwsh
        run: >
          flutter test --no-pub --timeout=2m
          test/data/repositories/first_food_milestone_commit_test.dart
          test/features/dashboard/dashboard_first_use_guidance_test.dart
          test/features/commerce/reviewer_subscription_mirror_fallback_test.dart

      - name: Verify More UI behavior before Golden captures
        if: ${{ success() }}
        shell: pwsh
        run: >
          flutter test --no-pub
          test/features/settings/more_section_headings_test.dart
          test/features/settings/more_language_entry_test.dart
          test/features/settings/more_latest_weight_test.dart
          test/features/settings/more_premium_polish_contract_test.dart

  focused:
    # Fast, mandatory failure gate. All current Golden suites and the
    # transaction queue are exercised before the expensive complete suite.
    # Nothing is skipped or accepted here: a red focused check keeps the
    # aggregate required check red, while the full eight shards wait for green.
    name: focused-regressions (${{ matrix.suite }})
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - suite: store-captures
            path: test/epic15_store_screenshot_golden_test.dart
          - suite: production-goldens
            path: test/visual_closure/actual_production_pages_golden_test.dart
          - suite: data-goldens
            path: test/visual_closure/actual_data_pages_golden_test.dart
          - suite: splash-golden
            path: test/premium_splash_experience_test.dart
          - suite: transaction-queue
            path: test/features/commerce/store_transaction_queue_test.dart
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Clean stale checked-in Golden failure images
        shell: pwsh
        run: |
          Get-ChildItem -Path test -Directory -Recurse -Filter failures |
            ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }

      - name: Run focused Golden or transaction regression suite
        shell: pwsh
        run: |
          if ("${{ matrix.suite }}" -eq "splash-golden") {
            # A hanging image codec must fail promptly, never occupy the runner
            # for the default ten-minute per-test timeout.
            flutter test --no-pub --timeout=2m "${{ matrix.path }}"
          } else {
            flutter test --no-pub "${{ matrix.path }}"
          }

      # Temporary, read-only evidence export for the eight reviewed icon-only
      # Goldens. Exact PNG hashes prevent accepting unreviewed visual changes.
      # No files are overwritten, no checks are skipped, and protected
      # Home/Log Food screens are absent from this fixed whitelist.
      - name: Export reviewed flat-icon PNG candidates with SHA guards
        if: ${{ failure() && (matrix.suite == 'data-goldens' || matrix.suite == 'production-goldens' || matrix.suite == 'store-captures') }}
        shell: pwsh
        run: |
          $approved = @{
            'visual_closure_more_phone' = '121e02c2f58ff4be2c130293ea5fd08b73529105c78cece9c929edcb82404716'
            'visual_closure_more_lower_phone' = '6638633ee207054ce6a50adda4f92868b5f46b24a2237a28a01976bf5d7e171c'
            'visual_closure_settings_phone' = '0e72b314d3a62a59e6edaea992217975e4064e1f269fdcabc79a9ec4638cbd0d'
            'visual_closure_settings_phone_2' = 'fcc7e6265ccbf07b2acfc5be3a33e76ad02980f67d5b45ac9a95f643c195aafd'
            'visual_closure_settings_phone_3' = '02bab03c9e648309f6b1e22c8988f7219c5d1e38974d774b6d06f6526826ed61'
            'visual_closure_settings_phone_4' = '4cd79085013d883b7cc3feb75edb581689f9201f8e994bdef14eb53d69cbd910'
            'visual_closure_notification_settings_phone' = '580aaf65d46eb0afa2d22fdec5d8d081a89c4bd9c734e41d23f2d9dbaa1011bf'
            'visual_closure_wellness_library_phone' = 'fe31b02a66a7f0e92e998dee28723932692af7a68b42d2862db98bc72c415421'
            'visual_closure_community_signed_out_phone' = '02fcc2ee35a1747b1f3e36d6269355b788f39ad70e536662a857efe3f0e053c2'
            'visual_closure_community_messages_phone' = 'c40af20baca72398c8be1d11cb8738d17e3b6b350d058098fe57102ea381f726'
            'visual_closure_community_hub_authenticated_phone' = '72145d6a99c9c913bf7e93ed3570ae3ebe7fda5b6ed2b0cd1f4f2447a0b25e87'
            'visual_closure_community_navigation_menu_authenticated_phone' = '0d30d714162cc65cf52ba037e7e878e7b2aab819437fcc440369a788f1b8bc55'
            'visual_closure_community_inbox_authenticated_phone' = 'c61126c2e404b13f2b3fa7a62c105862a5816c6d679bb4200ee352151ae90b9b'
            'visual_closure_community_sent_authenticated_phone' = '3b45ccee35a5053b99da3e7f7b835582ed89b6d43351529bb31a35ad25ca5e98'
            'visual_closure_community_notifications_empty_authenticated_phone' = '8ed868db9e463f023e59e41bd8786628bb119dbd9a18f59f505501445da51fe7'
            'visual_closure_ai_coach_conversation_phone' = '18836860b5710a099853379b514e796633bdbc5dc37a082e798896f98e2778f6'
            'visual_closure_local_export_selected_day_phone' = '6587d9261ad294fa49df5f4726b27c6f5934d82c3558ec005c0cf9aaa50ae16d'
            'epic15_evidence_en_recipe_library' = '3e32a8cb6f02af47c9c2324c35446a06357df7feffc063dabe46f69dc6f77a51'
            'epic15_iphone_69_en_06_privacy_settings' = '17f858bd97fe37f3c3e9836826d61ece6bc2bfb493272ab53970b85ba5a25e68'
            'epic15_iphone_69_ar_08_privacy_settings_dark' = '01f5026f767e40676e5af4e3572bd303ac71dfcead2f1c3daad3826dacf82499'
            'epic15_android_phone_en_06_privacy_settings' = 'ae963daf74bed9f540732a0c9a3d27c7efcc89b85064531e0b477f4b24b19612'
            'epic15_evidence_en_workout_library' = 'a35a14eac5008ab1bbaf3cdb1c846ebecf99a9d144321cef67300eb10ab5b928'
          }
          foreach ($item in $approved.GetEnumerator()) {
            $file = "test/visual_closure/failures/$($item.Key)_testImage.png"
            if ($item.Key.StartsWith('epic15_')) {
              $file = "test/failures/$($item.Key)_testImage.png"
            }
            if (-not (Test-Path $file)) { continue }
            $digest = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($digest -ne $item.Value) {
              throw "Unreviewed Golden candidate $($item.Key): $digest"
            }
            # Git blobs accept base64. Emit bounded lines for later independent
            # review and SHA verification; never push from this test runner.
            $encoded = [Convert]::ToBase64String(
              [System.IO.File]::ReadAllBytes($file)
            )
            Write-Host "BIL_REVIEWED_IMAGE_BEGIN:$($item.Key):$digest"
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
              $size = [Math]::Min(4096, $encoded.Length - $offset)
              Write-Host $encoded.Substring($offset, $size)
            }
            Write-Host "BIL_REVIEWED_IMAGE_END:$($item.Key)"
          }

      - name: Preserve failed Golden screenshots from focused suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-golden-failures-${{ matrix.suite }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  shards:
    name: flutter-tests (shard ${{ matrix.shard }} of 8)
    needs: [source, focused]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Clean stale checked-in Golden failure images
        shell: pwsh
        run: |
          Get-ChildItem -Path test -Directory -Recurse -Filter failures |
            ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }

      - name: Run complete Flutter test suite shard ${{ matrix.shard }} of 8
        shell: pwsh
        run: |
          flutter test --no-pub --total-shards=8 --shard-index=${{ matrix.shard }}

      - name: Preserve failed golden screenshots from this shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-shard-${{ matrix.shard }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  flutter:
    name: flutter
    if: ${{ always() }}
    needs: [source, focused, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require analysis, formatting and all eight shards to pass
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          echo "Formatting and analysis: $SOURCE_RESULT"
          echo "Focused Goldens and commerce: $FOCUSED_RESULT"
          echo "All eight Flutter test shards: $SHARDS_RESULT"
          if [[ "$SOURCE_RESULT" != "success" || "$FOCUSED_RESULT" != "success" || "$SHARDS_RESULT" != "success" ]]; then
            echo "::error::All three quality phases must pass: source, focused, and the complete eight-shard suite."
            exit 1
          fi
          echo "All quality gates passed."
