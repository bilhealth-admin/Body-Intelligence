{
  "name": "BIL final commerce candidate source validation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "reviewed_controller_sha": {
          "description": "Exact Root-reviewed isolated controller SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "commerce-candidate-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "commerce": {
      "name": "commerce-candidate-source-tests",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "env": {
        "FLUTTER_SUPPRESS_ANALYTICS": "true",
        "DART_SUPPRESS_ANALYTICS": "true"
      },
      "steps": [
        {
          "name": "Require reviewed exact controller",
          "env": {
            "REVIEWED_CONTROLLER": "${{ inputs.reviewed_controller_sha }}"
          },
          "run": "test \"$GITHUB_SHA\" = \"$REVIEWED_CONTROLLER\"\ntest \"$GITHUB_REF\" = refs/heads/codex/bil-commerce-final-source-candidate-visible-action-20261121\n"
        },
        {
          "name": "Check out exact candidate",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Install pinned Flutter",
          "uses": "subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2",
          "with": {
            "flutter-version": "3.44.6",
            "cache": true
          }
        },
        {
          "name": "Resolve locked source dependencies",
          "run": "flutter pub get"
        },
        {
          "name": "Prove regression then validate exact candidate source",
          "run": "python3 - <<'BIL_COMMERCE_SOURCE_PY'\nimport datetime,hashlib,json,pathlib,subprocess,sys,time\nMANIFEST = {'base_source': '5c2a3c4ac35bc7c4d2bc72c27c160ba89607d96e', 'files': {'lib/features/commerce/domain/store_offer_metadata.dart': {'sha256': 'fd9ee361e0db929f2e2c085a7fc06879b7fe9628bb92917b37daec0851ae1613'}, 'lib/features/commerce/presentation/bil_store_plans_page.dart': {'sha256': '048704f731ec93742b1364bbf82d31d953369f9a1b0ebf88ec8d2132adb97e0f'}, 'lib/features/commerce/presentation/bil_store_plans_presentation.dart': {'sha256': 'a0daa4c4ab2efe8820981cb3b0e9b33d1e171b1b157f247f1bc5138459379ddc'}, 'lib/features/commerce/providers/commerce_presentation_providers.dart': {'sha256': 'e65eb533849c2351bc7ee3c6cc61a9da3a5592a112385c61dbdf941ed8145bd5'}, 'lib/features/commerce/providers/commerce_subscription_access.dart': {'sha256': 'd22d12984fa549970c6f1e9b32f7638af36f740d305067bc2a8490376339a068'}, 'lib/features/commerce/services/verified_store_catalog_adapter.dart': {'sha256': '196ab0606af13b99b5c5f9dbd5ef501e588558c199a7b341c5339e8bf5bd8459'}, 'test/features/commerce/apple_store_offer_metadata_test.dart': {'sha256': 'a7fdab5eaef923ac9e53cdf30745f9da046c9c2cc776a56c57135979132b4928'}, 'test/features/commerce/plans_verified_member_access_test.dart': {'sha256': 'd1c3fd590c32a7251c908bd38cbc12f54a075fac53055b1577b288c404220ffc'}, 'test/features/commerce/server_entitlement_explicit_checkout_fresh_test.dart': {'sha256': 'e6ed2da01aa4a65ef2974e56e4fa94db1d2f7a934cc83559b029ac71f0d81919'}}, 'tests': ['test/features/commerce/plans_verified_member_access_test.dart', 'test/features/commerce/apple_store_offer_metadata_test.dart']}\nROOT=pathlib.Path.cwd()\nOUT=ROOT/'artifacts/commerce-candidate-validation'\nOUT.mkdir(parents=True,exist_ok=False)\ndef sha(raw): return hashlib.sha256(raw).hexdigest()\ndef git(*args): return subprocess.check_output(['git',*args],cwd=ROOT)\ndef verify_candidate():\n    for name,meta in MANIFEST['files'].items():\n        p=ROOT/name\n        assert p.is_file() and not p.is_symlink(),name\n        assert sha(p.read_bytes())==meta['sha256'],name\n    changed=set(git('diff-tree','--no-commit-id','--name-only','-r',MANIFEST['base_source'],'HEAD').decode().splitlines())\n    assert changed==set(MANIFEST['files'])|{'.github/workflows/verify.yml'},changed\n    assert git('rev-list','--parents','-n','1','HEAD').decode().split()[1:]==[MANIFEST['base_source']]\nverify_candidate()\nversion=json.loads(subprocess.check_output(['flutter','--version','--machine']))\nassert version['frameworkVersion']=='3.44.6'\nassert version['frameworkRevision']=='ee80f08bbf97172ec030b8751ceab557177a34a6'\nassert version['engineRevision']=='83675ed27633283e7fc296c8bca22e841224c096'\n(OUT/'actual_inputs.json').write_text(json.dumps({'controller':git('rev-parse','HEAD').decode().strip(),'manifest':MANIFEST,'flutter':version,'scope':'targeted source tests only; not final CI, signing, device or store approval'},indent=2)+'\\n')\nresults=[]\ndef run(label,args,timeout):\n    start=time.monotonic();log=OUT/(label+'.log')\n    print('START',label,flush=True)\n    try:\n        with log.open('wb') as stream:\n            proc=subprocess.run(args,stdout=stream,stderr=subprocess.STDOUT,timeout=timeout)\n        code=proc.returncode\n    except subprocess.TimeoutExpired:\n        code=124\n    entry={'label':label,'exit_code':code,'elapsed_seconds':time.monotonic()-start,'log_sha256':sha(log.read_bytes())}\n    results.append(entry)\n    (OUT/'phase_results.json').write_text(json.dumps(results,indent=2)+'\\n')\n    print(json.dumps(entry),flush=True)\n    print(log.read_text(errors='replace')[-(6000 if code else 1800):],flush=True)\n    return code,log\n# Deliberate causal baseline: restore only the two old production providers,\n# keeping the new real-repository HTTP503 regression. Restore exact candidate\n# bytes even on timeout; this diagnostic cannot change candidate acceptance.\nnames=['lib/features/commerce/providers/commerce_subscription_access.dart','lib/features/commerce/providers/commerce_presentation_providers.dart']\nsaved={name:(ROOT/name).read_bytes() for name in names}\ntry:\n    for name in names: (ROOT/name).write_bytes(git('show',MANIFEST['base_source']+':'+name))\n    red_code,red_log=run('causal-baseline-confirmed-free-outage',['flutter','test','--no-pub','--reporter','expanded','--plain-name','apple keeps a confirmed Free display through a completed outage','test/features/commerce/server_entitlement_explicit_checkout_fresh_test.dart'],420)\nfinally:\n    for name,raw in saved.items(): (ROOT/name).write_bytes(raw)\nverify_candidate()\nred_text=red_log.read_text(errors='replace')\nred_proven=(red_code==1 and 'apple keeps a confirmed Free display through a completed outage' in red_text and 'Expected: same instance as' in red_text and 'Compilation failed' not in red_text and 'Failed to load' not in red_text)\n(OUT/'causal_baseline_review.json').write_text(json.dumps({'expected_failure_observed':red_proven,'raw_exit':red_code,'release_acceptance':False,'candidate_restored_byte_exact':True},indent=2)+'\\n')\ntargets=sorted(MANIFEST['files'])\nformat_code,_=run('candidate-format',['dart','format','--output=none','--set-exit-if-changed',*targets],180)\nif format_code:\n    # Formatting diagnostics only; restore exact tested candidate immediately.\n    saved_format={name:(ROOT/name).read_bytes() for name in targets}\n    try:\n        run('formatter-diagnostic-only',['dart','format',*targets],180)\n        (OUT/'formatter_diagnostic.patch').write_bytes(git('diff','--binary','HEAD','--',*targets))\n        for name in targets:\n            formatted=OUT/'formatted_candidate'/name\n            formatted.parent.mkdir(parents=True,exist_ok=True)\n            formatted.write_bytes((ROOT/name).read_bytes())\n    finally:\n        for name,raw in saved_format.items(): (ROOT/name).write_bytes(raw)\nverify_candidate()\nanalyze_code,_=run('candidate-strict-analysis',['flutter','analyze','--no-pub','--fatal-infos','--fatal-warnings',*targets],420)\ntest_code,_=run('candidate-commerce-regressions',['flutter','test','--no-pub','--reporter','expanded','--concurrency=2',*MANIFEST['tests']],900)\nverify_candidate()\nfinal={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'candidate_files_byte_exact':True,'causal_baseline_confirmed':red_proven,'format_exit':format_code,'strict_analyze_exit':analyze_code,'candidate_tests_exit':test_code,'results':results,'signing_approved':False,'physical_acceptance':False,'final_source_ci_approval':False}\n(OUT/'FINAL_TARGETED_SOURCE_RESULT.json').write_text(json.dumps(final,indent=2)+'\\n')\nsys.exit(0 if red_proven and format_code==analyze_code==test_code==0 else 1)\n\nBIL_COMMERCE_SOURCE_PY\n"
        },
        {
          "name": "Preserve original source diagnostics",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "commerce-candidate-source-validation",
            "path": "artifacts/commerce-candidate-validation",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
