name: Android39 paid12 offline transport and real Bash preflight only
run-name: Android39 C5 external harness Linux11 Python23 noSDK no credentials
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-android39-paid12-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  external-android39-offline-preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/bil-android39-paid12-offline-preflight-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact isolated preflight child without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require C5 direct parent and exact four reviewed preflight files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BIND'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          if subprocess.check_output(['git','rev-parse','HEAD^'],cwd=root,text=True).strip()!='c5b610276a3bbee8a0e446300296920b5cdc9570':raise ValueError('DIRECT_C5_PARENT_REQUIRED')
          expected_paths = ['.github/workflows/verify.yml', 'tool/release/fixtures/android39_paid12_candidate.yml', 'tool/release/fixtures/run_isolated_preflight.py', 'tool/release/fixtures/test_external39.py']
          actual=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],cwd=root,text=True).splitlines()
          if sorted(actual)!=expected_paths:raise ValueError('EXACT_FOUR_PATHS_REQUIRED')
          pins = {'tool/release/fixtures/android39_paid12_candidate.yml': '5a1c0058f1c5887734b27ee7b15c8b2f51128108eba45f19e4db8cc5f610dded', 'tool/release/fixtures/test_external39.py': '72010d8af1111e64d42726824e2afd7c6155e17ab7f032bc701ef2f3c6604a38', 'tool/release/fixtures/run_isolated_preflight.py': '8bd5d850ce85b029e74860396925cb865d45f1110e6e44f9c85713c047c3e16e'}
          for name,digest in pins.items():
              p=root/name
              if not p.is_file() or p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest()!=digest:raise ValueError('EXACT_REVIEWED_PREFLIGHT_BYTES_REQUIRED')
          if any(k in os.environ for k in ('GH_TOKEN','GITHUB_TOKEN','BIL_GOOGLE_REVIEWER_EMAIL','BIL_GOOGLE_REVIEWER_PASSWORD')):raise ValueError('NO_CREDENTIALS_REQUIRED')
          PY_BIND
      - name: Checkout exact immutable parser dependency only no install
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: 4c44018e59b437e86cdfc41da381398f93ed8808
          path: artifacts/tooling/bil-android-emulator-action
          persist-credentials: false
      - name: Run actual Linux11 and Python23 without SDK emulator network or credentials
        shell: bash
        run: python3 -B tool/release/fixtures/run_isolated_preflight.py
      - name: Preserve original finite offline results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android39-paid12-offline-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/android39-reviewer-safe
          if-no-files-found: error
          retention-days: 14
