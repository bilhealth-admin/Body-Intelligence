# INERT BOUND PREPARATION: requires Source17 full-unit green and separate Root publication/dispatch approval.
name: Source17 source checks and QA tools only
run-name: Source17 source checks and QA tools - 6c0dfbab576e797d24b42310e9194db2f1664188
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 6c0dfbab576e797d24b42310e9194db2f1664188
  SOURCE_TREE: bc22c3881ecc5cad8f3ee78d0a784de9e246e1a0
  CONTROLLER_BRANCH: codex/bil-s17-source-checks-only-20261122
jobs:
  source:
    name: source-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c0dfbab576e797d24b42310e9194db2f1664188
          persist-credentials: false

      - name: Verify immutable source and one-file controller provenance
        shell: pwsh
        env:
          BINDING_JOB_KEY: source-checks
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          """Embedded in a future tests-only GitHub controller. Never run locally."""
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)
          
          def git(*args, env=None):
              try:
                  result = subprocess.run(['git', *args], env=env, capture_output=True, timeout=90)
              except (subprocess.TimeoutExpired, OSError):
                  raise RuntimeError('PROVENANCE_GIT_TIMEOUT_OR_OS_ERROR_NO_RAW_OUTPUT') from None
              require(result.returncode == 0, 'PROVENANCE_GIT_FAILED_NO_RAW_STDERR')
              return result.stdout
          
          
          def fetch_controller(controller, fetch_env):
              # Retry only this read of the same immutable controller, never a ref or push.
              # A successful fetch still grants no binding: all checks below must finish.
              for attempt in range(1, 3):
                  try:
                      result = subprocess.run(
                          ['git', 'fetch', '--no-tags', '--depth=1', 'origin', controller],
                          env=fetch_env, capture_output=True, timeout=180,
                      )
                  except (subprocess.TimeoutExpired, OSError):
                      fetched = False
                  else:
                      fetched = result.returncode == 0
                  if fetched:
                      return
                  if attempt < 2:
                      print(json.dumps({'provenance_fetch_attempt': attempt,
                                        'status': 'RETRYING_SAME_IMMUTABLE_CONTROLLER'}))
              raise RuntimeError('PROVENANCE_FETCH_FAILED_AFTER_2_ATTEMPTS_NO_RAW_OUTPUT') from None
          
          source = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']
          controller = os.environ['GITHUB_SHA']
          branch = os.environ['CONTROLLER_BRANCH']
          workflow = '.github/workflows/verify.yml'
          require(all(re.fullmatch('[a-f0-9]{40}', value) for value in (source, source_tree, controller)), 'INVALID_IMMUTABLE_BINDING')
          require(source != controller, 'SOURCE_AND_CONTROLLER_MUST_BE_DISTINCT')
          require(os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence', 'WRONG_REPOSITORY')
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'DISPATCH_ONLY')
          require(os.environ['GITHUB_REF'] == 'refs/heads/' + branch, 'WRONG_CONTROLLER_REF')
          require(os.environ['GITHUB_WORKFLOW_SHA'] == controller, 'WORKFLOW_AND_RUN_CONTROLLER_DIFFER')
          require(git('rev-parse', 'HEAD').decode().strip() == source, 'SOURCE_HEAD_DRIFT')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == source_tree, 'SOURCE_TREE_DRIFT')
          require(not git('status', '--porcelain', '--untracked-files=no').strip(), 'SOURCE_NOT_PRISTINE')
          # Git credentials remain disabled in the checkout. Only this read-only child
          # receives an ephemeral header; no token/header is printed, stored or in argv.
          fetch_env = dict(os.environ)
          fetch_env.update(GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never', GCM_GUI_PROMPT='0')
          token = fetch_env.get('GH_TOKEN')
          require(isinstance(token, str) and bool(token), 'READONLY_GITHUB_TOKEN_REQUIRED')
          config_count = fetch_env.get('GIT_CONFIG_COUNT', '0')
          require(re.fullmatch(r'\d+', config_count) is not None and int(config_count) < 100, 'GIT_CHILD_CONFIG_COUNT_INVALID')
          slot = str(int(config_count))
          fetch_env['GIT_CONFIG_KEY_' + slot] = 'http.https://github.com/.extraheader'
          fetch_env['GIT_CONFIG_VALUE_' + slot] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          fetch_env['GIT_CONFIG_COUNT'] = str(int(config_count) + 1)
          for key in list(fetch_env):
              if key.upper().startswith(('GIT_TRACE', 'GCM_TRACE')) or key.upper() == 'GIT_CURL_VERBOSE':
                  fetch_env.pop(key)
          try:
              fetch_controller(controller, fetch_env)
          finally:
              fetch_env.pop('GH_TOKEN', None)
              fetch_env.pop('GIT_CONFIG_VALUE_' + slot, None)
              token = None
          require(git('rev-parse', 'FETCH_HEAD').decode().strip() == controller, 'CONTROLLER_FETCH_DRIFT')
          commit = git('cat-file', '-p', controller).decode('utf-8')
          parents = [line.split(' ', 1)[1] for line in commit.split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          require(parents == [source], 'CONTROLLER_MUST_HAVE_EXACT_SOURCE_PARENT')
          changed = git('diff-tree', '--no-commit-id', '--no-abbrev', '--raw', '-r', source, controller).decode().splitlines()
          require(len(changed) == 1, 'CONTROLLER_MUST_CHANGE_EXACTLY_ONE_WORKFLOW')
          fields = changed[0].split('\t')
          require(len(fields) == 2 and fields[1] == workflow, 'CONTROLLER_CHANGED_UNREVIEWED_PATH')
          metadata = fields[0].split()
          require(len(metadata) == 5 and metadata[0:2] == [':100644', '100644'] and metadata[4] == 'M', 'CONTROLLER_WORKFLOW_MODE_OR_OPERATION_CHANGED')
          workflow_bytes = git('show', controller + ':' + workflow)
          report = {
              'schema': 'bil49.tests-only-source-controller-binding.v1',
              'status': 'VERIFIED_BINDING_ONLY_NOT_TEST_RESULT',
              'source_sha': source, 'source_tree': source_tree,
              'controller_sha': controller,
              'controller_tree': git('rev-parse', controller + '^{tree}').decode().strip(),
              'controller_parent': source, 'controller_branch': branch,
              'workflow_path': workflow,
              'workflow_sha256': hashlib.sha256(workflow_bytes).hexdigest(),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job_key': os.environ['BINDING_JOB_KEY'],
              'event': 'workflow_dispatch',
              'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'release_approval': False,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'bil49-source-binding' / 'source-provenance.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({key: report[key] for key in ('source_sha', 'source_tree', 'controller_sha', 'controller_tree', 'job_key', 'status')}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        id: source_dependencies
        run: flutter pub get

      - name: Check formatting
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $baseRef = $env:GITHUB_BASE_REF
            if (-not $baseRef -or $baseRef.Contains("..")) {
              throw "The pull-request base ref is missing or invalid."
            }
            $remoteRef = "refs/remotes/origin/$baseRef"
            git fetch --no-tags --depth=1 origin "refs/heads/$baseRef`:$remoteRef"
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the pull-request base ref." }
            $baseSha = git rev-parse $remoteRef
            if ($LASTEXITCODE -ne 0) { throw "Unable to resolve the pull-request base SHA." }
            $targets = git diff --name-only $baseSha HEAD -- '*.dart' |
              Where-Object {
                (Test-Path $_) -and (
                  $_ -like 'lib/*' -or
                  $_ -like 'test/*' -or
                  $_ -like 'integration_test/*'
                )
              }
            if (-not $targets) {
              Write-Host "No changed Dart files to format-check."
              exit 0
            }
            Write-Host "Format-checking $($targets.Count) changed Dart files."
            dart format --output=none --set-exit-if-changed @targets
          } else {
            $targets = @('lib', 'test')
            if (Test-Path integration_test) { $targets += 'integration_test' }
            dart format --output=none --set-exit-if-changed @targets
          }

      - name: Diagnose exact formatter diff on failure
        if: ${{ failure() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          # Diagnostic only; source-checks remains FAILED on formatting errors.
          # Show the exact SDK patch for the known scoped sources and tests.
          $formatTargets = @(
            'lib/features/settings/settings_page.dart',
            'lib/features/settings/help_center_page.dart',
            'test/visual_closure/actual_data_pages_golden_test.dart',
            'test/epic15_store_screenshot_golden_test.dart',
            'test/premium_splash_experience_test.dart',
            'lib/data/repositories/meal_repository.dart',
            'lib/features/connected_health/widgets/live_health_watch.dart',
            'lib/features/dashboard/dashboard_page.dart',
            'lib/features/dashboard/widgets/dashboard_first_use_experience.dart',
            'lib/features/dashboard/widgets/first_use_context_coachmark.dart',
            'lib/features/dashboard/widgets/first_use_glass_surface.dart',
            'lib/features/dashboard/widgets/first_value_handoff_card.dart',
            'lib/features/daily_log/food_log_page.dart',
            'lib/features/daily_log/food_log_actions.dart',
            'test/features/dashboard/first_meal_celebration_visual_test.dart',
            'test/features/dashboard/first_use_context_coachmark_test.dart',
            'test/features/daily_log/food_log_first_use_coachmark_test.dart',
            'lib/features/dashboard/widgets/dashboard_grid.dart',
            'lib/features/dashboard/widgets/dashboard_header.dart',
            'lib/features/dashboard/widgets/dashboard_reference_goal_components.dart',
            'lib/features/dashboard/widgets/dashboard_reference_phone_components.dart',
            'lib/features/dashboard/widgets/first_meal_celebration.dart',
            'test/data/repositories/first_food_milestone_commit_test.dart',
            'test/features/dashboard/dashboard_first_use_guidance_test.dart',
            'lib/app/router/bil_external_route_navigator.dart',
            'lib/app/router/bil_safe_return_button.dart',
            'lib/features/notifications/services/inactivity_reminder_coordinator.dart',
            'test/app/router/audited_route_return_source_contract_test.dart',
            'test/app/router/notification_return_navigation_test.dart',
            'test/features/community/community_reference_navigation_test.dart',
            'lib/features/meal_planner/presentation/meal_planner_page.dart',
            'lib/features/meal_planner/presentation/meal_planner_copy.dart',
            'lib/features/daily_log/daily_log_navigation_actions.dart',
            'test/features/meal_planner/meal_planner_e2e_contract_test.dart',
            'test/features/meal_planner/meal_planner_recovery_contract_test.dart',
            'lib/features/meal_planner/presentation/meal_planner_persistence.dart',
            'test/features/meal_planner/meal_planner_recovery_widget_test.dart',
            'lib/app/theme/bil_navigation_press_style.dart',
            'lib/shared/widgets/bil_crystal_arrow.dart',
            'lib/shared/widgets/secondary_page_app_bar.dart',
            'test/bil_crystal_arrow_test.dart'
          )
          dart format @formatTargets
          git diff -- @formatTargets

      - name: Analyze complete source
        # Report analyzer failures in the *same* run if formatting is red.
        # The source job still fails; this never bypasses any required gate.
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        run: flutter analyze --no-pub

      - name: Verify adaptive calendar presentation negative controls
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        run: dart run tool/test_verify_bil39_pinned_calendar.dart

      - name: Prove pinned calendar date logic is unchanged
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        run: dart run tool/verify_bil39_pinned_calendar.dart

      - name: Verify native observation, IME and capture negative controls
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          # Live cloud cycles retain their explicit isolated runner and credentials.
          # This phase runs every host-safe native observer/transport control.
          $bilNativeQaFiles = @(Get-ChildItem -LiteralPath tools/qa/flutter -File -Filter 'native_*_test.dart' |
            Sort-Object Name | ForEach-Object { $_.FullName })
          if ($bilNativeQaFiles.Count -eq 0) { throw 'Native QA controls must not be empty' }
          flutter test --no-pub --concurrency=1 @bilNativeQaFiles

      - name: Verify first-food commits, optional Skip and reviewer entitlement
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: >
          flutter test --no-pub --timeout=2m
          test/data/repositories/first_food_milestone_commit_test.dart
          test/features/dashboard/dashboard_first_use_guidance_test.dart
          test/features/dashboard/first_use_context_coachmark_test.dart
          test/features/dashboard/first_meal_celebration_visual_test.dart
          test/features/daily_log/food_log_first_use_coachmark_test.dart
          test/features/commerce/reviewer_subscription_mirror_fallback_test.dart

      - name: Verify cold and warm notification Back navigation
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: >
          flutter test --no-pub --timeout=2m
          test/app/router/notification_return_navigation_test.dart
          test/app/router/audited_route_return_source_contract_test.dart
          test/features/notifications/ios_notification_navigation_test.dart
          test/features/community/community_deep_link_test.dart

      - name: Verify More UI behavior before Golden captures
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: >
          flutter test --no-pub
          test/features/settings/more_section_headings_test.dart
          test/features/settings/more_language_entry_test.dart
          test/features/settings/more_latest_weight_test.dart
          test/features/settings/more_premium_polish_contract_test.dart

      - name: Verify Meal Planner recovery and Review & log
        if: ${{ always() && !cancelled() && steps.source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: >
          flutter test --no-pub --timeout=2m
          test/features/meal_planner/meal_planner_e2e_contract_test.dart
          test/features/meal_planner/meal_planner_recovery_contract_test.dart
          test/features/meal_planner/meal_planner_recovery_widget_test.dart

      - name: Preserve immutable source and controller provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil49-source17-source-tools-source-checks-${{ env.SOURCE_SHA }}-${{ github.sha }}
          path: ${{ runner.temp }}/bil49-source-binding/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  integration-tools:
    name: Exact-source QA receipt and orchestration regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c0dfbab576e797d24b42310e9194db2f1664188
          persist-credentials: false
      - name: Verify immutable source and one-file controller provenance
        shell: pwsh
        env:
          BINDING_JOB_KEY: qa-tools
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          """Embedded in a future tests-only GitHub controller. Never run locally."""
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)
          
          def git(*args, env=None):
              try:
                  result = subprocess.run(['git', *args], env=env, capture_output=True, timeout=90)
              except (subprocess.TimeoutExpired, OSError):
                  raise RuntimeError('PROVENANCE_GIT_TIMEOUT_OR_OS_ERROR_NO_RAW_OUTPUT') from None
              require(result.returncode == 0, 'PROVENANCE_GIT_FAILED_NO_RAW_STDERR')
              return result.stdout
          
          
          def fetch_controller(controller, fetch_env):
              # Retry only this read of the same immutable controller, never a ref or push.
              # A successful fetch still grants no binding: all checks below must finish.
              for attempt in range(1, 3):
                  try:
                      result = subprocess.run(
                          ['git', 'fetch', '--no-tags', '--depth=1', 'origin', controller],
                          env=fetch_env, capture_output=True, timeout=180,
                      )
                  except (subprocess.TimeoutExpired, OSError):
                      fetched = False
                  else:
                      fetched = result.returncode == 0
                  if fetched:
                      return
                  if attempt < 2:
                      print(json.dumps({'provenance_fetch_attempt': attempt,
                                        'status': 'RETRYING_SAME_IMMUTABLE_CONTROLLER'}))
              raise RuntimeError('PROVENANCE_FETCH_FAILED_AFTER_2_ATTEMPTS_NO_RAW_OUTPUT') from None
          
          source = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']
          controller = os.environ['GITHUB_SHA']
          branch = os.environ['CONTROLLER_BRANCH']
          workflow = '.github/workflows/verify.yml'
          require(all(re.fullmatch('[a-f0-9]{40}', value) for value in (source, source_tree, controller)), 'INVALID_IMMUTABLE_BINDING')
          require(source != controller, 'SOURCE_AND_CONTROLLER_MUST_BE_DISTINCT')
          require(os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence', 'WRONG_REPOSITORY')
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'DISPATCH_ONLY')
          require(os.environ['GITHUB_REF'] == 'refs/heads/' + branch, 'WRONG_CONTROLLER_REF')
          require(os.environ['GITHUB_WORKFLOW_SHA'] == controller, 'WORKFLOW_AND_RUN_CONTROLLER_DIFFER')
          require(git('rev-parse', 'HEAD').decode().strip() == source, 'SOURCE_HEAD_DRIFT')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == source_tree, 'SOURCE_TREE_DRIFT')
          require(not git('status', '--porcelain', '--untracked-files=no').strip(), 'SOURCE_NOT_PRISTINE')
          # Git credentials remain disabled in the checkout. Only this read-only child
          # receives an ephemeral header; no token/header is printed, stored or in argv.
          fetch_env = dict(os.environ)
          fetch_env.update(GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never', GCM_GUI_PROMPT='0')
          token = fetch_env.get('GH_TOKEN')
          require(isinstance(token, str) and bool(token), 'READONLY_GITHUB_TOKEN_REQUIRED')
          config_count = fetch_env.get('GIT_CONFIG_COUNT', '0')
          require(re.fullmatch(r'\d+', config_count) is not None and int(config_count) < 100, 'GIT_CHILD_CONFIG_COUNT_INVALID')
          slot = str(int(config_count))
          fetch_env['GIT_CONFIG_KEY_' + slot] = 'http.https://github.com/.extraheader'
          fetch_env['GIT_CONFIG_VALUE_' + slot] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          fetch_env['GIT_CONFIG_COUNT'] = str(int(config_count) + 1)
          for key in list(fetch_env):
              if key.upper().startswith(('GIT_TRACE', 'GCM_TRACE')) or key.upper() == 'GIT_CURL_VERBOSE':
                  fetch_env.pop(key)
          try:
              fetch_controller(controller, fetch_env)
          finally:
              fetch_env.pop('GH_TOKEN', None)
              fetch_env.pop('GIT_CONFIG_VALUE_' + slot, None)
              token = None
          require(git('rev-parse', 'FETCH_HEAD').decode().strip() == controller, 'CONTROLLER_FETCH_DRIFT')
          commit = git('cat-file', '-p', controller).decode('utf-8')
          parents = [line.split(' ', 1)[1] for line in commit.split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          require(parents == [source], 'CONTROLLER_MUST_HAVE_EXACT_SOURCE_PARENT')
          changed = git('diff-tree', '--no-commit-id', '--no-abbrev', '--raw', '-r', source, controller).decode().splitlines()
          require(len(changed) == 1, 'CONTROLLER_MUST_CHANGE_EXACTLY_ONE_WORKFLOW')
          fields = changed[0].split('\t')
          require(len(fields) == 2 and fields[1] == workflow, 'CONTROLLER_CHANGED_UNREVIEWED_PATH')
          metadata = fields[0].split()
          require(len(metadata) == 5 and metadata[0:2] == [':100644', '100644'] and metadata[4] == 'M', 'CONTROLLER_WORKFLOW_MODE_OR_OPERATION_CHANGED')
          workflow_bytes = git('show', controller + ':' + workflow)
          report = {
              'schema': 'bil49.tests-only-source-controller-binding.v1',
