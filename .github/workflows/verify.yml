name: verify

on:
  push:
    branches:
      - phase-3-product-excellence
      - fix/admob-clean-production-2026-10-02
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            $baseSha = git rev-parse "origin/${{ github.base_ref }}"
            $targets = git diff --name-only $baseSha HEAD -- '*.dart' |
              Where-Object {
                (Test-Path $_) -and (
                  $_ -like 'lib/*' -or
                  $_ -like 'test/*' -or
                  $_ -like 'integration_test/*'
                )
              }
            if (-not $targets) {
              Write-Host "No changed Dart files to format-check."
              exit 0
            }
            Write-Host "Format-checking $($targets.Count) changed Dart files."
            dart format --output=none --set-exit-if-changed @targets
          } else {
            $targets = @('lib', 'test')
            if (Test-Path integration_test) { $targets += 'integration_test' }
            dart format --output=none --set-exit-if-changed @targets
          }

      - name: Diagnose exact formatter diff on failure
        if: failure()
        shell: pwsh
        run: |
          dart format test/visual_closure/actual_production_pages_golden_test.dart
          git diff -- test/visual_closure/actual_production_pages_golden_test.dart

      - name: Analyze complete source
        run: flutter analyze --no-pub

  shards:
    name: flutter-tests (shard ${{ matrix.shard }} of 8)
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run complete Flutter test suite shard ${{ matrix.shard }} of 8
        shell: pwsh
        run: |
          flutter test --no-pub --total-shards=8 --shard-index=${{ matrix.shard }}

      - name: Preserve failed golden screenshots from this shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-shard-${{ matrix.shard }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  flutter:
    name: flutter
    if: ${{ always() }}
    needs: [source, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require analysis, formatting and all eight shards to pass
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          echo "Formatting and analysis: $SOURCE_RESULT"
          echo "All eight Flutter test shards: $SHARDS_RESULT"
          if [[ "$SOURCE_RESULT" != "success" || "$SHARDS_RESULT" != "success" ]]; then
            echo "::error::Source checks or one or more Flutter test shards failed."
            exit 1
          fi
          echo "All quality gates passed."
