name: BIL StoreKit POSIX preflight (isolated)

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed candidate parent commit; never a branch name
        required: true
        type: string

permissions:
  contents: read

jobs:
  storekit-posix:
    if: ${{ github.ref == 'refs/heads/codex/bil47-storekit-posix-preflight-20261117' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact dispatched child commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing v7.0.1 pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select existing pinned Python action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # existing v7.1.0 pin
        with:
          python-version: '3.14'
      - name: Prove child-only workflow and exact parent source bytes
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          WORKFLOW = '.github/workflows/verify.yml'
          source = os.environ['EXPECTED_SOURCE_SHA']
          child = os.environ['GITHUB_SHA']
          assert re.fullmatch('[a-f0-9]{40}', source)
          assert re.fullmatch('[a-f0-9]{40}', child)
          assert git('rev-parse', 'HEAD').decode().strip() == child
          assert git('rev-parse', 'HEAD^').decode().strip() == source
          assert not git('status', '--porcelain')
          assert git('diff', '--name-status', source, child).decode().splitlines() == [
              'M\t' + WORKFLOW]
          assert sys.platform == 'linux' and sys.version_info[:2] == (3, 14)
          paths = [
              'tool/release/prepare_ios_storekit_restore_codec_overlay.py',
              'tool/release/test_prepare_ios_storekit_restore_codec_overlay.py',
              'tool/release/test_prepare_ios_storekit_restore_codec_overlay_binding.py',
              'tool/release/fixtures/storekit_0_4_13_plus_1/.gitattributes',
              'tool/release/fixtures/storekit_0_4_13_plus_1/README.md',
              'tool/release/fixtures/storekit_0_4_13_plus_1/LICENSE',
              'tool/release/fixtures/storekit_0_4_13_plus_1/InAppPurchasePlugin+StoreKit2.swift',
          ]
          hashes = {}
          for path in paths:
              data = Path(path).read_bytes()
              assert data == git('show', source + ':' + path), path
              hashes[path] = hashlib.sha256(data).hexdigest()
          assert hashes[paths[0]] == 'a9078a7e81f71fea99484e3270c038ca31acfc04bb02c18d02e36b0a9cfcfb16'
          assert hashes[paths[2]] == '7bb8eed31d9e4166e6d973457efb12967d4f399588aed6a9f97f8c8bcb49601e'
          assert hashes[paths[6]] == 'ee03daa8c3006114b2dc38d6c50b5730bfd89b6c849e419e26d90f2d1fc56304'
          out = Path('artifacts/storekit-posix-preflight')
          out.mkdir(parents=True)
          receipt = {'candidate_source_sha':source, 'workflow_child_sha':child,
              'workflow_only_child':True, 'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'python':sys.version, 'platform':sys.platform, 'source_hashes':hashes,
              'temporary_workflow_path':WORKFLOW,
              'temporary_workflow_sha256':hashlib.sha256(Path(WORKFLOW).read_bytes()).hexdigest(),
              'native_compilation_acceptance':False, 'signed_artifact_acceptance':False}
          (out/'source-binding.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Run exactly the existing41 plus native-binding22 POSIX fixtures
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tool/release -p 'test_prepare_ios_storekit_restore_codec_overlay*.py' -v 2>&1 | tee artifacts/storekit-posix-preflight/unittest.log
          python -B - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root = Path('artifacts/storekit-posix-preflight')
          text = (root/'unittest.log').read_text(encoding='utf-8')
          assert 'Ran 63 tests in ' in text
          assert '\nOK (skipped=1)\n' in text
          assert re.search(r'^test_posix_original_native_alias_rebound_atomically_only_its_link \([^\n]*\) \.\.\. ok$', text, re.M)
          assert re.search(r"^test_windows_stale_junction_prepare_refuses_non_atomic_swap_and_preserves \([^\n]*\) \.\.\. skipped 'Actual Windows junction refusal case'$", text, re.M)
          receipt = json.loads((root/'source-binding.json').read_text(encoding='utf-8'))
          for path, expected in receipt['source_hashes'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          receipt.update(cases=63, passed=62, skipped=1,
              skip_scope='Windows-only non-atomic junction refusal; POSIX atomic replacement executed',
              source_unchanged_after_tests=True,
              test_log_sha256=hashlib.sha256((root/'unittest.log').read_bytes()).hexdigest())
          (root/'test-result.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Preserve small exact-source fixture proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing v7.0.2 pin
        with:
          name: storekit-posix-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/storekit-posix-preflight/
          if-no-files-found: warn
          retention-days: 3
