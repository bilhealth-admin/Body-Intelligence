name: BIL reviewer39 SDK-free shared-temp guard preflight
run-name: "Reviewer39 source/controller filesystem; Python42 and actual Linux Bash17 only"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-reviewer39-guard-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout only this four-blob temporary controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact C5 application separately without controller YAML
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5b610276a3bbee8a0e446300296920b5cdc9570
          path: application-source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout pinned parser source only without executing emulator action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: 4c44018e59b437e86cdfc41da381398f93ed8808
          path: application-source/artifacts/tooling/bil-android-emulator-action
          persist-credentials: false
      - name: Exact Python42 and actual Bash17 in populated shared runner temp
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/bil-reviewer39-guard-preflight-20261117
          test "$GITHUB_RUN_ATTEMPT" = 1
          cd "$GITHUB_WORKSPACE/controller"
          printf '%s  %s\n' '000e10e1c2b099b0ea724a6fabb52976890aa8af328fa201d5b6261df02cf8c6' 'tool/reviewer39_guard_preflight/run_preflight.py' '02cffc2d39a2f4daa8a2d71b7ee2be1d21811268f26e1f0b6d84b3afb4322d80' 'tool/reviewer39_guard_preflight/frozen-inputs.json' '047efa683a4817fc839f3d1100b59157b0ca880d698dae712702ebfcea7e3b2a' 'tool/reviewer39_guard_preflight/candidate-controller.yml' | sha256sum -c -
          env -u BIL_GOOGLE_REVIEWER_EMAIL -u BIL_GOOGLE_REVIEWER_PASSWORD -u GH_TOKEN -u GITHUB_TOKEN python3 -X utf8 -B tool/reviewer39_guard_preflight/run_preflight.py
      - name: Preserve structured proof and original synthetic-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer39-sdk-free-guard42-bash17-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/reviewer39-guard-preflight-safe/
          if-no-files-found: error
          retention-days: 7
