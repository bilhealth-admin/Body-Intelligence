# BOUND INERT PREPARATION: publication and dispatch are separate Root-only actions.
# Tests-only evidence. This workflow never grants release approval.
name: Source15 comprehensive Flutter tests only
run-name: Source15 complete Flutter tests - fcba1d50901f68627c943c5943163b17b9857b97

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: fcba1d50901f68627c943c5943163b17b9857b97
  SOURCE_TREE: 1730bafa030aa86a3f29bf8ecaea23bee05a0052
  CONTROLLER_BRANCH: codex/bil-s15-comprehensive-flutter-only-20261122

jobs:
  shards:
    name: flutter-tests (shard ${{ matrix.shard }} of 8)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fcba1d50901f68627c943c5943163b17b9857b97
          persist-credentials: false

      - name: Verify immutable source and one-file controller provenance
        shell: pwsh
        env:
          BINDING_JOB_KEY: shard-${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          """Embedded in a future tests-only GitHub controller. Never run locally."""
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)
          
          def git(*args, env=None):
              try:
                  result = subprocess.run(['git', *args], env=env, capture_output=True, timeout=90)
              except (subprocess.TimeoutExpired, OSError):
                  raise RuntimeError('PROVENANCE_GIT_TIMEOUT_OR_OS_ERROR_NO_RAW_OUTPUT') from None
              require(result.returncode == 0, 'PROVENANCE_GIT_FAILED_NO_RAW_STDERR')
              return result.stdout
          
          
          def fetch_controller(controller, fetch_env):
              # Retry only this read of the same immutable controller, never a ref or push.
              # A successful fetch still grants no binding: all checks below must finish.
              for attempt in range(1, 3):
                  try:
                      result = subprocess.run(
                          ['git', 'fetch', '--no-tags', '--depth=1', 'origin', controller],
                          env=fetch_env, capture_output=True, timeout=180,
                      )
                  except (subprocess.TimeoutExpired, OSError):
                      fetched = False
                  else:
                      fetched = result.returncode == 0
                  if fetched:
                      return
                  if attempt < 2:
                      print(json.dumps({'provenance_fetch_attempt': attempt,
                                        'status': 'RETRYING_SAME_IMMUTABLE_CONTROLLER'}))
              raise RuntimeError('PROVENANCE_FETCH_FAILED_AFTER_2_ATTEMPTS_NO_RAW_OUTPUT') from None
          
          source = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']
          controller = os.environ['GITHUB_SHA']
          branch = os.environ['CONTROLLER_BRANCH']
          workflow = '.github/workflows/verify.yml'
          require(all(re.fullmatch('[a-f0-9]{40}', value) for value in (source, source_tree, controller)), 'INVALID_IMMUTABLE_BINDING')
          require(source != controller, 'SOURCE_AND_CONTROLLER_MUST_BE_DISTINCT')
          require(os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence', 'WRONG_REPOSITORY')
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'DISPATCH_ONLY')
          require(os.environ['GITHUB_REF'] == 'refs/heads/' + branch, 'WRONG_CONTROLLER_REF')
          require(os.environ['GITHUB_WORKFLOW_SHA'] == controller, 'WORKFLOW_AND_RUN_CONTROLLER_DIFFER')
          require(git('rev-parse', 'HEAD').decode().strip() == source, 'SOURCE_HEAD_DRIFT')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == source_tree, 'SOURCE_TREE_DRIFT')
          require(not git('status', '--porcelain', '--untracked-files=no').strip(), 'SOURCE_NOT_PRISTINE')
          # Git credentials remain disabled in the checkout. Only this read-only child
          # receives an ephemeral header; no token/header is printed, stored or in argv.
          fetch_env = dict(os.environ)
          fetch_env.update(GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never', GCM_GUI_PROMPT='0')
          token = fetch_env.get('GH_TOKEN')
          require(isinstance(token, str) and bool(token), 'READONLY_GITHUB_TOKEN_REQUIRED')
          config_count = fetch_env.get('GIT_CONFIG_COUNT', '0')
          require(re.fullmatch(r'\d+', config_count) is not None and int(config_count) < 100, 'GIT_CHILD_CONFIG_COUNT_INVALID')
          slot = str(int(config_count))
          fetch_env['GIT_CONFIG_KEY_' + slot] = 'http.https://github.com/.extraheader'
          fetch_env['GIT_CONFIG_VALUE_' + slot] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          fetch_env['GIT_CONFIG_COUNT'] = str(int(config_count) + 1)
          for key in list(fetch_env):
              if key.upper().startswith(('GIT_TRACE', 'GCM_TRACE')) or key.upper() == 'GIT_CURL_VERBOSE':
                  fetch_env.pop(key)
          try:
              fetch_controller(controller, fetch_env)
          finally:
              fetch_env.pop('GH_TOKEN', None)
              fetch_env.pop('GIT_CONFIG_VALUE_' + slot, None)
              token = None
          require(git('rev-parse', 'FETCH_HEAD').decode().strip() == controller, 'CONTROLLER_FETCH_DRIFT')
          commit = git('cat-file', '-p', controller).decode('utf-8')
          parents = [line.split(' ', 1)[1] for line in commit.split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          require(parents == [source], 'CONTROLLER_MUST_HAVE_EXACT_SOURCE_PARENT')
          changed = git('diff-tree', '--no-commit-id', '--no-abbrev', '--raw', '-r', source, controller).decode().splitlines()
          require(len(changed) == 1, 'CONTROLLER_MUST_CHANGE_EXACTLY_ONE_WORKFLOW')
          fields = changed[0].split('\t')
          require(len(fields) == 2 and fields[1] == workflow, 'CONTROLLER_CHANGED_UNREVIEWED_PATH')
          metadata = fields[0].split()
          require(len(metadata) == 5 and metadata[0:2] == [':100644', '100644'] and metadata[4] == 'M', 'CONTROLLER_WORKFLOW_MODE_OR_OPERATION_CHANGED')
          workflow_bytes = git('show', controller + ':' + workflow)
          report = {
              'schema': 'bil49.tests-only-source-controller-binding.v1',
              'status': 'VERIFIED_BINDING_ONLY_NOT_TEST_RESULT',
              'source_sha': source, 'source_tree': source_tree,
              'controller_sha': controller,
              'controller_tree': git('rev-parse', controller + '^{tree}').decode().strip(),
              'controller_parent': source, 'controller_branch': branch,
              'workflow_path': workflow,
              'workflow_sha256': hashlib.sha256(workflow_bytes).hexdigest(),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job_key': os.environ['BINDING_JOB_KEY'],
              'event': 'workflow_dispatch',
              'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'release_approval': False,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'bil49-source-binding' / 'source-provenance.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({key: report[key] for key in ('source_sha', 'source_tree', 'controller_sha', 'controller_tree', 'job_key', 'status')}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Archive stale generated Golden comparison images
        shell: pwsh
        run: |
          $bilTestRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'test'))
          $bilPrefix = $bilTestRoot + [IO.Path]::DirectorySeparatorChar
          $bilArchive = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'bil39-stale-shard-comparisons'))
          $bilTempPrefix = [IO.Path]::GetFullPath($env:RUNNER_TEMP) + [IO.Path]::DirectorySeparatorChar
          if (-not $bilArchive.StartsWith($bilTempPrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid archive root' }
          Get-ChildItem -LiteralPath $bilTestRoot -File -Recurse -Filter '*.png' |
            Where-Object { $_.Directory.Name -eq 'failures' -and $_.Name -match '_(masterImage|testImage|isolatedDiff|maskedDiff)\.png$' } |
            ForEach-Object {
              $bilSource = [IO.Path]::GetFullPath($_.FullName)
              if (-not $bilSource.StartsWith($bilPrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Comparison escaped test root' }
              if ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Refusing a comparison symlink' }
              $bilDestination = [IO.Path]::GetFullPath((Join-Path $bilArchive $bilSource.Substring($bilPrefix.Length)))
              if (-not $bilDestination.StartsWith($bilArchive + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid archive target' }
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($bilDestination)) -Force | Out-Null
              Move-Item -LiteralPath $bilSource -Destination $bilDestination
            }

      - name: Run complete Flutter test suite shard ${{ matrix.shard }} of 8
        shell: pwsh
        run: |
          $bilEvidence=Join-Path $env:RUNNER_TEMP 'bil39-full-shard-${{ matrix.shard }}'
          New-Item -ItemType Directory -Path $bilEvidence -Force | Out-Null
          python tools/qa/bil39_full_suite_files.py --source-sha $env:SOURCE_SHA --index ${{ matrix.shard }} --total 8 --output (Join-Path $bilEvidence 'plan.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bilTestFiles = @((Get-Content -LiteralPath (Join-Path $bilEvidence 'plan.json') -Raw | ConvertFrom-Json).files)
          if ($bilTestFiles.Count -eq 0) { throw 'An empty complete-suite partition cannot pass' }
          $bilDart = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin/dart.exe'
          $bilFlutterTools = Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.snapshot'
          & $bilDart $bilFlutterTools test `
            --no-pub `
            --machine `
            --dart-define=BIL_PAYMENTS_ENABLED=true `
            --dart-define=BIL_LIVE_WORKOUT_STREAM_CHECK=true `
            --concurrency=1 `
            @bilTestFiles 2>&1 | Tee-Object -FilePath (Join-Path $bilEvidence 'events.jsonl')
          $bilFlutterExit=$LASTEXITCODE
          python tools/qa/bil39_flutter_event_receipt.py --log (Join-Path $bilEvidence 'events.jsonl') --source-sha $env:SOURCE_SHA --test-exit $bilFlutterExit --output (Join-Path $bilEvidence 'receipt.json')
          exit $LASTEXITCODE

      - name: Preserve exact-source complete test outcomes even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil39-full-shard-${{ matrix.shard }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/bil39-full-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed golden screenshots from this shard
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-shard-${{ matrix.shard }}
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Preserve immutable shard provenance separately from original receipt archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil49-source15-provenance-shard-${{ matrix.shard }}-${{ env.SOURCE_SHA }}-${{ github.sha }}
          path: ${{ runner.temp }}/bil49-source-binding/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: tests-only complete file coverage
    if: ${{ always() && !cancelled() }}
    needs: [shards]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
