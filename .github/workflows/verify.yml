          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({key: report[key] for key in ('source_sha', 'source_tree', 'controller_sha', 'controller_tree', 'job_key', 'status')}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node24
        with:
          python-version: '3.14'
      - name: Execute all QA tool regression tests
        run: python -m unittest discover -s tools/qa -p 'test_*.py' -v
      - name: Verify StoreKit restore overlay isolation and reentry
        run: python -B -m unittest discover -s tool/release -p 'test_prepare_ios_storekit_restore_codec_overlay*.py' -v
      - name: Verify bounded Maven HTTP429 recovery and failure propagation
        run: python -B -m unittest discover -s tool/release -p test_retry_android_maven429_build.py -v
      - name: Verify CI-owned Supabase ports and exact database identity
