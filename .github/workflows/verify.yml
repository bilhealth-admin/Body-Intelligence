name: BIL Android startup harness preflight (isolated)

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact D186 source parent; never a branch name
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-startup-harness:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil47-android-startup-harness-preflight-20261117' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_COLORS: '0'
      NO_COLOR: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact dispatched temporary child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing v7.0.1 pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select existing pinned Python action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # existing v7.1.0 pin
        with:
          python-version: '3.14'
      - name: Prove exact D186 parent and three-path candidate overlay
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          PARENT = 'd1861c934a519a869d22388a5a9f6a959ddec3a1'
          EXPECTED_CHANGED = {'tool/release/run_android_emulator_smoke.sh': {'before_sha256': '97d54862d1b6f187d91dbb61cd57e047716f79ccbb8d157e8a146de1cc895c9e', 'proposed_sha256': '5c19d89758f1f39182307075b9f61113d6d521dbd76a64dfa400067ee73c5cc0'}, '.github/workflows/bil_android_isolated_emulator_smoke.yml': {'before_sha256': '2bd6da075d656aa3e9deec85e667ceeaee2b952560efc1fae95b36a70e6bc15a', 'proposed_sha256': 'b3090767407b45b9d24ecfbd11f24425826c1a6b4c19770ec458095a4fbb2e46'}, 'tool/release/test_android_emulator_fresh_install.py': {'before_sha256': None, 'proposed_sha256': 'fa374bcd36c951c071ee40d32d4c276fe738451e27540c57537ed50133174b0a'}}
          SUPPORT = ['tool/release/test_android_emulator_launch_options.py', 'tool/release/test_configure_android_emulator_display.py', 'tool/release/test_android_startup_workflow.py', 'tool/release/test_verify_android_startup_frame.py', 'tool/release/test_classify_android_startup_anr.py', 'tool/release/test_prepare_android_emulator_action.py', 'tool/release/test_android_emulator_unlock.py', 'tool/release/android_emulator_launch_options.py', 'tool/release/configure_android_emulator_display.py', 'tool/release/verify_android_startup_frame.py', 'tool/release/classify_android_startup_anr.py', 'tool/release/prepare_android_emulator_action.py', 'tool/release/android_emulator_unlock.py']
          WORKFLOW = '.github/workflows/verify.yml'
          def git(*args):
              return subprocess.check_output(['git', *args])
          source = os.environ['EXPECTED_SOURCE_SHA']
          child = os.environ['GITHUB_SHA']
          assert source == PARENT and re.fullmatch('[a-f0-9]{40}', child)
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/bil47-android-startup-harness-preflight-20261117'
          assert git('rev-parse', 'HEAD').decode().strip() == child
          assert git('rev-list', '--parents', '-n', '1', child).decode().split() == [child, source]
          assert not git('status', '--porcelain', '--untracked-files=all')
          expected_status = sorted(['M\t.github/workflows/verify.yml'] + [
              ('A\t' if row['before_sha256'] is None else 'M\t') + path
              for path, row in EXPECTED_CHANGED.items()])
          assert sorted(git('diff', '--name-status', source, child).decode().splitlines()) == expected_status
          assert sys.platform == 'linux' and sys.version_info[:2] == (3, 14)
          hashes = {}
          for path, row in EXPECTED_CHANGED.items():
              actual = Path(path).read_bytes()
              assert actual == git('show', child + ':' + path), path
              assert hashlib.sha256(actual).hexdigest() == row['proposed_sha256'], path
              if row['before_sha256'] is None:
                  assert subprocess.run(['git','cat-file','-e',source+':'+path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode != 0
              else:
                  assert hashlib.sha256(git('show', source + ':' + path)).hexdigest() == row['before_sha256'], path
              hashes[path] = hashlib.sha256(actual).hexdigest()
          for path in SUPPORT:
              actual = Path(path).read_bytes()
              assert actual == git('show', source + ':' + path), path
              hashes[path] = hashlib.sha256(actual).hexdigest()
          out = Path('artifacts/android-startup-harness-preflight')
          out.mkdir(parents=True)
          receipt = {'status':'SOURCE_BOUND_TESTS_NOT_YET_RUN','candidate_source_parent':source,
              'workflow_child_sha':child,'parent_tree':git('rev-parse',source+'^{tree}').decode().strip(),
              'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'approved_source_overlay_paths':EXPECTED_CHANGED,'source_hashes':hashes,
              'temporary_workflow_path':WORKFLOW,
              'temporary_workflow_sha256':hashlib.sha256(Path(WORKFLOW).read_bytes()).hexdigest(),
              'branch':os.environ['GITHUB_REF'],'event':os.environ['GITHUB_EVENT_NAME'],
              'python':sys.version,'platform':sys.platform,
              'native_emulator_execution':False,'native_startup_acceptance':False,
              'signed_artifact_acceptance':False,'store_or_device_mutations':False}
          (out/'source-binding.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run actual13 Bash regressions and all128 existing Python harness cases
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import datetime, hashlib, json, os, re, subprocess, sys, time
          from pathlib import Path
          SUITES = [('test_android_emulator_fresh_install.py', 13), ('test_android_emulator_launch_options.py', 4), ('test_configure_android_emulator_display.py', 16), ('test_android_startup_workflow.py', 12), ('test_verify_android_startup_frame.py', 35), ('test_classify_android_startup_anr.py', 8), ('test_prepare_android_emulator_action.py', 10), ('test_android_emulator_unlock.py', 43)]
          out = Path('artifacts/android-startup-harness-preflight')
          receipt = json.loads((out/'source-binding.json').read_text())
          owned_tmp = Path(os.environ['RUNNER_TEMP'])/'bil-android-startup-harness-preflight'
          owned_tmp.mkdir(exist_ok=False)
          env = dict(os.environ, TMPDIR=str(owned_tmp), TMP=str(owned_tmp), TEMP=str(owned_tmp),
              PYTHONDONTWRITEBYTECODE='1', PYTHON_COLORS='0', NO_COLOR='1')
          results = []
          for filename, expected in SUITES:
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              tick = time.monotonic()
              command = [sys.executable,'-B','-m','unittest','discover','-s','tool/release','-p',filename,'-v']
              timeout = False
              try:
                  result = subprocess.run(command,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180,check=False)
                  code, text = result.returncode, result.stdout
              except subprocess.TimeoutExpired as error:
                  timeout = True
                  code = None
                  text = error.stdout or ''
                  if isinstance(text,bytes): text = text.decode('utf-8',errors='replace')
                  text += '\nPREFLIGHT_OWNED_TEST_PROCESS_TIMEOUT\n'
              log = out/(filename.removesuffix('.py')+'.log')
              log.write_text(text,encoding='utf-8')
              counts = re.findall(r'^Ran (\d+) tests? in [^\n]+$',text,re.M)
              actual = int(counts[0]) if len(counts)==1 else None
              ok_rows = re.findall(r'^test_[^\n]* \.\.\. ok$',text,re.M)
              passed = code == 0 and not timeout and actual == expected and len(ok_rows)==expected and re.search(r'\nOK\s*\Z',text) is not None
              results.append({'file':filename,'expected_cases':expected,'actual_cases':actual,
                  'verbose_ok_rows':len(ok_rows),'exit_code':code,'timeout':timeout,'pass':passed,
                  'started_at_utc':started,'elapsed_seconds':round(time.monotonic()-tick,3),
                  'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),'command':command})
              print(json.dumps(results[-1]),flush=True)
          source_unchanged = all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in receipt['source_hashes'].items())
          tracked_clean = subprocess.run(['git','diff','--quiet'],check=False).returncode == 0 and subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode == 0
          status = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          only_owned_outputs = all(row.startswith('?? artifacts/android-startup-harness-preflight/') for row in status)
          passed = len(results)==8 and sum(x['expected_cases'] for x in results)==141 and all(x['pass'] for x in results) and source_unchanged and tracked_clean and only_owned_outputs
          receipt.update(status='ISOLATED_BASH_AND_PYTHON_PREFLIGHT_PASS' if passed else 'ISOLATED_BASH_AND_PYTHON_PREFLIGHT_FAIL',
              suite_results=results,expected_total_cases=141,actual_total_cases=sum(x['actual_cases'] or 0 for x in results),
              source_unchanged_after_tests=source_unchanged,tracked_source_clean=tracked_clean,
              only_owned_untracked_outputs=only_owned_outputs,completed_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          (out/'test-result.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          assert passed, 'Actual Bash/Python preflight failed; inspect original per-file logs'
          PY
      - name: Preserve exact-source bounded preflight proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing v7.0.2 pin
        with:
          name: android-startup-harness-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/android-startup-harness-preflight/
          if-no-files-found: warn
          retention-days: 3
