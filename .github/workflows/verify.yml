name: verify

on:
  push:
    branches:
      - phase-3-product-excellence
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: flutter
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze complete source
        run: flutter analyze --no-pub

      - name: Run complete test suite including goldens
        run: flutter test --no-pub
