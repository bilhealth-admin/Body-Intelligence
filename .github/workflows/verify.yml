      - name: Verify eight original raw event streams and complete source file coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Embedded collector: exact controller transport, unchanged source consumers."""
          import datetime
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys
          import zipfile
          
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path.cwd() / 'tools' / 'qa'))
          import bil39_full_suite_artifacts as transport
          import bil39_full_suite_files as suite
          from bil39_flutter_event_receipt import summarize
          from bil_owner_full_test_runner import Ledger
          
          class Refused(RuntimeError):
              pass
          
          def require(condition, code):
              if not condition:
                  raise Refused(code)
          
          def api(path, binary=False):
              result = subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'GET',
                                       'repos/bilhealth-admin/Body-Intelligence' + path],
                                      capture_output=True, timeout=60)
              require(result.returncode == 0, 'EXACT_RUN_GITHUB_GET_FAILED')
              require(len(result.stdout) <= (transport.MAX_ZIP if binary else 2 * 1024 * 1024), 'GITHUB_RESPONSE_TOO_LARGE')
              return result.stdout if binary else json.loads(result.stdout)
          
          def timestamp(value):
              parsed = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              require(parsed.tzinfo is not None, 'ARTIFACT_TIME_MUST_BE_EXPLICIT')
              return parsed
          
          source = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']
          controller = os.environ['GITHUB_SHA']
          branch = os.environ['CONTROLLER_BRANCH']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          out = Path(os.environ['RUNNER_TEMP']) / 'bil49-tests-only-coverage'
          out.mkdir(parents=True, exist_ok=False)
          report = {
              'schema': 'bil49.comprehensive-flutter-tests-only.v1',
              'status': 'FAIL', 'source_sha': source, 'source_tree': source_tree,
              'controller_sha': controller, 'controller_branch': branch,
              'run_id': run_id, 'run_attempt': attempt,
              'scope': 'Complete test/**/*_test.dart Flutter execution on GitHub only; eight original partitions plus exact coverage aggregation.',
              'release_approval': False,
              'all_defined_host_cases_passed': False,
              'separate_signed_artifact_or_native_or_store_claim': False,
              'live_public_range_opt_in': True,
              'required_skip_count': 0,
              'historical_execution_evidence_reused': False,
              'selected_artifacts': [], 'shard_outcomes': [],
              'live_public_range_execution': [],
          }
          
          def select(rows, name, start):
              candidates = [row for row in rows if row.get('name') == name]
              require(bool(candidates), 'MISSING_CURRENT_ATTEMPT_ARTIFACT_' + name)
              for row in candidates:
                  identity = row.get('workflow_run', {})
                  require(identity.get('head_sha') == controller and identity.get('id') == run_id and
                          identity.get('head_branch') == branch and row.get('expired') is False and
                          type(row.get('id')) is int and row['id'] > 0 and
                          type(row.get('size_in_bytes')) is int and 0 < row['size_in_bytes'] <= transport.MAX_ZIP and
                          re.fullmatch(r'sha256:[a-f0-9]{64}', row.get('digest') or '') is not None,
                          'ARTIFACT_CONTROLLER_IDENTITY_OR_DIGEST_INVALID')
                  timestamp(row['created_at'])
              current = [row for row in candidates if timestamp(row['created_at']) >= start]
              require(bool(current), 'NO_ARTIFACT_FROM_CURRENT_RUN_ATTEMPT')
              newest = max(timestamp(row['created_at']) for row in current)
              latest = [row for row in current if timestamp(row['created_at']) == newest]
              require(len(latest) == 1, 'AMBIGUOUS_NEWEST_ARTIFACT')
              chosen = latest[0]
              selected = {key: chosen[key] for key in ('id', 'name', 'digest', 'created_at')}
              selected['superseded_artifact_ids'] = sorted(row['id'] for row in candidates if row is not chosen)
              report['selected_artifacts'].append(selected)
              return selected
          
          def download(row):
              raw = api('/actions/artifacts/' + str(row['id']) + '/zip', binary=True)
              require('sha256:' + hashlib.sha256(raw).hexdigest() == row['digest'], 'DOWNLOADED_ARCHIVE_DIGEST_MISMATCH')
              return raw
          
          def provenance(raw, job_key, reference):
              with zipfile.ZipFile(io.BytesIO(raw)) as bundle:
                  members = bundle.infolist()
                  require(len(members) == 1 and members[0].filename == 'source-provenance.json' and
                          not members[0].is_dir() and not stat.S_ISLNK(members[0].external_attr >> 16) and
                          0 < members[0].file_size <= 32768, 'INVALID_SOURCE_PROVENANCE_ARCHIVE')
                  value = json.loads(bundle.read(members[0]))
              expected = dict(reference, job_key=job_key)
              # A timestamp records when each immutable binding was proved, not identity.
              require(set(value) == set(expected) and all(value[key] == expected[key]
                      for key in expected if key != 'utc'), 'SHARD_SOURCE_CONTROLLER_BINDING_DRIFT')
              timestamp(value['utc'])
              return value
          
          try:
              require(all(re.fullmatch('[a-f0-9]{40}', value) for value in (source, source_tree, controller)), 'INVALID_SHA_BINDING')
              reference_path = Path(os.environ['RUNNER_TEMP']) / 'bil49-source-binding' / 'source-provenance.json'
              reference = json.loads(reference_path.read_text(encoding='utf-8'))
              require(reference['source_sha'] == source and reference['source_tree'] == source_tree and
                      reference['controller_sha'] == controller and reference['controller_branch'] == branch and
                      reference['run_id'] == run_id and reference['run_attempt'] == attempt and
                      reference['job_key'] == 'coverage', 'COVERAGE_BINDING_DRIFT')
              report['source_controller_binding'] = reference
              run = api('/actions/runs/' + str(run_id))
              require(run.get('id') == run_id and run.get('head_sha') == controller and
                      run.get('head_branch') == branch and run.get('event') == 'workflow_dispatch' and
                      run.get('path') == '.github/workflows/verify.yml' and run.get('run_attempt') == attempt,
                      'EXACT_CONTROLLER_RUN_IDENTITY_MISMATCH')
              current = api('/actions/runs/' + str(run_id) + '/attempts/' + str(attempt))
              require(current.get('id') == run_id and current.get('head_sha') == controller and
                      current.get('run_attempt') == attempt, 'EXACT_ATTEMPT_IDENTITY_MISMATCH')
              start = timestamp(current['run_started_at'])
              jobs = api('/actions/runs/' + str(run_id) + '/attempts/' + str(attempt) + '/jobs?per_page=100')
              expected_names = {'flutter-tests (shard ' + str(index) + ' of 8)' for index in range(8)}
              expected_names.add('tests-only complete file coverage')
              require(jobs.get('total_count') == 9 and len(jobs.get('jobs', [])) == 9 and
                      {job.get('name') for job in jobs['jobs']} == expected_names,
                      'EXPECTED_EXACTLY_EIGHT_SHARDS_AND_ONE_COVERAGE_JOB')
              report['jobs'] = [{key: job.get(key) for key in ('id', 'name', 'status', 'conclusion')} for job in jobs['jobs']]
              rows = []
              for page in range(1, 11):
                  batch = api('/actions/runs/' + str(run_id) + '/artifacts?per_page=100&page=' + str(page))['artifacts']
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise Refused('UNBOUNDED_ARTIFACT_INVENTORY')
              execution = out / 'execution'
              execution.mkdir()
              for index in range(8):
                  selected = select(rows, 'bil39-full-shard-' + str(index) + '-' + source, start)
                  archive = out / ('shard-' + str(index) + '.zip')
                  archive.write_bytes(download(selected))
                  destination = execution / ('shard-' + str(index))
                  # Original reviewed digest/size/member/link checks, unchanged.
                  transport.extract(archive, destination, digest=selected['digest'])
                  p = select(rows, 'bil49-source15-provenance-shard-' + str(index) + '-' + source + '-' + controller, start)
                  binding = provenance(download(p), 'shard-' + str(index), reference)
                  (out / ('provenance-shard-' + str(index) + '.json')).write_text(json.dumps(binding, indent=2) + '\n', encoding='utf-8')
                  receipt = json.loads((destination / 'receipt.json').read_text(encoding='utf-8-sig'))
                  require(type(receipt.get('process_exit')) is int, 'INVALID_RECORDED_PROCESS_EXIT')
                  event_lines = (destination / 'events.jsonl').read_text(encoding='utf-8-sig', errors='replace').splitlines()
                  actual = summarize(event_lines, source, receipt['process_exit'])
                  require(actual == receipt, 'RECEIPT_DIFFERS_FROM_ORIGINAL_RAW_MACHINE_EVENTS')
                  ledger = Ledger()
                  for line in event_lines:
                      try:
                          event = json.loads(line)
                      except ValueError:
                          continue
                      if isinstance(event, dict):
                          ledger.event(event)
                  for key, outcome in ledger.outcomes.items():
                      test = ledger.tests[key]
                      file = ledger.file_for(test)
                      if (file == 'test/features/wellness/wellness_video_stream_live_test.dart' and
                              test.get('name') == 'live public BIL stream supports pinned native range delivery'):
                          report['live_public_range_execution'].append({'shard': index, 'file': file,
                              'name': test['name'], 'outcome': outcome,
                              'evidence': 'Original raw nonhidden Flutter machine testDone outcome; exact Source15 bytes.'})
                  report['shard_outcomes'].append({'index': index, 'status': actual['status'], 'counts': actual['counts'],
                      'process_exit': actual['process_exit'], 'protocol_success': actual['protocol_success'],
                      'error_events': actual['error_events'], 'skips': actual['skips']})
                  require(actual['counts'].get('skip', 0) == 0 and not actual['skips'] and
                          not actual['unexpected_skips'], 'ANY_SKIP_PREVENTS_ALL_CASES_PASS')
              require(len(report['live_public_range_execution']) == 1 and
                      report['live_public_range_execution'][0]['outcome'] == 'success',
                      'EXACT_CURRENT_SOURCE_LIVE_PUBLIC_RANGE_CASE_MUST_PASS_ONCE')
              selection = {'source_sha': source, 'controller_sha': controller, 'controller_branch': branch,
                  'run_id': run_id, 'run_attempt': attempt, 'artifacts': report['selected_artifacts'],
                  'prior_artifacts_deleted': False, 'scope': 'Current exact controller attempt; tested source independently bound.'}
              (execution / 'artifact-selection.json').write_text(json.dumps(selection, indent=2) + '\n', encoding='utf-8')
              # Original exact-source plans, files, outcomes and full coverage verifier.
              coverage = suite.verify(Path.cwd(), execution, sha=source, total=8)
              require(coverage['counts'].get('skip', 0) == 0 and coverage['counts'].get('failure', 0) == 0 and
                      coverage['counts'].get('error', 0) == 0, 'NONZERO_SKIP_FAILURE_OR_ERROR')
              require(os.environ['SHARDS_RESULT'] == 'success', 'SHARD_JOB_AGGREGATE_NOT_SUCCESS')
              require(all(job['status'] == 'completed' and job['conclusion'] == 'success'
                          for job in jobs['jobs'] if job['name'] != 'tests-only complete file coverage'),
                      'ORIGINAL_SHARD_JOBS_NOT_ALL_SUCCESS')
              report['complete_file_coverage'] = coverage
              report['status'] = 'ALL_DEFINED_HOST_FLUTTER_CASES_PASSED_ZERO_SKIPS'
              report['all_defined_host_cases_passed'] = True
          except Refused as error:
              report['refusal_code'] = str(error)
          except Exception:
              report['refusal_code'] = 'UNEXPECTED_COLLECTOR_ERROR_NO_RAW_STDERR'
          finally:
              (out / 'tests-only-result.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              print(json.dumps({key: report[key] for key in ('source_sha', 'source_tree', 'controller_sha', 'status', 'all_defined_host_cases_passed', 'release_approval')}))
              print(json.dumps({'refusal_code': report.get('refusal_code'), 'recorded_shards': len(report['shard_outcomes'])}))
          raise SystemExit(not report['all_defined_host_cases_passed'])
          PY

      - name: Preserve tests-only coverage and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil49-tests-only-coverage-${{ env.SOURCE_SHA }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bil49-tests-only-coverage/
            ${{ runner.temp }}/bil49-source-binding/source-provenance.json
          if-no-files-found: error
          retention-days: 30
