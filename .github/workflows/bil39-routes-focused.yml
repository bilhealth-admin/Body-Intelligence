name: BIL39 Routes Focused

on:
  pull_request:
    paths:
      - 'lib/app/router/bil_safe_return_button.dart'
      - 'lib/features/connected_health/**'
      - 'lib/features/settings/reference_goals*'
      - 'lib/features/wellness/presentation/bil_workout_routines_page.dart'
      - 'test/app/router/bil39_*'
      - 'test/features/connected_health/steps_history_navigation_test.dart'
      - 'test/features/wellness/bil39_*'
      - 'test/features/wellness/workout_deep_link_no_automatic_paywall_test.dart'
      - '.github/workflows/bil39-routes-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    name: BIL-05/10/14/18/20 exact-HEAD regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Require exact Dart format
        run: >
          dart format --output=none --set-exit-if-changed
          lib/app/router/bil_safe_return_button.dart
          test/app/router/bil39_safe_return_widget_test.dart
          test/app/router/bil39_pop_scope_return_test.dart
          test/features/wellness/bil39_session_video_return_test.dart
          test/features/wellness/workout_deep_link_no_automatic_paywall_test.dart
      - name: Show official pinned Dart formatting patch on failure (diagnostic only)
        if: failure()
        run: |
          dart format --output=write test/features/wellness/bil39_session_video_return_test.dart
          git --no-pager diff -- test/features/wellness/bil39_session_video_return_test.dart
      - name: Analyze full Flutter source
        run: flutter analyze --no-pub
      - name: Run real navigation and bad-path widget regressions
        run: >
          flutter test --no-pub --timeout=2m
          test/app/router/bil39_safe_return_widget_test.dart
          test/app/router/bil39_pop_scope_return_test.dart
          test/app/router/notification_return_navigation_test.dart
          test/features/connected_health/steps_history_navigation_test.dart
          test/bil39_routes_regression_contract_test.dart
          test/features/wellness/bil39_session_video_return_test.dart
          test/features/wellness/workout_deep_link_no_automatic_paywall_test.dart
