name: BIL targeted Windows Daily Log golden refresh

on:
  push:
    branches: [fix/admob-clean-production-2026-10-02]

permissions:
  contents: write

concurrency:
  group: bil-targeted-windows-daily-log-golden-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Refresh only intentional Daily Log references on Windows
        shell: pwsh
        run: |
          flutter test --no-pub --update-goldens test/visual_closure/actual_data_pages_golden_test.dart --plain-name "daily log production empty day capture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --update-goldens test/visual_closure/actual_data_pages_golden_test.dart --plain-name "daily log reference premium goal capture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $expected = @(
            'test/visual_closure/goldens/visual_closure_daily_log_empty_phone.png',
            'test/visual_closure/goldens/visual_closure_daily_log_reference_premium_phone.png'
          )
          $changed = @(git status --porcelain=v1 | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 2) {
            Write-Error "Expected exactly two changed golden files; got: $($changed -join ', ')"
            exit 1
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              Write-Error "Missing intended golden change: $path"
              exit 1
            }
          }

          flutter test --no-pub test/visual_closure/actual_data_pages_golden_test.dart --plain-name "daily log production empty day capture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub test/visual_closure/actual_data_pages_golden_test.dart --plain-name "daily log reference premium goal capture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit references and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "bilhealth-admin"
          git config user.email "bilhealth.app@gmail.com"
          git rm .github/workflows/bil_targeted_windows_daily_log_golden_refresh.yml
          git add test/visual_closure/goldens/visual_closure_daily_log_empty_phone.png
          git add test/visual_closure/goldens/visual_closure_daily_log_reference_premium_phone.png

          $expected = @(
            '.github/workflows/bil_targeted_windows_daily_log_golden_refresh.yml',
            'test/visual_closure/goldens/visual_closure_daily_log_empty_phone.png',
            'test/visual_closure/goldens/visual_closure_daily_log_reference_premium_phone.png'
          )
          $changed = @(git status --porcelain=v1 | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 3) {
            Write-Error "Unexpected final change set: $($changed -join ', ')"
            exit 1
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              Write-Error "Missing expected final path: $path"
              exit 1
            }
          }

          git commit -m "goldens: normalize Daily Log references for Windows CI"
          git push origin HEAD:fix/admob-clean-production-2026-10-02
