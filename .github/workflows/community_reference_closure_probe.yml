name: Community reference closure probe

on:
  push:
    branches:
      - work/community-reference-parity-20261003

permissions:
  contents: read

concurrency:
  group: community-reference-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify changed Dart formatting
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only 9389fbb569bbadeb5d127b71a553f24bb7b1159d HEAD -- '*.dart' | while read -r path; do test -f "$path" && printf '%s\n' "$path"; done)
          if [ "${#paths[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${paths[@]}"
          fi
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Verify reference closure regressions
        run: |
          flutter test --no-pub \
            test/localization/bil_25_locale_fallback_closure_test.dart \
            test/features/community/community_reference_parity_v1_test.dart \
            test/features/community/community_reference_composer_v1_test.dart \
            test/features/community/community_post_image_support_test.dart \
            test/features/community/community_comment_threads_v3_contract_test.dart \
            test/features/community/community_topics_v1_contract_test.dart \
            test/features/community/community_circles_v1_contract_test.dart \
            test/features/community/community_multi_image_v1_contract_test.dart \
            test/features/community/community_post_context_v1_contract_test.dart
