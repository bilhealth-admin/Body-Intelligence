name: BIL notification privacy and release evidence repairs
on:
  workflow_dispatch:
  push:
    branches: [fix/store-release-readiness-20261020]
    paths: [.github/workflows/bil_store_readiness_repairs_20261020.yml]
permissions:
  contents: read
jobs:
  focused-mobile-repairs:
    name: Exact SDK format, full analysis and notification/privacy regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only reviewed Dart repairs and preserve exact branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/store-release-readiness-20261020'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          dart format lib/features/notifications/services/community_push_service.dart \
            test/features/notifications/community_push_owner_epoch_test.dart \
            lib/app/localization/runtime_copy_apple_ai_privacy.dart \
            test/features/intelligence_center/ai_consent_and_context_settings_contract_test.dart \
            tool/localization/generate_apple_ai_privacy_copy.dart
          git diff --check
          git add -- lib/features/notifications/services/community_push_service.dart \
            test/features/notifications/community_push_owner_epoch_test.dart \
            lib/app/localization/runtime_copy_apple_ai_privacy.dart \
            test/features/intelligence_center/ai_consent_and_context_settings_contract_test.dart \
            tool/localization/generate_apple_ai_privacy_copy.dart
          if ! git diff --cached --quiet; then
            git config user.name 'BIL scoped exact SDK formatter'
            git config user.email 'bil-qa-format@users.noreply.github.com'
            git commit -m 'style: apply pinned Dart formatter to reviewed readiness repairs'
            REMOTE="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$REMOTE" = "$GITHUB_SHA"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          mkdir -p "$RUNNER_TEMP/bil-readiness-focused"
          git rev-parse HEAD > "$RUNNER_TEMP/bil-readiness-focused/tested-source.txt"
      - name: Analyze all Flutter source without weakening any rule
        run: flutter analyze --no-pub
      - name: Exercise all notification suites and real consent copy resolver
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded --concurrency 4 \
            test/features/notifications \
            test/features/intelligence_center/ai_consent_and_context_settings_contract_test.dart \
            2>&1 | tee "$RUNNER_TEMP/bil-readiness-focused/flutter-tests.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-readiness-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-readiness-focused/
          if-no-files-found: error
          retention-days: 30
  push-provider-privacy:
    name: Push title/body redaction and gateway contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Test real production dispatcher with synthetic transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bil-push-privacy"
          git rev-parse HEAD > "$RUNNER_TEMP/bil-push-privacy/source.txt"
          cd supabase/functions
          deno test --allow-env --allow-read --frozen --lock=deno.lock \
            community-push-dispatch/server_test.ts push-provider-gateway/server_test.ts \
            2>&1 | tee "$RUNNER_TEMP/bil-push-privacy/tests.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-push-privacy-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-push-privacy/
          if-no-files-found: error
          retention-days: 30
  artifact-evidence-contracts:
    name: Final archive identity and SDK privacy inventory negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -W error::ResourceWarning -m unittest discover -s tool/release -p test_verify_final_artifact_identity.py -v
