            "artifact_id": 13543413557,
            "producer_controller_sha": "9c7654c840c9712d66a31f4485f0c3eb83b29a19",
            "producer_workflow_sha256": "93380c093b060a337e606f5cf1472ce78c6e7624e334140942001ec947daf63f",
            "artifact_zip_sha256": "fb18ec5958e550f2997617fa62243142a16012d0fb3a7b0e37e10f162aa451f2",
            "aab_sha256": "04bf03c750946054d835a55e1215ac22bb72c3ef0367c5de0d16f04f51f8a418",
            "apk_sha256": "9d627a4d7d745a4feca60e8ed2c393fe37373d3912f974403a3f70d719e2ad24",
