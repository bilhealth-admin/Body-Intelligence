              def dismiss_daily_reminder_if_observed(self, root, *, already_dismissed=False):
                  # StartupPage legitimately routes an existing account to this reminder
                  # before Dashboard. Its source close action only stores today's local
                  # dismissal preference; never tap Save or alter a weight/measurement.
                  if not (self.found(root,'How much do you weigh today?') and self.found(root,'Not now')):
                      return False
                  if already_dismissed:raise Stop('DAILY_REMINDER_REPEATED_WITHOUT_NAVIGATION')
                  self.tap(root,'Not now')
                  return True
          
              def login(self):
                  self.phase = 'WELCOME'
                  root = self.wait('Sign in', seconds=120)
                  if not self.found(root, 'Continue without an account'):
                      raise Stop('MODERN_ACCOUNT_GATEWAY_NOT_OBSERVED')
                  self.tap(root, 'Sign in')
                  self.phase = 'LOGIN_OPTIONS'
                  root = self.wait('Store reviewer access', scroll=True)
                  self.tap(root, 'Store reviewer access')
                  self.phase = 'REVIEWER_FORM'
                  root = self.wait_reviewer_form()
                  fields = [n for n in root.iter('node') if n.get('class') == 'android.widget.EditText'
                            and n.get('enabled') == 'true' and n.get('package') == APP_ID]
                  passwords = [n for n in fields if n.get('password') == 'true']
                  emails = [n for n in fields if n.get('password') != 'true']
                  if len(passwords) != 1 or len(emails) != 1: raise Stop('ORDINARY_PASSWORD_FORM_NOT_OBSERVED')
                  self.credentials_active = True
                  for is_password, value in [(False, self.email), (True, self.password)]:
                      self.phase = 'PASSWORD_ENTRY' if is_password else 'EMAIL_ENTRY'
                      # Re-observe after each IME/layout change before selecting bounds.
                      root = self.snapshot()
                      targets = [n for n in root.iter('node') if n.get('class') == 'android.widget.EditText'
                                 and n.get('enabled') == 'true' and n.get('package') == APP_ID
                                 and (n.get('password') == 'true') == is_password]
                      if len(targets) != 1: raise Stop('PRIVATE_LOGIN_FIELD_ABSENT_OR_AMBIGUOUS')
                      node = targets[0]
                      x1, y1, x2, y2 = bounds(node)
                      self.command('shell', 'input', 'tap', str((x1+x2)//2), str((y1+y2)//2))
                      # Credentials are stdin bytes only, never host argv, stdout, logs,
                      # screenshots, hierarchy files or shell text in tool arguments.
                      result = subprocess.run([self.adb, '-s', self.serial, 'shell', '-T'], input=credential_payload(value),
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)
                      if result.returncode: raise Stop('PRIVATE_CREDENTIAL_ENTRY_FAILED')
                  self.dismiss_observed_ime()
                  root = self.snapshot()
                  if self.email not in '\n'.join(value for node in root.iter() for value in node.attrib.values()):
                      raise Stop('EMAIL_ENTRY_NOT_OBSERVED')
                  self.private_entry_check(root)
                  self.phase = 'SIGN_IN_SUBMIT'
                  self.tap(root, 'Sign in')
                  self.phase = 'AUTHENTICATION_WAIT'
                  deadline = time.monotonic() + 120
                  dismissed_daily_reminder = False
                  demo_onboarding = None
                  onboarding_attempted = False
                  while time.monotonic() < deadline:
                      root = self.snapshot()
                      if self.found(root,'What would you like to work on?'):
                          if onboarding_attempted:raise Stop('DEMO_ONBOARDING_REPEATED_WITHOUT_DASHBOARD')
                          onboarding_attempted=True
                          self.phase='ONBOARDING_DEMO'
                          demo_onboarding=complete_demo_onboarding(self,root)
                          self.phase='AUTHENTICATION_WAIT'
                          # This bounded local setup has its own source-observed proof.
                          # Restore the auth observation window after the normal flow.
                          deadline=time.monotonic()+120
                          continue
                      self.safe_auth_observation(root)
                      if self.dismiss_daily_reminder_if_observed(root,already_dismissed=dismissed_daily_reminder):
                          dismissed_daily_reminder=True
                          continue
                      if self.nav_found(root, 'More') and self.nav_found(root, 'Home'):
                          if any(n.get('class') == 'android.widget.EditText' for n in root.iter('node')):
                              raise Stop('LOGIN_FIELDS_NOT_DISPOSED')
                          self.credentials_active = False
                          self.record('ordinary_password_sign_in', root, otp_action_performed=False, purchase_action_performed=False,
                                      daily_reminder_dismissed=dismissed_daily_reminder,
                                      daily_reminder_effect='LOCAL_TODAY_DISMISSAL_PREFERENCE_ONLY' if dismissed_daily_reminder else 'NONE',
                                      weight_or_measurement_saved=demo_onboarding is not None,
                                      intentional_synthetic_initial_profile_setup=demo_onboarding is not None,
                                      synthetic_onboarding_proof='DEMO_ONBOARDING_PROOF.json' if demo_onboarding else None)
                          return
                      if any(self.found(root, label) for label in ('Verification code', 'Check your email', 'Enter code')):
                          raise Stop('UNEXPECTED_OTP_ROUTE')
                      time.sleep(1)
                  raise Stop('PASSWORD_SIGN_IN_DID_NOT_REACH_AUTHENTICATED_UI')
          
