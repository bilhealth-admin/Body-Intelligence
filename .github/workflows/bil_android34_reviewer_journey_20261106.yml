          adb shell pm clear com.bilhealth.bodyintelligencelog >/dev/null
          adb shell am start -W -n com.bilhealth.bodyintelligencelog/.MainActivity >/dev/null
          env -u BIL_GOOGLE_REVIEWER_EMAIL -u BIL_GOOGLE_REVIEWER_PASSWORD python3 "$RUNNER_TEMP/reviewer_launch_probe.py"
          python3 "$RUNNER_TEMP/reviewer_ui.py"
          SH_REVIEWER_ENTRYPOINT
          chmod 700 "$RUNNER_TEMP/android34-reviewer-entrypoint.sh"
          cat > "$RUNNER_TEMP/reviewer-shell-contract.cjs" <<'JS_REVIEWER_SHELL_CONTRACT'
          // Mandatory Linux preflight. No credentials, SDK, device or real APK operations.
          const fs = require('fs'), path = require('path'), cp = require('child_process'), crypto = require('crypto');
          const COMMAND = 'bash "$RUNNER_TEMP/android34-reviewer-entrypoint.sh"';
          const result = {status: 'LINUX_SHELL_CONTRACT_FAIL', cases: [], actual_device_or_credentials_used: false};
          const workspace = process.env.GITHUB_WORKSPACE;
          const evidence = path.join(workspace, 'artifacts/android34-reviewer-safe/SHELL_CONTRACT.json');
          function requireThat(value, code) { if (!value) throw new Error(code); }
          try {
            requireThat(process.platform === 'linux', 'LINUX_REQUIRED');
            requireThat(!('BIL_GOOGLE_REVIEWER_EMAIL' in process.env) && !('BIL_GOOGLE_REVIEWER_PASSWORD' in process.env), 'CREDENTIALS_FORBIDDEN_IN_PREFLIGHT');
            const wrapper = path.join(process.env.RUNNER_TEMP, 'android34-reviewer-entrypoint.sh');
            requireThat(fs.statSync(wrapper).isFile() && (fs.statSync(wrapper).mode & 0o077) === 0, 'PRIVATE_PREPARED_WRAPPER_REQUIRED');
            const parserPath = path.join(workspace, 'artifacts/tooling/bil-android-emulator-action/lib/script-parser.js');
            requireThat(crypto.createHash('sha256').update(fs.readFileSync(parserPath)).digest('hex') === '6d162ab4384c2ef9c261b5cc4dfb8947f69cab75b98fedb0ee34275619c170ff', 'PINNED_PARSER_BYTES_REQUIRED');
            const scripts = require(parserPath).parseScript(COMMAND);
            requireThat(scripts.length === 1 && scripts[0] === COMMAND, 'ONE_EXPLICIT_BASH_COMMAND_REQUIRED');
            const fixture = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'reviewer-shell-contract-'));
            const bin = path.join(fixture, 'bin'); fs.mkdirSync(bin, {mode: 0o700});
            const apk = path.join(fixture, 'synthetic exact fixture.apk'); fs.writeFileSync(apk, 'NOT_AN_APK_NO_DEVICE_OPERATIONS');
            fs.writeFileSync(path.join(bin, 'adb'), `#!/bin/sh
          set -eu
          test "$(ulimit -c)" = 0
          printf 'adb:%s\\n' "$*" >> "$BIL_SHELL_FIXTURE_TRACE"
          if [ "$1" = shell ] && [ "${'${2-}'}" = getprop ]; then printf '33\\n'; fi
          if [ "$1" = install ] && [ "$BIL_SHELL_FIXTURE_FAIL_ADB" = 1 ]; then exit 43; fi
          `, {mode: 0o700});
            fs.writeFileSync(path.join(bin, 'python3'), `#!/bin/sh
          set -eu
          test "$(ulimit -c)" = 0
          test -z "${'${BIL_GOOGLE_REVIEWER_EMAIL+x}'}"
          test -z "${'${BIL_GOOGLE_REVIEWER_PASSWORD+x}'}"
          case "$1" in
            "$RUNNER_TEMP/reviewer_home_probe.py") printf 'home-probe:path-and-credential-absence-verified\\n' >> "$BIL_SHELL_FIXTURE_TRACE" ;;
            "$RUNNER_TEMP/reviewer_launch_probe.py") printf 'launch-probe:path-and-credential-absence-verified\\n' >> "$BIL_SHELL_FIXTURE_TRACE"; if [ "$BIL_SHELL_FIXTURE_FAIL_LAUNCH" = 1 ]; then exit 45; fi ;;
            "$RUNNER_TEMP/reviewer_ui.py") printf 'python:path-and-credential-absence-verified\\n' >> "$BIL_SHELL_FIXTURE_TRACE" ;;
            *) exit 44 ;;
          esac
          `, {mode: 0o700});
            for (const testCase of [
              {name:'SEQUENTIAL_SUCCESS', install:false, launch:false, status:0},
              {name:'INSTALL_FAILURE_STOPS_BEFORE_PYTHON', install:true, launch:false, status:43},
              {name:'APP_FOCUS_FAILURE_STOPS_BEFORE_REVIEWER_UI', install:false, launch:true, status:45}
            ]) {
              const fail = testCase.install;
              const trace = path.join(fixture, testCase.name+'.txt');
              const env = {...process.env, PATH: bin + ':' + process.env.PATH, BIL_REVIEW_EXACT_APK: apk,
                BIL_SHELL_FIXTURE_TRACE: trace, BIL_SHELL_FIXTURE_FAIL_ADB: fail ? '1' : '0', BIL_SHELL_FIXTURE_FAIL_LAUNCH: testCase.launch ? '1' : '0'};
              delete env.GH_TOKEN; delete env.GITHUB_TOKEN;
              const child = cp.spawnSync('sh', ['-c', scripts[0]], {env, cwd: workspace, encoding: 'utf8', timeout: 20000, maxBuffer: 65536});
              requireThat(!child.error && child.status === testCase.status, 'EXACT_SHELL_EXIT_PROPAGATION_REQUIRED');
              const rows = fs.readFileSync(trace, 'utf8').trim().split('\n');
              requireThat(rows[0] === 'adb:wait-for-device' && rows[1] === 'adb:shell getprop ro.build.version.sdk', 'ORDERED_BOOT_AND_SDK_CHECK_REQUIRED');
              requireThat(rows[2] === 'home-probe:path-and-credential-absence-verified', 'STRIPPED_ENV_HOME_PROBE_BEFORE_INSTALL_REQUIRED');
              requireThat(rows[3] === 'adb:install --no-streaming ' + apk, 'EXACT_APK_PATH_ARGUMENT_REQUIRED');
              if (fail) {
                requireThat(rows.length === 4, 'FAILED_INSTALL_MUST_STOP_BEFORE_PYTHON');
              } else {
                requireThat(rows.length === (testCase.launch ? 7 : 8) && rows[4] === 'adb:shell pm clear com.bilhealth.bodyintelligencelog' &&
                  rows[5] === 'adb:shell am start -W -n com.bilhealth.bodyintelligencelog/.MainActivity' &&
                  rows[6] === 'launch-probe:path-and-credential-absence-verified' &&
                  (testCase.launch || rows[7] === 'python:path-and-credential-absence-verified'), 'ORDERED_INSTALL_LAUNCH_FOCUS_PYTHON_REQUIRED');
              }
              result.cases.push({case: testCase.name, exit: child.status, stage_count: rows.length});
            }
            result.status = 'ACTUAL_LINUX_PINNED_PARSER_SH_TO_BASH_CONTRACT_PASS';
            result.actual_prepared_wrapper_sha256 = crypto.createHash('sha256').update(fs.readFileSync(wrapper)).digest('hex');
            result.one_pinned_parser_command = true;
            result.child_environment_only_no_github_env_write = true;
            result.child_core_dumps_disabled = true;
          } catch (error) {
            result.reason = /^[A-Z_]+$/.test(error.message) ? error.message : 'BOUNDED_LINUX_RUNTIME_CONTRACT_ERROR';
            process.exitCode = 1;
          }
          fs.mkdirSync(path.dirname(evidence), {recursive: true});
          fs.writeFileSync(evidence, JSON.stringify(result, null, 2) + '\n');
          console.log(result.status);
          JS_REVIEWER_SHELL_CONTRACT
          python3 "$RUNNER_TEMP/artifact_binding.py" "$RUNNER_TEMP/exact-android34-pins.json"

