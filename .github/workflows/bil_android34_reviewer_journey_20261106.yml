                      require(result.isVerified() && !result.containsErrors(), "APK_SIGNATURE_INVALID");
                      require(result.getSignerCertificates().size() == 1, "APK_SIGNER_COUNT");
                      if (discoverDebugOnly) expected = digest(result.getSignerCertificates().get(0));
                      Set<String> identities = new LinkedHashSet<>();
                      identities.add(digest(result.getSignerCertificates().get(0)));
                      for (var signer : result.getV1SchemeSigners()) {
                          require(!signer.containsErrors(), "V1_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV2SchemeSigners()) {
                          require(!signer.containsErrors(), "V2_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV3SchemeSigners()) {
                          require(!signer.containsErrors(), "V3_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV31SchemeSigners()) {
                          require(!signer.containsErrors(), "V31_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV4SchemeSigners()) {
                          require(!signer.containsErrors(), "V4_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      require(identities.size() == 1 && identities.contains(expected), "APK_CERTIFICATE_MISMATCH");
                      String json = "{\n"
                              + "  \"status\": \"VERIFIED_APK_SIGNATURE_AND_DER_IDENTITY\",\n"
                              + "  \"scope\": \"" + args[2] + "\",\n"
                              + "  \"apk_signature_verified\": true,\n"
                              + "  \"current_signer_count\": 1,\n"
                              + "  \"distinct_verified_scheme_leaf_certificates\": 1,\n"
                              + "  \"certificate_sha256\": \"" + expected + "\",\n"
                              + "  \"verified_v1\": " + result.isVerifiedUsingV1Scheme() + ",\n"
                              + "  \"verified_v2\": " + result.isVerifiedUsingV2Scheme() + ",\n"
                              + "  \"verified_v3\": " + result.isVerifiedUsingV3Scheme() + ",\n"
                              + "  \"verified_v31\": " + result.isVerifiedUsingV31Scheme() + ",\n"
                              + "  \"verified_v4\": " + result.isVerifiedUsingV4Scheme() + ",\n"
                              + "  \"play_delivery_proven\": false\n}\n";
