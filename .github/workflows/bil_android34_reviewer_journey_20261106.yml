                  self.email, self.password = email, password
                  self.credentials_active = False
                  self.rows = []
                  self.started = time.monotonic()
                  self.phase = 'INITIALIZATION'
                  self.capture_runner = Runner(adb, serial)
          
              def command(self, *args, timeout=25):
                  if time.monotonic() - self.started > 900: raise Stop('JOURNEY_TOTAL_DEADLINE')
                  return self.capture_runner.run(*args, timeout=timeout)
          
              def snapshot(self):
                  root = capture_hierarchy(self.command, self.evidence, phase=self.phase, runner=self.capture_runner)
                  self.observe_safe_route(root)
                  return root
          
              def observe_safe_route(self, root):
                  # Source-authored generic labels and counts only. Never persist raw UI,
                  # unknown content, values, identifiers, email or credential form state.
                  if self.credentials_active: return
                  row = {'phase': self.phase,
                         'recognized_source_labels': sorted(label for label in SAFE_LABELS if self.found(root, label)),
                         'node_count': sum(1 for _ in root.iter('node')),
                         'editable_field_count': sum(n.get('class') == 'android.widget.EditText' for n in root.iter('node')),
                         'password_field_count': sum(n.get('password') == 'true' for n in root.iter('node'))}
                  path = self.evidence / 'OBSERVED_ROUTE_DIAGNOSTICS.json'
                  rows = json.loads(path.read_bytes()) if path.exists() else []
                  if not rows or row != rows[-1]:
                      if len(rows) >= 80: raise Stop('SAFE_ROUTE_OBSERVATION_LIMIT')
                      rows.append(row)
                      path.write_text(json.dumps(rows, indent=2) + '\n')
          
              def found(self, root, label):
                  return any(normal(label) in labels(node) and node.get('enabled') == 'true'
                             and node.get('package') == APP_ID for node in root.iter('node'))
          
              def ensure_no_gate_error(self, root):
                  if any(self.found(root, label) for label in BAD_LABELS): raise Stop('REVIEW_ROUTE_NOT_VERIFIED_AVAILABLE')
          
              def tap(self, root, label, *, scope=None):
                  node = select(root, label, clickable=True, scope=scope)
                  x1, y1, x2, y2 = bounds(node)
                  self.command('shell', 'input', 'tap', str((x1 + x2) // 2), str((y1 + y2) // 2))
          
              def nav_found(self, root, label):
                  try:
                      select(root, label, clickable=True, scope='PRIMARY_NAVIGATION')
                      return True
                  except Stop:
                      return False
          
              def wait_navigation(self, label, seconds=60):
                  deadline=time.monotonic()+seconds
                  while time.monotonic()<deadline:
                      root=self.snapshot(); self.ensure_no_gate_error(root)
                      if self.nav_found(root,label): return root
                      time.sleep(1)
                  raise Stop('EXPECTED_PRIMARY_NAVIGATION_CONTROL_NOT_OBSERVED')
          
              def tap_navigation(self, root, label):
                  self.tap(root,label,scope='PRIMARY_NAVIGATION')
          
              def back(self): self.command('shell', 'input', 'keyevent', '4')
          
              def dismiss_observed_ime(self):
                  ime = self.command('shell', 'dumpsys', 'input_method').decode(errors='replace')
                  if re.search(r'(?:mInputShown|mIsInputViewShown|isInputViewShown)=true\b', ime):
                      self.back()
          
              def meal_editor(self, meal):
                  self.phase = 'MEAL_' + meal.upper()
                  root = self.wait(meal, scroll=True); self.tap(root, meal)
                  root = self.wait('kcal')
                  fields = [n for n in root.iter('node') if n.get('class') == 'android.widget.EditText'
                            and n.get('enabled') == 'true' and n.get('package') == APP_ID]
                  if len(fields) != 1 or not all(self.found(root, label) for label in (meal, 'Clear', 'Save', 'kcal')):
                      raise Stop('PREMIUM_MEAL_EDITOR_NOT_AVAILABLE')
                  # Source modal has no Cancel button. Android Back is the read-only
                  # dismissal path; never tap Clear (a write), Save or type a value.
                  self.dismiss_observed_ime()
                  self.back()
                  root = self.wait('Calorie goals by meal')
                  if any(n.get('class') == 'android.widget.EditText' for n in root.iter('node')):
                      raise Stop('MEAL_EDITOR_NOT_DISMISSED_WITHOUT_WRITE')
                  self.record('meal_editor_' + meal.lower(), root, editor_opened=True, dismissed_without_save_or_clear=True,
                              value_typed=False, meal_value_logged=False)
                  return root
          
              def smart_plan_content(self, root):
                  empty = self.found(root, 'Create plan') and self.found(root, 'Your next step, made clear.')
                  saved = all(self.found(root, label) for label in ('A clear plan, one day at a time.', 'Days in plan', 'Scheduled workouts'))
                  if not empty and not saved: raise Stop('SMART_PLAN_CONTENT_NOT_OBSERVED')
                  return 'EMPTY_LOCAL_PLAN' if empty else 'SAVED_LOCAL_PLAN_OVERVIEW'
          
              def wait(self, label, *, seconds=60, scroll=False, horizontal=False):
                  deadline, scrolls, prior = time.monotonic() + seconds, 0, None
                  while time.monotonic() < deadline:
                      root = self.snapshot()
                      self.ensure_no_gate_error(root)
                      if self.found(root, label): return root
                      if scroll and scrolls < 6:
                          candidates = [n for n in root.iter('node') if n.get('scrollable') == 'true'
                                        and n.get('enabled') == 'true' and n.get('package') == APP_ID]
                          if horizontal:
                              navigation = {normal(s) for s in ('Coach', 'Insights', 'Plan', 'Progress', 'Tools', 'My Plan')}
                              candidates = [n for n in candidates if len(set().union(*(labels(child) for child in n.iter('node'))) & navigation) >= 2
                                            and (bounds(n)[2] - bounds(n)[0]) >= 3 * (bounds(n)[3] - bounds(n)[1])]
                          if len(candidates) == 1:
                              box = bounds(candidates[0]); signature = sorted(set().union(*(labels(n) for n in root.iter('node'))))
                              if signature != prior:
                                  x1, y1, x2, y2 = box
                                  if horizontal:
                                      self.command('shell', 'input', 'swipe', str(x2 - (x2-x1)//5), str((y1+y2)//2),
                                                   str(x1 + (x2-x1)//5), str((y1+y2)//2), '400')
                                  else:
                                      self.command('shell', 'input', 'swipe', str((x1 + x2) // 2), str(y2 - (y2-y1)//5),
                                                   str((x1 + x2) // 2), str(y1 + (y2-y1)//5), '400')
                                  scrolls += 1; prior = signature
                      time.sleep(1)
                  raise Stop('EXPECTED_SCREEN_NOT_OBSERVED')
          
              def record(self, stage, root, **extra):
                  if self.credentials_active: raise Stop('EVIDENCE_FORBIDDEN_WHILE_CREDENTIAL_FIELDS_ACTIVE')
                  # Persist only a known-source label allowlist and safe structural state.
                  observed = sorted(label for label in SAFE_LABELS if self.found(root, label))
                  row = {'stage': stage, 'status': 'PASS', 'recognized_labels': observed, **extra}
                  if stage in ('plans_active_continue', 'calorie_goals_by_meal', 'smart_plan_my_plan'):
                      row['trusted_visual'] = self.trusted_visual(stage)
                  self.rows.append(row)
                  (self.evidence / 'JOURNEY_PROGRESS.json').write_text(json.dumps(self.rows, indent=2) + '\n')
          
              def visual_guard(self, stage, root):
                  if self.credentials_active: raise Stop('CREDENTIAL_FIELDS_ACTIVE')
                  raw = '\n'.join(value for node in root.iter() for value in node.attrib.values())
                  if any(n.get('class') == 'android.widget.EditText' or n.get('password') == 'true' for n in root.iter('node')):
                      raise Stop('EDITABLE_OR_PASSWORD_FIELD_IN_FRAME')
                  if self.email.casefold() in raw.casefold() or self.password.casefold() in raw.casefold():
                      raise Stop('PRIVATE_CREDENTIAL_TEXT_IN_FRAME')
                  if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', raw):
                      raise Stop('EMAIL_LIKE_TEXT_IN_FRAME')
                  if stage == 'plans_active_continue':
                      if not (self.found(root, 'Active') and self.found(root, 'Continue')
                              and any(self.found(root, label) for label in ('Current plan: Premium', 'Current plan: Premium AI Coach'))):
                          raise Stop('TRUSTED_PLANS_FRAME_NOT_OBSERVED')
                  elif stage == 'calorie_goals_by_meal':
                      if not self.found(root, 'Calorie goals by meal') or not all(self.found(root, label) for label in ('Breakfast', 'Lunch', 'Dinner', 'Snack')):
                          raise Stop('TRUSTED_ALL_MEAL_CATEGORY_FRAME_NOT_OBSERVED')
                  elif stage == 'smart_plan_my_plan':
                      if not all(self.found(root, label) for label in ('My Plan', 'Plan options', 'Your next step, made clear.')):
                          raise Stop('MY_PLAN_NOT_CONFIRMED_EMPTY_OVERVIEW')
                  else: raise Stop('SCREENSHOT_STAGE_NOT_AUTHORIZED')
          
              def trusted_visual(self, stage):
                  try:
                      before = self.snapshot(); self.visual_guard(stage, before)
                      png = self.command('exec-out', 'screencap', '-p', timeout=15)
                      after = self.snapshot(); self.visual_guard(stage, after)
                      if not png.startswith(b'\x89PNG\r\n\x1a\n') or len(png) > 12 * 1024 * 1024:
                          raise Stop('BOUNDED_PNG_FRAME_UNAVAILABLE')
                      path = self.evidence / ('trusted-' + stage + '.png')
                      if path.exists(): raise Stop('FRESH_SCREENSHOT_PATH_REQUIRED')
                      path.write_bytes(png)
                      return {'status': 'TRUSTED_POST_LOGIN_FRAME_CAPTURED_PENDING_HUMAN_VIEW',
                              'file': path.name, 'sha256': hashlib.sha256(png).hexdigest(),
                              'no_credentials_edit_fields_or_email_in_before_after_hierarchy': True}
                  except Exception as error:
                      reason = str(error) if isinstance(error, Stop) else 'PRIVACY_GUARD_OR_CAPTURE_UNAVAILABLE'
                      if not re.fullmatch('[A-Z_]+', reason): reason = 'SAFE_VISUAL_SUPPRESSION'
                      return {'status': 'SUPPRESSED_NOT_VISUALLY_VERIFIED', 'reason': reason}
          
              def wait_reviewer_form(self, seconds=60):
                  # Android's hierarchy can expose InputDecoration as a native field hint
                  # rather than text/content-desc. Require the actual password semantics,
                  # exact two enabled app fields and the dedicated page/submit controls.
                  deadline=time.monotonic()+seconds
                  while time.monotonic()<deadline:
                      root=self.snapshot()
                      fields=[n for n in root.iter('node') if n.get('class')=='android.widget.EditText'
                              and n.get('enabled')=='true' and n.get('package')==APP_ID]
                      if (len(fields)==2 and sum(n.get('password')=='true' for n in fields)==1
                              and self.found(root,'Store reviewer access') and self.found(root,'Sign in')):
                          return root
                      time.sleep(1)
                  raise Stop('ORDINARY_PASSWORD_FORM_NOT_OBSERVED')
          
              def private_entry_check(self, root):
                  fields=[n for n in root.iter('node') if n.get('class')=='android.widget.EditText'
                          and n.get('enabled')=='true' and n.get('package')==APP_ID]
                  protected=[n for n in fields if n.get('password')=='true']
                  if len(protected)!=1: raise Stop('PRIVATE_PASSWORD_FIELD_NOT_OBSERVED')
                  value=protected[0].get('text','')
                  if value==self.password: state='EXACT_VALUE_MATCH_MEMORY_ONLY'
                  elif value and set(value)<=set('•●*·'):
                      state='MASKED_LENGTH_MATCH' if len(value)==len(self.password) else 'MASKED_LENGTH_MISMATCH'
                  elif not value:state='NATIVE_VALUE_NOT_EXPOSED'
                  else:state='OBSERVED_TYPED_VALUE_MISMATCH'
                  (self.evidence/'PRIVATE_ENTRY_CHECK.json').write_text(json.dumps({
                      'email_observed_in_memory':self.email in '\n'.join(v for n in root.iter() for v in n.attrib.values()),
                      'password_observation':state,'credential_values_or_lengths_recorded':False},indent=2)+'\n')
                  if state in ('MASKED_LENGTH_MISMATCH','OBSERVED_TYPED_VALUE_MISMATCH'):
                      raise Stop('PRIVATE_PASSWORD_ENTRY_NOT_VERIFIED')
          
              def safe_auth_observation(self, root):
                  messages={
                      'Authentication could not be completed now. Try again later.':'AUTHENTICATION_REJECTED_UI',
                      'Secure connection failed. Try again.':'SECURE_CONNECTION_FAILURE_UI',
                      'Your cloud data could not be restored':'SIGNED_IN_STARTUP_CLOUD_RESTORE_BLOCKED',
                      'Your local data could not be opened':'STARTUP_LOCAL_DATA_BLOCKED',
                      'تعذّرت استعادة بياناتك السحابية':'SIGNED_IN_STARTUP_CLOUD_RESTORE_BLOCKED',
                      'تعذّر فتح بياناتك المحلية':'STARTUP_LOCAL_DATA_BLOCKED',
                      'تعذّر إكمال المصادقة الآن. حاول مرة أخرى لاحقًا.':'AUTHENTICATION_REJECTED_UI',
                      'تعذّر الاتصال الآمن. حاول مرة أخرى.':'SECURE_CONNECTION_FAILURE_UI',
                      'This device already has BIL data from another account':'ACCOUNT_DATA_CONFLICT_BLOCKED',
                      'يحتوي هذا الجهاز بالفعل على بيانات BIL مرتبطة بحساب آخر':'ACCOUNT_DATA_CONFLICT_BLOCKED',
                      'What would you like to work on?':'ONBOARDING_PROFILE_REQUIRED'}
                  reasons=sorted(v for k,v in messages.items() if self.found(root,k))
                  support_codes=sorted({v.upper() for n in root.iter('node') for v in labels(n)
                      if re.fullmatch(r'bil-s-(cloud|local)-(timeout|bridge|privacy|crypto|platform|format|unavailable)',v)})
                  daily=self.found(root,'How much do you weigh today?') and self.found(root,'Not now')
                  row={'phase':'AUTHENTICATION_WAIT','known_source_error_classes':reasons,'known_startup_support_codes':support_codes,
                       'source_daily_weight_reminder_observed':daily,
                       'source_arabic_daily_weight_title_observed':self.found(root,'كم وزنك اليوم؟'),
                       'home_label_observed':self.found(root,'Home'),'more_plain_label_observed':self.found(root,'More'),
                       'verified_home_navigation':self.nav_found(root,'Home'),'verified_more_navigation':self.nav_found(root,'More'),
                       'primary_navigation_label_count':sum(normal('Primary navigation') in labels(n) for n in root.iter('node')),
                       'enabled_editable_count':sum(n.get('class')=='android.widget.EditText' and n.get('enabled')=='true' for n in root.iter('node')),
                       'password_field_count':sum(n.get('password')=='true' for n in root.iter('node')),
                       'raw_ui_unknown_messages_values_or_credentials_recorded':False}
                  p=self.evidence/'SAFE_AUTH_WAIT_DIAGNOSTICS.json';rows=json.loads(p.read_bytes()) if p.exists() else []
                  if not rows or rows[-1]!=row:
                      if len(rows)>=40:raise Stop('SAFE_AUTH_OBSERVATION_LIMIT')
