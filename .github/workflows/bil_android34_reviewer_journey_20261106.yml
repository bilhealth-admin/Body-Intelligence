                      continue
                  target = n
                  while target.get('clickable') != 'true' and target in parents:
                      target = parents[target]
                  if (target.get('package') != APP or target.get('enabled') != 'true'
                          or target.get('clickable') != 'true'
                          or (checkable and target.get('checkable') != 'true')):
                      continue
                  candidates[box(target)] = target
