          def normal(text):
              return ' '.join(text.split()).casefold()
          
          
          def labels(node):
              return {normal(s) for k in ('text', 'content-desc') for s in node.get(k, '').splitlines() if s.strip()}
          
          
          UNIT_SOURCE_WORDS={'choose your units','metric','imperial','centimetres and kilograms','inches and pounds'}
          
          
          def unit_source_parts(node):
              if node.get('checkable')!='true':return set()
              for field in ('text','content-desc'):
                  parts={normal(v) for v in re.split(r',|\n',node.get(field,'')) if v.strip()}
                  if 'choose your units' in parts and len(parts)>=2 and parts<=UNIT_SOURCE_WORDS:return parts
              return set()
          
          
          def found(root, label):
              return any(n.get('package') == APP and n.get('enabled') == 'true' and (normal(label) in labels(n) or normal(label) in unit_source_parts(n))
                         for n in root.iter('node'))
          
          
          def box(node):
              match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
              if not match:
