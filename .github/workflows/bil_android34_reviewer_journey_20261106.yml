          import java.util.HexFormat;
          import java.util.LinkedHashSet;
          import java.util.Set;
          
          /** Verifies APK signatures and DER identities; CLI presentation is not a trust input. */
          public final class VerifyApkCertificate {
              private static String digest(X509Certificate certificate) throws Exception {
                  return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                          .digest(certificate.getEncoded()));
              }
          
              private static void require(boolean condition, String code) {
                  if (!condition) throw new IllegalStateException(code);
              }
          
              public static void main(String[] args) {
                  try {
                      require(args.length == 3, "ARGUMENTS");
                      String expected = System.getenv("EXPECTED_UPLOAD_CERT_SHA256");
                      require(expected != null, "EXPECTED_CERT_MISSING");
                      boolean discoverDebugOnly = args[2].equals("debug-preflight")
                              && expected.equals("DISCOVER_VERIFIED_DEBUG_IDENTITY_ONLY");
                      expected = expected.replaceAll("[:\\s]", "").toLowerCase(java.util.Locale.ROOT);
                      require(discoverDebugOnly || expected.matches("[0-9a-f]{64}"), "EXPECTED_CERT_FORMAT");
                      File apk = new File(args[0]);
                      Path output = Path.of(args[1]);
                      require(apk.isFile() && apk.length() > 0 && !Files.exists(output), "INPUT_OUTPUT");
                      require(args[2].equals("release") || args[2].equals("debug-preflight"), "SCOPE");
