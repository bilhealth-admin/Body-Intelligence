          """Observe the post-am-start handoff; no input, relaunch or private UI capture."""
          import json
          import os
          from pathlib import Path
          import time
          from reviewer_capture import Runner, Stop, live_health, safe_focus_summary
          
          PASS='ACTUAL_APP_LAUNCH_FOCUS_GATE_PASS'
          BLOCKED='APP_LAUNCH_FOCUS_GATE_BLOCKED'
          SAFE_REASONS=frozenset({
              'NATIVE_SYSTEM_ANR','PREINSTALL_WINDOW_FLAGS_UNAVAILABLE',
              'PREINSTALL_HOME_NOT_AWAKE_UNLOCKED','BOUNDED_ADB_COMMAND_FAILED',
              'BOUNDED_ADB_COMMAND_TIMEOUT','APP_LAUNCH_FOREIGN_FOREGROUND',
              'APP_LAUNCH_UNCLASSIFIED_FOCUS','APP_LAUNCH_FOCUS_DEADLINE',
              'LAUNCH_GATE_CREDENTIALS_FORBIDDEN','LAUNCH_GATE_CI_ONLY',
              'EXPECTED_DISPOSABLE_EMULATOR','INVALID_BOUNDED_LAUNCH_DEADLINE',
          })
          
          
          def verify_launch_focus(command, evidence, *, timeout=20):
              """Only a healthy known launcher or genuinely blank focus may settle."""
              result={'status':BLOCKED,'phase':'APP_LAUNCH','observations':[],
                      'exact_bil_focus_verified':False,'credentials_entered_by_probe':False,
                      'reviewer_ui_invoked_by_probe':False,'input_or_relaunch_performed':False,
                      'raw_focus_ui_health_or_account_data_persisted':False}
              try:
                  if isinstance(timeout,bool) or not isinstance(timeout,(int,float)) or not 0<timeout<=20:
                      raise Stop('INVALID_BOUNDED_LAUNCH_DEADLINE')
                  deadline=time.monotonic()+timeout
                  while time.monotonic()<deadline:
                      raw=command('shell','dumpsys','window',timeout=min(5,max(.1,deadline-time.monotonic())))
                      summary=safe_focus_summary(raw)
                      # This common guard verifies awake/unlocked status and rejects live
                      # ANRs before considering either transitional or exact app focus.
                      blank=False
                      try:
                          live_health(raw,app=False,require_launcher=False)
                      except Stop as error:
                          if str(error)!='LIVE_FOCUS_UNAVAILABLE':raise
                          blank=True
                      row=dict(summary)
                      if summary['owner_class']=='BIL_APPLICATION':
                          live_health(raw,app=True)
                          row['observation']='EXACT_BIL_FOCUS_HEALTHY_AWAKE_UNLOCKED'
                          result['observations'].append(row)
                          result['exact_bil_focus_verified']=True
                          result['status']=PASS
                          break
                      if (not blank and summary['owner_class']=='ANDROID_LAUNCHER'
                              and summary['component_count']==1):
                          row['observation']='KNOWN_LAUNCHER_HANDOFF_WAIT'
                      elif (blank and summary['live_window_status']=='FOCUSED_WINDOW_UNAVAILABLE'
                              and summary['component_count']==0):
                          row['observation']='BLANK_FOCUS_HANDOFF_WAIT'
                      else:
                          row['observation']='FOREIGN_OR_UNCLASSIFIED_FOCUS_REJECTED'
                          result['observations'].append(row)
                          raise Stop('APP_LAUNCH_FOREIGN_FOREGROUND')
                      result['observations'].append(row)
                      if len(result['observations'])>=40:raise Stop('APP_LAUNCH_FOCUS_DEADLINE')
                      time.sleep(min(.5,max(0,deadline-time.monotonic())))
                  if result['status']!=PASS:raise Stop('APP_LAUNCH_FOCUS_DEADLINE')
              except Stop as error:
                  reason=str(error)
                  result['reason']=reason if reason in SAFE_REASONS else 'APP_LAUNCH_UNCLASSIFIED_FOCUS'
              except Exception:
                  result['reason']='APP_LAUNCH_UNCLASSIFIED_FOCUS'
              # Caller only owns this existing fresh CI evidence directory. Preserve any
              # earlier receipt rather than overwriting it or claiming a new observation.
              directory=Path(evidence)
              if not directory.is_dir():raise Stop('EXISTING_SAFE_EVIDENCE_DIRECTORY_REQUIRED')
              with (directory/'APP_LAUNCH_FOCUS_GATE.json').open('x',encoding='utf-8') as f:
                  json.dump(result,f,indent=2);f.write('\n')
              if result['status']!=PASS:
                  with (directory/'REVIEWER_JOURNEY_RESULT.json').open('x',encoding='utf-8') as f:
                      json.dump({'status':'BLOCKED_NATIVE_REVIEWER_UI','reason':result['reason'],
                                 'failure_phase':'APP_LAUNCH','stages':[],
                                 'credentials_logged':False,'credentials_entered':False,
                                 'raw_ui_or_logcat_captured':False,'emulator_reviewer_ui_invoked':False},f,indent=2)
                      f.write('\n')
              return result
          
          
          def main():
              try:
                  if os.environ.get('GITHUB_ACTIONS')!='true':raise Stop('LAUNCH_GATE_CI_ONLY')
                  if any(name in os.environ for name in ('BIL_GOOGLE_REVIEWER_EMAIL','BIL_GOOGLE_REVIEWER_PASSWORD')):
                      raise Stop('LAUNCH_GATE_CREDENTIALS_FORBIDDEN')
                  evidence=Path(os.environ['GITHUB_WORKSPACE'])/'artifacts/android34-reviewer-safe'
                  runner=Runner('adb',os.environ.get('ANDROID_SERIAL','emulator-5554'))
                  result=verify_launch_focus(runner.run,evidence)
                  print(result['status'])
                  return 0 if result['status']==PASS else 1
              except Exception:
                  print('APP_LAUNCH_FOCUS_GATE_SETUP_BLOCKED')
                  return 1
          
          
          if __name__=='__main__':raise SystemExit(main())
          PY_REVIEWER_LAUNCH_PROBE_PY
