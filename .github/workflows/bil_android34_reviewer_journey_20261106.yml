          """Bounded observed-UI reviewer journey; never logs credentials or raw UI.
          
          No AI send, consent toggle, purchase, plan generation or food save is allowed.
          Coordinates always derive from unique observed semantic controls, not guesses.
          """
          from __future__ import annotations
          
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET
          
          APP_ID = 'com.bilhealth.bodyintelligencelog'
          SAFE_LABELS = {'Home', 'More', 'Goals', 'Nutrition Goals', 'Calorie Goals By Meal', 'Calorie goals by meal',
              'Breakfast', 'Lunch', 'Dinner', 'Snack', 'Plans', 'Active', 'Continue', 'Current plan: Premium',
              'Current plan: Premium AI Coach', 'Analytics', 'My Plan', 'Create plan', 'Your next step, made clear.',
              'AI Coach settings', 'Google Gemini AI consent', 'Context and privacy', 'Quick Add', 'Log food',
              'Food Log', 'Add food', 'Cancel', 'Close', 'Search', 'Sign in or create account', 'Store reviewer access',
              'Email address', 'Password', 'Sign in', 'Coach', 'Back', 'Back to Home', 'Back to settings'}
          SAFE_LABELS.update({'AI Coach', 'Plan options', 'Last 30 days', 'Analytics overview',
                              'A clear plan, one day at a time.', 'Days in plan', 'Scheduled workouts'})
