          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
          script: |
            set -euo pipefail
            set +x
            ulimit -c 0
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 33
            adb install --no-streaming "$BIL_REVIEW_EXACT_APK" >/dev/null
            adb shell pm clear com.bilhealth.bodyintelligencelog >/dev/null
            adb shell am start -W -n com.bilhealth.bodyintelligencelog/.MainActivity >/dev/null
            python3 "$RUNNER_TEMP/reviewer_ui.py"
      - name: Preserve only safe bounded reviewer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-android34-reviewer-safe-e90-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/android34-reviewer-safe/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private local binaries and credential-free helper files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/BIL-Android34-exact-QA.apk" "$RUNNER_TEMP/BIL-Android34-exact.aab"
