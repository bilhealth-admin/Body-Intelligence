name: BIL39 Coach exact Dart format diagnostic (temporary)

on:
  push:
    branches:
      - bil39/coach_app-20261025

permissions:
  contents: read

jobs:
  formatter-probe:
    name: formatter-probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Configure LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Print canonical formatter diff (do not commit)
        shell: pwsh
        run: |
          $checkoutSha = git rev-parse HEAD
          if ($checkoutSha -ne $env:GITHUB_SHA) { throw "Ref mismatch" }
          dart format test/features/intelligence_center/bil39_coach_routing_regression_test.dart
          if ($LASTEXITCODE -ne 0) { throw "Formatter failed" }
          git --no-pager diff -- test/features/intelligence_center/bil39_coach_routing_regression_test.dart
          if ($LASTEXITCODE -ne 0) { throw "Diff failed" }
