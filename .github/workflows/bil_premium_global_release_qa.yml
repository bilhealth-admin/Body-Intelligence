name: BIL Premium Global Release Audit

on:
  push:
    branches: [fix/premium-global-release-polish-final-20260930]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-global-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analyze-and-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify frozen routes and production identifiers
        shell: bash
        run: |
          set -euo pipefail
          BASE='1cd90816577ebb9fb3fb058db3f36c73a816c5fe'
          git diff --exit-code "$BASE" HEAD -- lib/app/router/app_router.dart android/app/build.gradle.kts ios/Runner.xcodeproj/project.pbxproj
          grep -F 'applicationId = "com.bilhealth.bodyintelligencelog"' android/app/build.gradle.kts
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = com.bilhealth.bodyintelligencelog;' ios/Runner.xcodeproj/project.pbxproj
      - name: Analyze and run focused premium global regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/premium-global-focused
          flutter pub get
          flutter analyze --no-pub 2>&1 | tee /tmp/premium-global-focused/analyze.log
          flutter test --no-pub --concurrency 1 --timeout 90s --reporter expanded             test/app/localization/food_log_runtime_copy_test.dart             test/app/theme/premium_black_dark_theme_contract_test.dart             test/shared/widgets/premium_trust_and_clinical_surface_test.dart             test/features/intelligence_center/ai_coach_premium_welcome_contract_test.dart             test/app/router/quick_add_premium_capture_actions_contract_test.dart             test/features/onboarding/premium_consent_surface_contract_test.dart             test/features/nutrition/food_presentation_localizer_test.dart             test/launch_readiness/trusted_food_search_backend_contract_test.dart             test/features/analytics/nutrition_empty_log_food_navigation_test.dart             test/features/onboarding/onboarding_flow_widget_test.dart             test/features/onboarding/onboarding_permission_gateway_test.dart             test/features/onboarding/onboarding_atomic_completion_test.dart             test/features/auth/android_native_oauth_contract_test.dart             test/premium_login_oauth_contract_test.dart             test/platform_readiness/mobile_release_configuration_contract_test.dart             test/platform_readiness/premium_global_native_parity_contract_test.dart             test/platform_readiness/android_health_permission_premium_contract_test.dart             test/connected_health             test/features/connected_health             test/features/commerce/store_transaction_queue_test.dart             test/features/commerce/android_checkout_refresh_test.dart             test/features/commerce/apple_store_offer_metadata_test.dart             test/features/commerce/bil_store_plans_dynamic_contract_test.dart             test/features/commerce/final_store_market_policy_alignment_test.dart             test/features/commerce/verified_store_purchase_startup_event_test.dart             test/semantic_icon_badge_spacing_test.dart             test/responsive_shell_test.dart             2>&1 | tee /tmp/premium-global-focused/focused.log
          flutter test --no-pub --concurrency 1 --timeout 30s --reporter expanded             test/performance_budget_test.dart             2>&1 | tee /tmp/premium-global-focused/performance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: premium-global-focused-${{ github.run_id }}
          path: |
            /tmp/premium-global-focused/
            test/**/failures/**
          retention-days: 14

  full-tests:
    needs: analyze-and-focused
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact committed catalog bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Run every test file with strict comparators and no exclusions
        env:
          SHARD: ${{ matrix.shard }}
        run: python tool/sapphire/run_full_shard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: premium-global-full-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sapphire-shard/
          retention-days: 14

  visual-and-cloud-contracts:
    needs: analyze-and-focused
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: community_qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Run visual regressions
        env:
          BIL_COMMUNITY_CAPTURE_DIR: /tmp/premium-global-visual/ui
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/premium-global-visual
          flutter pub get
          flutter test --no-pub --reporter expanded test/features/community/community_polish_visual_test.dart --timeout 2m 2>&1 | tee /tmp/premium-global-visual/visual.log
      - name: Run isolated cloud contracts
        env:
          PGPASSWORD: isolated-fixture-only
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d community_qa -f tool/release/test_community_attention_isolated.sql 2>&1 | tee /tmp/premium-global-visual/sql.log
          npm install --prefix /tmp/bil-deno deno@2.5.1
          /tmp/bil-deno/node_modules/.bin/deno test --allow-env --allow-read --allow-net             supabase/functions/push-provider-gateway             supabase/functions/community-push-dispatch             supabase/functions/food-search             2>&1 | tee /tmp/premium-global-visual/cloud.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: premium-global-visual-${{ github.run_id }}
          path: /tmp/premium-global-visual/
          retention-days: 14
