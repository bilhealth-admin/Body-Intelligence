name: BIL Premium Global Bootstrap

on:
  push:
    branches: [fix/premium-global-release-polish-final-20260930]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-global-bootstrap-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Restore exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64="$RUNNER_TEMP/premium-global-source.diff.gz.b64"
          PATCH_GZ="$RUNNER_TEMP/premium-global-source.diff.gz"
          PATCH="$RUNNER_TEMP/premium-global-source.diff"
          cat tool/premium_global_patch/part-* > "$PATCH_B64"
          echo "5c36fee224912ca60b4a370f14dab0aeec8191d2b41e4e1d0ed81c5ba230d16b  $PATCH_B64" | sha256sum --check --strict
          base64 --decode "$PATCH_B64" > "$PATCH_GZ"
          echo "34f3a1eb7c064fa04ee2e6a250f509abafb113f62fd7d62f8cb367464368394d  $PATCH_GZ" | sha256sum --check --strict
          gzip --decompress --stdout "$PATCH_GZ" > "$PATCH"
          echo "bf95218befb53c7b543fa98adb486159a9973d3fe9c2c7bad46e5a44e0d05ccb  $PATCH" | sha256sum --check --strict
          git apply --check "$PATCH"
          git apply "$PATCH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Format reviewed Dart source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          mapfile -t FILES < <(git diff --name-only -- '*.dart')
          if [ "${#FILES[@]}" -gt 0 ]; then
            dart format "${FILES[@]}"
          fi
          rm -rf tool/premium_global_patch

      - name: Commit final premium source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BIL premium release QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(release): premium global experience and native parity polish'
          git push origin HEAD:fix/premium-global-release-polish-final-20260930
