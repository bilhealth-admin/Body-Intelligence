name: BIL QA isolated Dashboard overflow diagnosis

# One failing English phone-size fixture only; no production Dashboard edits.
on:
  push:
    branches:
      - qa/bil-quality-ux-integration-20261009
    paths:
      - .github/workflows/bil_qa_dashboard_overflow_probe_20261010.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-one-renderflex-without-suppression
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Preserve LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Print overflowing RenderFlex ancestry, keep failure red
        shell: pwsh
        run: |
          flutter test --no-pub --timeout=3m --plain-name "en 320 at 1.0x retains all content and burned calories" test/dashboard_polish/dashboard_polish_layout_review_test.dart
