name: BIL07 Golden repair isolated Windows visual validation
on:
  push:
    branches:
      - qa/bil07-golden-remediation-diagnostic-20261018
permissions:
  contents: read
concurrency:
  group: bil07-golden-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Diagnose exact Dart formatter changes on Windows
        shell: pwsh
        run: |
          dart format \
          lib/features/daily_log/presentation/daily_log_meal_detail_items.dart \
          test/visual_closure/actual_data_pages_golden_test.dart \
          test/features/daily_log/meal_detail_add_button_regression_test.dart
          git diff --check
          Write-Host 'BIL_GOLDEN_FORMAT_START'
          git --no-pager diff --unified=2 -- lib/features/daily_log/presentation/daily_log_meal_detail_items.dart test/visual_closure/actual_data_pages_golden_test.dart test/features/daily_log/meal_detail_add_button_regression_test.dart
          Write-Host 'BIL_GOLDEN_FORMAT_END'
      - name: Analyze repair and actual add button
        shell: pwsh
        run: |
          flutter analyze --no-pub \
          lib/features/daily_log/presentation/daily_log_meal_detail_items.dart \
          test/visual_closure/actual_data_pages_golden_test.dart \
          test/features/daily_log/meal_detail_add_button_regression_test.dart
      - name: Real interactive + must retain 48 pixel tap and semantics
        run: flutter test --no-pub --reporter expanded test/features/daily_log/meal_detail_add_button_regression_test.dart
  store_captures:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Strict reviewed iPhone Arabic and English store goldens
        run: flutter test --no-pub --timeout 3m --reporter expanded test/epic15_store_screenshot_golden_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: bil07-golden-store-repair-diagnostics
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
  data_golden:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Strict full real-data golden and authoritative SQLite result
        run: flutter test --no-pub --timeout 3m --reporter expanded test/visual_closure/actual_data_pages_golden_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: bil07-golden-data-repair-diagnostics
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
