name: BIL43 isolated capsule render diagnostic
on:
  push:
    branches: [codex/bil43-capsule-render-probe2-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil43-capsule-render-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/bil43-capsule-render-probe2-20261108'
    name: Exact three capsule XCTest diagnostic (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone]
    steps:
      - name: Check out isolated probe commit with exact f86 parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ios/RunnerTests/RunnerTests.swift
            /ios/Runner/BILCommunityTranslationBridge.swift
            /.github/workflows/bil43_capsule_render_probe2.yml
      - name: Transfer compressed harness part1of2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil43-capsule-probe-transport.zlib'
          segment = base64.b64decode('', validate=True)
          with path.open('xb') as stream:
              stream.write(segment)
          PY
      - name: Transfer compressed harness part2of2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil43-capsule-probe-transport.zlib'
          segment = base64.b64decode('', validate=True)
          assert path.stat().st_size == 12750
          with path.open('ab') as stream:
              stream.write(segment)
          PY
      - name: Measure original baseline and candidate on one real simulator
        shell: bash
        env:
          BIL_PROBE_DEVICE: ${{ matrix.device }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, zlib
          packed = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil43-capsule-probe-transport.zlib').read_bytes()
          assert len(packed) == 25144
          assert hashlib.sha256(packed).hexdigest() == 'c78e63e104aa15bc87e24748ef20561db52b56df7a9c75d7bae8e51d5081efa9'
          unpacked = zlib.decompress(packed)
          assert len(unpacked) == 80872
          assert hashlib.sha256(unpacked).hexdigest() == 'b166c64dfe23ac5ab82dbcbb0ae3fdfd7cfb32722e7bedca41df25f086cce745'
          module_size = int.from_bytes(unpacked[:8], 'big')
          assert module_size == 26059
          module_bytes = unpacked[8:8 + module_size]
          assert hashlib.sha256(module_bytes).hexdigest() == '4ae31da6e1ef9692092e96b4e6df9f87063a34e8d5ea5d05ff09c62c8f155eda'
          bundle = json.loads(module_bytes)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil43-capsule-probe-tools'
          root.mkdir(exist_ok=False)
          for name, value in bundle.items():
              assert name in ('probe_common.py', 'probe_runtime.py')
              raw = base64.b64decode(value['base64'], validate=True)
              assert hashlib.sha256(raw).hexdigest() == value['sha256']
              (root / name).write_bytes(raw)
          payload = unpacked[8 + module_size:]
          assert hashlib.sha256(payload).hexdigest() == '711c827de0b47488bf0b796adfb0d5a40caf3b29c5eb48addd8e82ba5492a802'
          path = root / 'payload.json'
          path.write_bytes(payload)
          subprocess.run([sys.executable, str(root / 'probe_runtime.py'), '--payload', str(path),
                         '--device', os.environ['BIL_PROBE_DEVICE']], check=True)
          PY
      - name: Preserve separate actual logs results attachments and exact source
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil43-capsule-render-probe-${{ matrix.device }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/PROVENANCE.json
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/SIMULATOR_SELECTION.json
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/DIAGNOSTIC_RESULT.json
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/package-*/Package.swift
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/package-*/Sources/**
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/package-*/Tests/**
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/baseline/xcodebuild.log
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/baseline/*.json
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/baseline/attachment-export.log
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/baseline/Capsule.xcresult
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/baseline/captures
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/candidate/xcodebuild.log
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/candidate/*.json
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/candidate/attachment-export.log
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/candidate/Capsule.xcresult
            ${{ runner.temp }}/bil43-capsule-probe-${{ matrix.device }}/candidate/captures
          if-no-files-found: error
          retention-days: 30
