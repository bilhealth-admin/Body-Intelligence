name: BIL offline receipt diagnostic
on:
  workflow_dispatch:
  push:
    branches: [qa/coach-community-next-20261005]
    paths: [.github/workflows/bil_activity_retry_diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && (github.ref == 'refs/heads/qa/coach-community-next-20261005' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/bil-qa-media-policy-20261011'))
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve unchanged locked packages
        run: flutter pub get --enforce-lockfile
      - name: Verify the current offline retry fixture without changing application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bil-retry-diagnostic
          flutter test --no-pub --reporter expanded --concurrency 1 \
            test/features/community/community_activity_auto_read_test.dart \
            --plain-name 'offline automatic read is retryable and never clears unread rows' \
            --timeout 30s 2>&1 | tee /tmp/bil-retry-diagnostic/diagnostic.log
          git diff --exit-code
          printf '%s\n' 'Actual current regression assertions; no source injection or baseline updates.' > /tmp/bil-retry-diagnostic/scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-retry-diagnostic-${{ github.sha }}
          path: /tmp/bil-retry-diagnostic
          retention-days: 1
          if-no-files-found: error
