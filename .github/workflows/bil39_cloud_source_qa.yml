name: BIL S8 two-change bounded contract and host syntax preflight
on:
  workflow_dispatch:
    inputs:
      reviewed_controller_sha:
        description: Exact reviewed single-file controller commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bil-s8-two-change-preflight-${{ github.sha }}
  cancel-in-progress: false
jobs:
  bounded-two-change-preflight:
    name: S8 two-change format, targeted Dart, Python and Bash preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact S8 application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df930c575c12b0ec0c333ce92edffd9c2b6fb598
          persist-credentials: false
      - name: Bind exact S8 preimages and overlay only the two reviewed files
        shell: bash
        env:
          BIL_REVIEWED_CONTROLLER_SHA: "${{ inputs.reviewed_controller_sha }}"
          BIL_TWO_CANDIDATES_JSON: "[{\"path\":\"test/launch_readiness/ai_coach_server_contract_test.dart\",\"preimage_git_blob_sha1\":\"f9eafe413bdb5615d59c45f0f05be0a7cae22d33\",\"preimage_sha256\":\"540fb25a824ed68dd4b66d2056aea5343856e8ffac0acec211e8ebb766851ce2\",\"candidate_sha256\":\"25391d04be41cf105c1bde85fc50c93db80f67bb3905c755e8c849c727c4e8c7\",\"candidate_b64\":\"\"},{\"path\":\".github/workflows/bil_android_isolated_emulator_smoke.yml\",\"preimage_git_blob_sha1\":\"71aa4b9b771f3c54c4d4eb162b7588542860614c\",\"preimage_sha256\":\"1fa0bf5cdce9916154e39e5e89dd19519f6913e3b483fc20321fd8f21ae9ed4b\",\"candidate_sha256\":\"ce1306525cbda8c1d29280dc888735a491f9d7ec464ea6cfe02e401afda9ae1a\",\"candidate_b64\":\"\"}]"
        run: |
          set -euo pipefail
          python3 - <<'PY_TWO_EXACT_OVERLAYS'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          S='df930c575c12b0ec0c333ce92edffd9c2b6fb598';T='7ddf0f131d8942847b8d089e6185a4d8f532d06c'
          assert os.environ['BIL_REVIEWED_CONTROLLER_SHA']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          assert git('rev-parse','HEAD')==S and git('rev-parse','HEAD^{tree}')==T
          assert not git('status','--porcelain=v1','--untracked-files=all')
          for key in ['SUPABASE_SERVICE_ROLE_KEY','DATABASE_URL','GEMINI_API_KEY','GOOGLE_API_KEY']:assert not os.environ.get(key)
          rows=json.loads(os.environ['BIL_TWO_CANDIDATES_JSON'])
          assert len(rows)==2
          for row in rows:
           p=Path(row['path'])
           assert git('rev-parse',S+':'+row['path'])==row['preimage_git_blob_sha1']
           assert hashlib.sha256(p.read_bytes()).hexdigest()==row['preimage_sha256']
           raw=base64.b64decode(row['candidate_b64'],validate=True)
           assert hashlib.sha256(raw).hexdigest()==row['candidate_sha256']
          for row in rows:Path(row['path']).write_bytes(base64.b64decode(row['candidate_b64'],validate=True))
          assert set(git('diff','--name-only').splitlines())=={row['path'] for row in rows}
          p=Path('build/qa/bil-s8-two-change-preflight');p.mkdir(parents=True,exist_ok=True)
          for row in rows:row.pop('candidate_b64')
          (p/'runtime-overlay-provenance.json').write_text(json.dumps({'source_sha':S,'source_tree':T,'controller_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'candidate_files':rows,'only_two_runtime_overlays':True,'signed_or_native_app_acceptance':False},indent=2)+'\n')
          PY_TWO_EXACT_OVERLAYS
      - name: Install exact Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Enforce lockfile and strict formatting of only the changed Dart test
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine > build/qa/bil-s8-two-change-preflight/flutter-version.json
          python3 - <<'PY_FLUTTER_PIN'
          import json
          from pathlib import Path
          assert json.loads(Path('build/qa/bil-s8-two-change-preflight/flutter-version.json').read_text())['frameworkVersion']=='3.44.6'
          PY_FLUTTER_PIN
          flutter pub get --enforce-lockfile 2>&1 | tee build/qa/bil-s8-two-change-preflight/pub-get.log
          git diff --exit-code -- pubspec.yaml pubspec.lock
          dart format --output=none --set-exit-if-changed test/launch_readiness/ai_coach_server_contract_test.dart 2>&1 | tee build/qa/bil-s8-two-change-preflight/dart-format.log
      - name: Execute only the existing three-case AI Coach Dart contract file
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --machine test/launch_readiness/ai_coach_server_contract_test.dart 2>&1 | tee build/qa/bil-s8-two-change-preflight/flutter-events.jsonl
          python3 - <<'PY_CONTRACT_RECEIPT'
          from pathlib import Path
          import json
          p=Path('build/qa/bil-s8-two-change-preflight');events=[]
          for line in (p/'flutter-events.jsonl').read_text().splitlines():
           try:row=json.loads(line)
           except json.JSONDecodeError:continue
           if isinstance(row,dict) and isinstance(row.get('type'),str):events.append(row)
          starts={row['test']['id']:row['test'] for row in events if row['type']=='testStart'}
          visible=[row for row in events if row['type']=='testDone' and not row.get('hidden')]
          expected={'AI Coach text route is server metered and confirmation gated','AI Coach live provider caps fit the shared window and client deadline','AI Coach voice capture is not locked to the app locale'}
          assert len(visible)==3 and {starts[row['testID']]['name'] for row in visible}==expected
          assert all(row['result']=='success' and row['skipped'] is False for row in visible)
          assert not [row for row in events if row['type']=='error']
          done=[row for row in events if row['type']=='done'];assert len(done)==1 and done[0]['success'] is True
          (p/'targeted-contract-result.json').write_text(json.dumps({'status':'PASS','counts':{'success':3,'failure':0,'skip':0},'names':sorted(expected),'terminal_done':done[0],'source_sha':'df930c575c12b0ec0c333ce92edffd9c2b6fb598'},indent=2)+'\n')
          PY_CONTRACT_RECEIPT
      - name: Execute the twelve existing Android startup workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tool/release -p 'test_android_startup_workflow.py' -v 2>&1 | tee build/qa/bil-s8-two-change-preflight/startup-workflow-contracts.log
          python3 - <<'PY_STATIC_RECEIPT'
          from pathlib import Path
          import json,re
          p=Path('build/qa/bil-s8-two-change-preflight');text=(p/'startup-workflow-contracts.log').read_text()
          assert re.search(r'Ran 12 tests in ',text) and '\nOK\n' in text
          (p/'startup-workflow-contracts-result.json').write_text(json.dumps({'status':'PASS','executed_existing_tests':12,'failure':0,'skip':0,'scope':'Static existing workflow contracts, no app execution'},indent=2)+'\n')
          PY_STATIC_RECEIPT
      - name: Check original startup and new host step Bash syntax without execution
        shell: bash
        run: |
          set -euo pipefail
          bash -n tool/release/run_android_emulator_smoke.sh
          python3 - <<'PY_EXTRACT_BASH'
          from pathlib import Path
          lines=Path('.github/workflows/bil_android_isolated_emulator_smoke.yml').read_text().splitlines()
          start=lines.index('      - name: Record the hosted VM resource budget before emulator startup')
          run=lines.index('        run: |',start);body=[]
          for line in lines[run+1:]:
           if line and not line.startswith('          '):break
           body.append(line[10:] if line else '')
          text='\n'.join(body)+'\n'
          assert 'timeout 45s ./gradlew --stop --console=plain' in text
          assert 'sha256sum --check' in text and 'host-processes-before-gradle-stop.txt' in text and 'host-processes-after-gradle-stop.txt' in text
          Path('build/qa/bil-s8-two-change-preflight/extracted-host-resource-step.bash').write_text(text)
          PY_EXTRACT_BASH
          bash -n build/qa/bil-s8-two-change-preflight/extracted-host-resource-step.bash
          printf '%s\n' 'PASS: original startup and candidate host-step Bash syntax only; Gradle and ADB were not executed' > build/qa/bil-s8-two-change-preflight/bash-syntax-result.txt
      - name: Seal unchanged candidate bytes and bounded actual results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL_TWO_FILE_BINDING'
          from pathlib import Path
          import hashlib,json
          p=Path('build/qa/bil-s8-two-change-preflight');row=json.loads((p/'runtime-overlay-provenance.json').read_text())
          for item in row['candidate_files']:assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['candidate_sha256']
          (p/'bounded-preflight-complete.json').write_text(json.dumps({'status':'PASS','source_sha':row['source_sha'],'source_tree':row['source_tree'],'controller_sha':row['controller_sha'],'candidate_files':row['candidate_files'],'Dart_contract_cases':3,'existing_Python_workflow_cases':12,'Bash_syntax_only':True,'full_source_CI_ready':False,'actual_emulator_or_native_build':False,'signed_or_physical_acceptance':False},indent=2)+'\n')
          PY_FINAL_TWO_FILE_BINDING
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Preserve original bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-s8-two-change-preflight-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: build/qa/bil-s8-two-change-preflight/
          if-no-files-found: error
          retention-days: 30
