name: Gemini 3.8 isolated retirement source diagnosis
on:
  workflow_dispatch:
    inputs:
      reviewed_controller_sha:
        description: Exact reviewed diagnostic controller commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gemini38-diagnostic-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-deno-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Run exact S7 baseline and reviewed Gemini candidates
        shell: python
        env:
          REVIEWED_CONTROLLER_SHA: ${{ inputs.reviewed_controller_sha }}
        run: |
          import base64,hashlib,json,os,pathlib,re,shutil,subprocess,sys,datetime
          ROOT=pathlib.Path.cwd();WORK=ROOT/'gemini-diagnostic';WORK.mkdir(exist_ok=False)
          OUT=WORK/'evidence';OUT.mkdir()
          payload=json.loads(base64.b64decode(''))
          sha=lambda data:hashlib.sha256(data).hexdigest()
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],**kwargs)
          assert re.fullmatch('[a-f0-9]{40}',os.environ['REVIEWED_CONTROLLER_SHA'])
          assert os.environ['REVIEWED_CONTROLLER_SHA']==os.environ['GITHUB_SHA']==git('rev-parse','HEAD').decode().strip()
          assert git('rev-parse','HEAD^').decode().strip()==payload['source_sha']
          assert git('rev-parse',payload['source_sha']+'^{tree}').decode().strip()==payload['source_tree']
          assert git('diff-tree','--no-commit-id','--name-only','-r','HEAD').decode().splitlines()==['.github/workflows/bil39_cloud_source_qa.yml']
          for name in ['SUPABASE_SERVICE_ROLE_KEY','DATABASE_URL','GEMINI_API_KEY','GOOGLE_API_KEY','BIL_GEMINI_API_KEY','GOOGLE_APPLICATION_CREDENTIALS']:
              assert not os.environ.get(name),'Production credential variable unexpectedly present: '+name
          assert subprocess.check_output(['deno','--version']).decode().splitlines()[0].startswith('deno 2.9.7 ')
          for name,patch in payload['patches'].items():
              data=base64.b64decode(patch['base64']);assert sha(data)==patch['sha256']
              (WORK/(name+'.patch')).write_bytes(data)
          with (OUT/'payload-and-source-bindings.json').open('x') as stream:
              json.dump({key:value for key,value in payload.items() if key!='patches'},stream,indent=2)
          with (OUT/'controller-bindings.json').open('x') as stream:
              json.dump({'controller':os.environ['GITHUB_SHA'],'parent_source':payload['source_sha'],'parent_tree':payload['source_tree'],'only_changed_committed_path':'.github/workflows/bil39_cloud_source_qa.yml','cloud_credentials_present':False,'cloud_writes':0,'provider_requests':0},stream,indent=2)
          for name in ['baseline','candidate']:
              folder=WORK/name;folder.mkdir()
              archive=git('archive',payload['source_sha'],'supabase')
              subprocess.run(['tar','-x','-C',str(folder)],input=archive,check=True)
          candidate=WORK/'candidate';baseline=WORK/'baseline'
          for name in ['vision','fallback']:
              prefix=str(candidate.relative_to(ROOT)).replace('\\','/')
              subprocess.run(['git','apply','--check','--directory='+prefix,str(WORK/(name+'.patch'))],check=True)
              subprocess.run(['git','apply','--directory='+prefix,str(WORK/(name+'.patch'))],check=True)
          for path,pin in payload['source_pins'].items():assert sha((candidate/path).read_bytes())==pin,path
          summary=[]
          ansi=re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          def run(name,folder,arguments,expected):
              print('START '+name,flush=True)
              process=subprocess.run(['deno','test',*arguments],cwd=folder,capture_output=True,text=True,timeout=240)
              text=ansi.sub('',process.stdout+'\n'+process.stderr)
              (OUT/(name+'.log')).write_text(text,encoding='utf-8')
              matches=re.findall(r'(?:ok|FAILED)\s*\|\s*(\d+) passed\s*\|\s*(\d+) failed',text)
              counts=[int(x) for x in matches[-1]] if matches else None
              record={'name':name,'exit_code':process.returncode,'passed_failed':counts,'expected':expected,'command':['deno','test',*arguments]}
              summary.append(record)
              (OUT/'stage-results.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
              print(json.dumps(record),flush=True)
              if expected=='GREEN':assert process.returncode==0 and counts is not None and counts[1]==0,name
              elif expected=='CAUSAL_RED_3FAIL_3PASS':assert process.returncode!=0 and counts==[3,3],name
              elif expected=='OLD_DEFAULT_EXPECTATIONS_RED':assert process.returncode!=0 and counts is not None and counts[1]>0,name
              else:raise AssertionError('Unreviewed expectation')
          flags=['--frozen','--lock=deno.lock','--allow-env','--allow-read','--allow-net=deno.land,registry.npmjs.org,jsr.io,esm.sh']
          suites=['ai-coach','analyze-meal','_shared/ai_provider_recipient_test.ts']
          run('01_original_S7_existing_suites',baseline/'supabase/functions',flags+suites,'GREEN')
          new_test='supabase/functions/ai-coach/gemini_retirement_fallback_test.ts'
          shutil.copyfile(candidate/new_test,baseline/new_test)
          run('02_original_S7_new_causal_runtime_RED',baseline/'supabase/functions',['--no-check',*flags,'ai-coach/gemini_retirement_fallback_test.ts'],'CAUSAL_RED_3FAIL_3PASS')
          run('03_candidate_new_causal_typechecked_GREEN',candidate/'supabase/functions',flags+['ai-coach/gemini_retirement_fallback_test.ts'],'GREEN')
          run('04_candidate_unchanged_old_expectations_RED',candidate/'supabase/functions',flags+suites,'OLD_DEFAULT_EXPECTATIONS_RED')
          prefix=str(candidate.relative_to(ROOT)).replace('\\','/')
          subprocess.run(['git','apply','--check','--directory='+prefix,str(WORK/'tests.patch')],check=True)
          subprocess.run(['git','apply','--directory='+prefix,str(WORK/'tests.patch')],check=True)
          for path,pin in {**payload['source_pins'],**payload['test_adaptation_pins']}.items():assert sha((candidate/path).read_bytes())==pin,path
          run('05_candidate_full_suites_with_causal_test_adaptations',candidate/'supabase/functions',flags+suites,'GREEN')
          # The existing isolated SQL test uses pinned npm:PGlite0.3.15 and real migration SQL;
          # no remote database is accessed and --no-lock prevents source lockfile mutation.
          money_flags=['--no-lock','--allow-env','--allow-read','--allow-net=registry.npmjs.org,jsr.io,deno.land,esm.sh','supabase/tests/ai_credit_settlement_funding_pglite_test.ts']
          run('06_original_S7_credit_funding_SQL',baseline,money_flags,'GREEN')
          run('07_candidate_credit_funding_SQL',candidate,money_flags,'GREEN')
          tracked=git('status','--porcelain=v1','--untracked-files=no').decode().strip();assert tracked=='',tracked
          final={'status':'ALL_DIAGNOSTIC_STAGES_MATCH_EXPECTATIONS','source':payload['source_sha'],'controller':os.environ['GITHUB_SHA'],'candidate_source_pins':payload['source_pins'],'test_adaptation_pins':payload['test_adaptation_pins'],'stages':summary,'production_mutation':False,'source_checkout_mutation':False,'provider_requests':0,'does_not_prove_live_model_acceptance':True}
          (OUT/'FINAL_DIAGNOSTIC_RESULT.json').write_text(json.dumps(final,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':final['status'],'stages':len(summary)}),flush=True)
      - name: Preserve every outcome including causal RED failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gemini38-deno-diagnostic-${{ github.sha }}
          path: gemini-diagnostic/evidence
          if-no-files-found: error
          retention-days: 30
