name: BIL39 isolated Coach cloud source tests
on:
  push:
    branches:
      - codex/bil39-cloud-completion-20261025
      - bil39/integration-20261025
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil39-cloud-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-coach-handler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Record source and prove no production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GOOGLE_API_KEY:-}"
          mkdir -p build/qa/bil39-cloud-source
          git rev-parse HEAD > build/qa/bil39-cloud-source/source-sha.txt
          deno --version > build/qa/bil39-cloud-source/toolchain.txt
      - name: Type-check and execute the real handler with isolated boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          deno test --frozen --lock=deno.lock --allow-env --allow-read \
            --allow-net=deno.land,registry.npmjs.org,jsr.io,esm.sh \
            ai-coach 2>&1 | tee ../../build/qa/bil39-cloud-source/tests.log
          git diff --exit-code
      - name: Preserve evidence including failed outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil39-cloud-source-${{ github.sha }}
          path: build/qa/bil39-cloud-source
          if-no-files-found: error
          retention-days: 30
