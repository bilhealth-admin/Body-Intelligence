name: BIL Premium One Shot Finalize

on:
  push:
    branches: [tmp/premium-one-shot-20260930]

permissions:
  contents: write

jobs:
  finalize-premium-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Capture finalizer and require exact current premium head
        shell: bash
        run: |
          set -euo pipefail
          cp tool/premium_one_shot/finalize.py /tmp/finalize.py
          BASE='1cd90816577ebb9fb3fb058db3f36c73a816c5fe'
          EXPECTED='46cc4a3b4120ffaeaf3342b275cfb58f79bbed78'
          git fetch origin fix/community-sapphire-health-3033
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git reset --hard "$EXPECTED"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = "1"
          python3 /tmp/finalize.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/bil_sapphire_history_qa.yml'); puts 'SAPPHIRE_YAML_PASS'"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Prepare format analyze and run premium preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/sapphire/prepare.py
          flutter pub get
          mapfile -t DART_FILES < <(git diff --name-only 59839c7deb4d1cc860275b9e69578e299cc24d0a -- '*.dart')
          if ((${#DART_FILES[@]})); then
            dart format "${DART_FILES[@]}"
          fi
          npm install --prefix /tmp/bil-deno deno@2.5.1
          DENO=/tmp/bil-deno/node_modules/.bin/deno
          "$DENO" fmt supabase/functions/food-search/index.ts supabase/functions/food-search/index_test.ts
          git diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency 1 --timeout 90s --reporter expanded             test/app/localization/food_log_runtime_copy_test.dart             test/app/router/quick_add_premium_capture_actions_contract_test.dart             test/app/theme/premium_black_dark_theme_contract_test.dart             test/features/intelligence_center/ai_coach_premium_welcome_contract_test.dart             test/features/nutrition/food_presentation_localizer_test.dart             test/features/onboarding/premium_consent_surface_contract_test.dart             test/launch_readiness/trusted_food_search_backend_contract_test.dart             test/platform_readiness/android_health_permission_premium_contract_test.dart             test/platform_readiness/mobile_release_configuration_contract_test.dart             test/platform_readiness/premium_global_native_parity_contract_test.dart             test/shared/widgets/premium_trust_and_clinical_surface_test.dart
          "$DENO" test --allow-env --allow-read --allow-net supabase/functions/food-search

      - name: Create one replacement commit and move release branch once
        shell: bash
        run: |
          set -euo pipefail
          BASE='1cd90816577ebb9fb3fb058db3f36c73a816c5fe'
          EXPECTED='46cc4a3b4120ffaeaf3342b275cfb58f79bbed78'
          git diff --exit-code "$BASE" -- lib/app/router/app_router.dart android/app/build.gradle.kts ios/Runner.xcodeproj/project.pbxproj store_assets
          grep -Fq 'applicationId = "com.bilhealth.bodyintelligencelog"' android/app/build.gradle.kts
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.bilhealth.bodyintelligencelog' ios/Runner.xcodeproj/project.pbxproj
          git add -A
          ! git diff --cached --name-only | grep -q '^tool/premium_one_shot/'
          git config user.name 'bilhealth-admin'
          git config user.email 'bilhealth.app@gmail.com'
          TREE="$(git write-tree)"
          NEW="$(printf '%s\n' 'feat(release): premium global polish for Android 30 and iOS 33' | git commit-tree "$TREE" -p "$BASE")"
          test "$(git rev-parse "$NEW^")" = "$BASE"
          test "$(git rev-list --count "$BASE".."$NEW")" = "1"
          git fetch origin fix/community-sapphire-health-3033
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git push --force-with-lease=refs/heads/fix/community-sapphire-health-3033:$EXPECTED origin "$NEW":refs/heads/fix/community-sapphire-health-3033
          echo "FINAL_SHA=$NEW"
