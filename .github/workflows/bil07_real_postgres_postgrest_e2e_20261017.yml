name: BIL07 real PostgreSQL and PostgREST HTTP staging contract
on:
  push:
    branches:
      - qa/bil07-real-postgres-postgrest-isolated-20261017
permissions:
  contents: read
jobs:
  owner_jwt_rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: bil07_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bil07-fixture-postgres-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bil07_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require fixture and zero production credentials
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${BIL_RECONCILIATION_SECRET:-}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Apply exact BIL07 migrations only to synthetic Postgres
        env:
          PGPASSWORD: bil07-fixture-postgres-pass
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d bil07_fixture \
            -f supabase/tests/fixtures/bil07_real_postgres_auth.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d bil07_fixture \
            -f supabase/migrations/20261017210000_bil07_community_channels_isolated.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d bil07_fixture \
            -f supabase/migrations/20261017211000_bil07_channel_reporting_isolated.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d bil07_fixture \
            -f supabase/tests/fixtures/bil07_real_postgres_seed.sql
      - name: Run versioned PostgREST on loopback with fake JWT secret
        run: |
          set -euo pipefail
          docker run --rm --detach --name bil07-fixture-postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:bil07-fixture-only-database-pass@127.0.0.1:5432/bil07_fixture" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="bil07-fixture-only-jwt-secret-48chars-and-nothing-live" \
            -e PGRST_SERVER_PORT=3002 \
            postgrest/postgrest:v12.2.8
      - name: Test signed fake-owner JWT against actual HTTP and SQL grants
        env:
          BIL07_FIXTURE_HTTP_ONLY: "1"
        run: |
          set -euo pipefail
          python3 supabase/tests/bil07_real_postgrest_http_e2e.py
      - name: Preserve evidence and stop synthetic REST server
        if: always()
        run: |
          git diff --exit-code
          docker logs --tail=50 bil07-fixture-postgrest || true
          docker stop bil07-fixture-postgrest || true

  isolated_rate_pglite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Real candidate migrations, duplicate sends, rate limit and member safety
        run: |
          deno test --allow-read --allow-env --no-lock \
            supabase/tests/bil07_community_channels_isolated_pglite_test.ts
  channel_flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Enforce byte-exact Dart formatting of committed source
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/community/channels/domain/community_channel_models.dart \
            lib/features/community/channels/data/supabase_community_channels_repository.dart \
            lib/features/community/channels/presentation/community_channels_copy.dart \
            lib/features/community/channels/presentation/community_channel_composer.dart \
            lib/features/community/channels/presentation/community_channel_transcript.dart \
            test/features/community/community_channels_safety_action_test.dart
          git diff --check
          git diff --stat
      - name: Analyze typed rate-limited failures and send UX
        run: |
          flutter analyze --no-pub \
            lib/features/community/channels/domain/community_channel_models.dart \
            lib/features/community/channels/data/supabase_community_channels_repository.dart \
            lib/features/community/channels/presentation/community_channels_copy.dart \
            lib/features/community/channels/presentation/community_channel_composer.dart \
            lib/features/community/channels/presentation/community_channel_transcript.dart \
            test/features/community/community_channels_safety_action_test.dart
      - name: Test safety controls and full owner/retry regressions
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/community/community_channels_safety_action_test.dart \
            test/features/community/community_chat_auth_session_test.dart \
            test/features/community/community_owner_refresh_transport_test.dart
