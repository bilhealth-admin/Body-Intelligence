          import base64, hashlib, os, re, zlib
          from pathlib import Path
          BIL47_CHUNKS = [{'index': 0, 'name': 'bil47-exact-gate-bootstrap-000.chunk', 'bytes': 12000, 'sha256': 'b2506d06fee8c6bb1c9ce1f5f64aea208822df3ab98343a3f4fb48b5590af59a'}, {'index': 1, 'name': 'bil47-exact-gate-bootstrap-001.chunk', 'bytes': 12000, 'sha256': 'c4241beebc0081d3edfc97a9c8d9b739ee8759d2312c75858da5dfcbe557c326'}, {'index': 2, 'name': 'bil47-exact-gate-bootstrap-002.chunk', 'bytes': 12000, 'sha256': '0726da54f64bdff1022bfeb69fdb6d3155b6051cb5e3851ee05013ae2bd8e83c'}, {'index': 3, 'name': 'bil47-exact-gate-bootstrap-003.chunk', 'bytes': 12000, 'sha256': '862391be88c3efadeef4920eb280575d764512831d2cdd892b4691a8a76b017c'}, {'index': 4, 'name': 'bil47-exact-gate-bootstrap-004.chunk', 'bytes': 12000, 'sha256': '7d45e958f97b77c84e8c5ed179ad24af37c8fede2ac844fb47d7f3d5fe2253c6'}, {'index': 5, 'name': 'bil47-exact-gate-bootstrap-005.chunk', 'bytes': 12000, 'sha256': '021785cb52fb0e56fcf03fea22c8efc2d44cb809aa51dae868e1f66d84368c67'}, {'index': 6, 'name': 'bil47-exact-gate-bootstrap-006.chunk', 'bytes': 12000, 'sha256': 'a27d6762c9996938b4534aefbec57ef53b23c23e56b9057f476718df4b4219ef'}, {'index': 7, 'name': 'bil47-exact-gate-bootstrap-007.chunk', 'bytes': 4560, 'sha256': '7094b67a910b48c45d8e3e1264817c7d6648d8fa022340e11855a8c024360962'}]
          BIL47_CHUNK_COUNT = 8
          BIL47_ENCODED_BYTES = 88560
          BIL47_PACKED_SHA256 = '60ac852ede68edaa1340ed3a0d1d28e602752b19246354b766e71e20275b1d21'
          BIL47_BOOTSTRAP_BYTES = 86695
          BIL47_BOOTSTRAP_SHA256 = 'e8c7ef584cf9284710e705984691fd3682afca0eda551210a12a0a416b23715e'
          assert isinstance(BIL47_CHUNKS, list) and len(BIL47_CHUNKS) == BIL47_CHUNK_COUNT
          assert 0 < BIL47_CHUNK_COUNT <= 64
          assert 0 < BIL47_BOOTSTRAP_BYTES <= 4 * 1024 * 1024
          root_input = Path(os.environ['RUNNER_TEMP'])
          assert root_input.is_absolute() and root_input.is_dir() and not root_input.is_symlink()
          assert not (getattr(os.lstat(root_input), 'st_file_attributes', 0) & 0x400)
          root = root_input.resolve(strict=True)
          parts = []
          for index, descriptor in enumerate(BIL47_CHUNKS):
              assert isinstance(descriptor, dict) and set(descriptor) == {'index', 'name', 'bytes', 'sha256'}
              assert type(descriptor['index']) is int and descriptor['index'] == index
              name = descriptor['name']
              assert name == f'bil47-exact-gate-bootstrap-{index:03d}.chunk'
              assert type(descriptor['bytes']) is int and 0 < descriptor['bytes'] <= 12000
              assert re.fullmatch('[a-f0-9]{64}', descriptor['sha256'])
              path = root / name
              assert path.parent == root and path.is_file() and not path.is_symlink()
              assert not (getattr(os.lstat(path), 'st_file_attributes', 0) & 0x400)
              assert path.resolve(strict=True).parent == root and path.stat().st_size == descriptor['bytes']
              with path.open('rb') as source:
                  part = source.read(descriptor['bytes'] + 1)
              assert len(part) == descriptor['bytes']
              assert hashlib.sha256(part).hexdigest() == descriptor['sha256']
              parts.append(part)
          encoded = b''.join(parts)
          assert len(encoded) == BIL47_ENCODED_BYTES
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == BIL47_PACKED_SHA256
