name: BIL Android43 immutable a3206fbd release controller
run-name: "Android43 app a3206fbd; separate controller provenance; no Play submission"
on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: Explicit signed artifact preparation only; no store upload
        type: boolean
        default: false
      expected_source_sha:
        description: Exact accepted application source SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: bil-android43-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  BIL_TESTED_SOURCE_SHA: a3206fbd6d53d66fd4cd39820cbdba684810d886
  BIL_SIGNING_ORCHESTRATION_SHA: ${{ github.sha }}
  BIL_RELEASE_BRANCH: codex/bil49-android41-native40-fixes-20261120
  BIL_ORIGINAL_SHA: 0c94cf2a75c01ebb7cbea74704a18a8109831194
jobs:
  affected-source:
    name: Source18 affected Android and Edge checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_signed_build == true && inputs.expected_source_sha == 'a3206fbd6d53d66fd4cd39820cbdba684810d886' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a3206fbd6d53d66fd4cd39820cbdba684810d886
          persist-credentials: false
      - name: Verify exact source and code tree
        run: |
          test "$(git rev-parse HEAD)" = a3206fbd6d53d66fd4cd39820cbdba684810d886
          test "$(git rev-parse 'HEAD^{tree}')" = cf8514390337f102631693c018525a3b2d86e863
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze changed Edge source with existing extended rules
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          upload: never
          output: ${{ runner.temp }}/bil43-sarif
      - name: Inspect affected CodeQL results without publishing SARIF
        id: bil43_codeql_reader
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bil43-read-scanner.py" <<'PY'
          """Classify primary CodeQL locations and publish only allowlisted diagnostic fields."""
          import collections
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.parse import unquote, urljoin, urlsplit
          from urllib.request import url2pathname

          EDGE = {'supabase/functions/analyze-meal/index.ts', 'supabase/functions/analyze-meal/cache_request_binding_test.ts'}
          AFFECTED = EDGE | {'lib/features/commerce/services/verified_store_purchase_restore.dart', 'test/features/commerce/store_android_unscoped_checkout_failure_test.dart'}


          class LocationError(ValueError):
              def __init__(self, code, base=None):
                  super().__init__(code)
                  self.code = code
                  self.base = base


          def safe_id(value):
              if isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9%_.:/-]{1,120}', value) and not re.search(r'(?i)(?:[a-f0-9]{24,}|gh[pousr]_|github_pat_|eyJ|AIza|://)', value):
                  return value
              return None


          def report_path(value, tracked):
              if isinstance(value, str) and value in tracked and re.fullmatch(r'[A-Za-z0-9_.+/-]{1,260}', value):
                  return value
              return None


          def index_location(loc, run):
              if 'index' not in loc:
                  return loc
              idx = loc['index']
              artifacts = run.get('artifacts', [])
              if type(idx) is not int or not 0 <= idx < len(artifacts):
                  raise LocationError('invalid_artifact_index')
              item = artifacts[idx]['location']
              if any(k in loc and k in item and loc[k] != item[k] for k in ('index', 'uri', 'uriBaseId')):
                  raise LocationError('inconsistent_artifact_index')
              return {**item, **loc}


          def resolve(loc, run, root, counters):
              uri = loc.get('uri')
              if not isinstance(uri, str) or not uri:
                  raise LocationError('missing_artifact_uri')
              bases = run.get('originalUriBaseIds', {})
              key = loc.get('uriBaseId')
              visited = set()
              while key is not None:
                  if not isinstance(key, str) or key in visited:
                      raise LocationError('cyclic_or_invalid_base', key)
                  visited.add(key)
                  if key not in bases or (isinstance(bases[key], dict) and 'uri' not in bases[key] and 'uriBaseId' not in bases[key]):
                      if key != '%SRCROOT%':
                          raise LocationError('unknown_base', key)
                      uri = urljoin(root.as_uri() + '/', uri)
                      counters['implicit_checkout_srcroot'] += 1
                      break
                  base = bases[key]
                  if not isinstance(base, dict) or not isinstance(base.get('uri'), str) or not base['uri'].endswith('/'):
                      raise LocationError('invalid_base_location', key)
                  uri = urljoin(base['uri'], uri)
                  key = base.get('uriBaseId')
                  counters['declared_base_links'] += 1
              parsed = urlsplit(urljoin(root.as_uri() + '/', uri))
              if parsed.scheme != 'file' or parsed.netloc not in ('', 'localhost') or parsed.query or parsed.fragment:
                  raise LocationError('unsupported_repository_uri')
              converted = url2pathname(parsed.path)
              if chr(0) in converted or (os.name != 'nt' and chr(92) in converted):
                  raise LocationError('invalid_repository_path')
              physical = Path(converted).resolve()
              if not physical.is_relative_to(root) or physical == root:
                  raise LocationError('outside_checkout')
              return physical.relative_to(root).as_posix()


          def inspect(files, root, tracked):
              counters = collections.Counter()
              details = []
              if not files:
                  raise LocationError('missing_sarif')
              for path in files:
                  for run in json.loads(path.read_bytes())['runs']:
                      if not run['tool']['driver']['name'].lower().startswith('codeql'):
                          raise LocationError('unexpected_scanner')
                      counters['runs'] += 1
                      for result in run.get('results', []):
                          rule = safe_id(result.get('ruleId'))
                          locations = result.get('locations', [])
                          if not locations:
                              details.append({'issue': 'missing_primary_location', 'rule': rule})
                          for row in locations:
                              physical = row.get('physicalLocation', {})
                              loc = physical.get('artifactLocation', {})
                              line = physical.get('region', {}).get('startLine')
                              detail = {'rule': rule, 'line': line if type(line) is int and line > 0 else None}
                              try:
                                  loc = index_location(loc, run)
                                  counters['indexed'] += int('index' in loc)
                                  name = resolve(loc, run, root, counters)
                                  counters['resolved'] += 1
                                  if name in EDGE:
                                      details.append({**detail, 'issue': 'affected_finding', 'path': name, 'base': safe_id(loc.get('uriBaseId'))})
                              except LocationError as error:
                                  hint = report_path(unquote(loc.get('uri', '')), tracked)
                                  details.append({**detail, 'issue': error.code, 'candidate_repo_path': hint, 'base': safe_id(error.base or loc.get('uriBaseId'))})
              if not counters['runs']:
                  raise LocationError('missing_codeql_run')
              return {'counts': dict(counters), 'details': details, 'status': 'FAIL' if details else 'PASS'}


          def semgrep(path):
              if not path.is_file():
                  raise LocationError('semgrep_report_missing')
              data = json.loads(path.read_bytes())
              details = []
              for row in data['results']:
                  name = row.get('path')
                  line = row.get('start', {}).get('line')
                  details.append({'rule': safe_id(row.get('check_id')), 'path': name if name in AFFECTED else None,
                                  'line': line if type(line) is int and line > 0 else None})
              return {'status': 'SCAN_FAILED', 'details': details, 'scanner_errors': len(data.get('errors', []))}


          def main():
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
              temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              mode = sys.argv[1]
              try:
                  if mode == 'codeql':
                      if Path.cwd().resolve() != root or subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip() != str(root):
                          raise LocationError('checkout_root_mismatch')
                      if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != 'a3206fbd6d53d66fd4cd39820cbdba684810d886':
                          raise LocationError('source_revision_mismatch')
                      subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--'], check=True)
                      tracked = set(os.fsdecode(subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z'])).split(chr(0)))
                      summary = inspect(list((temp/'bil43-sarif').rglob('*.sarif')), root, tracked)
                  else:
                      summary = semgrep(temp/'bil43-semgrep.json')
              except LocationError as error:
                  summary = {'status': 'FAIL', 'details': [{'issue': error.code, 'base': safe_id(error.base)}]}
              except (ValueError, KeyError, TypeError, OSError, AttributeError, subprocess.SubprocessError):
                  summary = {'status': 'FAIL', 'details': [{'issue': 'malformed_or_unreadable_scanner_output'}]}
              summary['scanner'] = mode
              (temp/('bil43-'+mode+'-summary.json')).write_text(json.dumps(summary, indent=2)+'\n')
              print(json.dumps({'scanner': mode, 'status': summary['status'], 'counts': summary.get('counts'), 'diagnostic_count':len(summary['details'])}))
              return int(mode == 'codeql' and summary['status'] != 'PASS')


          if __name__ == '__main__':
              sys.exit(main())
          PY
          python3 "$RUNNER_TEMP/bil43-read-scanner.py" codeql
      - name: Scan affected source with original Semgrep rules
        id: bil43_semgrep
        shell: bash
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bil43-semgrep"
          "$RUNNER_TEMP/bil43-semgrep/bin/pip" install --disable-pip-version-check 'semgrep==1.181.0'
          "$RUNNER_TEMP/bil43-semgrep/bin/semgrep" scan --config p/security-audit --config p/secrets --jobs 2 --timeout 60 --timeout-threshold 0 --metrics off --disable-version-check --error --strict --json --output "$RUNNER_TEMP/bil43-semgrep.json" lib/features/commerce/services/verified_store_purchase_restore.dart test/features/commerce/store_android_unscoped_checkout_failure_test.dart supabase/functions/analyze-meal/index.ts supabase/functions/analyze-meal/cache_request_binding_test.ts
      - name: Summarize failed Semgrep scan
        if: ${{ failure() && steps.bil43_semgrep.outcome == 'failure' }}
        run: python3 "$RUNNER_TEMP/bil43-read-scanner.py" semgrep
      - name: Retain sanitized scanner failure metadata
        if: ${{ failure() && (steps.bil43_codeql_reader.outcome == 'failure' || steps.bil43_semgrep.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil43-affected-scan-summary-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/bil43-codeql-summary.json
            ${{ runner.temp }}/bil43-semgrep-summary.json
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Run all five current request binding cases
        run: |
          set -euo pipefail
          NO_COLOR=1 deno test --no-config --allow-read supabase/functions/analyze-meal/cache_request_binding_test.ts | tee "$RUNNER_TEMP/bil43-deno.log"
          grep -Eq '5 passed.*0 failed' "$RUNNER_TEMP/bil43-deno.log"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify changed Dart formatting and affected purchase paths
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/features/commerce/services/verified_store_purchase_restore.dart test/features/commerce/store_android_unscoped_checkout_failure_test.dart
          flutter test --no-pub --concurrency=1 --dart-define=BIL_PAYMENTS_ENABLED=true --machine test/features/commerce/store_android_unscoped_checkout_failure_test.dart test/features/commerce/bil_store_plans_dynamic_contract_test.dart test/features/commerce/plans_restore_neutral_outcomes_test.dart > "$RUNNER_TEMP/bil43-owned-flutter.jsonl"
          python3 tools/qa/bil39_flutter_event_receipt.py --log "$RUNNER_TEMP/bil43-owned-flutter.jsonl" --source-sha a3206fbd6d53d66fd4cd39820cbdba684810d886 --test-exit 0 --output "$RUNNER_TEMP/bil43-owned-flutter.json"
          python3 - <<'PY'
          import json,pathlib,os
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'bil43-owned-flutter.json').read_bytes())
          if r['counts']!={'success':93,'failure':0,'error':0,'skip':0}: raise ValueError('original 93 owning/UI cases did not pass')
          cases={'store_android_unscoped_checkout_failure_test.dart':51,'bil_store_plans_dynamic_contract_test.dart':36,'plans_restore_neutral_outcomes_test.dart':6}
          if r['files']!={'test/features/commerce/'+name:{'success':count} for name,count in cases.items()}: raise ValueError('affected case inventory mismatch')
          PY
      - name: Replay actual repository cross-day conflict, fresh save and deduplication
        run: |
          set -euo pipefail
          test ! -e test/features/nutrition/bil43_owned_cross_day_test.dart
          cat > test/features/nutrition/bil43_owned_cross_day_test.dart <<'DART'
          import 'dart:io';
          import 'package:body_intelligence_log/data/database/app_database.dart';
          import 'package:body_intelligence_log/data/repositories/meal_repository.dart';
          import 'package:body_intelligence_log/features/nutrition/domain/gemini_vision_estimate.dart';
          import 'package:drift/native.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'gemini_vision_atomic_persistence_test.dart'
              as fixture;
          
          void main() {
            test(
              'owned actual repo stale cached request conflicts across days; current request saves and retries',
              () async {
                final directory = Directory.systemTemp.createTempSync('bil43-cache-proof-');
                final db = AppDatabase.forTesting(
                  NativeDatabase.createInBackground(
                    File('${directory.path}/nutrition.sqlite'),
                  ),
                  localOwnerId: fixture.owner,
                );
                try {
                  Future<int> save(
                    DateTime day,
                    String request,
                    GeminiVisionEstimate estimate,
                  ) => MealRepository(db).addGeminiVisionMealAtomically(
                    date: day,
                    mealType: 'lunch',
                    ownerId: fixture.owner,
                    requestId: request,
                    items: [
                      ReviewedGeminiVisionEstimate(
                        estimate: estimate,
                        amount: 150,
                        unit: 'g',
                      ),
                    ],
                    isCurrentOwner: () => true,
                  );
                  final prior = fixture.estimate();
                  await save(DateTime(2026, 11, 21), prior.requestId, prior);
                  await expectLater(
                    save(DateTime(2026, 11, 22), prior.requestId, prior),
                    throwsA(
                      isA<StateError>().having(
                        (e) => e.message,
                        'conflict',
                        contains('conflicting data'),
                      ),
                    ),
                  );
                  expect(await db.select(db.meals).get(), hasLength(1));
                  expect(await db.select(db.mealItems).get(), hasLength(1));
                  final fresh = GeminiVisionEstimate.fromJson({
                    ...prior.toJson(),
                    'requestId': 'synthetic_current_analysis_002',
                  });
                  final meal = await save(DateTime(2026, 11, 22), fresh.requestId, fresh);
                  expect(
                    await save(DateTime(2026, 11, 22), fresh.requestId, fresh),
                    meal,
                  );
                  expect(await db.select(db.meals).get(), hasLength(2));
                  expect(await db.select(db.mealItems).get(), hasLength(2));
                } finally {
                  await db.close();
                  await directory.delete(recursive: true);
                }
              },
            );
          }
          DART
          flutter test --no-pub --concurrency=1 test/features/nutrition/bil43_owned_cross_day_test.dart
