name: BIL Android signed STORE_QA_ONLY candidate (build 32)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Exact approved testing candidate build number; must be 32
        required: true
        type: string
      manifest_sha256:
        description: Owner-reviewed committed-byte SHA256 of the STORE_QA_ONLY control manifest
        required: true
        type: string
      run_native_crypto_checks:
        description: Run the Android-emulator AES-GCM bridge check for this candidate
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  BIL_RELEASE_PHASE: STORE_QA_ONLY
  BIL_STORE_QA_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  BIL_STORE_QA_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  signed-android-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require explicit testing-only source, digest and native gates
        shell: bash
        env:
          RUN_NATIVE_CRYPTO_CHECKS: ${{ inputs.run_native_crypto_checks }}
        run: |
          set -euo pipefail
          test "$BIL_RELEASE_PHASE" = STORE_QA_ONLY
          [[ "$BIL_STORE_QA_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'A full owner-reviewed STORE_QA_ONLY manifest digest is required.' >&2; exit 1; }
          test "$RUN_NATIVE_CRYPTO_CHECKS" = true || { echo 'Native crypto verification cannot be waived for this testing candidate.' >&2; exit 1; }

      - name: Checkout immutable tested application source, not legacy 31/34 bindings
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          persist-credentials: false

      - name: Checkout exact workflow controller separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify exact existing QA and owner-approved testing-only freeze
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          python3 control/tool/release/store_qa_release.py verify \
            --platform android --manifest control/docs/release/BIL_STORE_QA_CANDIDATE_2026-10-04.json \
            | tee BIL-store-qa-upstream-qa.txt

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Validate release build number
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo 'build_number must be a positive integer.' >&2
            exit 1
          }
          (( BUILD_NUMBER == 32 )) || {
            echo 'build_number must be exactly 32 for this testing-only freeze; never reuse protected build 31.' >&2
            exit 1
          }

      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
          PLAY_INTEGRITY_PROJECT_NUMBER: ${{ vars.BIL_PLAY_INTEGRITY_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo 'Missing GitHub secret: ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "${STORE_PASSWORD:-}" || { echo 'Missing GitHub secret: ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo 'Missing GitHub secret: ANDROID_KEY_ALIAS'; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo 'Missing GitHub secret: ANDROID_KEY_PASSWORD'; exit 1; }
          test -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" || { echo 'Missing GitHub secret: ANDROID_UPLOAD_CERTIFICATE_SHA256'; exit 1; }
          [[ "${MOBILE_INTEGRITY_BACKEND_RELEASE_ID:-}" =~ [^[:space:]] ]] || { echo 'OWNER_INPUT_REQUIRED: BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID (set only after the migration, app-attest/play-integrity functions, guarded functions, and production server configuration are verified)'; exit 1; }
          [[ "${PLAY_INTEGRITY_PROJECT_NUMBER:-}" =~ ^[1-9][0-9]+$ ]] || { echo 'OWNER_INPUT_REQUIRED: numeric BIL_PLAY_INTEGRITY_PROJECT_NUMBER repository variable from the Play-linked Cloud project'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo 'storeFile=app/upload-keystore.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Validate production configuration while retaining all eight open release reviews
        shell: bash
        env:
          BIL_RELEASE_PRODUCTION: true
          BIL_RELEASE_PLATFORM: android
          BIL_RELEASE_APPLICATION_ID: com.bilhealth.bodyintelligencelog
          BIL_USE_SUPABASE: true
          SUPABASE_URL: https://tgmanzhqulksykhslrzb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_eMoUVfgwfU0RpQOwPJr-yw_ZgtStgld
          BIL_RECEIPT_SERVER_URL: https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/verify-store-purchase
          BIL_PAYMENTS_ENABLED: true
          BIL_STORE_CONFIGURED: true
          BIL_FACEBOOK_REQUIRED: true
          BIL_FACEBOOK_LOGIN_ENABLED: true
          BIL_FACEBOOK_LOGIN_READY: true
          BIL_ADS_ENABLED: true
          BIL_AD_PROVIDER_READY: true
          BIL_ADMOB_PRODUCTION_READY: true
          BIL_ADMOB_PUBLISHER_ID: pub-9688223318643509
          BIL_ADMOB_ANDROID_APP_ID: ca-app-pub-9688223318643509~2357875410
          BIL_ADMOB_ANDROID_BANNER_ID: ca-app-pub-9688223318643509/9430375211
          BIL_ADMOB_IOS_APP_ID: ca-app-pub-9688223318643509~4090504347
          BIL_ADMOB_IOS_BANNER_ID: ca-app-pub-9688223318643509/6445204944
          BIL_PUSH_ENABLED: true
          BIL_PUSH_PROVIDER_READY: true
          BIL_MOBILE_INTEGRITY_REQUIRED: true
          BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
          BIL_PLAY_INTEGRITY_PROJECT_NUMBER: ${{ vars.BIL_PLAY_INTEGRITY_PROJECT_NUMBER }}
          BIL_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_AUDITED_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_COUNTERPART_AUDITED_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_RELEASE_EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 control/tool/release/store_qa_release.py configuration \
            --platform android --manifest control/docs/release/BIL_STORE_QA_CANDIDATE_2026-10-04.json \
            2>&1 | tee BIL-store-qa-configuration.txt

      - name: Enable KVM for the Android system-crypto gate
        if: ${{ inputs.run_native_crypto_checks }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native AES-GCM gate on Android emulator
        if: ${{ inputs.run_native_crypto_checks }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            flutter test --no-pub
            integration_test/system_crypto_bridge_integration_test.dart
            -d emulator-5554
            --timeout 10m

      - name: Exclude dev-only native plugins from Android release
        run: dart run tool/release/sanitize_flutter_release_plugins.dart --platform=android

      - name: Validate production AdMob configuration
        shell: bash
        env:
          BIL_ADMOB_PRODUCTION_READY: true
          BIL_ADMOB_PUBLISHER_ID: pub-9688223318643509
          BIL_ADMOB_ANDROID_APP_ID: ca-app-pub-9688223318643509~2357875410
          BIL_ADMOB_ANDROID_BANNER_ID: ca-app-pub-9688223318643509/9430375211
          BIL_ADMOB_IOS_APP_ID: ca-app-pub-9688223318643509~4090504347
          BIL_ADMOB_IOS_BANNER_ID: ca-app-pub-9688223318643509/6445204944
        run: |
          set -euo pipefail
          python3 tool/release/validate_admob_production_configuration.py \
            | tee BIL-android-production-admob-source.txt

      - name: Build signed Android App Bundle
        id: android_aab_build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLAY_INTEGRITY_PROJECT_NUMBER: ${{ vars.BIL_PLAY_INTEGRITY_PROJECT_NUMBER }}
          BIL_ADMOB_ANDROID_APP_ID: ca-app-pub-9688223318643509~2357875410
        run: >-
          flutter build appbundle --release --no-pub
          --build-name 1.0.0
          --build-number "$BUILD_NUMBER"
          --dart-define=BIL_ENVIRONMENT=production
          --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=true
          --dart-define=BIL_PLAY_INTEGRITY_PROJECT_NUMBER="$PLAY_INTEGRITY_PROJECT_NUMBER"
          --dart-define=BIL_PAYMENTS_ENABLED=true
          --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms
          --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy
          --dart-define=BIL_MEAL_VISION_ENDPOINT=https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/analyze-meal
          --dart-define=BIL_WELLNESS_MANIFEST_URL=https://workouts.bilhealth.com/v2/manifest/wellness-workouts-v2-af6082ff28856f9154216067f16fe6a7147548c9a29f8e205b43bb81bc34efe8.json
          --dart-define=BIL_RECIPE_IMAGE_DELIVERY_ENABLED=true
          --dart-define=BIL_FACEBOOK_LOGIN_ENABLED=true
          --dart-define=BIL_FACEBOOK_LOGIN_READY=true
          --dart-define=BIL_PUSH_ENABLED=true
          --dart-define=BIL_PUSH_PROVIDER_READY=true
          --dart-define=BIL_ADS_ENABLED=true
          --dart-define=BIL_AD_PROVIDER_READY=true
          --dart-define=BIL_ADMOB_PUBLISHER_ID=pub-9688223318643509
          --dart-define=BIL_ADMOB_ANDROID_APP_ID=ca-app-pub-9688223318643509~2357875410
          --dart-define=BIL_ADMOB_ANDROID_BANNER_ID=ca-app-pub-9688223318643509/9430375211
          --dart-define=BIL_ADMOB_IOS_APP_ID=ca-app-pub-9688223318643509~4090504347
          --dart-define=BIL_ADMOB_IOS_BANNER_ID=ca-app-pub-9688223318643509/6445204944
          --dart-define=BIL_ENABLE_CATALOG_TEST_ACCESS=false

      - name: Verify final AAB SDK, optional hardware, 16 KB packaging, and ELF alignment
        id: android_16k_gate
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          BUNDLETOOL_VERSION=1.18.3
          BUNDLETOOL_SHA256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          BUNDLETOOL_URL="https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          EVIDENCE_DIR=BIL-android-16k-evidence
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "BUNDLETOOL_VERSION=$BUNDLETOOL_VERSION"
            echo "BUNDLETOOL_URL=$BUNDLETOOL_URL"
            echo "EXPECTED_BUNDLETOOL_SHA256=$BUNDLETOOL_SHA256"
            echo 'BUNDLETOOL_DOWNLOAD_CHECKSUM_GATE=NOT_COMPLETED'
          } > "$EVIDENCE_DIR/BIL-android-bundletool-install.txt"
          test -s "$AAB" || {
            echo 'The final release AAB is missing or empty.' >&2
            exit 1
          }
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$BUNDLETOOL_JAR" "$BUNDLETOOL_URL"
          ACTUAL_BUNDLETOOL_SHA256="$(sha256sum "$BUNDLETOOL_JAR" | cut -d ' ' -f 1)"
          echo "ACTUAL_BUNDLETOOL_SHA256=$ACTUAL_BUNDLETOOL_SHA256" \
            >> "$EVIDENCE_DIR/BIL-android-bundletool-install.txt"
          test "$ACTUAL_BUNDLETOOL_SHA256" = "$BUNDLETOOL_SHA256" || {
            echo 'Pinned official bundletool checksum mismatch.' >&2
            exit 1
          }
          echo 'BUNDLETOOL_DOWNLOAD_CHECKSUM_GATE=PASS' \
            >> "$EVIDENCE_DIR/BIL-android-bundletool-install.txt"
          java -jar "$BUNDLETOOL_JAR" dump manifest \
            --bundle="$AAB" \
            --module=base \
            > "$EVIDENCE_DIR/BIL-android-base-manifest.xml"
          python3 - "$EVIDENCE_DIR/BIL-android-base-manifest.xml" "$BUILD_NUMBER" "$EVIDENCE_DIR/BIL-android-artifact-version.json" <<'PY'
          import json,pathlib,sys,xml.etree.ElementTree as ET
          manifest_path,expected_build,evidence_path=sys.argv[1:]
          manifest=ET.parse(manifest_path).getroot()
          android='{http://schemas.android.com/apk/res/android}'
          evidence={'package':manifest.get('package'),'version_name':manifest.get(android+'versionName'),'version_code':manifest.get(android+'versionCode')}
          if evidence != {'package':'com.bilhealth.bodyintelligencelog','version_name':'1.0.0','version_code':expected_build}:
              raise SystemExit('Final AAB package/version does not match the STORE_QA_ONLY freeze.')
          pathlib.Path(evidence_path).write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n')
          print('ANDROID_ARTIFACT_VERSION_GATE=PASS')
          PY
          BIL_ADMOB_PRODUCTION_READY=true \
          BIL_ADMOB_PUBLISHER_ID=pub-9688223318643509 \
          BIL_ADMOB_ANDROID_APP_ID=ca-app-pub-9688223318643509~2357875410 \
          BIL_ADMOB_ANDROID_BANNER_ID=ca-app-pub-9688223318643509/9430375211 \
          BIL_ADMOB_IOS_APP_ID=ca-app-pub-9688223318643509~4090504347 \
          BIL_ADMOB_IOS_BANNER_ID=ca-app-pub-9688223318643509/6445204944 \
          python3 tool/release/validate_admob_production_configuration.py \
            --android-manifest "$EVIDENCE_DIR/BIL-android-base-manifest.xml" \
            | tee "$EVIDENCE_DIR/BIL-android-production-admob.txt"
          python3 tool/release/verify_android_target_sdk.py \
            --manifest "$EVIDENCE_DIR/BIL-android-base-manifest.xml" \
            --text-evidence "$EVIDENCE_DIR/BIL-android-target-sdk.txt" \
            --json-evidence "$EVIDENCE_DIR/BIL-android-target-sdk.json"
          python3 tool/release/verify_android_optional_device_features.py \
            --manifest "$EVIDENCE_DIR/BIL-android-base-manifest.xml" \
            --text-evidence "$EVIDENCE_DIR/BIL-android-optional-hardware.txt" \
            --json-evidence "$EVIDENCE_DIR/BIL-android-optional-hardware.json"
          python3 tool/release/verify_android_16k_alignment.py \
            --aab "$AAB" \
            --bundletool "$BUNDLETOOL_JAR" \
            --bundletool-version "$BUNDLETOOL_VERSION" \
            --readelf readelf \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Upload final AAB platform evidence
        if: ${{ always() && steps.android_aab_build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-android-16k-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BIL-android-16k-evidence/BIL-android-bundletool-install.txt
            BIL-android-16k-evidence/BIL-android-base-manifest.xml
            BIL-android-16k-evidence/BIL-android-artifact-version.json
            BIL-android-16k-evidence/BIL-android-production-admob.txt
            BIL-android-16k-evidence/BIL-android-target-sdk.txt
            BIL-android-16k-evidence/BIL-android-target-sdk.json
            BIL-android-16k-evidence/BIL-android-optional-hardware.txt
            BIL-android-16k-evidence/BIL-android-optional-hardware.json
            BIL-android-16k-evidence/BIL-android-16k-bundletool.txt
            BIL-android-16k-evidence/BIL-android-16k-elf.txt
            BIL-android-16k-evidence/BIL-android-16k-summary.json

      - name: Capture release evidence
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > BIL-android-signature.txt
          ACTUAL_UPLOAD_CERT_SHA256="$(keytool -printcert -rfc -jarfile "$AAB" \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d '=' -f 2 \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_UPLOAD_CERT_SHA256"
          test "$ACTUAL_UPLOAD_CERT_SHA256" = "$EXPECTED_NORMALIZED" || {
            echo 'Signed AAB certificate does not match the expected Play upload certificate.' >&2
            exit 1
          }
          printf '%s\n' 'ANDROID_UPLOAD_CERTIFICATE_SHA256=MATCH' \
            > BIL-android-upload-certificate.txt
          sha256sum "$AAB" | tee BIL-android-aab.sha256
          stat --printf='%s\n' "$AAB" | tee BIL-android-aab.size
          git rev-parse HEAD | tee BIL-source-head.txt
          git -C control rev-parse HEAD | tee BIL-control-head.txt
          cp control/docs/release/BIL_STORE_QA_CANDIDATE_2026-10-04.json BIL-store-qa-manifest.json
          printf '%s\n' 'RELEASE_PHASE=STORE_QA_ONLY' 'PUBLIC_RELEASE_READY=NO' \
            'APP_REVIEW_SUBMISSION=NOT_AUTHORIZED' 'PRODUCTION_ROLLOUT=NOT_AUTHORIZED' \
            > BIL-store-qa-boundary.txt
          printf '%s\n' "BUILD_NUMBER=$BUILD_NUMBER" > BIL-build-number.txt

      - name: Reject forbidden bundled crypto implementations in signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          SCAN_DIR="$RUNNER_TEMP/bil-android-crypto-scan"
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          unzip -qq "$AAB" -d "$SCAN_DIR"
          if find "$SCAN_DIR" -type f -name '*.so' \
            -exec strings {} + 2>/dev/null \
            | grep -Eiq 'pointycastle|PcAESEngine|PcPBKDF2KeyDerivator|PcHMac|GCMBlockCipher|ZipCrypto'; then
            echo 'Forbidden non-OS crypto implementation marker found in signed AAB.' >&2
            exit 1
          fi
          printf '%s\n' 'SIGNED_AAB_FORBIDDEN_CRYPTO_MARKERS=0' \
            | tee BIL-android-crypto-scan.txt

      - name: Record code and physical-device gate boundary
        shell: bash
        env:
          RUN_NATIVE_CRYPTO_CHECKS: ${{ inputs.run_native_crypto_checks }}
        run: |
          if [[ "$RUN_NATIVE_CRYPTO_CHECKS" == 'true' ]]; then
            NATIVE_CRYPTO_GATE_STATUS='PASS'
          else
            NATIVE_CRYPTO_GATE_STATUS='NOT_RUN_OWNER_WAIVED'
          fi
          printf '%s\n' \
            'UPSTREAM_EXACT_SOURCE_QA=VERIFIED' \
            'RELEASE_PHASE=STORE_QA_ONLY' \
            'PUBLIC_RELEASE_READY=NO' \
            "NATIVE_CRYPTO_GATE=$NATIVE_CRYPTO_GATE_STATUS" \
            'FACEBOOK_LOGIN_COMPILED_GATE=ENABLED_AND_READY' \
            'FACEBOOK_LOGIN_SIGNED_DEVICE_GATE=REQUIRED' \
            'ADS_COMPILED_GATE=ENABLED_PRODUCTION' \
            'ADMOB_ANDROID_PRODUCTION_CONFIGURATION_GATE=PASS' \
            'ADMOB_ANDROID_UMP_AND_NATIVE_CONFIGURATION_GATE=REQUIRED_AND_CONFIGURED' \
            'MOBILE_INTEGRITY_CLIENT_GATE=ENABLED' \
            'MOBILE_INTEGRITY_BACKEND_GATE=OWNER_EVIDENCE_PRESENT_NOT_LIVE_VERIFIED' \
            'PHYSICAL_DEVICE_GATE=REQUIRED' \
            'PHYSICAL_DEVICE_SCOPE=Google Credential Manager sign-in and Meta native Facebook authorization with Supabase token exchange,Play Integrity JIT token/request binding/replay denial,Health Connect,Wear OS via Health Connect,fitness BLE,Play billing' \
            > BIL-android-gate-status.txt
          printf '%s\n' "NATIVE_CRYPTO_GATE=$NATIVE_CRYPTO_GATE_STATUS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release candidate
        id: signed_android_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-android-store-qa-aab-32-3f0085e6-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/bundle/release/app-release.aab
            BIL-android-signature.txt
            BIL-android-aab.sha256
            BIL-android-aab.size
            BIL-android-crypto-scan.txt
            BIL-android-upload-certificate.txt
            BIL-android-production-admob-source.txt
            BIL-android-gate-status.txt
            BIL-build-number.txt
            BIL-source-head.txt
            BIL-control-head.txt
            BIL-store-qa-manifest.json
            BIL-store-qa-boundary.txt
            BIL-store-qa-upstream-qa.txt
            BIL-store-qa-configuration.txt
            BIL-android-16k-evidence/

      - name: Record exact testing-only signed artifact identity
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          ARTIFACT_ID: ${{ steps.signed_android_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.signed_android_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          {
            printf '%s\n' 'RELEASE_PHASE=STORE_QA_ONLY' 'PUBLIC_RELEASE_READY=NO' 'OPEN_RELEASE_REVIEWS=8'
            printf 'APPLICATION_SOURCE_SHA=%s\n' "$(cat BIL-source-head.txt)"
            printf 'CONTROL_SOURCE_SHA=%s\n' "$(cat BIL-control-head.txt)"
            printf 'VERSION=1.0.0\nBUILD_NUMBER=%s\n' "$BUILD_NUMBER"
            printf 'SIGNED_AAB_SHA256=%s\n' "$(cut -d ' ' -f 1 BIL-android-aab.sha256)"
            printf 'ACTIONS_ARTIFACT_ID=%s\nACTIONS_ARCHIVE_DIGEST=%s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact verified AAB to Google Play testing only
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          BIL_RELEASE_PRODUCTION: true
          BIL_RELEASE_PLATFORM: android
          BIL_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_AUDITED_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_COUNTERPART_AUDITED_SOURCE_COMMIT: 3f0085e6e6686f2e87e9cf14789e9e578ea64159
          BIL_RELEASE_EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
          BIL_STORE_QA_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 control/tool/release/store_qa_release.py upload-play \
            --platform android \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --manifest control/docs/release/BIL_STORE_QA_CANDIDATE_2026-10-04.json \
            --owner-publishing-state-checked \
            | tee BIL-store-qa-play-upload.txt

      - name: Preserve Google Play testing upload receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-android-store-qa-upload-receipt-32-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: BIL-store-qa-play-upload.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties
