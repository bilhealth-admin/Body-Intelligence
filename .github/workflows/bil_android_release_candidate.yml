name: BIL Android43 immutable a3206fbd release controller
run-name: "Android43 app a3206fbd; separate controller provenance; no Play submission"
on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: Explicit signed artifact preparation only; no store upload
        type: boolean
        default: false
      expected_source_sha:
        description: Exact accepted application source SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: bil-android43-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  BIL_TESTED_SOURCE_SHA: a3206fbd6d53d66fd4cd39820cbdba684810d886
  BIL_SIGNING_ORCHESTRATION_SHA: ${{ github.sha }}
  BIL_RELEASE_BRANCH: codex/bil49-android41-native40-fixes-20261120
  BIL_ORIGINAL_SHA: 0c94cf2a75c01ebb7cbea74704a18a8109831194
jobs:
  affected-source:
    name: Source18 affected Android and Edge checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_signed_build == true && inputs.expected_source_sha == 'a3206fbd6d53d66fd4cd39820cbdba684810d886' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a3206fbd6d53d66fd4cd39820cbdba684810d886
          persist-credentials: false
      - name: Verify exact source and code tree
        run: |
          test "$(git rev-parse HEAD)" = a3206fbd6d53d66fd4cd39820cbdba684810d886
          test "$(git rev-parse 'HEAD^{tree}')" = cf8514390337f102631693c018525a3b2d86e863
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze changed Edge source with existing extended rules
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          upload: never
          output: ${{ runner.temp }}/bil43-sarif
      - name: Inspect affected CodeQL results without publishing SARIF
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,os,urllib.parse
          def resolve_location(loc, run):
              if 'index' in loc:
                  index=loc['index']
                  artifacts=run.get('artifacts',[])
                  if type(index) is not int or not 0<=index<len(artifacts):
                      raise ValueError('unresolved SARIF artifact index')
                  base=artifacts[index]['location']
                  if any(k in base and k in loc and base[k]!=loc[k] for k in ('uri','uriBaseId')):
                      raise ValueError('inconsistent SARIF artifact')
                  loc={**base,**loc}
              uri=loc.get('uri')
              if not isinstance(uri,str) or not uri: raise ValueError('missing SARIF artifact URI')
              visited=set()
              while (key:=loc.get('uriBaseId')) is not None:
                  if key in visited or key not in run.get('originalUriBaseIds',{}):
                      raise ValueError('unresolved or cyclic SARIF URI base')
                  visited.add(key)
                  loc=run['originalUriBaseIds'][key]
                  uri=urllib.parse.urljoin(loc['uri'],uri)
              return urllib.parse.unquote(uri)
          files=list((pathlib.Path(os.environ['RUNNER_TEMP'])/'bil43-sarif').rglob('*.sarif'))
          if not files: raise ValueError('CodeQL returned no SARIF')
          seen=0
          affected={'supabase/functions/analyze-meal/index.ts','supabase/functions/analyze-meal/cache_request_binding_test.ts'}
          for f in files:
              for run in json.loads(f.read_bytes())['runs']:
                  if not run['tool']['driver']['name'].lower().startswith('codeql'): raise ValueError('unexpected scanner')
                  seen+=1
                  for result in run.get('results',[]):
                      if not result.get('locations'): raise ValueError('unlocated SARIF result')
                      for loc in result['locations']:
                          uri=resolve_location(loc.get('physicalLocation',{}).get('artifactLocation',{}),run)
                          if any(uri==name or uri.endswith('/'+name) for name in affected):
                              raise ValueError('security finding affecting reviewed Edge file; inspect privately')
          if not seen: raise ValueError('no CodeQL run')
          PY
      - name: Scan affected source with original Semgrep rules
        shell: bash
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bil43-semgrep"
          "$RUNNER_TEMP/bil43-semgrep/bin/pip" install --disable-pip-version-check 'semgrep==1.181.0'
          "$RUNNER_TEMP/bil43-semgrep/bin/semgrep" scan --config p/security-audit --config p/secrets --jobs 2 --timeout 60 --timeout-threshold 0 --metrics off --disable-version-check --error --strict --json --output "$RUNNER_TEMP/bil43-semgrep.json" lib/features/commerce/services/verified_store_purchase_restore.dart test/features/commerce/store_android_unscoped_checkout_failure_test.dart supabase/functions/analyze-meal/index.ts supabase/functions/analyze-meal/cache_request_binding_test.ts
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: Run all five current request binding cases
        run: |
          set -euo pipefail
          NO_COLOR=1 deno test --no-config --allow-read supabase/functions/analyze-meal/cache_request_binding_test.ts | tee "$RUNNER_TEMP/bil43-deno.log"
          grep -Eq '5 passed.*0 failed' "$RUNNER_TEMP/bil43-deno.log"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify changed Dart formatting and affected purchase paths
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/features/commerce/services/verified_store_purchase_restore.dart test/features/commerce/store_android_unscoped_checkout_failure_test.dart
          flutter test --no-pub --concurrency=1 --dart-define=BIL_PAYMENTS_ENABLED=true --machine test/features/commerce/store_android_unscoped_checkout_failure_test.dart test/features/commerce/bil_store_plans_dynamic_contract_test.dart test/features/commerce/plans_restore_neutral_outcomes_test.dart > "$RUNNER_TEMP/bil43-owned-flutter.jsonl"
          python3 tools/qa/bil39_flutter_event_receipt.py --log "$RUNNER_TEMP/bil43-owned-flutter.jsonl" --source-sha a3206fbd6d53d66fd4cd39820cbdba684810d886 --test-exit 0 --output "$RUNNER_TEMP/bil43-owned-flutter.json"
          python3 - <<'PY'
          import json,pathlib,os
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'bil43-owned-flutter.json').read_bytes())
          if r['counts']!={'success':93,'failure':0,'error':0,'skip':0}: raise ValueError('original 93 owning/UI cases did not pass')
          cases={'store_android_unscoped_checkout_failure_test.dart':51,'bil_store_plans_dynamic_contract_test.dart':36,'plans_restore_neutral_outcomes_test.dart':6}
          if r['files']!={'test/features/commerce/'+name:{'success':count} for name,count in cases.items()}: raise ValueError('affected case inventory mismatch')
          PY
      - name: Replay actual repository cross-day conflict, fresh save and deduplication
        run: |
          set -euo pipefail
          test ! -e test/features/nutrition/bil43_owned_cross_day_test.dart
          cat > test/features/nutrition/bil43_owned_cross_day_test.dart <<'DART'
          import 'dart:io';
          import 'package:body_intelligence_log/data/database/app_database.dart';
          import 'package:body_intelligence_log/data/repositories/meal_repository.dart';
          import 'package:body_intelligence_log/features/nutrition/domain/gemini_vision_estimate.dart';
          import 'package:drift/native.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'gemini_vision_atomic_persistence_test.dart'
              as fixture;
          
          void main() {
            test(
              'owned actual repo stale cached request conflicts across days; current request saves and retries',
              () async {
                final directory = Directory.systemTemp.createTempSync('bil43-cache-proof-');
                final db = AppDatabase.forTesting(
                  NativeDatabase.createInBackground(
                    File('${directory.path}/nutrition.sqlite'),
                  ),
                  localOwnerId: fixture.owner,
                );
                try {
                  Future<int> save(
                    DateTime day,
                    String request,
                    GeminiVisionEstimate estimate,
                  ) => MealRepository(db).addGeminiVisionMealAtomically(
                    date: day,
                    mealType: 'lunch',
                    ownerId: fixture.owner,
                    requestId: request,
                    items: [
                      ReviewedGeminiVisionEstimate(
                        estimate: estimate,
                        amount: 150,
                        unit: 'g',
                      ),
                    ],
                    isCurrentOwner: () => true,
                  );
                  final prior = fixture.estimate();
                  await save(DateTime(2026, 11, 21), prior.requestId, prior);
                  await expectLater(
                    save(DateTime(2026, 11, 22), prior.requestId, prior),
                    throwsA(
                      isA<StateError>().having(
                        (e) => e.message,
                        'conflict',
                        contains('conflicting data'),
                      ),
                    ),
                  );
                  expect(await db.select(db.meals).get(), hasLength(1));
                  expect(await db.select(db.mealItems).get(), hasLength(1));
                  final fresh = GeminiVisionEstimate.fromJson({
                    ...prior.toJson(),
                    'requestId': 'synthetic_current_analysis_002',
                  });
                  final meal = await save(DateTime(2026, 11, 22), fresh.requestId, fresh);
                  expect(
                    await save(DateTime(2026, 11, 22), fresh.requestId, fresh),
                    meal,
                  );
                  expect(await db.select(db.meals).get(), hasLength(2));
                  expect(await db.select(db.mealItems).get(), hasLength(2));
                } finally {
                  await db.close();
                  await directory.delete(recursive: true);
                }
              },
            );
          }
          DART
          flutter test --no-pub --concurrency=1 test/features/nutrition/bil43_owned_cross_day_test.dart
