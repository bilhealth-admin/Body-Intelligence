name: BIL global barcode coverage QA
on:
  push:
    branches: [feat/foods-arabic-recipes-25-locales-20261005]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  barcode-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Barcode handler and provider contract regressions
        run: deno test --allow-env supabase/functions/barcode-lookup/coverage_test.ts
      - name: Preserve all existing recipe content
        run: python3 tool/catalog/audit_recipe_locale_coverage.py
      - name: Ensure no native version, dependency or release workflow changes
        run: |
          git fetch --depth=1 origin d97cbd119722d92ec83be55a5c9dc03c07887282
          git diff --exit-code d97cbd119722d92ec83be55a5c9dc03c07887282 -- android ios pubspec.yaml pubspec.lock assets/catalogs/recipes .github/workflows/bil_ios_signed_release.yml .github/workflows/bil_android_release_candidate.yml
