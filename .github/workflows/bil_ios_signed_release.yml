      - name: Verify every carrier and execute exact original three-file bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BIL_COMPLETE'
          import base64, hashlib, os, re, zlib
          from pathlib import Path
          BIL47_CHUNKS = [{'index': 0, 'name': 'bil47-exact-gate-bootstrap-000.chunk', 'bytes': 12000, 'sha256': 'b05601511997dec433a086c99cb4bd2d9fc6284c86f3c314d14ee56288b7458e'}, {'index': 1, 'name': 'bil47-exact-gate-bootstrap-001.chunk', 'bytes': 12000, 'sha256': '850a3c50ba37c798d9171adaa8426d9292685aaedc6e7d91d941c50898062862'}, {'index': 2, 'name': 'bil47-exact-gate-bootstrap-002.chunk', 'bytes': 12000, 'sha256': '69b0fd44f019af6b0fc82228ac9da8860d0d92bf9fbb75ccd8b7715e07386d94'}, {'index': 3, 'name': 'bil47-exact-gate-bootstrap-003.chunk', 'bytes': 12000, 'sha256': '71043804fa9e43d876e7800d1fba98e5f082da22ad56b60ec6f2ea4499962914'}, {'index': 4, 'name': 'bil47-exact-gate-bootstrap-004.chunk', 'bytes': 12000, 'sha256': '5783674ec496867cda9b96a0b8eee75f3481a32f669aab73903e7d2c4d7ba193'}, {'index': 5, 'name': 'bil47-exact-gate-bootstrap-005.chunk', 'bytes': 9916, 'sha256': 'af02a15ac316a1e3f4241af8b3f0f17cd99a25115e36315ed11a1149894dbbe0'}]
          BIL47_CHUNK_COUNT = 6
          BIL47_ENCODED_BYTES = 69916
          BIL47_PACKED_SHA256 = '0c06e4fa40394f7520b286f9bb8b811c2f9b237d719db3151c20596c0831f3c9'
          BIL47_BOOTSTRAP_BYTES = 68675
          BIL47_BOOTSTRAP_SHA256 = '74e21785194a0cdd97cc0773b4ad3d21a1d4f0ad5ca7911df49626709f8423e3'
          assert isinstance(BIL47_CHUNKS, list) and len(BIL47_CHUNKS) == BIL47_CHUNK_COUNT
          assert 0 < BIL47_CHUNK_COUNT <= 64
          assert 0 < BIL47_BOOTSTRAP_BYTES <= 4 * 1024 * 1024
          root_input = Path(os.environ['RUNNER_TEMP'])
          assert root_input.is_absolute() and root_input.is_dir() and not root_input.is_symlink()
          assert not (getattr(os.lstat(root_input), 'st_file_attributes', 0) & 0x400)
          root = root_input.resolve(strict=True)
          parts = []
          for index, descriptor in enumerate(BIL47_CHUNKS):
              assert isinstance(descriptor, dict) and set(descriptor) == {'index', 'name', 'bytes', 'sha256'}
              assert type(descriptor['index']) is int and descriptor['index'] == index
              name = descriptor['name']
              assert name == f'bil47-exact-gate-bootstrap-{index:03d}.chunk'
              assert type(descriptor['bytes']) is int and 0 < descriptor['bytes'] <= 12000
              assert re.fullmatch('[a-f0-9]{64}', descriptor['sha256'])
              path = root / name
              assert path.parent == root and path.is_file() and not path.is_symlink()
              assert not (getattr(os.lstat(path), 'st_file_attributes', 0) & 0x400)
              assert path.resolve(strict=True).parent == root and path.stat().st_size == descriptor['bytes']
              with path.open('rb') as source:
                  part = source.read(descriptor['bytes'] + 1)
              assert len(part) == descriptor['bytes']
              assert hashlib.sha256(part).hexdigest() == descriptor['sha256']
              parts.append(part)
          encoded = b''.join(parts)
          assert len(encoded) == BIL47_ENCODED_BYTES
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == BIL47_PACKED_SHA256
          unpacker = zlib.decompressobj()
          raw = unpacker.decompress(packed, BIL47_BOOTSTRAP_BYTES + 1)
          assert unpacker.eof and not unpacker.unused_data and not unpacker.unconsumed_tail
          assert len(raw) == BIL47_BOOTSTRAP_BYTES
          assert hashlib.sha256(raw).hexdigest() == BIL47_BOOTSTRAP_SHA256
          exec(compile(raw.decode('utf-8'), '<verified-bil47-bootstrap>', 'exec'))
          PY_BIL_COMPLETE
      - name: Require strict exact-source full-ten-lane prerequisites and separate controller before credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bil47_fresh_source_gate.py" --platform ios --config "$RUNNER_TEMP/bil47_fresh_source_pins.json" --cloud-receipt "$RUNNER_TEMP/bil47_current_cloud_parity.json"
      - name: Require both original Xcode 27.2 native QA ZIPs before signing credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BIL27_REVIEWED_NATIVE_BINDINGS: '{"iphone":[44980774988,14739128384,"a82e1856660fb454aff1b56e586a7cd6e017975f","931c703d8393aa763415063ed991e3d17f4253d6f0e6e1a14596c9c647a2f847",561500597,"d1b03dbcb9d87cd99d0470fb4a0e3f2377e7ff5ad3313404d2560192976fc50c"],"ipad":[44980979438,14740435026,"99bf65c8ab04f5f69bf272e9bc0d620fa722f535","d57638c06c1d00422dd48b66de5a00d4ae9656ee5a0f068a3b0e8523a7d42300",824495032,"2b08ed3e785e0bd71b0b16dfac9807ed0e4825df50c5ac4a3fb03b6e13d48379"]}'
        run: |
          set -euo pipefail
          python3 -B - <<'PY_NATIVE27'
          """Validate both reviewed real Xcode 27.2 QA runs before signing credentials."""
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile
          
          SOURCE = '6c0dfbab576e797d24b42310e9194db2f1664188'
          TREE = 'bc22c3881ecc5cad8f3ee78d0a784de9e246e1a0'
          REPO = 'bilhealth-admin/Body-Intelligence'
          WORKFLOW = '.github/workflows/bil_ios_signed_release.yml'
          ROOT = pathlib.Path.cwd()
          sys.path.insert(0, str(ROOT / 'tools/qa'))
          sys.path.insert(0, str(ROOT / '.github/scripts'))
          import bil_native_source_evidence as native
          import bil39_native_receipts as receipts
          
          
          def require(ok, message):
              if not ok:
                  raise ValueError(message)
          
          
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{REPO}/{path}']))
          
          
          def verify(device, binding):
              run, artifact, controller, digest, size, workflow_digest = binding
              require(all(type(n) is int and n > 0 for n in (run, artifact, size)) and size <= native.MAX_ARCHIVE, 'Original bounded run artifact required')
              require(re.fullmatch('[a-f0-9]{40}', controller) and controller != SOURCE
                      and all(re.fullmatch('[a-f0-9]{64}', h) for h in (digest, workflow_digest)), 'Actual digests required')
              branch = {'iphone':'codex/bil-ios50-finalS17-xcode27-iphone-qa-20261122', 'ipad':'codex/bil-ios50-finalS17-xcode27-ipad-qa-20261122'}[device]
              info = api(f'actions/runs/{run}')
              require(info['id'] == run and info['head_sha'] == controller and info['head_branch'] == branch
                      and info['path'] == WORKFLOW and info['event'] == 'workflow_dispatch' and info['run_attempt'] == 1
                      and info['repository']['full_name'] == REPO and (info['status'], info['conclusion']) == ('completed', 'success'), 'Actual completed QA controller run required')
              jobs = api(f'actions/runs/{run}/attempts/1/jobs?per_page=100')
              require(jobs['total_count'] == len(jobs['jobs']) == 1, 'Exactly one native job')
              job = jobs['jobs'][0]
              require(job['run_id'] == run and job['run_attempt'] == 1 and job['head_sha'] == controller
                      and job['name'] == 'Native iOS source QA (' + device + ')' and job['conclusion'] == 'success', 'Dedicated successful native job required')
              steps = {s['name']: s['conclusion'] for s in job['steps']}
              for name in ('Drive all native scopes on dedicated iOS', 'Bind actual simulator runtime and SDK', 'Upload exact iOS native evidence'):
                  require(steps.get(name) == 'success', 'Missing completed step ' + name)
              meta = api(f'actions/artifacts/{artifact}')
              require(meta['id'] == artifact and meta['digest'] == 'sha256:' + digest and meta['size_in_bytes'] == size
                      and meta['expired'] is False and meta['name'] == f'bil-native27-{device}-{SOURCE}-r{run}-a1'
                      and meta['workflow_run']['id'] == run and meta['workflow_run']['head_sha'] == controller
                      and meta['workflow_run']['head_branch'] == branch, 'Original QA artifact binding')
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temp:
                  archive = pathlib.Path(temp) / 'original.zip'
                  with archive.open('xb') as out:
                      subprocess.run(['gh', 'api', f'repos/{REPO}/actions/artifacts/{artifact}/zip'], stdout=out, check=True)
                  with archive.open('rb') as data:
                      h = hashlib.sha256()
                      while block := data.read(1048576):
                          h.update(block)
                  require(archive.stat().st_size == size and h.hexdigest() == digest, 'Original downloaded ZIP')
                  with zipfile.ZipFile(archive) as z:
                      members = native._archive_members(z)
                      def raw(name):
                          return z.read(members[name])
                      for scene in ('ar-light-normal', 'ar-light-reduced', 'en-light-normal', 'en-light-reduced'):
                          for mode in ('history', 'reveal'):
                              name = f'{device}-feature-splashes-device-feature-splashes-native/coach-{mode}-{scene}-metadata.json'
                              sample = json.loads(raw(name))
                              require(sample['completed'] is True and sample['scene'] == scene and sample['mode'] == mode
                                      and sample['text_scale'] == 2 and sample['source_head'] == SOURCE and sample['source_fingerprint'] == TREE
                                      and sample['platform'] == 'ios' and sample['real_model_calls'] == sample['real_credits_spent'] == 0,
                                      'Actual completed 2x source-bound Coach case')
                              if mode == 'reveal':
                                  first = sample['first_nonempty_native_frame']
                                  require(0 <= first['observed_at_ms'] - sample['held_reply_released_at_ms'] <= 1500
                                          and first['native_height_ready'] is True and first['arrival_present'] is True
                                          and first['visible_graphemes'] >= 8 and first['first_content_visible_area'] > 0
                                          and first['reply_opacity'] > 0 and first['native_first_block'], 'Actual readable first native frame')
                      prov = json.loads(raw('controller-provenance.json'))
                      require(prov['device'] == device and prov['application_source_sha'] == SOURCE
                              and prov['application_source_tree'] == TREE and prov['controller_sha'] == controller
                              and prov['controller_workflow_sha256'] == workflow_digest and prov['run_id'] == str(run)
                              and prov['run_attempt'] == '1' and prov['caller_ref'] == 'refs/heads/' + branch
                              and prov['source_scope_hashes'] == native.native_source_pins(ROOT, device), 'Actual source and QA controller bytes')
                      require(raw('xcode-version.txt').decode().strip() == 'Xcode 27.2\nBuild version 27B52'
                              and raw('selected-device.txt').decode().split()[0] == 'com.apple.CoreSimulator.SimRuntime.iOS-27-2'
                              and raw('verified-simulator-sdk.txt').decode().strip() == '27.2', 'Actual selected runtime and SDK')
                      names = ['runner-tests/runner-tests-result.json', 'runner-tests/runner-tests-summary.json', 'runner-tests/runner-tests.log']
                      for scope in receipts.KINDS:
                          names.extend([f'{device}-{scope}-drive-result.json', f'{device}-{scope}.log'])
                      extracted = pathlib.Path(temp) / 'bounded-evidence'
                      for name in names:
                          target = extracted / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(raw(name))
                      final = receipts.verify(extracted, label=device, sha=SOURCE, source_root=ROOT)
                      require(final == json.loads(raw('native-complete-result.json')) and final['xctest']['totalTestCount'] == 20
                              and hashlib.sha256(raw('crypto-driver.dart')).hexdigest() == native.CRYPTO_DRIVER_SHA256, 'Full native completion and all named XCTests')
              return {'device':device, 'controller_sha':controller, 'controller_workflow_sha256':workflow_digest,
                      'run_id':run, 'run_attempt':1, 'artifact_id':artifact, 'zip_sha256':digest, 'zip_bytes':size}
          
          
          def main():
              bindings = json.loads(os.environ['BIL27_REVIEWED_NATIVE_BINDINGS'])
              require(set(bindings) == {'iphone', 'ipad'} and all(type(x) is list and len(x) == 6 for x in bindings.values()), 'Both reviewed real native binding rows required')
              require(all(len({row[i] for row in bindings.values()}) == 2 for i in (0, 1, 2, 3, 5)), 'Independent device runs, artifacts and controllers')
              rows = [verify(device, bindings[device]) for device in ('iphone','ipad')]
              pathlib.Path('BIL50-native27-original-pair.json').write_text(json.dumps({'source':SOURCE, 'tree':TREE, 'xcode':'27.2', 'build':'27B52', 'devices':rows}, indent=2)+'\n', encoding='utf8')
          
          
          if __name__ == '__main__':
              main()
          
          
          PY_NATIVE27
      - name: Select stable Xcode 27.2 build 27B52 and verify iOS SDK 27.2
        id: apple_toolchain_gate
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          for sdk in iphoneos iphonesimulator; do
            case "$(xcrun --sdk "$sdk" --show-sdk-path)" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
          python3 tool/release/verify_apple_release_toolchain.py \
            --text-evidence BIL-apple-release-toolchain.txt \
            --json-evidence BIL-apple-release-toolchain.json

      - name: Upload Apple toolchain version evidence
        if: ${{ always() && steps.apple_toolchain_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios50-preview-toolchain-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BIL-apple-release-toolchain.txt
            BIL-apple-release-toolchain.json

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Validate release build number and Apple team
        shell: bash
        env:
          BUILD_NUMBER: '50'
          UPLOAD_TO_TESTFLIGHT: 'false'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo 'build_number must be a positive integer.' >&2
            exit 1
          }
          (( BUILD_NUMBER == 50 )) || {
            echo 'build_number must be exactly 50 for the iOS release candidate; build 36 and earlier must never be selected.' >&2
            exit 1
          }
          [[ "$UPLOAD_TO_TESTFLIGHT" == 'true' || "$UPLOAD_TO_TESTFLIGHT" == 'false' ]] || {
            echo 'upload_to_testflight must be a boolean.' >&2
            exit 1
          }
          test -n "${APPLE_TEAM_ID:-}" || {
            echo 'OWNER_INPUT_REQUIRED: APPLE_TEAM_ID' >&2
            exit 1
          }
