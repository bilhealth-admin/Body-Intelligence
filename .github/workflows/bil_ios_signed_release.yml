name: BIL Xcode 27.2 runtime image and help metadata only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-ios50-xcode27-runtime-readonly
  cancel-in-progress: false
jobs:
  host-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/codex/bil-ios50-xcode27-runtime-image-help-readonly-20261121' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - name: Record host-only controller context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mkdir -p "$RUNNER_TEMP/bil-native27-host"
          python3 - <<'PY_CONTEXT'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil-native27-host'
          data={k:os.environ.get(k) for k in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_WORKFLOW_REF','GITHUB_WORKFLOW_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','DEVELOPER_DIR']}
          assert data['GITHUB_REPOSITORY']=='bilhealth-admin/Body-Intelligence'
          assert data['GITHUB_REF']=='refs/heads/codex/bil-ios50-xcode27-runtime-image-help-readonly-20261121'
          assert data['GITHUB_WORKFLOW_SHA']==data['GITHUB_SHA']
          data.update(scope='HOST_TOOLS_AND_SIMULATOR_METADATA_ONLY',expected_controller_parent='a626536de190099969fc8a12e9df90abe4b4ac8d',application_checkout_performed=False,application_source_or_native_acceptance=False)
          (root/'controller-context.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY_CONTEXT
      - name: Select stable Xcode 27.2 build 27B52 and verify both SDKs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bil-native27-host"
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          xcodebuild -version | tee "$out/xcode-version.txt"
          test "$(cat "$out/xcode-version.txt")" = $'Xcode 27.2\nBuild version 27B52'
          xcrun --sdk iphoneos --show-sdk-version | tee "$out/iphoneos-sdk-version.txt"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$out/iphonesimulator-sdk-version.txt"
          test "$(cat "$out/iphoneos-sdk-version.txt")" = 27.2
          test "$(cat "$out/iphonesimulator-sdk-version.txt")" = 27.2
          for sdk in iphoneos iphonesimulator; do
            xcrun --sdk "$sdk" --show-sdk-path | tee "$out/$sdk-sdk-path.txt"
            case "$(cat "$out/$sdk-sdk-path.txt")" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
      - name: Capture complete original simulator metadata and selected maximum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUNTIMES'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil-native27-host'
          commands=[('runtimes-available',['xcrun','simctl','list','runtimes','available','-j']),('runtimes-all',['xcrun','simctl','list','runtimes','-j']),('device-types',['xcrun','simctl','list','devicetypes','-j']),('runtime-images',['xcrun','simctl','runtime','list','-j']),('runtime-help',['xcrun','simctl','help','runtime']),('runtime-delete-help',['xcrun','simctl','runtime','help','delete'])]
          exits={}
          for name,argv in commands:
              suffix='.txt' if name in {'runtime-help','runtime-delete-help'} else '.json'
              try:
                  result=subprocess.run(argv,capture_output=True,timeout=60)
                  (root/(name+suffix)).write_bytes(result.stdout)
                  (root/(name+'.stderr.txt')).write_bytes(result.stderr)
                  exits[name]=result.returncode
                  print(name+' original stdout:\n'+result.stdout.decode(errors='replace'))
                  print(name+' original stderr:\n'+result.stderr.decode(errors='replace'))
              except subprocess.TimeoutExpired as error:
                  (root/(name+suffix)).write_bytes(error.stdout or b'')
                  (root/(name+'.stderr.txt')).write_bytes(error.stderr or b'')
                  exits[name]='TIMEOUT_60S'
          (root/'metadata-command-status.json').write_text(json.dumps(exits,indent=2)+'\n')
          if any(exits[name]!=0 for name in ['runtimes-available','runtimes-all','device-types','runtime-images']):
              raise SystemExit('Metadata command failed; original output/status preserved; no runtime change')
          runtimes=json.loads((root/'runtimes-available.json').read_text())['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and
                 item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime; original JSON preserved')
          runtime = max(ios, key=lambda item: tuple(map(int, re.findall(r'\d+', item['version']))))
          fields=lambda item:{k:item.get(k) for k in ['identifier','name','version','buildversion','isAvailable','availabilityError','availability']}
          all_entries=json.loads((root/'runtimes-all.json').read_text())['runtimes']
          result={'scope':'OBSERVATION_ONLY_NO_RUNTIME_MODIFICATION','available_ios_sorted':[fields(item) for item in sorted(ios,key=lambda item:tuple(map(int,re.findall(r'\d+',item['version']))))],'selected_by_unchanged_native_MAX':fields(runtime),'unavailable_or_error_entries':[fields(item) for item in all_entries if not item.get('isAvailable') or item.get('availabilityError')],'matches_required27_2':runtime['identifier']=='com.apple.CoreSimulator.SimRuntime.iOS-27-2'}
          (root/'runtime-selection-observation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['matches_required27_2']:
              raise SystemExit('Observed selected MAX is not iOS 27.2; metadata preserved; QA requirements unchanged')
          PY_RUNTIMES
      - name: Preserve only original host metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-native27-runtime-image-help-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bil-native27-host
          if-no-files-found: error
          retention-days: 14

