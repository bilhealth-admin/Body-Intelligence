      - name: Record code and physical-device gate boundary
        shell: bash
        run: |
          printf '%s\n' \
            'CODE_GATE=SIGNED_IPA_ARTIFACT_ONLY' \
            'FACEBOOK_LOGIN_COMPILED_GATE=SUPABASE_BROWSER_OAUTH_SOURCE_PRESENT' \
            'FACEBOOK_LOGIN_SIGNED_DEVICE_GATE=REQUIRED' \
            'ADS_COMPILED_GATE=ENABLED_PRODUCTION' \
            'ADMOB_IOS_PRODUCTION_CONFIGURATION_GATE=PASS' \
            'ADMOB_IOS_UMP_CONFIGURATION_GATE=SOURCE_CONFIG_VALIDATED' \
            'ADMOB_IOS_NATIVE_SDK_ARTIFACT_GATE=NOT_VERIFIED_IN_IPA_BY_THIS_JOB' \
            'IOS_STARTUP_DEVICE_GATE=REQUIRED_AFTER_OWNER_INSTALL_OR_UPLOAD' \
            'MOBILE_INTEGRITY_CLIENT_GATE=ENABLED' \
            'MOBILE_INTEGRITY_BACKEND_GATE=OWNER_EVIDENCE_PRESENT_NOT_LIVE_VERIFIED' \
            'PHYSICAL_DEVICE_GATE=REQUIRED' \
            'PHYSICAL_DEVICE_SCOPE=Facebook OAuth browser flow and Supabase token exchange,App Attest JIT registration/assertion/replay denial,HealthKit,Apple Watch via HealthKit,StoreKit sandbox,AdMob consent and served ad review' \
            'TESTFLIGHT=NOT_RUN' \
            > BIL-ios-gate-status.txt

      - name: Generate signed IPA-only receipt after codesign and entitlements PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIL_TESTED_SOURCE_SHA"
          grep -Fq 'SIGNED_IPA_CODESIGN_GATE=PASS' BIL-ios-codesign-verify.txt
          grep -Fq 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' BIL-ios-crypto-scan.txt
          test -s BIL-ios-final-artifact-inventory.json
          test -s BIL-ios-entitlements.plist
          test -s BIL-ios-embedded-profile.plist
          test -s BIL-ios-ipa.sha256
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          files=list(pathlib.Path('build/ios/ipa').glob('*.ipa'))
          if len(files)!=1 or not files[0].is_file() or files[0].stat().st_size<=0:
              raise SystemExit('Exactly one signed IPA required')
          digest=hashlib.sha256(files[0].read_bytes()).hexdigest()
          if pathlib.Path('BIL-ios-ipa.sha256').read_text().split()[0]!=digest:
              raise SystemExit('IPA hash readback mismatch')
          githead=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if githead!=os.environ['BIL_TESTED_SOURCE_SHA']:
              raise SystemExit('Built source differs from audited candidate')
          native_status='PASS'
          if ('NATIVE_CRYPTO_RUNTIME_GATE='+native_status) not in pathlib.Path('BIL-ios-native-crypto-gate.txt').read_text():
              raise SystemExit('Native runtime evidence scope mismatch')
          pathlib.Path('BIL-ios-build-only-receipt.json').write_text(json.dumps({
              'status':'SIGNED_IPA_BUILT_AND_LOCALLY_VERIFIED','source_sha':githead,
              'workflow_sha':os.environ['GITHUB_SHA'],'build':50,
              'validation_mode':os.environ['BIL_VALIDATION_MODE'],'public_release_approved':False,
              'native_crypto_runtime_status':native_status,
              'ipa_sha256':digest,'ipa_bytes':files[0].stat().st_size,
              'testflight_upload':'NOT_RUN','app_store_connect':'NOT_RUN',
              'production_deploy':'NOT_RUN','physical_device':'NOT_RUN',
              'release_certification':'NOT_CLAIMED'
          },indent=2)+'\n')
          print('SIGNED_IPA_BUILD_ONLY_PASS; NO_TESTFLIGHT_UPLOAD')
          PY

      - name: Stage the reviewed original-symbol verifier without changing app source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ORIGINAL_SYMBOL_VERIFIER'
          import base64,hashlib,os,pathlib,zlib
          base=pathlib.Path('tool/release/verify_ios48_symbol_binding.py')
          assert hashlib.sha256(base.read_bytes()).hexdigest()=='2bfe7189c1d0fbad4769bd73105860f703adc5e4c651b2b07cda0b20f84d9b87'
          raw=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='491fd405021b98934be2e37776ee83c768b0bf4ac6522e08b474dfc9e052b14f'
          for destination in (pathlib.Path(os.environ['RUNNER_TEMP'])/'verify_ios50_original_symbol_aliases.py',pathlib.Path('BIL-ios50-symbol-verifier.py')):
              assert not destination.exists() and not destination.is_symlink()
              with destination.open('xb') as f:f.write(raw)
          PY_ORIGINAL_SYMBOL_VERIFIER

      - name: Bind original archive dSYMs to the exported IPA
        id: ios50_symbol_binding
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/archive/Runner.xcarchive
          ditto -c -k --keepParent build/ios/archive/Runner.xcarchive BIL-ios50-original.xcarchive.zip
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          python3 "$RUNNER_TEMP/verify_ios50_original_symbol_aliases.py" --archive build/ios/archive/Runner.xcarchive \
            --archive-zip BIL-ios50-original.xcarchive.zip --ipa "$IPA_PATH" \
            --source "$BIL_TESTED_SOURCE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output BIL-ios50-symbol-binding.json \
            --diagnostics BIL-ios50-symbol-diagnostics.json

      - name: Upload signed IPA and validation evidence
        id: signed_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios50-signed-only-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/ipa/*.ipa
            BIL-ios50-original.xcarchive.zip
            BIL-ios50-symbol-binding.json
            BIL-ios50-symbol-diagnostics.json
            BIL-ios50-symbol-verifier.py
            BIL-ios-codesign.txt
            BIL-ios-codesign-verify.txt
            BIL-ios-entitlements.plist
            BIL-ios-final-artifact-inventory.json
            BIL-ios-final-icon-inventory.json
            BIL-ios-embedded-profile.plist
            BIL-ios-ipa.sha256
            BIL-ios-ipa.size
            BIL-ios-crypto-scan.txt
            BIL-ios-native-crypto-gate.txt
            BIL-ios-production-admob-source.txt
            BIL-ios-production-admob.txt
            BIL-ios-production-admob-plugin-graph.txt
            BIL-ios-gate-status.txt
            BIL-build-number.txt
            BIL-source-head.txt
            BIL-ios-build-only-receipt.json
            BIL-ios50-storekit-native-binding-before-ipa.json
            BIL-ios50-storekit-native-binding-after-ipa.json
            BIL50-pre-signing-ci.json
            BIL50-internal-acceptance.md
            BIL50-native27-original-pair.json
            BIL50-signing-manifest-proof.json
            BIL-apple-release-toolchain.txt
            BIL-apple-release-toolchain.json

      - name: Preserve original generated Pod compatibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios50-generated-pods-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bil-sdk27-pod-evidence
            ${{ runner.temp }}/sdk27_generated_flutter_pod_REVIEW.py
            ios/Pods/Pods.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary Apple distribution profile and export options
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/BIL.mobileprovision"
          rm -f "$RUNNER_TEMP/BIL-profile.plist" "$RUNNER_TEMP/BIL-export-options.plist"

      - name: Preserve unaccepted original IPA and archive on post-build verification failure
        if: ${{ failure() && steps.ios50_archive_build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios50-unaccepted-original-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/ipa/*.ipa
            BIL-ios50-original.xcarchive.zip
            BIL-ios50-symbol-diagnostics.json
            BIL-ios50-symbol-verifier.py
            BIL-ios-build-only-receipt.json
            BIL-source-head.txt
            BIL-ios-final-artifact-inventory.json
            BIL-ios-codesign-verify.txt
            BIL-ios-crypto-scan.txt
            BIL-ios-native-crypto-gate.txt

      - name: Record failure-safe signing stage evidence without credentials
        if: always()
        env:
          BIL_SIGNING_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY2'
          import json, os, pathlib, subprocess
          record={'source_sha':os.environ['BIL_TESTED_SOURCE_SHA'],
                  'workflow_sha':os.environ['GITHUB_SHA'], 'job_status':os.environ['BIL_SIGNING_JOB_STATUS'],
                  'actual_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'signed_receipt_exists':pathlib.Path('BIL-ios-build-only-receipt.json').is_file(),
                  'upload_receipt_exists':pathlib.Path('evidence/upload-receipt.json').is_file(),
                  'public_release_approved':False}
          pathlib.Path('evidence/signing-stage-status.json').write_text(json.dumps(record,indent=2)+'\n')
          PY2
      - name: Preserve upload, processing and artifact identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios50-testflight-promotion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 21
      - name: Remove ephemeral Apple private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_PRIVATE_KEY_PATH:-}" && "$ASC_PRIVATE_KEY_PATH" == "$HOME/.appstoreconnect/private_keys/"* ]]; then
            rm -f "$ASC_PRIVATE_KEY_PATH"
          fi
