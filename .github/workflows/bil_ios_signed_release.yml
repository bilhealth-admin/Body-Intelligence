name: BIL Xcode 27.2 iphone native QA
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native:
    name: Native iOS source QA (iphone)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-ios50-finalS11-xcode27-iphone-qa-20261121' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.native_evidence.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.native_evidence.outputs['artifact-digest'] }}
    steps:
      - name: Select stable Xcode 27.2 build 27B52 and verify both SDKs
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          for sdk in iphoneos iphonesimulator; do
            case "$(xcrun --sdk "$sdk" --show-sdk-path)" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
      - name: Require compatible stock runtime to select iOS 27.2 before checkout
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/bil-native27-early-runtimes.json"
          python3 - "$RUNNER_TEMP/bil-native27-early-runtimes.json" <<'PY_EARLY_NATIVE_RUNTIME'
          import json
          import re
          import sys
          from pathlib import Path
          runtimes = json.loads(Path(sys.argv[1]).read_text())['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and
                 item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          exact_device_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro'
          compatible = [item for item in ios if any(row.get('identifier') == exact_device_type
              for row in item.get('supportedDeviceTypes', []))]
          if not compatible:
              raise SystemExit('No available runtime supports the exact native QA device type')
          runtime = max(compatible, key=lambda item: tuple(map(int, re.findall(r'\d+', item['version']))))
          if runtime['identifier'] != 'com.apple.CoreSimulator.SimRuntime.iOS-27-2':
              raise SystemExit('The compatible native QA runtime is not the reviewed stable iOS 27.2')
          print('EARLY_NATIVE_RUNTIME_27_2=PASS')
          PY_EARLY_NATIVE_RUNTIME
      - name: Validate exactly one native device before checkout
        id: device_guard
        shell: bash
        env:
          BIL_NATIVE_DEVICE: iphone
        run: |
          set -euo pipefail
          case "$BIL_NATIVE_DEVICE" in
            iphone|ipad) ;;
            *) echo 'Exactly one approved native device is required' >&2; exit 2 ;;
          esac
      - name: Check out exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bddb81888240a0931ad56eda02735d3e4f2e0b76
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual native source, caller, target and reusable workflow
        shell: bash
        env:
          BIL_NATIVE_DEVICE: iphone
        run: |
          set -euo pipefail
          python3 - <<'PY_NATIVE_SOURCE_PROVENANCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          target = os.environ['BIL_NATIVE_DEVICE']
          if target not in ('iphone', 'ipad'):
              raise ValueError('Unknown native source target')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          controller = os.environ['GITHUB_SHA']
          workflow = '.github/workflows/bil_ios_signed_release.yml'
          branch = 'codex/bil-ios50-finalS11-xcode27-iphone-qa-20261121'
          def git(*args):
              return subprocess.check_output(['git', *args])
          if not (source == 'bddb81888240a0931ad56eda02735d3e4f2e0b76' and tree == 'c2bee734ff811543906cdbaba8db33dfa48982f6' and source != controller
                  and os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence'
                  and os.environ['GITHUB_REF'] == 'refs/heads/' + branch
                  and os.environ['GITHUB_WORKFLOW_SHA'] == controller
                  and os.environ['GITHUB_WORKFLOW_REF'] == 'bilhealth-admin/Body-Intelligence/' + workflow + '@refs/heads/' + branch
                  and git('rev-list','--parents','-n','1',controller).decode().split() == [controller,source]
                  and git('diff-tree','--no-commit-id','--name-status','--no-renames','-r',source,controller).decode().splitlines() == ['M\t'+workflow]
                  and git('ls-tree',controller,workflow).decode().startswith('100644 blob ')):
              raise ValueError('Expected separate single-workflow final-source child controller and actual committed final checkout')
          reusable = '.github/workflows/bil39_ios_native_reusable.yml'
          caller = '.github/workflows/bil39_' + target + '_native.yml'
          # Use the actual final source's existing native evidence pin registry.
          import sys
          sys.path.insert(0, str(Path('tools/qa').resolve()))
          from bil_native_source_evidence import native_source_pins
          expected_pins = {'.github/workflows/bil39_ios_native_reusable.yml': '5436986122d49b9f1bcb63611ba2e6aea15e4c206906235c3bab9aac5eb66704', '.github/workflows/bil39_iphone_native.yml': 'af4ceae7cfd8e36cb152d393828b16d2309497484f7b101708f6eca2d23d3ed3', '.github/scripts/bil39_ios_native_integration.sh': 'c128d90e4e2c5965e39f212b3896a19527d42cfd38e469b3dc7ba1dca6fd439e', '.github/scripts/bil39_native_receipts.py': '6f5acaf84c09bd95d7c4856cd288f25ab6e1deb8fce2029fd3d4610984be6712', '.github/scripts/bil_ios_os_readiness.py': '7750e796a8910d87665800bf28a98015cdf835ee927f664c07a0f5ed9af3c878', '.github/scripts/bil39_simulator_vm_attach.py': '966c678ac76e927810729144f89287bc68469732d86082f5b0f4a25282fafb76', '.github/scripts/bil_ios_runner_tests.py': 'c94f99b1253196e62eed7431107515530520a2f609141b10d317ffffa3026dbb', 'integration_test/system_crypto_bridge_integration_test.dart': '5cbcc835a16c7468dbd0a9720a885012d335d4abab7e7b23a23e0e397ce94fd0', 'integration_test/native_settings_polish_test.dart': 'e5fc6485c27b35bf9174909db241ddac8670902b9613bc89cc9111979767e977', 'integration_test/native_feature_splashes_test.dart': '3a4ae0682aa10b004ae2e5af492d07bde788fb15a3cc075d71870d1d6b417a74', 'test_driver/native_settings_capture_driver.dart': 'db4d996d9294c1cb8c74b0d9de6df4e7f763f8efea6f57c94d68506f57f4f4ef', 'test_driver/native_feature_splashes_driver.dart': '259c6c939c411c23cb2b145f440b328527dd9406b0b301b60cfa4a4d76d8fa19', 'ios/RunnerTests/RunnerTests.swift': '4744bde007040723a6f781dbabe299c9800e337f6d0d154ac51ecb380e9f3fae'}
          pins = native_source_pins(Path.cwd(), target)
          if len(pins) != 13 or '.github/scripts/bil_ios_os_readiness.py' not in pins or pins != expected_pins:
              raise ValueError('Exact final committed source 13-helper pins required')
          output = Path('artifacts/qa/bil39-native-' + target) / 'controller-provenance.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          receipt = {'schema':'bil.native27.separate-controller.v1', 'controller_sha':controller,
              'controller_workflow_sha256':hashlib.sha256(git('show',controller+':'+workflow)).hexdigest(), 'application_source_sha':source,
              'application_source_tree':tree, 'repository':os.environ['GITHUB_REPOSITORY'],
              'source_reference_caller':caller, 'caller_workflow':workflow, 'caller_workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
              'caller_ref':os.environ['GITHUB_REF'], 'inlined_source_reusable_workflow':reusable,
              'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'device':target, 'qa_harness_build':39, 'signed_artifact_acceptance':False,
              'physical_device_acceptance':False,
              'source_scope_hashes':pins}
          output.write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY_NATIVE_SOURCE_PROVENANCE
      - name: Verify native preparation and independent device orchestration
        run: |
          python3 -m unittest discover -s .github/scripts -p test_bil39_simulator_vm_attach.py -v
          python3 -m unittest discover -s .github/scripts -p 'test_bil_ios_*.py' -v
          python3 -m unittest discover -s tools/qa -p test_bil39_native_split.py -v
          python3 -B -m unittest discover -s tool/release -p 'test_prepare_ios_storekit_restore_codec_overlay*.py' -v
      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output artifacts/qa/bil39-native-iphone/cocoapods-installation.json
      - name: Install exact generated Flutter Pod SDK27 compatibility wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_STAGE_EXACT_POD_HELPER'
          import base64,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and root.is_dir() and not root.is_symlink()
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='1fb3b737a10ffc47915973c75953fb914e19b89b6f080ec086f288284165d9dd'
          target=root/'sdk27_generated_flutter_pod_REVIEW.py'
          assert not target.exists() and not target.is_symlink()
          with target.open('xb') as output:output.write(raw)
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='1fb3b737a10ffc47915973c75953fb914e19b89b6f080ec086f288284165d9dd'
          PY_STAGE_EXACT_POD_HELPER
          python3 "$RUNNER_TEMP/sdk27_generated_flutter_pod_REVIEW.py" install
      - name: Resolve existing dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          pod install --project-directory=ios
      - name: Verify Flutter UIKit composition and IME behavior before native build
        run: >
          flutter test --no-pub
          test/features/intelligence_center/coach_native_chat_presentation_test.dart
          test/features/intelligence_center/coach_reply_arrival_test.dart
      - name: Drive all native scopes on dedicated iOS
        env:
          BIL_NATIVE_DEVICE: iphone
        run: bash .github/scripts/bil39_ios_native_integration.sh
      - name: Verify generated Flutter Pod floor after all original native scopes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sdk27_generated_flutter_pod_REVIEW.py" verify
      - name: Bind actual simulator runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/qa/bil39-native-iphone
          read -r runtime device_type < "$out/selected-device.txt"
          test "$runtime" = com.apple.CoreSimulator.SimRuntime.iOS-27-2
          test "$(cat "$out/xcode-version.txt")" = $'Xcode 27.2\nBuild version 27B52'
          xcrun --sdk iphonesimulator --show-sdk-version > "$out/verified-simulator-sdk.txt"
          test "$(cat "$out/verified-simulator-sdk.txt")" = 27.2
          test -s "$out/native-complete-result.json"
      - name: Upload exact iOS native evidence
        id: native_evidence
        if: always() && steps.device_guard.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-native27-iphone-bddb81888240a0931ad56eda02735d3e4f2e0b76-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/qa/bil39-native-iphone
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original generated Pod compatibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-native27-generated-pods-iphone-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bil-sdk27-pod-evidence
            ${{ runner.temp }}/sdk27_generated_flutter_pod_REVIEW.py
            ios/Pods/Pods.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14
