name: BIL SDK27 environment boot readiness measurement
on:
  workflow_dispatch:
    inputs:
      reviewed_controller_sha:
        description: Exact controller SHA from Root verified one-file publication receipt
        type: string
        required: true
permissions:
  contents: read
jobs:
  environment-readiness:
    name: SDK27 ${{ matrix.device }} cold and fresh boot measurement
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-ios50-sdk27-boot-readiness-probe-20261121' && inputs.reviewed_controller_sha == github.sha }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      BIL_PROBE_DEVICE: ${{ matrix.device }}
      BIL_REVIEWED_CONTROLLER_SHA: ${{ inputs.reviewed_controller_sha }}
      BIL_NORMALIZATION_EXPECTED_PROBE_BRANCH: codex/bil-ios50-sdk27-boot-readiness-probe-20261121
    steps:
      - name: Read only the exact controller workflow and parent Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/workflows/bil_ios_signed_release.yml
          lfs: false
          submodules: false
          persist-credentials: false
      - name: Verify exact reviewed controller and S7 metadata parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONTROLLER_GUARD'
          import hashlib,json,os,pathlib,re,subprocess
          SOURCE="5c2a3c4ac35bc7c4d2bc72c27c160ba89607d96e"; TREE="0298d6d98b50533ffe84dc2fa2a696d733ece8e1"; BRANCH="codex/bil-ios50-sdk27-boot-readiness-probe-20261121"
          PATH=".github/workflows/bil_ios_signed_release.yml"
          def need(ok,message):
              if not ok:raise RuntimeError(message)
          def git(*args):return subprocess.check_output(["git",*args],timeout=30).decode().strip()
          need(os.environ.get("GITHUB_REPOSITORY")=="bilhealth-admin/Body-Intelligence" and os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch" and os.environ.get("GITHUB_REF")=="refs/heads/"+BRANCH and os.environ.get("GITHUB_RUN_ATTEMPT")=="1","EXACT_ONE_PROBE_CONTEXT_REQUIRED")
          controller=os.environ.get("GITHUB_SHA","")
          need(re.fullmatch("[a-f0-9]{40}",controller) and controller==os.environ.get("GITHUB_WORKFLOW_SHA")==os.environ.get("BIL_REVIEWED_CONTROLLER_SHA"),"EXACT_REVIEWED_CONTROLLER_REQUIRED")
          need(git("rev-parse","HEAD")==controller,"CHECKOUT_CONTROLLER_DRIFT")
          need(git("show","-s","--format=%P","HEAD").split()==[SOURCE] and git("rev-parse",SOURCE+"^{tree}")==TREE,"SOLE_EXACT_S7_SOURCE_PARENT_REQUIRED")
          change=git("diff-tree","--no-commit-id","--no-abbrev","--raw","-r",SOURCE,controller).splitlines()
          need(len(change)==1,"ONE_FILE_CONTROLLER_REQUIRED")
          meta,path=change[0].split("\t")
          need(path==PATH and re.fullmatch(r":100644 100644 [a-f0-9]{40} [a-f0-9]{40} M",meta),"EXACT_REGULAR_WORKFLOW_ONLY")
          need(git("status","--porcelain")=="" and git("config","--get","core.sparseCheckout")=="true","CLEAN_SPARSE_WORKFLOW_CHECKOUT_REQUIRED")
          need(not pathlib.Path("lib").exists() and not pathlib.Path("ios").exists() and not pathlib.Path("pubspec.yaml").exists(),"NO_APP_SOURCE_CHECKOUT_REQUIRED")
          workflow=subprocess.check_output(["git","show","HEAD:"+PATH],timeout=30)
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/("bil-sdk27-boot-probe-"+os.environ["BIL_PROBE_DEVICE"])
          root.mkdir(exist_ok=False)
          receipt={"scope":"Environment-only measurement, not application source acceptance", "controller_sha":controller,"controller_workflow_sha256":hashlib.sha256(workflow).hexdigest(),"source_parent":SOURCE,"source_parent_tree":TREE,"source_reference_branch":"codex/bil49-android41-native40-fixes-20261120","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"probe_branch":BRANCH,"device":os.environ["BIL_PROBE_DEVICE"],"host_image_metadata":{key:os.environ.get(key)for key in ["ImageOS","ImageVersion","RUNNER_OS","RUNNER_ARCH"]},"app_build_install_signing_tests":False}
          (root/"CONTROLLER_PROVENANCE.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY_CONTROLLER_GUARD
      - name: Select exact Xcode27.2 SDKs on disposable host
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
      - name: Normalize only the exact incompatible Duo runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_NORMALIZE_PROBE'
          """Root-review candidate: exact incompatible Duo runtime normalization on disposable CI only."""
          import hashlib,json,os,pathlib,re,subprocess
          GENERIC="com.apple.CoreSimulator.SimRuntime.iOS-27-2"
          DUO="com.apple.CoreSimulator.SimRuntime.iOS-27-2-iPhone19-4"
          IOS="com.apple.platform.iphonesimulator"
          NEEDED={"com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro","com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB"}
          class Refused(ValueError):pass
          def need(ok,message):
              if not ok:raise Refused(message)
          def version(row):return tuple(map(int,re.findall(r"\d+",row["version"])))
          def fingerprint(row):
              return {k:row.get(k) for k in ["identifier","version","buildversion","isAvailable","supportedArchitectures","supportedDeviceTypes","bundlePath","runtimeRoot"]}
          def image_for(images,runtime,build):
              rows=[(key,row) for key,row in images.items() if row.get("runtimeIdentifier")==runtime["identifier"]]
              need(len(rows)==1,"UNIQUE_RUNTIME_IMAGE_REQUIRED")
              key,row=rows[0]
              need(re.fullmatch(r"[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}",key) is not None and row.get("identifier")==key,"EXACT_UUID_KEY_REQUIRED")
              need(row.get("platformIdentifier")==IOS and row.get("version")=="27.2" and row.get("build")==build and row.get("state")=="Ready","IMAGE_IDENTITY_DRIFT")
              need(row.get("kind")=="Patchable Cryptex Disk Image" and row.get("supportedArchitectures")==["arm64"],"IMAGE_KIND_ARCH_DRIFT")
              need(row.get("runtimeBundlePath")==runtime.get("bundlePath"),"IMAGE_RUNTIME_PATH_BINDING_REQUIRED")
              return key,row
          def plan(available,images,help_text):
              need(isinstance(images,dict) and 0<len(images)<128,"STRICT_IMAGE_MAP_REQUIRED")
              need("delete (<identifier>|" in help_text and "[--dry-run]" in help_text,"DOCUMENTED_IDENTIFIER_DELETE_REQUIRED")
              rows=available["runtimes"]
              need(isinstance(rows,list),"RUNTIME_ROWS_REQUIRED")
              ios=[r for r in rows if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
              generic=[r for r in ios if r["identifier"]==GENERIC]
              need(len(generic)==1,"UNIQUE_AVAILABLE_GENERIC_REQUIRED");generic=generic[0]
              need(generic.get("version")=="27.2" and generic.get("buildversion")=="24B8117" and generic.get("supportedArchitectures")==["arm64"],"GENERIC_IDENTITY_DRIFT")
              need(NEEDED.issubset({r["identifier"] for r in generic["supportedDeviceTypes"]}),"GENERIC_DEVICE_COMPATIBILITY_REQUIRED")
              need(all(version(r)<(27,2) or r["identifier"] in {GENERIC,DUO} and version(r)==(27,2) for r in ios),"UNKNOWN_TIED_OR_NEWER_RUNTIME_REFUSED")
              generic_uuid,generic_image=image_for(images,generic,"24B8117")
              duo=[r for r in ios if r["identifier"]==DUO]
              need(len(duo)<=1,"DUPLICATE_DUO_RUNTIME")
              if not duo:
                  need(max(ios,key=version)["identifier"]==GENERIC,"GENERIC_NOT_SELECTED")
                  return {"delete_uuid":None,"generic_uuid":generic_uuid,"generic_fingerprint":fingerprint(generic),"mode":"ALREADY_GENERIC_ONLY"}
              duo=duo[0]
              need(duo.get("version")=="27.2" and duo.get("buildversion")=="24B91016s" and duo.get("supportedArchitectures")==["arm64"],"DUO_IDENTITY_DRIFT")
              need({r["identifier"] for r in duo["supportedDeviceTypes"]}=={"com.apple.CoreSimulator.SimDeviceType.iPhone-Duo"},"DUO_ONLY_DEVICE_REQUIRED")
              uid,image=image_for(images,duo,"24B91016s")
              need(image.get("deletable") is True and uid!=generic_uuid,"EXACT_DELETABLE_DUO_ONLY")
              a=pathlib.PurePosixPath(image["path"]);b=pathlib.PurePosixPath(generic_image["path"])
              need(a.is_absolute() and b.is_absolute() and a!=b and not a.is_relative_to(b) and not b.is_relative_to(a),"SEPARATE_GENERIC_ASSET_REQUIRED")
              return {"delete_uuid":uid,"generic_uuid":generic_uuid,"generic_fingerprint":fingerprint(generic),"duo_fingerprint":fingerprint(duo),"mode":"REMOVE_ONLY_INCOMPATIBLE_DUO"}
          def main():
              root=pathlib.Path(os.environ["RUNNER_TEMP"])/"bil-native27-runtime-normalization"
              root.mkdir(exist_ok=False)
              def save(name,obj):
                  with (root/name).open("x",encoding="utf-8") as f:json.dump(obj,f,indent=2);f.write("\n")
              def capture(name,argv,timeout=90):
                  try:
                      r=subprocess.run(argv,capture_output=True,timeout=timeout)
                  except subprocess.TimeoutExpired as error:
                      (root/(name+".stdout")).write_bytes(error.stdout or b"")
                      (root/(name+".stderr")).write_bytes(error.stderr or b"")
                      save(name+".status.json",{"argv":argv,"status":"TIMEOUT","timeout":timeout})
                      raise Refused("COMMAND_TIMEOUT_NO_RETRY") from None
                  (root/(name+".stdout")).write_bytes(r.stdout);(root/(name+".stderr")).write_bytes(r.stderr)
                  save(name+".status.json",{"argv":argv,"exit":r.returncode})
                  need(r.returncode==0,"COMMAND_FAILED_NO_RETRY")
                  return r
              try:
                  branch=os.environ.get("BIL_NORMALIZATION_EXPECTED_PROBE_BRANCH")
                  need(branch in {"codex/bil-ios50-sdk27-boot-readiness-probe-20261121"},"EXACT_PROBE_BRANCH_REQUIRED")
                  need(os.environ.get("GITHUB_REPOSITORY")=="bilhealth-admin/Body-Intelligence" and os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch" and os.environ.get("GITHUB_REF")=="refs/heads/"+branch and os.environ.get("GITHUB_RUN_ATTEMPT")=="1" and os.environ.get("GITHUB_WORKFLOW_SHA")==os.environ.get("GITHUB_SHA"),"ROOT_PROBE_CONTROLLER_CONTEXT_REQUIRED")
                  h=capture("before-runtime-help",["xcrun","simctl","help","runtime"])
                  a=capture("before-runtimes",["xcrun","simctl","list","runtimes","available","-j"])
                  i=capture("before-images",["xcrun","simctl","runtime","list","-j"])
                  before=json.loads(a.stdout);images=json.loads(i.stdout)
                  action=plan(before,images,(h.stdout+h.stderr).decode())
                  save("verified-plan-before-mutation.json",action);print(json.dumps(action,indent=2),flush=True)
                  if action["delete_uuid"] is not None:
                      # One exact live-mapped UUID only; never 'all', selectors, paths, retry or source edits.
                      capture("delete-exact-duo",["xcrun","simctl","runtime","delete",action["delete_uuid"]],180)
                  a=capture("after-runtimes",["xcrun","simctl","list","runtimes","available","-j"])
                  i=capture("after-images",["xcrun","simctl","runtime","list","-j"])
                  after=json.loads(a.stdout);after_images=json.loads(i.stdout)
                  expected=set(images)-({action["delete_uuid"]} if action["delete_uuid"] else set())
                  need(set(after_images)==expected,"OTHER_IMAGE_SET_CHANGED")
                  for key in expected:
                      for field in ["identifier","runtimeIdentifier","version","build","platformIdentifier","kind","supportedArchitectures","deletable"]:
                          need(images[key].get(field)==after_images[key].get(field),"UNRELATED_IMAGE_IDENTITY_CHANGED")
                  rows=[r for r in after["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
                  need(sum(r["identifier"]==GENERIC for r in rows)==1 and all(r["identifier"]!=DUO for r in rows),"GENERIC_PRESERVED_DUO_REMOVED_REQUIRED")
                  need(fingerprint(next(r for r in rows if r["identifier"]==GENERIC))==action["generic_fingerprint"],"GENERIC_RUNTIME_CHANGED")
                  chosen=max(rows,key=version);need(chosen["identifier"]==GENERIC,"UNCHANGED_HARNESS_MAX_NOT_GENERIC")
                  save("NORMALIZATION_RESULT.json",{"status":"EXACT_GENERIC27_2_ENVIRONMENT_READY","selected_by_original_MAX":{k:chosen[k] for k in ["identifier","version","buildversion","isAvailable"]},"delete_uuid":action["delete_uuid"],"generic_uuid":action["generic_uuid"],"source_harness_or_threshold_changes":False})
              except Exception as error:
                  save("NORMALIZATION_FAILED_CLOSED.json",{"status":"FAILED_BEFORE_CHECKOUT_OR_APP_BUILD","category":str(error) if isinstance(error,Refused) else type(error).__name__,"no_retry":True})
                  raise
          if __name__=="__main__":main()
          PY_NORMALIZE_PROBE
      - name: Materialize exact reviewed environment measurement helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PROBE_HELPER'
          import base64,hashlib,os,pathlib
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='4ebafabe1ae65fadc69a0aa05946cb1b9022011bb69312304aada59746026818'
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sdk27_boot_readiness_probe.py"
          with p.open("xb")as f:f.write(raw)
          PY_PROBE_HELPER
      - name: Measure one cold boot and one fresh device without application actions
        shell: bash
        run: python3 "$RUNNER_TEMP/sdk27_boot_readiness_probe.py"
      - name: Preserve all environment cases including failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-sdk27-boot-readiness-${{ matrix.device }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bil-sdk27-boot-probe-${{ matrix.device }}
            ${{ runner.temp }}/bil-native27-runtime-normalization
          if-no-files-found: error
          retention-days: 14
