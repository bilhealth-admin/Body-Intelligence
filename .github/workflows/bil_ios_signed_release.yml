name: BIL Xcode 27.2 ipad native QA
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native:
    name: Native iOS source QA (ipad)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-ios50-xcode27-ipad-qa-20261121' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.native_evidence.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.native_evidence.outputs['artifact-digest'] }}
    steps:
      - name: Select stable Xcode 27.2 build 27B52 and verify both SDKs
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          for sdk in iphoneos iphonesimulator; do
            case "$(xcrun --sdk "$sdk" --show-sdk-path)" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
      - name: Require unchanged native maximum runtime to select iOS 27.2 before checkout
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/bil-native27-early-runtimes.json"
          python3 - "$RUNNER_TEMP/bil-native27-early-runtimes.json" <<'PY_EARLY_NATIVE_RUNTIME'
          import json
          import re
          import sys
          from pathlib import Path
          runtimes = json.loads(Path(sys.argv[1]).read_text())['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and
                 item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          runtime = max(ios, key=lambda item: tuple(map(int, re.findall(r'\d+', item['version']))))
          if runtime['identifier'] != 'com.apple.CoreSimulator.SimRuntime.iOS-27-2':
              raise SystemExit('The unchanged native harness would select a runtime other than stable iOS 27.2')
          print('EARLY_NATIVE_RUNTIME_27_2=PASS')
          PY_EARLY_NATIVE_RUNTIME
      - name: Validate exactly one native device before checkout
        id: device_guard
        shell: bash
        env:
          BIL_NATIVE_DEVICE: ipad
        run: |
          set -euo pipefail
          case "$BIL_NATIVE_DEVICE" in
            iphone|ipad) ;;
            *) echo 'Exactly one approved native device is required' >&2; exit 2 ;;
          esac
      - name: Check out exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a626536de190099969fc8a12e9df90abe4b4ac8d
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual native source, caller, target and reusable workflow
        shell: bash
        env:
          BIL_NATIVE_DEVICE: ipad
        run: |
          set -euo pipefail
          python3 - <<'PY_NATIVE_SOURCE_PROVENANCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          target = os.environ['BIL_NATIVE_DEVICE']
          if target not in ('iphone', 'ipad'):
              raise ValueError('Unknown native source target')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          controller = os.environ['GITHUB_SHA']
          workflow = '.github/workflows/bil_ios_signed_release.yml'
          branch = 'codex/bil-ios50-xcode27-ipad-qa-20261121'
          def git(*args):
              return subprocess.check_output(['git', *args])
          if not (source == 'a626536de190099969fc8a12e9df90abe4b4ac8d' and tree == 'ab50e3b863f46a0476a5ff87be06b5d6ac91ec15' and source != controller
                  and os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence'
                  and os.environ['GITHUB_REF'] == 'refs/heads/' + branch
                  and os.environ['GITHUB_WORKFLOW_SHA'] == controller
                  and os.environ['GITHUB_WORKFLOW_REF'] == 'bilhealth-admin/Body-Intelligence/' + workflow + '@refs/heads/' + branch
                  and git('rev-list','--parents','-n','1',controller).decode().split() == [controller,source]
                  and git('diff-tree','--no-commit-id','--name-status','--no-renames','-r',source,controller).decode().splitlines() == ['M\t'+workflow]
                  and git('ls-tree',controller,workflow).decode().startswith('100644 blob ')):
              raise ValueError('Expected separate single-workflow S5-child controller and actual S5 checkout')
          reusable = '.github/workflows/bil39_ios_native_reusable.yml'
          caller = '.github/workflows/bil39_' + target + '_native.yml'
          paths = [reusable, caller, '.github/scripts/bil39_ios_native_integration.sh',
              '.github/scripts/bil39_native_receipts.py',
              '.github/scripts/bil39_simulator_vm_attach.py', '.github/scripts/bil_ios_runner_tests.py',
              'integration_test/system_crypto_bridge_integration_test.dart',
              'integration_test/native_settings_polish_test.dart', 'integration_test/native_feature_splashes_test.dart',
              'test_driver/native_settings_capture_driver.dart', 'test_driver/native_feature_splashes_driver.dart',
              'ios/RunnerTests/RunnerTests.swift']
          output = Path('artifacts/qa/bil39-native-' + target) / 'controller-provenance.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          receipt = {'schema':'bil.native27.separate-controller.v1', 'controller_sha':controller,
              'controller_workflow_sha256':hashlib.sha256(git('show',controller+':'+workflow)).hexdigest(), 'application_source_sha':source,
              'application_source_tree':tree, 'repository':os.environ['GITHUB_REPOSITORY'],
              'source_reference_caller':caller, 'caller_workflow':workflow, 'caller_workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
              'caller_ref':os.environ['GITHUB_REF'], 'inlined_source_reusable_workflow':reusable,
              'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'device':target, 'qa_harness_build':39, 'signed_artifact_acceptance':False,
              'physical_device_acceptance':False,
              'source_scope_hashes':{path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}}
          output.write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY_NATIVE_SOURCE_PROVENANCE
      - name: Verify native preparation and independent device orchestration
        run: |
          python3 -m unittest discover -s .github/scripts -p test_bil39_simulator_vm_attach.py -v
          python3 -m unittest discover -s .github/scripts -p 'test_bil_ios_*.py' -v
          python3 -m unittest discover -s tools/qa -p test_bil39_native_split.py -v
          python3 -B -m unittest discover -s tool/release -p 'test_prepare_ios_storekit_restore_codec_overlay*.py' -v
      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output artifacts/qa/bil39-native-ipad/cocoapods-installation.json
      - name: Resolve existing dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          pod install --project-directory=ios
      - name: Verify Flutter UIKit composition and IME behavior before native build
        run: >
          flutter test --no-pub
          test/features/intelligence_center/coach_native_chat_presentation_test.dart
          test/features/intelligence_center/coach_reply_arrival_test.dart
      - name: Drive all native scopes on dedicated iOS
        env:
          BIL_NATIVE_DEVICE: ipad
        run: bash .github/scripts/bil39_ios_native_integration.sh
      - name: Bind actual simulator runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/qa/bil39-native-ipad
          read -r runtime device_type < "$out/selected-device.txt"
          test "$runtime" = com.apple.CoreSimulator.SimRuntime.iOS-27-2
          test "$(cat "$out/xcode-version.txt")" = $'Xcode 27.2\nBuild version 27B52'
          xcrun --sdk iphonesimulator --show-sdk-version > "$out/verified-simulator-sdk.txt"
          test "$(cat "$out/verified-simulator-sdk.txt")" = 27.2
          test -s "$out/native-complete-result.json"
      - name: Upload exact iOS native evidence
        id: native_evidence
        if: always() && steps.device_guard.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-native27-ipad-a626536de190099969fc8a12e9df90abe4b4ac8d-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/qa/bil39-native-ipad
          if-no-files-found: error
          retention-days: 14
