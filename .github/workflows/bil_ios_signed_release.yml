name: BIL iOS50 pinned-source internal TestFlight
run-name: iOS50 app 6c0dfbab; separate controller; no App Store submission
on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: Explicit signed artifact preparation only; no store upload
        type: boolean
        default: false
      expected_source_sha:
        description: Exact accepted application source SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: bil-ios50-internal-testflight-${{ github.ref }}
  cancel-in-progress: false
env:
  BIL_VALIDATION_MODE: exact_source_ci_separate_controller
  BIL_TESTED_SOURCE_SHA: 6c0dfbab576e797d24b42310e9194db2f1664188
  BIL_TESTED_SOURCE: 6c0dfbab576e797d24b42310e9194db2f1664188
  BIL_SIGNING_ORCHESTRATION_SHA: ${{ github.sha }}
  BIL_ORIGINAL_SHA: 155b079696430919f8272df934371f033fb11be2
jobs:
  signed-ios-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_signed_build == true && inputs.expected_source_sha == '6c0dfbab576e797d24b42310e9194db2f1664188' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 240
    steps:
      - name: Checkout the immutable candidate accepted by final CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c0dfbab576e797d24b42310e9194db2f1664188
          fetch-depth: 0
          persist-credentials: false
      - name: Stage exact-source verified bootstrap chunk 1 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BIL_CARRIER'
          import hashlib, os
          from pathlib import Path
          root_input = Path(os.environ['RUNNER_TEMP'])
          assert root_input.is_absolute() and root_input.is_dir() and not root_input.is_symlink()
          assert not (getattr(os.lstat(root_input), 'st_file_attributes', 0) & 0x400)
          root = root_input.resolve(strict=True)
          name = 'bil47-exact-gate-bootstrap-000.chunk'
          assert name == 'bil47-exact-gate-bootstrap-000.chunk'
          content = ''.encode('ascii')
          assert 0 < len(content) == 12000 <= 12000
          assert hashlib.sha256(content).hexdigest() == 'b05601511997dec433a086c99cb4bd2d9fc6284c86f3c314d14ee56288b7458e'
          path = root / name
          assert path.parent == root and not path.exists() and not path.is_symlink()
          with path.open('xb') as output:
              output.write(content)
          assert not path.is_symlink() and not (getattr(os.lstat(path), 'st_file_attributes', 0) & 0x400)
          PY_BIL_CARRIER
