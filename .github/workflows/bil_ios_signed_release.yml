name: BIL Xcode 27.2 iphone native QA
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native:
    name: Native iOS source QA (iphone)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-ios50-xcode27-iphone-qa2-20261121' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.native_evidence.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.native_evidence.outputs['artifact-digest'] }}
    steps:
      - name: Select stable Xcode 27.2 build 27B52 and verify both SDKs
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          for sdk in iphoneos iphonesimulator; do
            case "$(xcrun --sdk "$sdk" --show-sdk-path)" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
      - name: Normalize only incompatible Duo runtime on disposable CI host
        shell: bash
        env:
          BIL_NORMALIZATION_EXPECTED_QA_BRANCH: codex/bil-ios50-xcode27-iphone-qa2-20261121
        run: |
          set -euo pipefail
          python3 - <<'PY_NORMALIZE_DUO_RUNTIME'
          """Root-review candidate: exact incompatible Duo runtime normalization on disposable CI only."""
          import hashlib,json,os,pathlib,re,subprocess
          GENERIC="com.apple.CoreSimulator.SimRuntime.iOS-27-2"
          DUO="com.apple.CoreSimulator.SimRuntime.iOS-27-2-iPhone19-4"
          IOS="com.apple.platform.iphonesimulator"
          NEEDED={"com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro","com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB"}
          class Refused(ValueError):pass
          def need(ok,message):
              if not ok:raise Refused(message)
          def version(row):return tuple(map(int,re.findall(r"\d+",row["version"])))
          def fingerprint(row):
              return {k:row.get(k) for k in ["identifier","version","buildversion","isAvailable","supportedArchitectures","supportedDeviceTypes","bundlePath","runtimeRoot"]}
          def image_for(images,runtime,build):
              rows=[(key,row) for key,row in images.items() if row.get("runtimeIdentifier")==runtime["identifier"]]
              need(len(rows)==1,"UNIQUE_RUNTIME_IMAGE_REQUIRED")
              key,row=rows[0]
              need(re.fullmatch(r"[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}",key) is not None and row.get("identifier")==key,"EXACT_UUID_KEY_REQUIRED")
              need(row.get("platformIdentifier")==IOS and row.get("version")=="27.2" and row.get("build")==build and row.get("state")=="Ready","IMAGE_IDENTITY_DRIFT")
              need(row.get("kind")=="Patchable Cryptex Disk Image" and row.get("supportedArchitectures")==["arm64"],"IMAGE_KIND_ARCH_DRIFT")
              need(row.get("runtimeBundlePath")==runtime.get("bundlePath"),"IMAGE_RUNTIME_PATH_BINDING_REQUIRED")
              return key,row
          def plan(available,images,help_text):
              need(isinstance(images,dict) and 0<len(images)<128,"STRICT_IMAGE_MAP_REQUIRED")
              need("delete (<identifier>|" in help_text and "[--dry-run]" in help_text,"DOCUMENTED_IDENTIFIER_DELETE_REQUIRED")
              rows=available["runtimes"]
              need(isinstance(rows,list),"RUNTIME_ROWS_REQUIRED")
              ios=[r for r in rows if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
              generic=[r for r in ios if r["identifier"]==GENERIC]
              need(len(generic)==1,"UNIQUE_AVAILABLE_GENERIC_REQUIRED");generic=generic[0]
              need(generic.get("version")=="27.2" and generic.get("buildversion")=="24B8117" and generic.get("supportedArchitectures")==["arm64"],"GENERIC_IDENTITY_DRIFT")
              need(NEEDED.issubset({r["identifier"] for r in generic["supportedDeviceTypes"]}),"GENERIC_DEVICE_COMPATIBILITY_REQUIRED")
              need(all(version(r)<(27,2) or r["identifier"] in {GENERIC,DUO} and version(r)==(27,2) for r in ios),"UNKNOWN_TIED_OR_NEWER_RUNTIME_REFUSED")
              generic_uuid,generic_image=image_for(images,generic,"24B8117")
              duo=[r for r in ios if r["identifier"]==DUO]
              need(len(duo)<=1,"DUPLICATE_DUO_RUNTIME")
              if not duo:
                  need(max(ios,key=version)["identifier"]==GENERIC,"GENERIC_NOT_SELECTED")
                  return {"delete_uuid":None,"generic_uuid":generic_uuid,"generic_fingerprint":fingerprint(generic),"mode":"ALREADY_GENERIC_ONLY"}
              duo=duo[0]
              need(duo.get("version")=="27.2" and duo.get("buildversion")=="24B91016s" and duo.get("supportedArchitectures")==["arm64"],"DUO_IDENTITY_DRIFT")
              need({r["identifier"] for r in duo["supportedDeviceTypes"]}=={"com.apple.CoreSimulator.SimDeviceType.iPhone-Duo"},"DUO_ONLY_DEVICE_REQUIRED")
              uid,image=image_for(images,duo,"24B91016s")
              need(image.get("deletable") is True and uid!=generic_uuid,"EXACT_DELETABLE_DUO_ONLY")
              a=pathlib.PurePosixPath(image["path"]);b=pathlib.PurePosixPath(generic_image["path"])
              need(a.is_absolute() and b.is_absolute() and a!=b and not a.is_relative_to(b) and not b.is_relative_to(a),"SEPARATE_GENERIC_ASSET_REQUIRED")
              return {"delete_uuid":uid,"generic_uuid":generic_uuid,"generic_fingerprint":fingerprint(generic),"duo_fingerprint":fingerprint(duo),"mode":"REMOVE_ONLY_INCOMPATIBLE_DUO"}
          def main():
              root=pathlib.Path(os.environ["RUNNER_TEMP"])/"bil-native27-runtime-normalization"
              root.mkdir(exist_ok=False)
              def save(name,obj):
                  with (root/name).open("x",encoding="utf-8") as f:json.dump(obj,f,indent=2);f.write("\n")
              def capture(name,argv,timeout=90):
                  try:
                      r=subprocess.run(argv,capture_output=True,timeout=timeout)
                  except subprocess.TimeoutExpired as error:
                      (root/(name+".stdout")).write_bytes(error.stdout or b"")
                      (root/(name+".stderr")).write_bytes(error.stderr or b"")
                      save(name+".status.json",{"argv":argv,"status":"TIMEOUT","timeout":timeout})
                      raise Refused("COMMAND_TIMEOUT_NO_RETRY") from None
                  (root/(name+".stdout")).write_bytes(r.stdout);(root/(name+".stderr")).write_bytes(r.stderr)
                  save(name+".status.json",{"argv":argv,"exit":r.returncode})
                  need(r.returncode==0,"COMMAND_FAILED_NO_RETRY")
                  return r
              try:
                  branch=os.environ.get("BIL_NORMALIZATION_EXPECTED_QA_BRANCH")
                  need(branch in {"codex/bil-ios50-xcode27-iphone-qa2-20261121","codex/bil-ios50-xcode27-ipad-qa2-20261121"},"EXACT_QA2_BRANCH_REQUIRED")
                  need(os.environ.get("GITHUB_REPOSITORY")=="bilhealth-admin/Body-Intelligence" and os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch" and os.environ.get("GITHUB_REF")=="refs/heads/"+branch and os.environ.get("GITHUB_RUN_ATTEMPT")=="1" and os.environ.get("GITHUB_WORKFLOW_SHA")==os.environ.get("GITHUB_SHA"),"ROOT_QA2_CONTROLLER_CONTEXT_REQUIRED")
                  h=capture("before-runtime-help",["xcrun","simctl","help","runtime"])
                  a=capture("before-runtimes",["xcrun","simctl","list","runtimes","available","-j"])
                  i=capture("before-images",["xcrun","simctl","runtime","list","-j"])
                  before=json.loads(a.stdout);images=json.loads(i.stdout)
                  action=plan(before,images,(h.stdout+h.stderr).decode())
                  save("verified-plan-before-mutation.json",action);print(json.dumps(action,indent=2),flush=True)
                  if action["delete_uuid"] is not None:
                      # One exact live-mapped UUID only; never 'all', selectors, paths, retry or source edits.
                      capture("delete-exact-duo",["xcrun","simctl","runtime","delete",action["delete_uuid"]],180)
                  a=capture("after-runtimes",["xcrun","simctl","list","runtimes","available","-j"])
                  i=capture("after-images",["xcrun","simctl","runtime","list","-j"])
                  after=json.loads(a.stdout);after_images=json.loads(i.stdout)
                  expected=set(images)-({action["delete_uuid"]} if action["delete_uuid"] else set())
                  need(set(after_images)==expected,"OTHER_IMAGE_SET_CHANGED")
                  for key in expected:
                      for field in ["identifier","runtimeIdentifier","version","build","platformIdentifier","kind","supportedArchitectures","deletable"]:
                          need(images[key].get(field)==after_images[key].get(field),"UNRELATED_IMAGE_IDENTITY_CHANGED")
                  rows=[r for r in after["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
                  need(sum(r["identifier"]==GENERIC for r in rows)==1 and all(r["identifier"]!=DUO for r in rows),"GENERIC_PRESERVED_DUO_REMOVED_REQUIRED")
                  need(fingerprint(next(r for r in rows if r["identifier"]==GENERIC))==action["generic_fingerprint"],"GENERIC_RUNTIME_CHANGED")
                  chosen=max(rows,key=version);need(chosen["identifier"]==GENERIC,"UNCHANGED_HARNESS_MAX_NOT_GENERIC")
                  save("NORMALIZATION_RESULT.json",{"status":"EXACT_GENERIC27_2_ENVIRONMENT_READY","selected_by_original_MAX":{k:chosen[k] for k in ["identifier","version","buildversion","isAvailable"]},"delete_uuid":action["delete_uuid"],"generic_uuid":action["generic_uuid"],"source_harness_or_threshold_changes":False})
              except Exception as error:
                  save("NORMALIZATION_FAILED_CLOSED.json",{"status":"FAILED_BEFORE_CHECKOUT_OR_APP_BUILD","category":str(error) if isinstance(error,Refused) else type(error).__name__,"no_retry":True})
                  raise
          if __name__=="__main__":main()

          PY_NORMALIZE_DUO_RUNTIME
      - name: Require unchanged native maximum runtime to select iOS 27.2 before checkout
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/bil-native27-early-runtimes.json"
          python3 - "$RUNNER_TEMP/bil-native27-early-runtimes.json" <<'PY_EARLY_NATIVE_RUNTIME'
          import json
          import re
          import sys
          from pathlib import Path
          runtimes = json.loads(Path(sys.argv[1]).read_text())['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and
                 item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          runtime = max(ios, key=lambda item: tuple(map(int, re.findall(r'\d+', item['version']))))
          if runtime['identifier'] != 'com.apple.CoreSimulator.SimRuntime.iOS-27-2':
              raise SystemExit('The unchanged native harness would select a runtime other than stable iOS 27.2')
          print('EARLY_NATIVE_RUNTIME_27_2=PASS')
          PY_EARLY_NATIVE_RUNTIME
      - name: Validate exactly one native device before checkout
        id: device_guard
        shell: bash
        env:
          BIL_NATIVE_DEVICE: iphone
        run: |
          set -euo pipefail
          case "$BIL_NATIVE_DEVICE" in
            iphone|ipad) ;;
            *) echo 'Exactly one approved native device is required' >&2; exit 2 ;;
          esac
      - name: Check out exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a626536de190099969fc8a12e9df90abe4b4ac8d
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual native source, caller, target and reusable workflow
        shell: bash
        env:
          BIL_NATIVE_DEVICE: iphone
        run: |
          set -euo pipefail
          python3 - <<'PY_NATIVE_SOURCE_PROVENANCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          target = os.environ['BIL_NATIVE_DEVICE']
          if target not in ('iphone', 'ipad'):
              raise ValueError('Unknown native source target')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          controller = os.environ['GITHUB_SHA']
          workflow = '.github/workflows/bil_ios_signed_release.yml'
          branch = 'codex/bil-ios50-xcode27-iphone-qa2-20261121'
          def git(*args):
              return subprocess.check_output(['git', *args])
          if not (source == 'a626536de190099969fc8a12e9df90abe4b4ac8d' and tree == 'ab50e3b863f46a0476a5ff87be06b5d6ac91ec15' and source != controller
                  and os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence'
                  and os.environ['GITHUB_REF'] == 'refs/heads/' + branch
                  and os.environ['GITHUB_WORKFLOW_SHA'] == controller
                  and os.environ['GITHUB_WORKFLOW_REF'] == 'bilhealth-admin/Body-Intelligence/' + workflow + '@refs/heads/' + branch
                  and git('rev-list','--parents','-n','1',controller).decode().split() == [controller,source]
                  and git('diff-tree','--no-commit-id','--name-status','--no-renames','-r',source,controller).decode().splitlines() == ['M\t'+workflow]
                  and git('ls-tree',controller,workflow).decode().startswith('100644 blob ')):
              raise ValueError('Expected separate single-workflow S5-child controller and actual S5 checkout')
          reusable = '.github/workflows/bil39_ios_native_reusable.yml'
          caller = '.github/workflows/bil39_' + target + '_native.yml'
          paths = [reusable, caller, '.github/scripts/bil39_ios_native_integration.sh',
              '.github/scripts/bil39_native_receipts.py',
              '.github/scripts/bil39_simulator_vm_attach.py', '.github/scripts/bil_ios_runner_tests.py',
              'integration_test/system_crypto_bridge_integration_test.dart',
              'integration_test/native_settings_polish_test.dart', 'integration_test/native_feature_splashes_test.dart',
              'test_driver/native_settings_capture_driver.dart', 'test_driver/native_feature_splashes_driver.dart',
              'ios/RunnerTests/RunnerTests.swift']
          output = Path('artifacts/qa/bil39-native-' + target) / 'controller-provenance.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          receipt = {'schema':'bil.native27.separate-controller.v1', 'controller_sha':controller,
              'controller_workflow_sha256':hashlib.sha256(git('show',controller+':'+workflow)).hexdigest(), 'application_source_sha':source,
              'application_source_tree':tree, 'repository':os.environ['GITHUB_REPOSITORY'],
              'source_reference_caller':caller, 'caller_workflow':workflow, 'caller_workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
              'caller_ref':os.environ['GITHUB_REF'], 'inlined_source_reusable_workflow':reusable,
              'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'device':target, 'qa_harness_build':39, 'signed_artifact_acceptance':False,
              'physical_device_acceptance':False,
              'source_scope_hashes':{path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}}
          output.write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY_NATIVE_SOURCE_PROVENANCE
      - name: Verify native preparation and independent device orchestration
        run: |
          python3 -m unittest discover -s .github/scripts -p test_bil39_simulator_vm_attach.py -v
          python3 -m unittest discover -s .github/scripts -p 'test_bil_ios_*.py' -v
          python3 -m unittest discover -s tools/qa -p test_bil39_native_split.py -v
          python3 -B -m unittest discover -s tool/release -p 'test_prepare_ios_storekit_restore_codec_overlay*.py' -v
      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output artifacts/qa/bil39-native-iphone/cocoapods-installation.json
      - name: Resolve existing dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          pod install --project-directory=ios
      - name: Verify Flutter UIKit composition and IME behavior before native build
        run: >
          flutter test --no-pub
          test/features/intelligence_center/coach_native_chat_presentation_test.dart
          test/features/intelligence_center/coach_reply_arrival_test.dart
      - name: Drive all native scopes on dedicated iOS
        env:
          BIL_NATIVE_DEVICE: iphone
        run: bash .github/scripts/bil39_ios_native_integration.sh
      - name: Bind actual simulator runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/qa/bil39-native-iphone
          read -r runtime device_type < "$out/selected-device.txt"
          test "$runtime" = com.apple.CoreSimulator.SimRuntime.iOS-27-2
          test "$(cat "$out/xcode-version.txt")" = $'Xcode 27.2\nBuild version 27B52'
          xcrun --sdk iphonesimulator --show-sdk-version > "$out/verified-simulator-sdk.txt"
          test "$(cat "$out/verified-simulator-sdk.txt")" = 27.2
          test -s "$out/native-complete-result.json"
      - name: Upload exact iOS native evidence
        id: native_evidence
        if: always() && steps.device_guard.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-native27-iphone-a626536de190099969fc8a12e9df90abe4b4ac8d-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/qa/bil39-native-iphone
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original runtime normalization evidence even before checkout
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-native27-normalization-iphone-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bil-native27-runtime-normalization
          if-no-files-found: warn
          retention-days: 14
