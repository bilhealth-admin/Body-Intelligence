name: BIL SDK27 generated Flutter Pod toolchain smoke only
run-name: TOOLCHAIN_SMOKE_ONLY_NOT_APP_QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain-smoke:
    name: TOOLCHAIN_SMOKE_ONLY_NOT_APP_QA
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-ios50-xcode27-pod-toolchain-smoke-20261121' }}
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Select stable Xcode 27.2 build 27B52 and verify both SDKs
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
          test "$(/usr/bin/xcode-select -p)" = "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          for sdk in iphoneos iphonesimulator; do
            case "$(xcrun --sdk "$sdk" --show-sdk-path)" in "$DEVELOPER_DIR"/*) ;; *) exit 1 ;; esac
          done
      - name: Checkout exact S5 solely for generated Pod toolchain smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a626536de190099969fc8a12e9df90abe4b4ac8d
          fetch-depth: 0
          persist-credentials: false
      - name: Bind smoke-only controller and S5 application checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/toolchain-smoke
          python3 - <<'PY_SMOKE_PROVENANCE'
          import hashlib,json,os,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args])
          source='a626536de190099969fc8a12e9df90abe4b4ac8d';tree='ab50e3b863f46a0476a5ff87be06b5d6ac91ec15';branch='codex/bil-ios50-xcode27-pod-toolchain-smoke-20261121';path='.github/workflows/bil_ios_signed_release.yml'
          assert git('rev-parse','HEAD').decode().strip()==source and git('rev-parse','HEAD^{tree}').decode().strip()==tree
          assert not git('status','--porcelain=v1','--untracked-files=all').strip()
          controller=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_REPOSITORY']=='bilhealth-admin/Body-Intelligence' and os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_WORKFLOW_SHA']==controller
          assert os.environ['GITHUB_WORKFLOW_REF']=='bilhealth-admin/Body-Intelligence/'+path+'@refs/heads/'+branch
          assert git('rev-list','--parents','-n','1',controller).decode().split()==[controller,source]
          assert git('diff-tree','--no-commit-id','--name-status','--no-renames','-r',source,controller).decode().splitlines()==['M\t'+path]
          assert git('ls-tree',controller,path).decode().startswith('100644 blob ')
          result={'status':'TOOLCHAIN_SMOKE_ONLY_NOT_APP_QA','application_source':source,'application_tree':tree,'controller':controller,'workflow_sha256':hashlib.sha256(git('show',controller+':'+path)).hexdigest(),'run':os.environ['GITHUB_RUN_ID'],'attempt':1,'XCTest_or_application_scopes_executed':False,'release_acceptance':False}
          pathlib.Path('artifacts/toolchain-smoke/provenance.json').write_text(json.dumps(result,indent=2)+'\n')
          PY_SMOKE_PROVENANCE
      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output artifacts/toolchain-smoke/cocoapods-installation.json
      - name: Install exact generated Flutter Pod SDK27 compatibility wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_STAGE_EXACT_POD_HELPER'
          import base64,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and root.is_dir() and not root.is_symlink()
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='844f94f282d2787ccb754e7efc885f732244650993cd4f826e43c16b040ac931'
          target=root/'sdk27_generated_flutter_pod_REVIEW.py'
          assert not target.exists() and not target.is_symlink()
          with target.open('xb') as output:output.write(raw)
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='844f94f282d2787ccb754e7efc885f732244650993cd4f826e43c16b040ac931'
          PY_STAGE_EXACT_POD_HELPER
          python3 "$RUNNER_TEMP/sdk27_generated_flutter_pod_REVIEW.py" install
      - name: Resolve existing dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          pod install --project-directory=ios
      - name: Regenerate Pods a second time through the persistent exact wrapper
        shell: bash
        run: |
          set -euo pipefail
          pod install --project-directory=ios
      - name: Verify real generated Flutter Pod floor before minimal target build
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sdk27_generated_flutter_pod_REVIEW.py" verify
      - name: Build only the generated Flutter Pod simulator target without signing
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/toolchain-smoke
          mkdir -p "$out"
          xcodebuild -version > "$out/xcode-version.txt"
          xcrun --sdk iphonesimulator --show-sdk-version > "$out/simulator-sdk-version.txt"
          set +e
          xcodebuild -project ios/Pods/Pods.xcodeproj -target Flutter             -configuration Debug -sdk iphonesimulator -arch arm64             SYMROOT="$RUNNER_TEMP/bil-sdk27-smoke-products"             OBJROOT="$RUNNER_TEMP/bil-sdk27-smoke-objects"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build             > "$out/flutter-target-xcodebuild.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$out/flutter-target-xcodebuild.exit"
          cat "$out/flutter-target-xcodebuild.log"
          exit "$status"
      - name: Verify generated settings remain effective and record smoke-only result
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sdk27_generated_flutter_pod_REVIEW.py" verify
          python3 - <<'PY_SMOKE_RESULT'
          import json,pathlib
          out=pathlib.Path('artifacts/toolchain-smoke')
          assert (out/'flutter-target-xcodebuild.exit').read_text().strip()=='0'
          (out/'result.json').write_text(json.dumps({'status':'TOOLCHAIN_SMOKE_ONLY_NOT_APP_QA','generated_Flutter_target_build':'PASS','application_XCTest_executed':False,'application_integration_scopes_executed':False,'native_performance_proven':False,'signed_artifact_proven':False,'release_acceptance':False},indent=2)+'\n')
          PY_SMOKE_RESULT
      - name: Preserve original toolchain diagnostics and exact generated Pod project on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-sdk27-generated-pod-toolchain-smoke-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/toolchain-smoke
            ${{ runner.temp }}/bil-sdk27-pod-evidence
            ${{ runner.temp }}/sdk27_generated_flutter_pod_REVIEW.py
            ios/Pods/Pods.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14
