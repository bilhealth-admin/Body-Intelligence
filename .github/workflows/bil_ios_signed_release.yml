name: BIL iOS signed release candidate

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the validated build to TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed-ios-release:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require Apple signing inputs
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${CERTIFICATE_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_DISTRIBUTION_CERTIFICATE_BASE64'; exit 1; }
          test -n "${CERTIFICATE_PASSWORD:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD'; exit 1; }
          test -n "${PROVISIONING_PROFILE_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_PROVISIONING_PROFILE_BASE64'; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_TEAM_ID'; exit 1; }
          test -n "${ASC_KEY_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_KEY_ID'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_ISSUER_ID'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_PRIVATE_KEY_BASE64'; exit 1; }

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/BIL.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/BIL-profile.plist"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/BIL-profile.plist")"
          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.com.bilhealth.bodyintelligencelog" || {
            echo 'Provisioning profile does not authorize the BIL production bundle identifier.' >&2
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.healthkit' "$RUNNER_TEMP/BIL-profile.plist" \
            | grep -Eiq 'true|YES' || {
              echo 'Provisioning profile does not authorize HealthKit.' >&2
              exit 1
            }

      - name: Resolve and validate source
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --timeout 30s
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerDebug.entitlements

      - name: Build signed archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" ios/Runner.xcodeproj/project.pbxproj
          flutter build ipa --release --no-pub --export-method app-store

      - name: Capture signed IPA evidence
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -s "$IPA"
          codesign -dv --verbose=4 build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app 2> BIL-ios-codesign.txt
          codesign -d --entitlements :- \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
            > BIL-ios-entitlements.plist
          test "$(plutil -extract application-identifier raw BIL-ios-entitlements.plist)" \
            = "$APPLE_TEAM_ID.com.bilhealth.bodyintelligencelog"
          plutil -extract com.apple.developer.healthkit raw BIL-ios-entitlements.plist \
            | grep -Eiq 'true|YES'
          shasum -a 256 "$IPA" | tee BIL-ios-ipa.sha256
          stat -f '%z' "$IPA" | tee BIL-ios-ipa.size
          git rev-parse HEAD | tee BIL-source-head.txt

      - name: Validate candidate with App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload validated build to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: bil-ios-signed-ipa-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/ipa/*.ipa
            BIL-ios-codesign.txt
            BIL-ios-entitlements.plist
            BIL-ios-ipa.sha256
            BIL-ios-ipa.size
            BIL-source-head.txt

      - name: Remove App Store Connect private key
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
