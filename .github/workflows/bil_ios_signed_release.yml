name: S11 offline Android Python preflight

on:
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        description: Full SHA of this reviewed controller commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-preflight:
    name: Frozen S11 and reviewed fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BIL_EXPECT_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Check out the immutable S11 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bddb81888240a0931ad56eda02735d3e4f2e0b76
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tool/release

      - name: Write the reviewed offline runner outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bil-s11-offline.py" <<'BIL_PYTHON'
          """Record per-case results from standard unittest discovery, with raw output separately."""
          import ast
          import base64
          from collections import Counter
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import traceback
          import unittest
          import zlib
          
          SOURCE = "bddb81888240a0931ad56eda02735d3e4f2e0b76"
          TREE = "c2bee734ff811543906cdbaba8db33dfa48982f6"
          FIXTURE = "tool/release/test_android_emulator_fresh_install.py"
          BEFORE_SHA256 = "fa374bcd36c951c071ee40d32d4c276fe738451e27540c57537ed50133174b0a"
          AFTER_SHA256 = "a44a03a8cf46cc5df1c143c1f2d37f22149b080b26cdf16b2b00606ba853b76f"
          BEFORE_BLOB = "9324cc61ffa76dff7b90f5f8e68b15d9e3b89bec"
          AFTER_BLOB = "9188e33b7bb29d4148d9f7cfe42b583469870a58"
          PATCH_SHA256 = "d35db12be5d68ea6386eec675bc67e466766f9ec509175226c90d476b242fa89"
          PATCH_B64 = ""
          REGISTRY_FILE = ".github/workflows/bil_ios_signed_release.yml"
          CONTROLLER = "refs/heads/codex/bil-s11-android-offline-preflight-20261121"
          REPO = "bilhealth-admin/Body-Intelligence"
          WORKFLOW = ".github/workflows/bil_android_isolated_emulator_smoke.yml"
          SUITE_COUNTS = {
              "test_android_emulator_launch_options.py": 4,
              "test_configure_android_emulator_display.py": 16,
              "test_configure_android_emulator_memory.py": 14,
              "test_android_emulator_fresh_install.py": 14,
              "test_android_startup_workflow.py": 12,
              "test_verify_android_startup_frame.py": 35,
              "test_classify_android_startup_anr.py": 8,
              "test_prepare_android_emulator_action.py": 10,
              "test_android_emulator_unlock.py": 43,
          }
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          def write_json(file, data):
              file.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          
          def suite_list():
              source = Path(WORKFLOW).read_text(encoding="utf-8")
              block = source.split("      - name: Verify offline emulator tooling and select explicit renderer", 1)[1].split("\n      - name:", 1)[0]
              lines = [line.strip() for line in block.splitlines() if "python3 -m unittest" in line]
              commands = {}
              for line in lines:
                  argv = shlex.split(line)
                  require(argv[:7] == ["python3", "-m", "unittest", "discover", "-s", "tool/release", "-p"]
                          and len(argv) in (8, 9) and argv[8:] in ([], ["-v"]), "Unexpected workflow test invocation")
                  require(argv[7] not in commands, "Duplicate suite")
                  commands[argv[7]] = argv
              require(list(commands) == list(SUITE_COUNTS), "S11 workflow suite list changed")
              return commands
          
          def named_cases(suite):
              module = Path(suite).stem
              tree = ast.parse(Path("tool/release", suite).read_text(encoding="utf-8"))
              return {module + "." + cls.name + "." + method.name
                      for cls in tree.body if isinstance(cls, ast.ClassDef)
                      for method in cls.body if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")}
          
          def report_suite(json_file, argv):
              records = []
              class NamedResults(unittest.TextTestResult):
                  def record(self, test, outcome):
                      records.append({"name": test.id(), "outcome": outcome})
                  def addSuccess(self, test):
                      super().addSuccess(test)
                      self.record(test, "pass")
                  def addFailure(self, test, err):
                      super().addFailure(test, err)
                      self.record(test, "failure")
                  def addError(self, test, err):
                      super().addError(test, err)
                      self.record(test, "error")
                  def addSkip(self, test, reason):
                      super().addSkip(test, reason)
                      self.record(test, "skip")
                  def addExpectedFailure(self, test, err):
                      super().addExpectedFailure(test, err)
                      self.record(test, "expected_failure")
                  def addUnexpectedSuccess(self, test):
                      super().addUnexpectedSuccess(test)
                      self.record(test, "unexpected_success")
              class Reporter(unittest.TextTestRunner):
                  resultclass = NamedResults
              # The argv after "unittest" is taken directly from the frozen workflow.
              program = unittest.main(module=None, argv=["unittest", *argv], testRunner=Reporter, exit=False)
              result = program.result
              counts = {"run": result.testsRun, "failure": len(result.failures), "error": len(result.errors),
                        "skip": len(result.skipped), "expected_failure": len(result.expectedFailures),
                        "unexpected_success": len(result.unexpectedSuccesses)}
              counts["pass"] = sum(item["outcome"] == "pass" for item in records)
              write_json(json_file, {"counts": counts, "named": records})
              return 0 if result.wasSuccessful() else 1
          
          def run_bounded(directory, name, args):
              proc = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=270)
              require(len(proc.stdout) <= 2_000_000, "Unexpected log size")
              (directory / (name + ".log")).write_bytes(proc.stdout)
              return proc.returncode, proc.stdout.decode(errors="replace")
          
          def bind():
              env = os.environ
              expected, controller = env["BIL_EXPECT_CONTROLLER_SHA"], env["GITHUB_SHA"]
              require(re.fullmatch(r"[0-9a-f]{40}", expected) and expected == controller == env["GITHUB_WORKFLOW_SHA"], "Controller SHA mismatch")
              require(env["GITHUB_EVENT_NAME"] == "workflow_dispatch" and env["GITHUB_REPOSITORY"] == REPO and
                      env["GITHUB_REF"] == CONTROLLER and env["GITHUB_WORKFLOW_REF"] == REPO + "/" + REGISTRY_FILE + "@" + CONTROLLER,
                      "Workflow, repository or controller ref mismatch")
              require(env["GITHUB_RUN_ATTEMPT"] == "1" and re.fullmatch(r"[1-9][0-9]*", env["GITHUB_RUN_ID"]), "First attempt required")
              require(git("rev-parse", "HEAD") == SOURCE and git("rev-parse", "HEAD^{tree}") == TREE, "Source mismatch")
              return {"repo": REPO, "source": SOURCE, "tree": TREE, "controller": controller,
                      "ref": CONTROLLER, "workflow_ref": env["GITHUB_WORKFLOW_REF"], "workflow_sha": env["GITHUB_WORKFLOW_SHA"],
                      "run_id": env["GITHUB_RUN_ID"], "run_attempt": env["GITHUB_RUN_ATTEMPT"],
                      "runner_os": env["RUNNER_OS"], "python": sys.version}
          
          def verify_worktree(modified):
              require(git("diff", "--cached", "--name-only") == "", "Index changed")
              require(git("ls-files", "--others", "--exclude-standard") == "", "Untracked source-checkout files")
              expected = FIXTURE if modified else ""
              require(git("diff", "--name-only") == expected, "Unexpected tracked paths")
              require(git("rev-parse", "HEAD:" + FIXTURE) == BEFORE_BLOB, "Frozen fixture blob changed")
              require(git("hash-object", FIXTURE) == (AFTER_BLOB if modified else BEFORE_BLOB), "Working fixture blob mismatch")
              require(sha(Path(FIXTURE).read_bytes()) == (AFTER_SHA256 if modified else BEFORE_SHA256), "Working fixture hash mismatch")
          
          def validate(directory, receipt):
              receipt["binding"] = bind()
              verify_worktree(False)
              receipt["before"] = {"blob": BEFORE_BLOB, "sha256": BEFORE_SHA256}
              commands = suite_list()
              fixture = Path(FIXTURE).name
              red_args = [sys.executable, "-m", "unittest", *commands[fixture][3:],
                          "-k", "test_fresh_install_launches_once_without_any_data_clear"]
              code, output = run_bounded(directory, "original-causal-red", red_args)
              receipt["original_causal_red"] = {"exit": code, "matched": code == 1 and "99 != 0" in output and "Ran 1 test in" in output
                  and "Unexpected validator boundary: tool/release/configure_android_emulator_memory.py verify-runtime --api-level 33 --evidence-dir artifacts/release/android_emulator_smoke/api-33" in output}
              require(receipt["original_causal_red"]["matched"], "Original failure signature did not reproduce")
              patch = zlib.decompress(base64.b64decode(PATCH_B64, validate=True))
              require(sha(patch) == PATCH_SHA256, "Patch digest mismatch")
              for args in (["git", "-c", "core.autocrlf=false", "apply", "--check", "-"], ["git", "-c", "core.autocrlf=false", "apply", "-"]):
                  subprocess.run(args, input=patch, check=True)
              verify_worktree(True)
              receipt["candidate"] = {"path": FIXTURE, "blob": AFTER_BLOB, "sha256": AFTER_SHA256, "patch_sha256": PATCH_SHA256}
              totals = Counter()
              for name, argv in commands.items():
                  report = directory / (name + ".json")
                  code, _ = run_bounded(directory, name, [sys.executable, str(Path(__file__).resolve()), "--report-suite",
                                                             str(report), *argv[3:]])
                  summary = json.loads(report.read_text())
                  ids = [entry["name"] for entry in summary["named"]]
                  expected = named_cases(name)
                  counts = summary["counts"]
                  valid = (code == 0 and counts["pass"] == counts["run"] == SUITE_COUNTS[name] and len(ids) == len(set(ids))
                           and set(ids) == expected and all(entry["outcome"] == "pass" for entry in summary["named"])
                           and all(value == 0 for key, value in counts.items() if key not in ("pass", "run")))
                  totals.update(counts)
                  receipt["suites"].append({"suite": name, "workflow_command": shlex.join(argv),
                                            "exit": code, "counts": counts, "named_report": report.name, "pass": valid})
                  write_json(directory / "result.json", receipt)
                  print(name, counts, flush=True)
              for api in (26, 29, 33, 34, 35, 36):
                  code, opts = run_bounded(directory, "options-api-" + str(api), [sys.executable,
                                     "tool/release/android_emulator_launch_options.py", "--api-level", str(api)])
                  mode = "software" if api == 36 else "swiftshader_indirect"
                  require(code == 0 and opts.strip() == "options=-no-window -gpu " + mode + " -no-snapshot -noaudio -no-boot-anim", "Renderer output changed")
                  receipt["renderer"][str(api)] = opts.strip()
              verify_worktree(True)
              receipt["totals"] = dict(totals)
              require(len(receipt["suites"]) == 9 and all(row["pass"] for row in receipt["suites"]) and
                      totals["run"] == totals["pass"] == 156, "Named candidate tests incomplete or unsuccessful")
              receipt["passed"] = True
          
          def main():
              if sys.argv[1:2] == ["--report-suite"]:
                  return report_suite(Path(sys.argv[2]), sys.argv[3:])
              directory = Path(os.environ["RUNNER_TEMP"]) / "bil-s11-offline-preflight"
              directory.mkdir(exist_ok=False)
              receipt = {"passed": False, "suites": [], "renderer": {}}
              try:
                  validate(directory, receipt)
              except Exception:
                  receipt["error"] = traceback.format_exc()
                  print(receipt["error"], file=sys.stderr)
              finally:
                  write_json(directory / "result.json", receipt)
              return 0 if receipt["passed"] else 1
          
          if __name__ == "__main__":
              sys.exit(main())
          BIL_PYTHON

      - name: Reproduce the original failure and verify every candidate suite
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bil-s11-offline.py"

      - name: Preserve named outcomes, raw logs and exact run binding
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-s11-offline-preflight-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bil-s11-offline-preflight/
          if-no-files-found: error
          retention-days: 7
