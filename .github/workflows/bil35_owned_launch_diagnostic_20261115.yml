name: BIL35 owned launch exit and memory diagnostic
run-name: One original37.1.11 API33 guest; no app or reviewer credentials
'on':
  push:
    branches:
    - codex/bil35-owned-launch-diagnostic-20261115
permissions:
  contents: read
concurrency:
  group: bil35-owned-launch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned-launch-cause:
    if: github.repository == 'bilhealth-admin/Body-Intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout immutable application source for existing KVM preparation only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2916d20612b919e126765be25b7df5b8da95eb4d
        fetch-depth: 1
        persist-credentials: false
    - name: Require isolated credential-free owned launch diagnostic
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$RUNNER_OS" = Linux
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_REPOSITORY" = bilhealth-admin/Body-Intelligence
        test "$GITHUB_REF_NAME" = codex/bil35-owned-launch-diagnostic-20261115
        test -z "${BIL_GOOGLE_REVIEWER_EMAIL+x}"
        test -z "${BIL_GOOGLE_REVIEWER_PASSWORD+x}"
        test -z "${GH_TOKEN+x}"
        mkdir -p artifacts/owned-launch-safe
    - name: Prepare exact owned diagnostic helper bytes 1
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY_OWNED_TRANSPORT'
        import base64,hashlib,json,os,zlib
        from pathlib import Path
        def check(v):
            if not v:raise ValueError('OWNED_TRANSPORT_INTEGRITY_REJECTED')
        records = json.loads('[{"name":"pinned_emulator_install.py","raw_bytes":13918,"raw_sha256":"2866a426da596012d20a88750f441238c8123c11469d1c6ba9d83350998d2195","compressed_base64":"","compressed_sha256":"4b1f4d0037e343ae0c3dedba2aca002bdcb42ff29b9f814140da9c9caebff44b"},{"name":"read_only_emulator_host.py","raw_bytes":7355,"raw_sha256":"7e89dcf27db83d6f774a93375e41b6c988248e7c09f693d155e8221011306354","compressed_base64":"","compressed_sha256":"c6875a7db522ff8915833ea9aab741923f1fd6c9f5118cc57b03d0851e0819f9"},{"name":"pinned_emulator_guard.py","raw_bytes":7092,"raw_sha256":"e63c4d7f4b31613aa2c45eae9a7218aee7e1b6a82b52af7bffc5244128c79795","compressed_base64":"","compressed_sha256":"106796bcc8a3bad06fb51cc98830854a60db1d60c08dd1db3a5eae61ccf53221"}]')
        allowed=('pinned_emulator_install.py', 'read_only_emulator_host.py', 'pinned_emulator_guard.py', 'host_libpulse_prerequisite.py', 'owned_emulator_launcher.py', 'apply_owned_action_probe.py')
        root=Path(os.environ['RUNNER_TEMP']).resolve(strict=True);check(root.is_dir())
        prepared=[];seen=set()
        for r in records:
            check(set(r)=={'name','raw_bytes','raw_sha256','compressed_base64','compressed_sha256'})
            name=r['name'];check(name in allowed and name not in seen);seen.add(name)
            check(type(r['raw_bytes']) is int and 0<r['raw_bytes']<=512*1024)
            packed=base64.b64decode(r['compressed_base64'],validate=True)
            check(hashlib.sha256(packed).hexdigest()==r['compressed_sha256'])
            dec=zlib.decompressobj();raw=dec.decompress(packed,r['raw_bytes']+1)
            check(dec.eof and not dec.unused_data and not dec.unconsumed_tail)
            check(len(raw)==r['raw_bytes'] and hashlib.sha256(raw).hexdigest()==r['raw_sha256'])
            p=root/name;check(not p.exists() and not p.is_symlink());prepared.append((p,raw))
        for p,raw in prepared:
            with p.open('xb') as f:f.write(raw)
        PY_OWNED_TRANSPORT
    - name: Prepare exact owned diagnostic helper bytes 2
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY_OWNED_TRANSPORT'
        import base64,hashlib,json,os,zlib
        from pathlib import Path
        def check(v):
            if not v:raise ValueError('OWNED_TRANSPORT_INTEGRITY_REJECTED')
        records = json.loads('[{"name":"host_libpulse_prerequisite.py","raw_bytes":4427,"raw_sha256":"2e4d709baa1888b8b1b60366791bd0421b771fdcc08c4c4886c8b6ff0d6f4b7f","compressed_base64":"","compressed_sha256":"5032f0ade2b477607bcc03a88d68772ff6a56b5ec68fd50dfddb136052e79ab1"},{"name":"owned_emulator_launcher.py","raw_bytes":14300,"raw_sha256":"828f833ed84598c2f920cf0111e0e3efe70d1e5ddf2cdd629e51069d965296a8","compressed_base64":"","compressed_sha256":"42059692e8ed70e97ecf3852ccd6e9f5d5b7123d3b08f3ed7b7bee56d799b039"},{"name":"apply_owned_action_probe.py","raw_bytes":3457,"raw_sha256":"7fbdb5213e9bb7539e440f381659705aa1e345bb63ebf5c72436565d781d1061","compressed_base64":"","compressed_sha256":"b21a2eaecf5147db2a0ce36985eb1fe00bbd4bbf042f5555fc40f1157a99a7f7"}]')
        allowed=('pinned_emulator_install.py', 'read_only_emulator_host.py', 'pinned_emulator_guard.py', 'host_libpulse_prerequisite.py', 'owned_emulator_launcher.py', 'apply_owned_action_probe.py')
        root=Path(os.environ['RUNNER_TEMP']).resolve(strict=True);check(root.is_dir())
        prepared=[];seen=set()
        for r in records:
            check(set(r)=={'name','raw_bytes','raw_sha256','compressed_base64','compressed_sha256'})
            name=r['name'];check(name in allowed and name not in seen);seen.add(name)
            check(type(r['raw_bytes']) is int and 0<r['raw_bytes']<=512*1024)
            packed=base64.b64decode(r['compressed_base64'],validate=True)
            check(hashlib.sha256(packed).hexdigest()==r['compressed_sha256'])
            dec=zlib.decompressobj();raw=dec.decompress(packed,r['raw_bytes']+1)
            check(dec.eof and not dec.unused_data and not dec.unconsumed_tail)
            check(len(raw)==r['raw_bytes'] and hashlib.sha256(raw).hexdigest()==r['raw_sha256'])
            p=root/name;check(not p.exists() and not p.is_symlink());prepared.append((p,raw))
        for p,raw in prepared:
            with p.open('xb') as f:f.write(raw)
        PY_OWNED_TRANSPORT
    - name: Require all final helper bytes before any execution
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_OWNED_ALL_BYTES'
        import hashlib,json,os
        from pathlib import Path
        expected = json.loads('{"pinned_emulator_install.py":{"bytes":13918,"sha256":"2866a426da596012d20a88750f441238c8123c11469d1c6ba9d83350998d2195"},"read_only_emulator_host.py":{"bytes":7355,"sha256":"7e89dcf27db83d6f774a93375e41b6c988248e7c09f693d155e8221011306354"},"pinned_emulator_guard.py":{"bytes":7092,"sha256":"e63c4d7f4b31613aa2c45eae9a7218aee7e1b6a82b52af7bffc5244128c79795"},"host_libpulse_prerequisite.py":{"bytes":4427,"sha256":"2e4d709baa1888b8b1b60366791bd0421b771fdcc08c4c4886c8b6ff0d6f4b7f"},"owned_emulator_launcher.py":{"bytes":14300,"sha256":"828f833ed84598c2f920cf0111e0e3efe70d1e5ddf2cdd629e51069d965296a8"},"apply_owned_action_probe.py":{"bytes":3457,"sha256":"7fbdb5213e9bb7539e440f381659705aa1e345bb63ebf5c72436565d781d1061"}}')
        root=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
        for name,description in expected.items():
            p=root/name
            if not p.is_file() or p.is_symlink():raise ValueError('OWNED_RUNTIME_BYTES_DIFFER')
            raw=p.read_bytes()
            if len(raw)!=description['bytes'] or hashlib.sha256(raw).hexdigest()!=description['sha256']:raise ValueError('OWNED_RUNTIME_BYTES_DIFFER')
        PY_OWNED_ALL_BYTES
    - name: Checkout the pinned owned emulator action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ReactiveCircus/android-emulator-runner
        ref: 4c44018e59b437e86cdfc41da381398f93ed8808
        path: artifacts/tooling/bil-android-emulator-action
        persist-credentials: 'false'
    - name: Instrument and verify exactly one owned launch callsite
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/apply_owned_action_probe.py"
        node --check artifacts/tooling/bil-android-emulator-action/lib/emulator-manager.js
    - name: Require isolated accelerated runner and exact API33 emulator tooling
      shell: bash
      run: |
        set -euo pipefail
        bash .github/scripts/bil_prepare_android_kvm.sh
        test "$(nproc)" -ge 4
    - name: Require the proven libpulse0 loader prerequisite
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/host_libpulse_prerequisite.py" --evidence "$GITHUB_WORKSPACE/artifacts/owned-launch-safe"
    - name: Observe one identical pinned guest for 300 seconds after boot
      uses: ./artifacts/tooling/bil-android-emulator-action
      with:
        api-level: '33'
        arch: x86_64
        target: google_apis
        profile: pixel_6
        cores: '4'
        ram-size: 4096M
        force-avd-creation: 'true'
        disable-animations: 'true'
        emulator-boot-timeout: '900'
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        pre-emulator-launch-script: python3 "$RUNNER_TEMP/pinned_emulator_guard.py" --prepare --evidence "$GITHUB_WORKSPACE/artifacts/owned-launch-safe"
        script: |
          python3 "$RUNNER_TEMP/pinned_emulator_guard.py" --verify-before-reviewer --evidence "$GITHUB_WORKSPACE/artifacts/owned-launch-safe"
          python3 "$RUNNER_TEMP/owned_emulator_launcher.py" --observe
    - name: Preserve actual owned child exit and stop only the read-only observer
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if test -f "$GITHUB_WORKSPACE/artifacts/owned-launch-safe/READ_ONLY_HOST_EMULATOR_LIVENESS.json"; then
          python3 "$RUNNER_TEMP/read_only_emulator_host.py" --stop --evidence "$GITHUB_WORKSPACE/artifacts/owned-launch-safe"
        fi
        python3 "$RUNNER_TEMP/owned_emulator_launcher.py" --finalize
    - name: Preserve only bounded safe owned launch evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bil35-owned-launch-safe-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: artifacts/owned-launch-safe/
        if-no-files-found: error
        retention-days: 14
