name: BIL Community final format probe

on:
  push:
    branches:
      - staging/community-final-qa-20261003

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Emit exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/app/launch/bil_verified_links_configuration.dart \
            lib/features/community/presentation/community_feed_tab.dart \
            test/apple_preparation/ios_return_to_app_link_contract_test.dart \
            test/features/community/community_comment_threads_v3_contract_test.dart \
            test/features/community/community_referral_client_contract_test.dart \
            test/launch_readiness/verified_links_and_analytics_test.dart
          git diff -- \
            lib/app/launch/bil_verified_links_configuration.dart \
            lib/features/community/presentation/community_feed_tab.dart \
            test/apple_preparation/ios_return_to_app_link_contract_test.dart \
            test/features/community/community_comment_threads_v3_contract_test.dart \
            test/features/community/community_referral_client_contract_test.dart \
            test/launch_readiness/verified_links_and_analytics_test.dart
