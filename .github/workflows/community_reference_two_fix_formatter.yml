name: Community reference two-fix formatter

on:
  push:
    branches:
      - work/community-reference-parity-20261003

permissions:
  contents: write

concurrency:
  group: community-reference-two-fix-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format exact files
        run: |
          set -euo pipefail
          dart format \
            lib/features/community/presentation/community_hub_page.dart \
            lib/features/community/presentation/community_post_composer_switch_row.dart \
            lib/features/community/presentation/community_post_composer_rendering.dart \
            lib/features/community/presentation/community_member_profile_content.dart \
            test/features/community/community_reference_parity_v1_test.dart
          git diff --check
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "bil-community-qa"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style(community): format final two fixes"
          git push origin HEAD:work/community-reference-parity-20261003
