name: BIL explicit reviewed association apply 20261020

on:
  push:
    branches: [ops/site-association-apply-20261020]
    paths: [.github/workflows/bil_site_association_apply_20261020.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: bil-public-site-production
  cancel-in-progress: false

jobs:
  guarded-recovery:
    if: ${{ github.repository == 'bilhealth-admin/Body-Intelligence' && github.event_name == 'push' && github.ref == 'refs/heads/ops/site-association-apply-20261020' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5d2a12b60ef9649dd9df14d95b8e092ae7ee2c71
          path: controller
          persist-credentials: false
          sparse-checkout: tool/release_ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bf23994712ffbdcb2d8179defec5852e5d08ae1
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public_site/
            /tool/release/
            /wrangler.site.jsonc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify controller negative controls without network
        working-directory: controller/tool/release_ops
        run: python3 -m unittest -v test_public_site_diagnosis.py test_site_recovery_20261020.py test_bootstrap_site_npm_11.py
      - name: Verify reviewed successful read-only preflight and exact immutable backup before fresh preparation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGATE'
          import hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          repo = "bilhealth-admin/Body-Intelligence"
          controller = "5d2a12b60ef9649dd9df14d95b8e092ae7ee2c71"
          controller_tree = "c3f696288763788290fd9dd45f6705869fa63a4e"
          source = "6bf23994712ffbdcb2d8179defec5852e5d08ae1"
          preflight_id = 39423254315
          backup_id = 12264462815
          backup_digest = "047e973d30d10e33f448397e28297fa3a9249fbd0a2bb7f274d55d03be82e5c5"
          apply_branch = "refs/heads/ops/site-association-apply-20261020"
          apply_path = ".github/workflows/bil_site_association_apply_20261020.yml"
          def require(condition, code):
              if not condition:
                  raise SystemExit(code)
          def api(path, raw=False):
              result = subprocess.run(["gh", "api", "repos/" + repo + "/" + path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(result.returncode == 0, "REVIEW_BINDING_GITHUB_READ_FAILED")
              return result.stdout if raw else json.loads(result.stdout)
          def git(path, revision):
              result = subprocess.run(["git", "-C", path, "rev-parse", revision], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(result.returncode == 0, "REVIEW_BINDING_LOCAL_GIT_FAILED")
              return result.stdout.decode().strip()
          actual_head = os.environ.get("GITHUB_SHA", "")
          require(os.environ.get("GITHUB_REPOSITORY") == repo and os.environ.get("GITHUB_EVENT_NAME") == "push" and
              os.environ.get("GITHUB_REF") == apply_branch and re.fullmatch(r"[0-9a-f]{40}", actual_head) is not None,
              "EXPLICIT_APPLY_EVENT_OR_BRANCH_MISMATCH")
          require(os.environ.get("GITHUB_WORKFLOW_REF") == repo + "/" + apply_path + "@" + apply_branch and
              os.environ.get("GITHUB_WORKFLOW_SHA") == actual_head, "ACTUAL_APPLY_WORKFLOW_CONTEXT_MISMATCH")
          require(git("controller", "HEAD") == controller and git("controller", "HEAD^{tree}") == controller_tree and
              git("candidate", "HEAD") == source, "PINNED_REVIEWED_CHECKOUT_MISMATCH")
          run = api("actions/runs/" + str(preflight_id))
          require(run.get("id") == preflight_id and run.get("status") == "completed" and run.get("conclusion") == "success" and
              run.get("head_sha") == controller and run.get("head_branch") == "ops/site-association-recovery-20261020" and
              run.get("event") == "push" and run.get("path") == ".github/workflows/bil_site_association_recovery_20261020.yml" and
              run.get("repository", {}).get("full_name") == repo, "REVIEWED_PREFLIGHT_RUN_NOT_BOUND_SUCCESS")
          commit = api("commits/" + controller)
          require(commit.get("sha") == controller and commit.get("commit", {}).get("tree", {}).get("sha") == controller_tree,
              "REVIEWED_CONTROLLER_TREE_MISMATCH")
          actual_commit = api("commits/" + actual_head)
          require(actual_commit.get("sha") == actual_head and
              re.fullmatch(r"[0-9a-f]{40}", actual_commit.get("commit", {}).get("tree", {}).get("sha", "")) is not None,
              "ACTUAL_APPLY_WORKFLOW_COMMIT_NOT_RESOLVED")
          jobs = api("actions/runs/" + str(preflight_id) + "/jobs?per_page=100")
          require(jobs.get("total_count") == 1 and isinstance(jobs.get("jobs"), list) and len(jobs["jobs"]) == 1,
              "REVIEWED_PREFLIGHT_JOB_INVENTORY_MISMATCH")
          job = jobs["jobs"][0]
          require(job.get("id") == 118629272637 and job.get("name") == "guarded-recovery" and
              job.get("status") == "completed" and job.get("conclusion") == "success", "REVIEWED_PREFLIGHT_JOB_FAILED")
          steps = {row.get("name"): row.get("conclusion") for row in job.get("steps", [])}
          required = [
              "Verify controller negative controls without network",
              "Preserve current version and compare every proposed reachable asset before any mutation",
              "Install pinned Wrangler and its official exported asset collector without lifecycle scripts",
              "Run complete existing Worker, merge, public policy and generator tests on frozen source",
              "Verify pinned Wrangler dry-run with both restored association files in the local upload inventory",
              "Upload immutable prechange backup before deployment is possible",
              "Preserve final evidence and any actual failed postchecks",
          ]
          require(all(steps.get(name) == "success" for name in required) and
              steps.get("Recheck current actor/source/public state and deploy only exact frozen restoration") == "skipped",
              "REVIEWED_PREFLIGHT_REQUIRED_GATE_NOT_PASSED_OR_APPLY_NOT_SKIPPED")
          backup = api("actions/artifacts/" + str(backup_id))
          require(backup.get("id") == backup_id and backup.get("expired") is False and
              backup.get("name") == "bil-site-recovery-backup-" + str(preflight_id) and
              backup.get("digest") == "sha256:" + backup_digest and backup.get("size_in_bytes") == 3500536 and
              backup.get("workflow_run", {}).get("id") == preflight_id and
              backup["workflow_run"].get("head_sha") == controller and
              backup["workflow_run"].get("head_branch") == "ops/site-association-recovery-20261020",
              "REVIEWED_PREFLIGHT_BACKUP_METADATA_MISMATCH")
          raw = api("actions/artifacts/" + str(backup_id) + "/zip", raw=True)
          require(len(raw) == 3500536 and hashlib.sha256(raw).hexdigest() == backup_digest,
              "REVIEWED_PREFLIGHT_BACKUP_BYTES_MISMATCH")
          reviewed_documents = {
              "preflight.json": "77f392abab291475c4d56ec038b5fc436c6f3e9f7b354a781a6c3675b448976d",
              "official-wrangler-inventory.json": "09c9f2cb822e842aa94c983d7848c5659bcbae3d897f81b9adb9ab0aaa95876c",
              "contracts.json": "b5b8be4f4c62343e937bcf69498e224638fced57d907386baf6fb44ac8cc7a7b",
          }
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              require(len(archive.namelist()) == len(set(archive.namelist())), "REVIEWED_BACKUP_DUPLICATE_MEMBER")
              for name, digest in reviewed_documents.items():
                  require(hashlib.sha256(archive.read(name)).hexdigest() == digest, "REVIEWED_PREFLIGHT_DOCUMENT_CHANGED")
          output = Path("recovery-evidence")
          output.mkdir(parents=True, exist_ok=True)
          receipt = {
              "status": "PASS", "mode": "EXPLICIT_REVIEWED_SINGLE_SITE_APPLY", "production_changed_by_binding_gate": False,
              "actual_workflow_head_sha": actual_head, "actual_workflow_tree": actual_commit["commit"]["tree"]["sha"],
              "actual_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"], "actual_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "actual_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "actual_push_ref": apply_branch,
              "verified_helper_controller_sha": controller, "verified_helper_controller_tree": controller_tree,
              "frozen_site_source_sha": source, "reviewed_preflight_run_id": preflight_id, "reviewed_preflight_job_id": job["id"],
              "reviewed_preflight_backup_artifact_id": backup_id, "reviewed_preflight_backup_sha256": backup_digest,
              "reviewed_preflight_document_sha256": reviewed_documents,
              "authorization_scope": "Restore the two exact recovered association files using reviewed visible frozen6bf site configuration, after all fresh gates and an uploaded prechange backup; no store submission authorization",
          }
          (output / "explicit-apply-review-binding.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("REVIEWED_PREFLIGHT_AND_EXACT_BACKUP_BINDING=PASS")
          PYGATE
      - name: Preserve current version and compare every proposed reachable asset before any mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 controller/tool/release_ops/site_recovery_20261020.py prepare candidate recovery-evidence
      - name: Install pinned Wrangler and its official exported asset collector without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/bil-site-toolchain"
          evidence="$GITHUB_WORKSPACE/recovery-evidence/npm-toolchain"
          mkdir -p "$toolchain" "$evidence"
          cp controller/tool/release_ops/site-recovery-toolchain-package.json "$toolchain/package.json"
          cp "$toolchain/package.json" "$evidence/package.json"
          touch "$toolchain/npm-user-config" "$toolchain/npm-global-config"
          node --version > "$evidence/node-version.txt"
          npm --version > "$evidence/npm-version.txt"
          python3 controller/tool/release_ops/bootstrap_site_npm_11.py "$RUNNER_TEMP/bil-site-npm11" "$evidence/npm11-bootstrap"
          node "$RUNNER_TEMP/bil-site-npm11/package/bin/npm-cli.js" --version > "$evidence/active-npm-version.txt"
          npm_status=0
          (
            cd "$toolchain"
            NPM_CONFIG_USERCONFIG="$toolchain/npm-user-config" NPM_CONFIG_GLOBALCONFIG="$toolchain/npm-global-config" \
              node "$RUNNER_TEMP/bil-site-npm11/package/bin/npm-cli.js" install --ignore-scripts --workspaces=false --no-audit --no-fund \
              --registry=https://registry.npmjs.org/ --cache "$RUNNER_TEMP/bil-site-npm-cache"
          ) > "$evidence/install.log" 2>&1 || npm_status=$?
          if test -f "$toolchain/package-lock.json"; then
            cp "$toolchain/package-lock.json" "$evidence/package-lock.json"
          fi
          python3 - "$RUNNER_TEMP/bil-site-npm-cache/_logs" "$evidence/npm-diagnostic.json" "$npm_status" <<'PY'
          import json, pathlib, re, sys
          logs = pathlib.Path(sys.argv[1])
          reports = []
          for path in sorted(logs.glob("*-debug-*.log")) if logs.is_dir() else []:
              value = path.read_text(encoding="utf-8", errors="replace")
              frames = []
              for line in value.splitlines():
                  if "verbose stack" not in line:
                      continue
                  match = re.search(r"\bat ([A-Za-z0-9_.$<>#]+).*?[/\\]([A-Za-z0-9_.-]+\.js):(\d+):(\d+)", line)
                  if match:
                      frames.append({"function": match[1], "file": match[2], "line": int(match[3]), "column": int(match[4])})
              reports.append({"log_name": path.name, "null_edges_out": "Cannot read properties of null (reading 'edgesOut')" in value,
                  "error_codes": sorted(set(re.findall(r"^\d+ error code ([A-Z0-9_-]+)$", value, flags=re.M))),
                  "stack_frames": frames[:30]})
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"npm_exit_code": int(sys.argv[3]), "debug_summaries": reports,
              "raw_debug_logs_retained": False, "secret_or_environment_values_included": False}, indent=2) + "\n")
          PY
          if test "$npm_status" -ne 0; then
            cat "$evidence/install.log"
            exit "$npm_status"
          fi
      - name: Run complete existing Worker, merge, public policy and generator tests on frozen source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/release/generate_app_link_associations.py --self-test
          node --test tool/release/bilhealth_site_worker.test.mjs tool/release/merge_site_associations.test.mjs tool/release/public_policy_pages.test.mjs
          node ../controller/tool/release_ops/validate_recovered_site.mjs . ../recovery-evidence
      - name: Verify pinned Wrangler dry-run with both restored association files in the local upload inventory
        working-directory: candidate
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/bil-site-toolchain/node_modules/wrangler/bin/wrangler.js" deploy --config "$GITHUB_WORKSPACE/recovery-evidence/deploy-project/wrangler.recovery.json" --no-bundle --keep-vars --dry-run --outdir "$GITHUB_WORKSPACE/recovery-evidence/wrangler-dry-run" > ../recovery-evidence/wrangler-dry-run.log 2>&1
          node ../controller/tool/release_ops/verify_official_site_inventory.mjs . ../recovery-evidence "$RUNNER_TEMP/bil-site-toolchain"
      - name: Upload immutable prechange backup before deployment is possible
        id: backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-site-recovery-backup-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Recheck current actor/source/public state and deploy only exact frozen restoration
        if: ${{ success() && github.repository == 'bilhealth-admin/Body-Intelligence' && github.event_name == 'push' && github.ref == 'refs/heads/ops/site-association-apply-20261020' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 992830d7894ba09161ff0a411fe4154b
          BIL_BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BIL_BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 controller/tool/release_ops/site_recovery_20261020.py deploy candidate recovery-evidence
      - name: Preserve final evidence and any actual failed postchecks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-site-recovery-result-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 30



