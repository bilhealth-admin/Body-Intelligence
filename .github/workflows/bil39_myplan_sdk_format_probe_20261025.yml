name: BIL39 My Plan exact SDK formatter evidence only
on:
  push:
    branches: [bil39/myplan-20261025]
    paths: [.github/workflows/bil39_myplan_sdk_format_probe_20261025.yml]
permissions:
  contents: read
jobs:
  format-only:
    if: github.repository == 'bilhealth-admin/Body-Intelligence'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only exact My Plan-owned source and visual test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'lib/features/smart_plan/presentation/bil_smart_plan_progress_sections.dart',
            'test/features/smart_plan/bil_smart_plan_visual_surface_test.dart'
          )
          dart --version
          dart format @targets
          if ($LASTEXITCODE -ne 0) { throw 'dart formatter failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          foreach ($path in $targets) {
            $dst = Join-Path 'build/bil39-myplan-official-format' $path
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item -LiteralPath $path -Destination $dst
          }
          git diff -- @targets | Set-Content -Encoding utf8 build/bil39-myplan-official-format/sdk-diff.patch
          git rev-parse HEAD | Set-Content build/bil39-myplan-official-format/base-head.txt
      - name: Upload official formatted source, no private data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil39-myplan-sdk-format-${{ github.sha }}
          path: build/bil39-myplan-official-format/
          retention-days: 2
          if-no-files-found: error
