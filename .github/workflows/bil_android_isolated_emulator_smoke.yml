name: BIL API26 lifecycle probe DIAGNOSTIC NOT six-lane acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-api26-lifecycle-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug-emulator:
    name: API26 instrumented lifecycle probe NOT source-six acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bil-android26-lifecycle-probe-20261121' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            profile: pixel_2
            ram-size: ""

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5c2a3c4ac35bc7c4d2bc72c27c160ba89607d96e
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Apply the same pinned SDK repairs as the audited source
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/release/prepare_android_policy_plugin_overrides.py
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=android
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Inject hash-bound CI-only MainActivity and owned diagnostic payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_API26_PROBE_OWNED'
          import base64,hashlib,json,os,pathlib,subprocess
          S="5c2a3c4ac35bc7c4d2bc72c27c160ba89607d96e";T="0298d6d98b50533ffe84dc2fa2a696d733ece8e1";BRANCH="codex/bil-android26-lifecycle-probe-20261121";WF=".github/workflows/bil_android_isolated_emulator_smoke.yml"
          assert os.environ.get("GITHUB_ACTIONS")=="true" and os.environ.get("RUNNER_OS")=="Linux"
          assert os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch" and os.environ["GITHUB_REF"]=="refs/heads/"+BRANCH
          g=lambda *a:subprocess.check_output(["git",*a]).decode().strip()
          assert g("rev-parse","HEAD")==S and g("rev-parse","HEAD^{tree}")==T
          C=os.environ["GITHUB_SHA"]
          assert C!=S and g("rev-list","--parents","-n","1",C).split()==[C,S]
          assert g("diff-tree","--no-commit-id","--name-status","--no-renames","-r",S,C).splitlines()==["M\t"+WF]
          version=json.loads(subprocess.check_output(["flutter","--version","--machine"]))
          assert version["frameworkVersion"]=="3.44.6" and version["frameworkRevision"]=="ee80f08bbf97172ec030b8751ceab557177a34a6"
          assert version["engineRevision"]=="83675ed27633283e7fc296c8bca22e841224c096"
          target=pathlib.Path("android/app/src/main/kotlin/com/bilhealth/bodyintelligencelog/MainActivity.kt")
          assert hashlib.sha256(target.read_bytes()).hexdigest()=="eab26ced3a7e796887ca573f7290c19924a76dcab46891513c64ee1c9fa472f3"
          payloads={'MainActivity.kt': {'sha256': '6ec12375cc1eb9b7651e5231189c656b9d482942716238a7ebd316d5dd5d74dd', 'bytes': 32128, 'base64': ''}, 'original_smoke_owned_evidence_only.sh': {'sha256': 'fa4abc9b08fc9ab1f831098c1eeb3cac75cbe0dd78f3018a3353bcccf0fe240a', 'bytes': 8789, 'base64': ''}, 'run_owned_cases.sh': {'sha256': '2772db895f448e7d5521897a8627dd6361ae7fbb80ab722fd3741e5227540342', 'bytes': 5674, 'base64': ''}, 'summarize_observations.py': {'sha256': 'fa923ec9bcb4b5e97e01482246671657358e1c1fe916d2d2b7fa6e3a2b5b4bd5', 'bytes': 9867, 'base64': ''}, 'trigger_update_appinfo_once.py': {'sha256': 'e7a3d5fa1c14b682b9b8e5ed9748667740557ec8463de3c896fe955c61a65942', 'bytes': 3305, 'base64': ''}}
          root=pathlib.Path("artifacts/tooling/bil-api26-probe");assert not root.exists();root.mkdir(parents=True)
          for name,meta in payloads.items():
           raw=base64.b64decode(meta["base64"],validate=True)
           assert len(raw)==meta["bytes"] and hashlib.sha256(raw).hexdigest()==meta["sha256"]
           dest=root/name
           with dest.open("xb") as out:out.write(raw)
           assert dest.read_bytes()==raw
          main=(root/"MainActivity.kt").read_bytes()
          with target.open("r+b") as out:out.seek(0);out.write(main);out.truncate()
          assert target.read_bytes()==main
          evidence=pathlib.Path("artifacts/release/android26_lifecycle_probe");evidence.mkdir(parents=True,exist_ok=True)
          record={"source_sha":S,"source_tree":T,"controller_sha":C,"controller_branch":BRANCH,"instrumented_app":True,"six_lane_acceptance":False,"signed_or_public_acceptance":False,"modified_source_file":"android/app/src/main/kotlin/com/bilhealth/bodyintelligencelog/MainActivity.kt","original_main_sha256":"eab26ced3a7e796887ca573f7290c19924a76dcab46891513c64ee1c9fa472f3","instrumented_main_sha256":hashlib.sha256(main).hexdigest(),"payloads":{name:{k:v for k,v in meta.items() if k!="base64"} for name,meta in payloads.items()},"flutter":version,"sdk_or_jar_modified":False}
          with (evidence/"INSTRUMENTED_APP_SOURCE_SCOPE_NOT_ACCEPTANCE.json").open("x") as out:json.dump(record,out,indent=2);out.write("\n")
          PY_API26_PROBE_OWNED

      - name: Build un-signed local-only Android debug APK
        shell: bash
        run: >-
          python3 tool/release/retry_android_maven429_build.py --
          flutter build apk --debug --no-pub --build-number 33
          --dart-define=BIL_ENVIRONMENT=testing
          --dart-define=BIL_USE_SUPABASE=false
          --dart-define=SUPABASE_URL=
          --dart-define=SUPABASE_ANON_KEY=
          --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=false
          --dart-define=BIL_PAYMENTS_ENABLED=false
          --dart-define=BIL_ADS_ENABLED=false
          --dart-define=BIL_COMMUNITY_ENABLED=false
          --dart-define=BIL_PUSH_ENABLED=false

      - name: Execute all eight real Android integrity lease unit tests once
        if: matrix.api-level == 26
        shell: bash
        run: |
          set -euo pipefail
          (
            cd android
            ./gradlew :app:testDebugUnitTest --tests com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest --no-daemon --console=plain
          )
          python3 - <<'PY_INTEGRITY_LEASE_RESULTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('build/app/test-results/testDebugUnitTest/TEST-com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest.xml')
          suite = ET.parse(path).getroot()
          expected = {
              'exactObjectAndSingleUse', 'wrongHandleCannotConsumeCurrent',
              'expiresAtExactMonotonicDeadline', 'validUntilDeadline',
              'newestTokenSupersedesOldExactResponse', 'releasingStaleLeaseCannotRetireNewToken',
              'currentReleaseAndDisposeClearExactResponse',
              'unrelatedNonremediationResponseCannotOverwriteRecoveryResponse',
          }
          cases = suite.findall('testcase')
          if (suite.tag != 'testsuite' or suite.get('name') != 'com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest'
                  or len(cases) != 8 or {row.get('name') for row in cases} != expected
                  or any(row.get('classname') != suite.get('name') for row in cases)
                  or suite.get('tests') != '8'
                  or any(int(suite.get(key, '-1')) != 0 for key in ('failures', 'errors', 'skipped'))
                  or any(row.find(kind) is not None for row in cases for kind in ('failure', 'error', 'skipped'))):
              raise ValueError('Exactly eight successful, unskipped Android integrity lease unit tests are required')
          print('ANDROID_INTEGRITY_LEASE_JUNIT: 8 PASS, 0 FAIL, 0 ERROR, 0 SKIP')
          PY_INTEGRITY_LEASE_RESULTS

      - name: Preserve actual Android integrity lease unit reports
        if: always() && matrix.api-level == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil48-android-integrity-lease-unit-${{ github.sha }}
          path: |
            build/app/test-results/testDebugUnitTest
            build/app/reports/tests/testDebugUnitTest
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for the isolated emulator
        shell: bash
        run: bash .github/scripts/bil_prepare_android_kvm.sh

      - name: Verify offline emulator tooling and select explicit renderer
        id: emulator-options
        shell: bash
        env:
          BIL_ANDROID_API: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_launch_options.py'
          python3 -m unittest discover -s tool/release -p 'test_configure_android_emulator_display.py'
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_fresh_install.py' -v
          python3 -m unittest discover -s tool/release -p 'test_android_startup_workflow.py'
          python3 -m unittest discover -s tool/release -p 'test_verify_android_startup_frame.py'
          python3 -m unittest discover -s tool/release -p 'test_classify_android_startup_anr.py'
          python3 -m unittest discover -s tool/release -p 'test_prepare_android_emulator_action.py'
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_unlock.py'
          python3 tool/release/android_emulator_launch_options.py --api-level "$BIL_ANDROID_API" >> "$GITHUB_OUTPUT"

      - name: Record the hosted VM resource budget before emulator startup
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}'
          mkdir -p "$evidence"
          {
            printf 'host_cpu_threads=%s\nemulator_cpu_cores=2\n' "$(nproc)"
            printf 'emulator_ram_override=%s\n' '${{ matrix.ram-size }}'
            printf 'emulator_options=%s\n' '${{ steps.emulator-options.outputs.options }}'
            free -m
          } > "$evidence/host-resources.txt"

      - name: Checkout the exact emulator action into owned tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: 4c44018e59b437e86cdfc41da381398f93ed8808
          path: artifacts/tooling/bil-android-emulator-action
          persist-credentials: false

      - name: Verify and prepare the owned emulator bootstrap
        shell: bash
        run: >-
          python3 tool/release/prepare_android_emulator_action.py
          --action-dir artifacts/tooling/bil-android-emulator-action
          --api-level ${{ matrix.api-level }}
          --evidence-dir artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}

      - name: Install and launch BIL offline on API ${{ matrix.api-level }} with verified bootstrap
        uses: ./artifacts/tooling/bil-android-emulator-action
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          cores: 2
          ram-size: ${{ matrix.ram-size }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: ${{ steps.emulator-options.outputs.options }}
          pre-emulator-launch-script: |
            python3 tool/release/configure_android_emulator_display.py configure --api-level ${{ matrix.api-level }} --config "$ANDROID_AVD_HOME/test.avd/config.ini" --evidence-dir 'artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}'
            adb kill-server || true
            adb start-server
            adb version
          script: BIL_ANDROID_EMULATOR_API=26 bash artifacts/tooling/bil-api26-probe/run_owned_cases.sh

      - name: Preserve all original case outcomes and instrumented APK identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-android26-lifecycle-probe-5c2a3c4ac35bc7c4d2bc72c27c160ba89607d96e-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            artifacts/release/android26_lifecycle_probe
            artifacts/release/android_emulator_smoke/api-26
            artifacts/tooling/bil-api26-probe
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
