# INERT: Root-approved complete Source17 unit gate, recipe hashes and registry binding required before activation.
name: Source17 android-startup-missing5
on:
  workflow_dispatch:
    inputs:
      api36_only:
        description: Run only API 36 to verify its repaired startup environment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bil-android-isolated-emulator-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 6c0dfbab576e797d24b42310e9194db2f1664188
  SOURCE_TREE: bc22c3881ecc5cad8f3ee78d0a784de9e246e1a0
  CONTROLLER_BRANCH: codex/bil-s17-android-startup-missing5-20261122
jobs:
  android-debug-emulator:
    name: Android ${{ matrix.api-level }} offline-config startup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(
        inputs.api36_only == true &&
          '{"include":[{"api-level":36,"profile":"pixel_6","ram-size":"4096M"}]}'
        || '{"include":[{"api-level":26,"profile":"pixel_2"},{"api-level":33,"profile":"pixel_6","ram-size":"4096M"},{"api-level":34,"profile":"pixel_6","ram-size":"4096M"},{"api-level":35,"profile":"pixel_6","ram-size":"4096M"},{"api-level":36,"profile":"pixel_6","ram-size":"4096M"}]}'
        ) }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c0dfbab576e797d24b42310e9194db2f1664188
          persist-credentials: false
      - name: Verify immutable source and one-file native controller provenance
        shell: bash
        env:
          BINDING_JOB_KEY: android-startup-${{ matrix.api-level }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Embedded in a future tests-only GitHub controller. Never run locally."""
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)
          
          def git(*args, env=None):
              try:
                  result = subprocess.run(['git', *args], env=env, capture_output=True, timeout=90)
              except (subprocess.TimeoutExpired, OSError):
                  raise RuntimeError('PROVENANCE_GIT_TIMEOUT_OR_OS_ERROR_NO_RAW_OUTPUT') from None
              require(result.returncode == 0, 'PROVENANCE_GIT_FAILED_NO_RAW_STDERR')
              return result.stdout
          
          
          def fetch_controller(controller, fetch_env):
              # Retry only this read of the same immutable controller, never a ref or push.
              # A successful fetch still grants no binding: all checks below must finish.
              for attempt in range(1, 3):
                  try:
                      result = subprocess.run(
                          ['git', 'fetch', '--no-tags', '--depth=1', 'origin', controller],
                          env=fetch_env, capture_output=True, timeout=180,
                      )
                  except (subprocess.TimeoutExpired, OSError):
                      fetched = False
                  else:
                      fetched = result.returncode == 0
                  if fetched:
                      return
                  if attempt < 2:
                      print(json.dumps({'provenance_fetch_attempt': attempt,
                                        'status': 'RETRYING_SAME_IMMUTABLE_CONTROLLER'}))
              raise RuntimeError('PROVENANCE_FETCH_FAILED_AFTER_2_ATTEMPTS_NO_RAW_OUTPUT') from None
          
          source = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']
          controller = os.environ['GITHUB_SHA']
          branch = os.environ['CONTROLLER_BRANCH']
          workflow = '.github/workflows/bil_android_isolated_emulator_smoke.yml'
          require(all(re.fullmatch('[a-f0-9]{40}', value) for value in (source, source_tree, controller)), 'INVALID_IMMUTABLE_BINDING')
          require(source != controller, 'SOURCE_AND_CONTROLLER_MUST_BE_DISTINCT')
          require(os.environ['GITHUB_REPOSITORY'] == 'bilhealth-admin/Body-Intelligence', 'WRONG_REPOSITORY')
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'DISPATCH_ONLY')
          require(os.environ['GITHUB_REF'] == 'refs/heads/' + branch, 'WRONG_CONTROLLER_REF')
          require(os.environ['GITHUB_WORKFLOW_SHA'] == controller, 'WORKFLOW_AND_RUN_CONTROLLER_DIFFER')
          require(git('rev-parse', 'HEAD').decode().strip() == source, 'SOURCE_HEAD_DRIFT')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == source_tree, 'SOURCE_TREE_DRIFT')
          require(not git('status', '--porcelain', '--untracked-files=no').strip(), 'SOURCE_NOT_PRISTINE')
          # Git credentials remain disabled in the checkout. Only this read-only child
          # receives an ephemeral header; no token/header is printed, stored or in argv.
          fetch_env = dict(os.environ)
          fetch_env.update(GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never', GCM_GUI_PROMPT='0')
          token = fetch_env.get('GH_TOKEN')
          require(isinstance(token, str) and bool(token), 'READONLY_GITHUB_TOKEN_REQUIRED')
          config_count = fetch_env.get('GIT_CONFIG_COUNT', '0')
          require(re.fullmatch(r'\d+', config_count) is not None and int(config_count) < 100, 'GIT_CHILD_CONFIG_COUNT_INVALID')
          slot = str(int(config_count))
          fetch_env['GIT_CONFIG_KEY_' + slot] = 'http.https://github.com/.extraheader'
          fetch_env['GIT_CONFIG_VALUE_' + slot] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          fetch_env['GIT_CONFIG_COUNT'] = str(int(config_count) + 1)
          for key in list(fetch_env):
              if key.upper().startswith(('GIT_TRACE', 'GCM_TRACE')) or key.upper() == 'GIT_CURL_VERBOSE':
                  fetch_env.pop(key)
          try:
              fetch_controller(controller, fetch_env)
          finally:
              fetch_env.pop('GH_TOKEN', None)
              fetch_env.pop('GIT_CONFIG_VALUE_' + slot, None)
              token = None
          require(git('rev-parse', 'FETCH_HEAD').decode().strip() == controller, 'CONTROLLER_FETCH_DRIFT')
          commit = git('cat-file', '-p', controller).decode('utf-8')
          parents = [line.split(' ', 1)[1] for line in commit.split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          require(parents == [source], 'CONTROLLER_MUST_HAVE_EXACT_SOURCE_PARENT')
          changed = git('diff-tree', '--no-commit-id', '--no-abbrev', '--raw', '-r', source, controller).decode().splitlines()
          require(len(changed) == 1, 'CONTROLLER_MUST_CHANGE_EXACTLY_ONE_WORKFLOW')
          fields = changed[0].split('\t')
          require(len(fields) == 2 and fields[1] == workflow, 'CONTROLLER_CHANGED_UNREVIEWED_PATH')
          metadata = fields[0].split()
          require(len(metadata) == 5 and metadata[0:2] == [':100644', '100644'] and metadata[4] == 'M', 'CONTROLLER_WORKFLOW_MODE_OR_OPERATION_CHANGED')
          workflow_bytes = git('show', controller + ':' + workflow)
          report = {
              'schema': 'bil49.tests-only-source-controller-binding.v1',
              'status': 'VERIFIED_BINDING_ONLY_NOT_TEST_RESULT',
              'source_sha': source, 'source_tree': source_tree,
              'controller_sha': controller,
              'controller_tree': git('rev-parse', controller + '^{tree}').decode().strip(),
              'controller_parent': source, 'controller_branch': branch,
              'workflow_path': workflow,
              'workflow_sha256': hashlib.sha256(workflow_bytes).hexdigest(),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job_key': os.environ['BINDING_JOB_KEY'],
              'event': 'workflow_dispatch',
              'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'release_approval': False,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'bil49-source-binding' / 'source-provenance.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({key: report[key] for key in ('source_sha', 'source_tree', 'controller_sha', 'controller_tree', 'job_key', 'status')}))
          PY

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Apply the same pinned SDK repairs as the audited source
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/release/prepare_android_policy_plugin_overrides.py
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=android
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Build un-signed local-only Android debug APK
        shell: bash
        run: >-
          python3 tool/release/retry_android_maven429_build.py --
          flutter build apk --debug --no-pub --build-number 33
          --dart-define=BIL_ENVIRONMENT=testing
          --dart-define=BIL_USE_SUPABASE=false
          --dart-define=SUPABASE_URL=
          --dart-define=SUPABASE_ANON_KEY=
          --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=false
          --dart-define=BIL_PAYMENTS_ENABLED=false
          --dart-define=BIL_ADS_ENABLED=false
          --dart-define=BIL_COMMUNITY_ENABLED=false
          --dart-define=BIL_PUSH_ENABLED=false

      - name: Execute all eight real Android integrity lease unit tests once
        if: matrix.api-level == 26
        shell: bash
        run: |
          set -euo pipefail
          (
            cd android
            ./gradlew :app:testDebugUnitTest --tests com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest --no-daemon --console=plain
          )
          python3 - <<'PY_INTEGRITY_LEASE_RESULTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('build/app/test-results/testDebugUnitTest/TEST-com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest.xml')
          suite = ET.parse(path).getroot()
          expected = {
              'exactObjectAndSingleUse', 'wrongHandleCannotConsumeCurrent',
              'expiresAtExactMonotonicDeadline', 'validUntilDeadline',
              'newestTokenSupersedesOldExactResponse', 'releasingStaleLeaseCannotRetireNewToken',
              'currentReleaseAndDisposeClearExactResponse',
              'unrelatedNonremediationResponseCannotOverwriteRecoveryResponse',
          }
          cases = suite.findall('testcase')
          if (suite.tag != 'testsuite' or suite.get('name') != 'com.bilhealth.bodyintelligencelog.BILIntegrityTokenLeaseTest'
                  or len(cases) != 8 or {row.get('name') for row in cases} != expected
                  or any(row.get('classname') != suite.get('name') for row in cases)
                  or suite.get('tests') != '8'
                  or any(int(suite.get(key, '-1')) != 0 for key in ('failures', 'errors', 'skipped'))
                  or any(row.find(kind) is not None for row in cases for kind in ('failure', 'error', 'skipped'))):
              raise ValueError('Exactly eight successful, unskipped Android integrity lease unit tests are required')
          print('ANDROID_INTEGRITY_LEASE_JUNIT: 8 PASS, 0 FAIL, 0 ERROR, 0 SKIP')
          PY_INTEGRITY_LEASE_RESULTS

      - name: Preserve actual Android integrity lease unit reports
        if: always() && matrix.api-level == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil48-android-integrity-lease-unit-${{ github.sha }}
          path: |
            build/app/test-results/testDebugUnitTest
            build/app/reports/tests/testDebugUnitTest
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for the isolated emulator
        shell: bash
        run: bash .github/scripts/bil_prepare_android_kvm.sh

      - name: Verify offline emulator tooling and select explicit renderer
        id: emulator-options
        shell: bash
        env:
          BIL_ANDROID_API: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_launch_options.py'
          python3 -m unittest discover -s tool/release -p 'test_configure_android_emulator_display.py'
          python3 -m unittest discover -s tool/release -p 'test_configure_android_emulator_memory.py'
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_fresh_install.py' -v
          python3 -m unittest discover -s tool/release -p 'test_android_startup_workflow.py'
          python3 -m unittest discover -s tool/release -p 'test_verify_android_startup_frame.py'
          python3 -m unittest discover -s tool/release -p 'test_classify_android_startup_anr.py'
          python3 -m unittest discover -s tool/release -p 'test_prepare_android_emulator_action.py'
          python3 -m unittest discover -s tool/release -p 'test_android_emulator_unlock.py'
          python3 tool/release/android_emulator_launch_options.py --api-level "$BIL_ANDROID_API" >> "$GITHUB_OUTPUT"

      - name: Record the hosted VM resource budget before emulator startup
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}'
          mkdir -p "$evidence"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$evidence/host-provisioning-apk.sha256"
          ps -eo pid,ppid,comm,pcpu,rss > "$evidence/host-processes-before-gradle-stop.txt"
          (
            cd android
            timeout 45s ./gradlew --stop --console=plain
          ) > "$evidence/host-gradle-stop.txt" 2>&1
          sha256sum --check "$evidence/host-provisioning-apk.sha256"
          ps -eo pid,ppid,comm,pcpu,rss > "$evidence/host-processes-after-gradle-stop.txt"
          {
            printf 'host_cpu_threads=%s\nemulator_cpu_cores=2\n' "$(nproc)"
            printf 'emulator_ram_override=%s\n' '${{ matrix.ram-size }}'
            printf 'emulator_options=%s\n' '${{ steps.emulator-options.outputs.options }}'
            free -m
          } > "$evidence/host-resources.txt"

      - name: Checkout the exact emulator action into owned tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: 4c44018e59b437e86cdfc41da381398f93ed8808
          path: artifacts/tooling/bil-android-emulator-action
          persist-credentials: false

      - name: Verify and prepare the owned emulator bootstrap
        shell: bash
        run: >-
          python3 tool/release/prepare_android_emulator_action.py
          --action-dir artifacts/tooling/bil-android-emulator-action
          --api-level ${{ matrix.api-level }}
          --evidence-dir artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}

      - name: Install and launch BIL offline on API ${{ matrix.api-level }} with verified bootstrap
        uses: ./artifacts/tooling/bil-android-emulator-action
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          cores: 2
          ram-size: ${{ matrix.ram-size }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: ${{ steps.emulator-options.outputs.options }}
          pre-emulator-launch-script: |
            python3 tool/release/configure_android_emulator_memory.py configure --api-level ${{ matrix.api-level }} --config "$ANDROID_AVD_HOME/test.avd/config.ini" --evidence-dir 'artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}'
            python3 tool/release/configure_android_emulator_display.py configure --api-level ${{ matrix.api-level }} --config "$ANDROID_AVD_HOME/test.avd/config.ini" --evidence-dir 'artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}'
            adb kill-server || true
            adb start-server
            adb version
          script: BIL_ANDROID_EMULATOR_API=${{ matrix.api-level }} bash tool/release/run_android_emulator_smoke.sh

      - name: Upload startup screenshots and metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil-android-api${{ matrix.api-level }}-startup-${{ github.sha }}
          path: artifacts/release/android_emulator_smoke/api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve immutable source and native controller provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil49-source17-native-android-startup-missing5-android-startup-${{ matrix.api-level }}-${{ env.SOURCE_SHA }}-${{ github.sha }}
          path: ${{ runner.temp }}/bil49-source-binding/source-provenance.json
          if-no-files-found: error
          retention-days: 30

