name: BIL offline SQLite runtime
on:
  push:
    branches: [qa/coach-community-next-20261005]
    paths: [.github/workflows/bil_offline_sqlite_runtime.yml]
permissions:
  contents: read
jobs:
  sqlite-runtime:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/coach-community-next-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Download unmodified pinned dependency, not user data
        run: |
          set -euo pipefail
          mkdir -p /tmp/bil-sqlite
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.4.0/libsqlite3.x64.linux.so -o /tmp/bil-sqlite/libsqlite3.so
          test "$(stat -c %s /tmp/bil-sqlite/libsqlite3.so)" -lt 16777216
          sha256sum /tmp/bil-sqlite/libsqlite3.so > /tmp/bil-sqlite/sha256.txt
          printf 'Unmodified sqlite3-3.4.0 upstream binary; verify its SHA against the pinned Dart package before offline use. No deployment or application build.\n' > /tmp/bil-sqlite/scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-offline-sqlite-${{ github.sha }}
          path: /tmp/bil-sqlite
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
