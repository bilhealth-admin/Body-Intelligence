name: Frozen 31554 three blocked SQL fixtures corrected only in QA
run-name: "Frozen 31554 - THREE previously failed rollback SQL scopes, consent-before-profile"
on:
  push:
    branches: [qa/bil-independent-31554-20261022]
    paths:
      - .github/workflows/bil_qa_reorder_three_failed_consent_sql_20261022.yml

permissions:
  contents: read

concurrency:
  group: frozen31554-three-consent-fixture-recovery
  cancel-in-progress: false

env:
  BIL_FROZEN_SHA: 31554b3e078667a38bd3c53aa105f5f1d2a4dc96
  BIL_QA_HARNESS_SHA: ${{ github.sha }}
  BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb

jobs:
  exact-production-policy-fixture-repair:
    name: One QA-only reorder; real 3x rollback checks and independent residue
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BIL_FROZEN_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BIL_QA_HARNESS_SHA }}
          path: qa-harness
          sparse-checkout: |
            tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py
            tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Pin immutable original, prove ALL THREE exact SQL transformations OFFLINE first
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIL_FROZEN_SHA"
          python3 -m py_compile qa-harness/tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py qa-harness/tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py
          python3 qa-harness/tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py --self-test --source . --output "$RUNNER_TEMP/frozen-consent-sql"
          test -z "$(git diff --name-only HEAD)"
          echo "EXACT_3_SOURCE_SQL_BLOBS; CONSENT_BEFORE_PROFILE_ONLY; ALL_ASSERTIONS_INTACT"
      - name: First former failure only - community prebuild exact original rollback E2E
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          printf '%s' "$BIL_SUPABASE_PROJECT_REF" > supabase/.temp/project-ref
          export GITHUB_SHA="$BIL_FROZEN_SHA"
          python3 qa-harness/tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py --source . --scope community_prebuild --output "$RUNNER_TEMP/frozen-consent-sql/community_prebuild"
      - name: Second former failure only - collaborator privacy exact original rollback E2E
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          export GITHUB_SHA="$BIL_FROZEN_SHA"
          python3 qa-harness/tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py --source . --scope community_collaborator_privacy --output "$RUNNER_TEMP/frozen-consent-sql/community_collaborator_privacy"
      - name: Third former failure only - latest policy exact original rollback E2E
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          export GITHUB_SHA="$BIL_FROZEN_SHA"
          python3 qa-harness/tools/qa/frozen_guarded_sql_consent_fixture_order_20261022.py --source . --scope community_policy_20261019 --output "$RUNNER_TEMP/frozen-consent-sql/community_policy_20261019"
      - name: Reprove product SHA untouched, never waive a failed assertion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIL_FROZEN_SHA"
          test -z "$(git diff --name-only HEAD)"
          echo "THREE_REAL_ROLLBACK_ASSERTIONS_AND_INDEPENDENT_RESIDUE_PASS; NO_TESTFLIGHT"
      - name: Save original E2E receipts, strict overlays and sanitized failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen31554-qa-consent-fixture-three-sql-${{ github.run_id }}
          path: ${{ runner.temp }}/frozen-consent-sql/
          if-no-files-found: warn
          retention-days: 30
