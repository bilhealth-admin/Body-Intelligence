name: BIL QUALITY temporary invalid-route Dart formatter
on:
  pull_request:
    paths:
      - .github/workflows/bil_quality_temp_format_invalid_route.yml
permissions:
  contents: write
jobs:
  format-qa-only:
    if: github.head_ref == 'qa/bil-stability-flicker-data-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install Flutter 3.44.6 / matching Dart formatter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only invalid route locale file and push fast forward
        shell: bash
        env:
          TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$TRIGGER_HEAD" ]; then
            echo "Ref mismatch: $current != $TRIGGER_HEAD"
            exit 1
          fi
          dart format lib/app/localization/runtime_copy_invalid_route.dart
          git diff --check
          git fetch origin qa/bil-stability-flicker-data-20261008
          if [ "$(git rev-parse FETCH_HEAD)" != "$TRIGGER_HEAD" ]; then
            echo "Branch advanced: stop without writing"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/app/localization/runtime_copy_invalid_route.dart
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m 'style(quality): apply Dart 3.12 formatter to invalid route labels'
            git push origin HEAD:qa/bil-stability-flicker-data-20261008
          fi
