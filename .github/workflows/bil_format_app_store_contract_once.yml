name: BIL one-shot App Store contract formatter

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913

permissions:
  contents: write

concurrency:
  group: bil-format-app-store-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: codex/build18-ai-coach-no-loading-flash-20260913
          fetch-depth: 0

      - name: Install Flutter release toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Format App Store rejection contract
        shell: bash
        run: |
          set -euo pipefail
          dart format test/platform_readiness/app_store_rejection_compliance_contract_test.dart
          rm .github/workflows/bil_format_app_store_contract_once.yml

      - name: Commit formatter output and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/platform_readiness/app_store_rejection_compliance_contract_test.dart
          git add .github/workflows/bil_format_app_store_contract_once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format App Store compliance contract"
          git push origin HEAD:codex/build18-ai-coach-no-loading-flash-20260913
