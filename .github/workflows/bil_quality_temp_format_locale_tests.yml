name: BIL QUALITY temporary locale formatter
on:
  pull_request:
    paths:
      - .github/workflows/bil_quality_temp_format_locale_tests.yml
permissions:
  contents: write
jobs:
  format-two-regression-tests:
    if: github.head_ref == 'qa/bil-stability-flicker-data-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/bil-stability-flicker-data-20261008
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Flutter and Dart version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format exactly the two tests and commit on current branch
        shell: bash
        env:
          TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$TRIGGER_HEAD" ]; then
            echo "Head moved, skipping; trigger=$TRIGGER_HEAD checked-out=$current"
            exit 0
          fi
          paths=(
            test/features/analytics/analytics_home_tooltip_locale_test.dart
            test/features/connected_health/health_source_display_25_locale_test.dart
          )
          dart format "${paths[@]}"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'style(quality): apply matching Dart formatter to locale regressions'
            git push origin HEAD:qa/bil-stability-flicker-data-20261008
          fi
