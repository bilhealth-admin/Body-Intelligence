name: build18-build17-baseline-diagnostics

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913

permissions:
  contents: read

concurrency:
  group: build18-build17-baseline-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build17-windows-baseline:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact successful Build 17 source
        uses: actions/checkout@v4
        with:
          ref: 6004b78e8c06f6e419ebe6042296baf17a6d0c62

      - name: Install Build 17 release Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve Build 17 packages
        run: flutter pub get

      - name: Probe Build 17 AI Coach live-refresh contract
        shell: pwsh
        run: |
          flutter test --no-pub test/features/commerce/ai_coach_live_refresh_contract_test.dart --plain-name "AI Coach access refreshes after usage, purchase, and restore"
          $code = $LASTEXITCODE
          Write-Host "BUILD17_AI_LIVE_REFRESH_EXIT=$code"
          exit 0

      - name: Probe Build 17 iPhone Arabic profile golden
        shell: pwsh
        run: |
          flutter test --no-pub test/epic15_store_screenshot_golden_test.dart --plain-name "iphone_69 Arabic RTL store screenshots"
          $code = $LASTEXITCODE
          Write-Host "BUILD17_EPIC15_PROFILE_EXIT=$code"
          exit 0

      - name: Probe Build 17 profile visual-closure golden
        shell: pwsh
        run: |
          flutter test --no-pub test/visual_closure/actual_data_pages_golden_test.dart --plain-name "profile production populated state capture"
          $code = $LASTEXITCODE
          Write-Host "BUILD17_VISUAL_PROFILE_EXIT=$code"
          exit 0

      - name: Probe Build 17 acknowledgement test three times
        shell: pwsh
        run: |
          $failures = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            flutter test --no-pub test/features/commerce/store_transaction_queue_test.dart --plain-name "acknowledgement failure after verification cannot enable a second purchase"
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          Write-Host "BUILD17_STORE_ACK_FAILURES=$failures/3"
          exit 0
