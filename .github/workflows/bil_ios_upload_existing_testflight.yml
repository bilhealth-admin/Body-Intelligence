name: BIL iOS49 original signed IPA to internal TestFlight
run-name: iOS49 exact original IPA promotion; no rebuild or App Store submission
on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Upload the already verified original IPA once
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: bil-ios49-testflight-one-shot
  cancel-in-progress: false
env:
  BIL_VALIDATION_MODE: exact_source_ci_separate_controller
  BIL_TESTED_SOURCE: a626536de190099969fc8a12e9df90abe4b4ac8d
  BIL_TESTED_SOURCE_SHA: a626536de190099969fc8a12e9df90abe4b4ac8d
  BIL_SIGNING_ORCHESTRATION_SHA: 15fa80de7c18802ca5a28396412d6fd657055ed4
  BIL_SIGNED_RUN: '44861922081'
  BIL_SIGNED_ARTIFACT: '14690791360'
  BIL_IPA_SHA256: 6895b60e99b277f6c496ffa7e29a3d8e5effe0433fc87966c084829223cba793
jobs:
  promote-existing-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_upload == true }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout accepted application source without rebuilding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a626536de190099969fc8a12e9df90abe4b4ac8d
          fetch-depth: 0
          persist-credentials: false
      - name: Create evidence directory
        run: mkdir -p evidence

      - name: Verify original producer and both one-file controller boundaries before Apple credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          python3 - <<'PY_BIND'
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          PINS={'source_sha': 'a626536de190099969fc8a12e9df90abe4b4ac8d', 'signed_controller_sha': '15fa80de7c18802ca5a28396412d6fd657055ed4', 'signed_controller_workflow_sha256': '26c90fa8e12290ab7ba382a4852b78ffd8685338e9dc8dad2ecb47a202fcf857', 'signed_run_id': 44861922081, 'signed_artifact_id': 14690791360, 'signed_artifact_digest': 'sha256:88e4964400a32b733b8f62f39b3858f5976dab0480f418925912fb0de54893bf', 'ipa_sha256': '6895b60e99b277f6c496ffa7e29a3d8e5effe0433fc87966c084829223cba793', 'symbol_binding_sha256': '6143639b3c44c06911a675995f32060aa8657179cc3da2ac536b7a4a005cfeac', 'archive_zip_sha256': '57da84c0359387b2b9599384340982b5717089722c398800bda38f203594c695', 'symbol_verifier_sha256': '330bb48f7daed0ab13840c41a7527aaf329d0ab65ca0403fac09bdf5336c5b12'}
          SOURCE=PINS['source_sha'];SOURCE_TREE='ab50e3b863f46a0476a5ff87be06b5d6ac91ec15';REPO='bilhealth-admin/Body-Intelligence'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+REPO+path]))
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  while b:=f.read(1024*1024):h.update(b)
              return h.hexdigest()
          def child(sha,path,expected_digest=None):
              c=api('/commits/'+sha)
              assert [p['sha'] for p in c['parents']]==[SOURCE]
              assert len(c['files'])==1 and c['files'][0]['filename']==path
              data=subprocess.check_output(['git','show',sha+':'+path])
              if expected_digest:assert hashlib.sha256(data).hexdigest()==expected_digest
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==SOURCE
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()==SOURCE_TREE
          assert not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all']).strip()
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/bil-ios49-upload-controller-20261120'
          child(os.environ['GITHUB_SHA'],'.github/workflows/bil_ios_upload_existing_testflight.yml')
          signed_path='.github/workflows/bil_ios_signed_release.yml'
          child(PINS['signed_controller_sha'],signed_path,PINS['signed_controller_workflow_sha256'])
          run=api('/actions/runs/'+str(PINS['signed_run_id']))
          assert all(run[k]==v for k,v in {'head_sha':PINS['signed_controller_sha'],
              'head_branch':'codex/bil-ios49-controller-20261120','path':signed_path,
              'event':'workflow_dispatch','status':'completed','conclusion':'success','run_attempt':1}.items())
          jobs=api('/actions/runs/'+str(PINS['signed_run_id'])+'/attempts/1/jobs?per_page=100')
          assert jobs['total_count']==1 and len(jobs['jobs'])==1 and jobs['jobs'][0]['conclusion']=='success'
          art=api('/actions/artifacts/'+str(PINS['signed_artifact_id']))
          assert art['workflow_run']['id']==PINS['signed_run_id'] and art['workflow_run']['head_sha']==PINS['signed_controller_sha']
          assert not art['expired'] and art['digest']==PINS['signed_artifact_digest']
          assert art['name']=='bil-ios49-signed-only-'+str(PINS['signed_run_id'])
          delivery=pathlib.Path('delivery');delivery.mkdir()
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil49-original-signed-artifact.zip'
          with archive.open('xb') as f:subprocess.run(['gh','api','repos/'+REPO+'/actions/artifacts/'+str(art['id'])+'/zip'],stdout=f,check=True)
          assert digest(archive)==PINS['signed_artifact_digest'].removeprefix('sha256:')
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist())==len(set(z.namelist())) and z.testzip() is None
              for n in z.infolist():
                  p=pathlib.PurePosixPath(n.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(n.external_attr>>16)
              z.extractall(delivery)
          def unique(pattern):
              matches=list(delivery.rglob(pattern));assert len(matches)==1;return matches[0]
          ipa=unique('*.ipa');symbols=unique('BIL-ios49-symbol-binding.json');original=unique('BIL-ios49-original.xcarchive.zip')
          verifier=unique('BIL-ios49-symbol-verifier.py')
          assert digest(verifier)==PINS['symbol_verifier_sha256']=='330bb48f7daed0ab13840c41a7527aaf329d0ab65ca0403fac09bdf5336c5b12'
          assert digest(ipa)==PINS['ipa_sha256'] and digest(symbols)==PINS['symbol_binding_sha256'] and digest(original)==PINS['archive_zip_sha256']
          symbol=json.loads(symbols.read_text())
          assert symbol['status']=='ORIGINAL_RUNNER_ARCHIVE_EXPORT_DSYM_UUID_PASS'
          assert symbol['source_sha']==SOURCE and symbol['build']==49 and symbol['run_id']==PINS['signed_run_id'] and symbol['run_attempt']==1
          assert symbol['ipa_sha256']==PINS['ipa_sha256'] and symbol['original_archive_zip_sha256']==PINS['archive_zip_sha256']
          assert symbol['all_runtime_frameworks_archive_export_uuid_bound'] is True
          assert symbol['rebuilt_or_resigned'] is False
          unpack=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil49-original-archive';unpack.mkdir()
          subprocess.run(['ditto','-x','-k',str(original),str(unpack)],check=True)
          roots=list(unpack.glob('*.xcarchive'));assert len(roots)==1
          subprocess.run(['python3',str(verifier),'--archive',str(roots[0]),'--archive-zip',str(original),'--ipa',str(ipa),'--source',SOURCE,'--run',str(PINS['signed_run_id']),'--attempt','1','--output','evidence/reverified-original-symbols.json','--diagnostics','evidence/reverified-original-symbol-diagnostics.json'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as e:e.write('BIL_IPA_PATH='+str(ipa.resolve())+'\n')
          pathlib.Path('evidence/immutable-binding.json').write_text(json.dumps(PINS,indent=2)+'\n')
          PY_BIND
      - name: Verify exact bytes, IPA identity and original signing receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, zipfile
          root=pathlib.Path('delivery')
          def unique(name):
              matches=list(root.rglob(name))
              assert len(matches)==1, 'Missing or ambiguous evidence: '+name
              return matches[0]
          ipa=unique('*.ipa')
          digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest==os.environ['BIL_IPA_SHA256'], 'IPA bytes differ from signed run'
          receipt=json.loads(unique('BIL-ios-build-only-receipt.json').read_text())
          assert receipt['status']=='SIGNED_IPA_BUILT_AND_LOCALLY_VERIFIED'
          assert receipt['source_sha']==os.environ['BIL_TESTED_SOURCE'] and receipt['build']==49
          assert receipt['workflow_sha']==os.environ['BIL_SIGNING_ORCHESTRATION_SHA']
          assert receipt.get('validation_mode','all_exact_source_ci')==os.environ['BIL_VALIDATION_MODE']
          native_status='PASS'
          assert receipt['native_crypto_runtime_status']==native_status
          assert ('NATIVE_CRYPTO_RUNTIME_GATE='+native_status) in unique('BIL-ios-native-crypto-gate.txt').read_text()
          assert receipt['ipa_sha256']==digest and receipt['ipa_bytes']==ipa.stat().st_size
          assert unique('BIL-source-head.txt').read_text().strip()==os.environ['BIL_TESTED_SOURCE']
          assert 'SIGNED_IPA_CODESIGN_GATE=PASS' in unique('BIL-ios-codesign-verify.txt').read_text()
          assert 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' in unique('BIL-ios-crypto-scan.txt').read_text()
          inventory=json.loads(unique('BIL-ios-final-artifact-inventory.json').read_text())
          assert inventory['status']=='FINAL_ARTIFACT_IDENTITY_PASS' and inventory['build']=='49'
          assert inventory['package']=='com.bilhealth.bodyintelligencelog' and inventory['version']=='1.0.0'
          with zipfile.ZipFile(ipa) as archive:
              infos=[n for n in archive.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and len(n.split('/'))==3]
              assert len(infos)==1
              info=plistlib.loads(archive.read(infos[0]))
          assert info['CFBundleIdentifier']=='com.bilhealth.bodyintelligencelog'
          assert info['CFBundleVersion']=='49' and info['CFBundleShortVersionString']=='1.0.0'
          identity={'source_sha':os.environ['BIL_TESTED_SOURCE'],'build':49,'ipa_sha256':digest,
                    'workflow_sha':os.environ['BIL_SIGNING_ORCHESTRATION_SHA'],'signed_run':int(os.environ['BIL_SIGNED_RUN']),
                    'signed_artifact':int(os.environ['BIL_SIGNED_ARTIFACT']),
                    'uses_non_exempt_encryption':info.get('ITSAppUsesNonExemptEncryption'),
                    'physical_device_verified':False,'release_approved':False}
          pathlib.Path('evidence/identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('BIL_IPA_PATH='+str(ipa.resolve())+'\n')
          print('EXACT_SIGNED_IPA_49_BYTES_AND_SOURCE=PASS')
          PY
          python3 tool/release/verify_final_artifact_identity.py \
            --ipa "$BIL_IPA_PATH" --package com.bilhealth.bodyintelligencelog \
            --version 1.0.0 --build 49 --output evidence/final-artifact-inventory.json
          python3 tool/release/verify_ios_app_icon.py --ipa "$BIL_IPA_PATH" --output evidence/final-icon-inventory.json
      - name: Prepare ephemeral Apple API key and processing verifier
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          assert all(os.environ.get(k) for k in ('ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY_BASE64'))
          folder=pathlib.Path.home()/'.appstoreconnect/private_keys'
          folder.mkdir(parents=True,exist_ok=True)
          key=folder/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          raw=base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'],validate=True)
          assert b'-----BEGIN PRIVATE KEY-----' in raw
          key.write_bytes(raw); key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('ASC_PRIVATE_KEY_PATH='+str(key)+'\n')
          PY
          cat > evidence/asc-processing.mjs <<'JS'
          import fs from 'node:fs';
          import { clientFromEnvironment } from '../tool/apple_store_connect/asc_catalog_sync.mjs';
          const client=clientFromEnvironment();
          const APP='6805349703';
          const mode=process.argv[2];
          const write=(name,data)=>fs.writeFileSync(`evidence/${name}.json`,JSON.stringify(data,null,2)+'\n');
          const matching=async version=>{
            const response=await client.request('GET',`/v1/builds?filter[app]=${APP}&filter[version]=${version}&include=preReleaseVersion&limit=100`);
            return response.data.filter(b=>response.included?.some(v=>v.id===b.relationships.preReleaseVersion.data?.id&&v.attributes.version==='1.0.0'&&v.attributes.platform==='IOS'));
          };
          const internalGroupsForBuild=async buildId=>{
            const result=[];
            for(const group of await client.all(`/v1/apps/${APP}/betaGroups?limit=200`)){
              if(group.attributes.isInternalGroup!==true) continue;
              const builds=await client.all(`/v1/betaGroups/${group.id}/builds?limit=200`);
              if(builds.some(b=>b.id===buildId)) result.push(group);
            }
            return result;
          };
          if(mode==='preflight'){
            const app=await client.request('GET',`/v1/apps/${APP}`);
            if(app.data.attributes.bundleId!=='com.bilhealth.bodyintelligencelog') throw Error('ASC app identity mismatch');
            if((await matching('49')).length) throw Error('Build 49 already exists: upload is blocked to prevent duplication; inspect its identity before proceeding');
            const previous=await matching('47');
            const internal=new Map();
            for(const build of previous){
              for(const group of await internalGroupsForBuild(build.id)){
                if(group.attributes.isInternalGroup===true) internal.set(group.id,{id:group.id,name:group.attributes.name});
              }
            }
            write('asc-preflight',{app_id:APP,build49_absent:true,previous_internal_groups:[...internal.values()]});
            if(internal.size===0) throw Error('No existing internal testing group was verified; upload is blocked');
            console.log(`ASC_PREFLIGHT=PASS; BUILD49_ABSENT; EXISTING_INTERNAL_GROUPS=${internal.size}`);
          }else if(mode==='processing'){
            const identity=JSON.parse(fs.readFileSync('evidence/identity.json'));
            const preflight=JSON.parse(fs.readFileSync('evidence/asc-preflight.json'));
            const expectedGroups=preflight.previous_internal_groups;
            if(!Array.isArray(expectedGroups)||expectedGroups.length===0) throw Error('At least one verified internal group is required before promotion');
            let build;
            for(let attempt=0;attempt<31;attempt++){
              const matches=await matching('49');
              if(matches.length>1) throw Error('Ambiguous build 49 records');
              build=matches[0];
              const state=build?.attributes.processingState??'NOT_VISIBLE_YET';
              write('apple-processing',{build_id:build?.id??null,processing_state:state,attempt,source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256});
              console.log(`APPLE_PROCESSING=${state}; CHECK=${attempt+1}`);
              if(['FAILED','INVALID'].includes(state)) throw Error('Apple rejected binary processing; preserve upload receipt and do not re-upload');
              if(state==='VALID') break;
              if(attempt<30) await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(build?.attributes.processingState!=='VALID'){
              write('testflight-pending',{status:'APPLE_PROCESSING_PENDING',build_id:build?.id??null,
                processing_state:build?.attributes.processingState??'NOT_VISIBLE_YET',
                source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256,do_not_reupload:true});
              throw Error('Upload accepted but Apple processing is pending; readiness was not verified. Do not re-upload');
            }
            if(build.attributes.usesNonExemptEncryption==null&&identity.uses_non_exempt_encryption===false){
              await client.request('PATCH',`/v1/builds/${build.id}`,{data:{type:'builds',id:build.id,attributes:{usesNonExemptEncryption:false}}});
            }
            const current=await internalGroupsForBuild(build.id);
            const known=new Set(current.map(g=>g.id));
            for(const group of expectedGroups){
              if(!known.has(group.id)) await client.request('POST',`/v1/betaGroups/${group.id}/relationships/builds`,{data:[{type:'builds',id:build.id}]});
            }
            // Apple InternalBetaState availability values; processing VALID alone
            // does not establish internal testing or group association.
            // https://developer.apple.com/documentation/appstoreconnectapi/internalbetastate
            const availableStates=new Set(['READY_FOR_BETA_TESTING','IN_BETA_TESTING']);
            let ready=false;
            for(let attempt=0;attempt<13;attempt++){
              const internal=await internalGroupsForBuild(build.id);
              const detail=await client.request('GET',`/v1/builds/${build.id}/buildBetaDetail`);
              const state=detail.data?.attributes.internalBuildState??'NOT_AVAILABLE_YET';
              const associated=new Set(internal.map(g=>g.id));
              const missing=expectedGroups.filter(g=>!associated.has(g.id)).map(g=>g.id);
              ready=availableStates.has(state)&&missing.length===0;
              const result={status:ready?'INTERNAL_TESTFLIGHT_READY':'INTERNAL_AVAILABILITY_PENDING',
                build_id:build.id,version:'1.0.0',build:49,processing_state:'VALID',
                internal_build_state:state,internal_groups:internal.map(g=>({id:g.id,name:g.attributes.name})),
                expected_internal_groups:expectedGroups,missing_internal_group_ids:missing,attempt,
                source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256,
                physical_device_verified:false,release_approved:false,do_not_reupload:true};
              write(ready?'testflight-ready':'testflight-pending',result);
              console.log(`TESTFLIGHT_BUILD49_PROCESSING=VALID; INTERNAL_STATE=${state}; MISSING_INTERNAL_GROUPS=${missing.length}; READINESS_CHECK=${attempt+1}`);
              if(ready){
                console.log('TESTFLIGHT_BUILD49_INTERNAL_AVAILABILITY=VERIFIED; DEVICE_ACCEPTANCE=PENDING');
                break;
              }
              if(['PROCESSING_EXCEPTION','EXPIRED'].includes(state)) throw Error('Apple internal testing is unavailable: '+state+'; do not re-upload');
              if(attempt<12) await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if(!ready) throw Error('Upload accepted but internal testing availability or group readback remains pending; do not re-upload');
          }else throw Error('Unknown ASC operation');
          JS
          node --check evidence/asc-processing.mjs
      - name: Verify Apple access and prevent an accidental duplicate upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs preflight
      - name: Validate this exact IPA with Apple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-validation.log
      - name: Upload the original signed IPA to TestFlight once
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          xcrun altool --upload-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-upload.log
          python3 - <<'PY'
          import datetime,json,pathlib,os
          identity=json.loads(pathlib.Path('evidence/identity.json').read_text())
          identity.update(status='UPLOAD_ACCEPTED',processing_verified=False,
                          uploaded_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),signed_run=int(os.environ['BIL_SIGNED_RUN']),signed_artifact=int(os.environ['BIL_SIGNED_ARTIFACT']))
          pathlib.Path('evidence/upload-receipt.json').write_text(json.dumps(identity,indent=2)+'\n')
          print('EXACT_ORIGINAL_IPA49_UPLOAD=ACCEPTED')
          PY
      - name: Verify Apple processing and reuse existing internal testing groups
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs processing
      - name: Preserve upload outcome without credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios49-testflight-promotion-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral Apple key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_PRIVATE_KEY_PATH:-}" ]]; then rm -f -- "$ASC_PRIVATE_KEY_PATH"; fi
