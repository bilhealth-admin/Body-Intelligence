# Isolated BIL-02/BIL-21 diagnostic CI. Not an integration or release gate.
# Protected purchase CTA, legacy glass widget and baseline remain untouched.
name: BIL39 Crystal Focused
on:
  pull_request:
    paths:
      - .github/workflows/bil39-crystal.yml
      - lib/app/theme/bil_navigation_press_style.dart
      - lib/shared/widgets/bil_crystal_arrow.dart
      - lib/shared/widgets/secondary_page_app_bar.dart
      - test/bil_crystal_arrow_test.dart
      - test/bil_crystal_calendar_video_test.dart
      - test/bil_crystal_purchase_cta_isolation_test.dart
      - tool/audit_bil_crystal_arrows.py
      - tool/test_audit_bil_crystal_arrows.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil39-crystal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: Crystal format/analyze/widget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Show exact SDK and commit
        run: |
          flutter --version
          git rev-parse HEAD
      - name: Assert exact PR HEAD, never test the synthetic merge commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Protect purchase CTA and shared legacy glass source blobs
        shell: bash
        run: |
          test "$(git hash-object lib/features/commerce/presentation/bil_dynamic_store_components.dart)" = "26303dce18ddc3f4f4ddceb859081283c0aebfe7"
          test "$(git hash-object lib/shared/widgets/bil_glass_press_feedback.dart)" = "653d424ddb6cca8adeb0d394f5c8f8866da3792d"
      - name: Check scoped Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/app/theme/bil_navigation_press_style.dart lib/shared/widgets/bil_crystal_arrow.dart lib/shared/widgets/secondary_page_app_bar.dart test/bil_crystal_arrow_test.dart test/bil_crystal_calendar_video_test.dart test/bil_crystal_purchase_cta_isolation_test.dart
      - name: Diagnose exact scoped formatter diff on failure
        if: failure()
        shell: bash
        run: |
          dart format test/bil_crystal_arrow_test.dart test/bil_crystal_calendar_video_test.dart test/bil_crystal_purchase_cta_isolation_test.dart
          git diff -- test/bil_crystal_arrow_test.dart test/bil_crystal_calendar_video_test.dart test/bil_crystal_purchase_cta_isolation_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze full Dart source
        run: flutter analyze --no-pub
      - name: Verify scanner includes directional asset references and native images
        run: python3 -m unittest tool/test_audit_bil_crystal_arrows.py
      - name: Generate occurrence candidate inventory (read-only)
        run: python3 tool/audit_bil_crystal_arrows.py --root . --output build/bil39_crystal_arrow_candidates.csv
      - name: Crystal + legacy-payment-isolation + back navigation widgets
        run: flutter test --no-pub --timeout=2m test/bil_crystal_arrow_test.dart test/bil_crystal_calendar_video_test.dart test/bil_navigation_press_style_test.dart test/secondary_page_navigation_test.dart
      - name: Verify protected purchase CTA without platform charges
        run: flutter test --no-pub test/bil_crystal_purchase_cta_isolation_test.dart
      - name: Checkout immutable iOS38 baseline for pixel equivalence
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 155b079696430919f8272df934371f033fb11be2
          path: crystal-cta-baseline
      - name: Compare twelve CTA frames against exact baseline
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          test "$(git -C crystal-cta-baseline rev-parse HEAD)" = "155b079696430919f8272df934371f033fb11be2"
          cp test/bil_crystal_purchase_cta_isolation_test.dart crystal-cta-baseline/test/
          (
            cd crystal-cta-baseline
            flutter pub get
            flutter test --no-pub test/bil_crystal_purchase_cta_isolation_test.dart
          )
          count=0
          for f in build/bil39_crystal_cta_pixels/*.png; do
            test -f "$f" || continue
            baseline="crystal-cta-baseline/$f"
            test -f "$baseline" || { echo "::error::Missing baseline $f"; exit 1; }
            cmp -s "$f" "$baseline" || { echo "::error::CTA pixels differ: $f"; exit 1; }
            count=$((count+1))
          done
          test "$count" -eq 12 || { echo "::error::Expected 12 CTA comparison frames, got $count"; exit 1; }
          echo "PASS: all twelve protected CTA frames byte-identical to immutable iOS38"
      - name: Upload synthetic CTA pixel comparison evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil39-crystal-cta-isolation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/bil39_crystal_cta_pixels
            crystal-cta-baseline/build/bil39_crystal_cta_pixels
          if-no-files-found: warn
          retention-days: 14
      - name: Upload synthetic calendar/video Crystal captures
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil39-crystal-calendar-video-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/bil39_crystal_calendar_video/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve candidates for manual classification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil39-crystal-arrow-candidates-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/bil39_crystal_arrow_candidates.csv
          if-no-files-found: warn
          retention-days: 14
