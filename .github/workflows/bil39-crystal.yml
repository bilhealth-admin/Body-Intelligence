# Isolated BIL-02/BIL-21 diagnostic CI. Not an integration or release gate.
# Protected purchase CTA, legacy glass widget and baseline remain untouched.
name: BIL39 Crystal Focused
on:
  pull_request:
    paths:
      - .github/workflows/bil39-crystal.yml
      - lib/app/theme/bil_navigation_press_style.dart
      - lib/shared/widgets/bil_crystal_arrow.dart
      - lib/shared/widgets/secondary_page_app_bar.dart
      - test/bil_crystal_arrow_test.dart
      - tool/audit_bil_crystal_arrows.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil39-crystal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: Crystal format/analyze/widget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Show exact SDK and commit
        run: |
          flutter --version
          git rev-parse HEAD
      - name: Check scoped Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/app/theme/bil_navigation_press_style.dart lib/shared/widgets/bil_crystal_arrow.dart lib/shared/widgets/secondary_page_app_bar.dart test/bil_crystal_arrow_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze full Dart source
        run: flutter analyze --no-pub
      - name: Generate occurrence candidate inventory (read-only)
        run: python3 tool/audit_bil_crystal_arrows.py --root . --output build/bil39_crystal_arrow_candidates.csv
      - name: Crystal + legacy-payment-isolation + back navigation widgets
        run: flutter test --no-pub --timeout=2m test/bil_crystal_arrow_test.dart test/bil_navigation_press_style_test.dart test/secondary_page_navigation_test.dart
      - name: Preserve candidates for manual classification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil39-crystal-arrow-candidates-${{ matrix.os }}-${{ github.sha }}
          path: build/bil39_crystal_arrow_candidates.csv
          if-no-files-found: warn
          retention-days: 14
