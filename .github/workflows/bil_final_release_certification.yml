name: BIL Final Release Certification
on:
  push:
    branches: [fix/community-sapphire-health-3033]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-final-cert-${{ github.sha }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.m.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - id: m
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/fix/community-sapphire-health-3033 | awk '{print $1}')" = "$GITHUB_SHA"
          python3 tool/release_certification/generate_manifest.py --expected-sha "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/freeze"
          echo "sha=$(awk '{print $1}' "$RUNNER_TEMP/freeze/BIL_RC_MANIFEST.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "bil-cert-freeze-${{ github.sha }}", path: "${{ runner.temp }}/freeze/", retention-days: 30}

  static:
    needs: freeze
    strategy:
      fail-fast: false
      matrix: {pass: [1, 2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: "3.44.6", cache: true}
      - run: bash tool/release_certification/run_static.sh "$RUNNER_TEMP/static"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "bil-cert-static-${{ matrix.pass }}-${{ github.sha }}", path: "${{ runner.temp }}/static/", retention-days: 30}

  full_tests:
    needs: static
    strategy:
      fail-fast: false
      matrix: {pass: [1, 2], shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    runs-on: windows-2022
    timeout-minutes: 45
    env: {PYTHONUTF8: "1"}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: "3.44.6", cache: true}
      - run: flutter pub get
      - env: {SHARD: "${{ matrix.shard }}"}
        run: python tool/sapphire/run_full_shard.py
      - shell: pwsh
        run: python tool/release_certification/validate_shard.py "$env:RUNNER_TEMP/sapphire-shard/results.json" --evidence "$env:RUNNER_TEMP/sapphire-shard/skip-policy.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "bil-cert-full-${{ matrix.pass }}-${{ matrix.shard }}-${{ github.sha }}", path: "${{ runner.temp }}/sapphire-shard/", retention-days: 30}

  visual_cloud:
    needs: static
    strategy:
      fail-fast: false
      matrix: {pass: [1, 2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: isolated-fixture-only, POSTGRES_DB: community_qa}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d community_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: "3.44.6", cache: true}
      - env: {PGPASSWORD: isolated-fixture-only}
        run: bash tool/release_certification/run_visual_cloud.sh "$RUNNER_TEMP/visual"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "bil-cert-visual-${{ matrix.pass }}-${{ github.sha }}", path: "${{ runner.temp }}/visual/", retention-days: 30}

  live_backend:
    needs: freeze
    strategy:
      fail-fast: false
      matrix: {pass: [1, 2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - id: c
        env: {A: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", D: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
        run: 'if [[ -n "$A" && -n "$D" ]]; then echo ready=true >> "$GITHUB_OUTPUT"; else echo ready=false >> "$GITHUB_OUTPUT"; fi'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.c.outputs.ready == 'true'
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.c.outputs.ready == 'true'
        with: {flutter-version: "3.44.6", cache: true}
      - if: steps.c.outputs.ready == 'true'
        env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
        run: bash tool/release_certification/run_live.sh "$RUNNER_TEMP/live"
      - if: always()
        run: mkdir -p "$RUNNER_TEMP/live"; test -f "$RUNNER_TEMP/live/status.txt" || echo "LIVE_BACKEND_CORE=NOT RUN" > "$RUNNER_TEMP/live/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "bil-cert-live-${{ matrix.pass }}-${{ github.sha }}", path: "${{ runner.temp }}/live/", retention-days: 30}

  report:
    if: always()
    needs: [freeze, static, full_tests, visual_cloud, live_backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - env:
          BIL_RC_SHA: "${{ github.sha }}"
          BIL_MANIFEST_SHA256: "${{ needs.freeze.outputs.manifest }}"
          BIL_FREEZE_STATUS: "${{ needs.freeze.result }}"
          BIL_STATIC_1: "${{ needs.static.result }}"
          BIL_STATIC_2: "${{ needs.static.result }}"
          BIL_FULL_1: "${{ needs.full_tests.result }}"
          BIL_FULL_2: "${{ needs.full_tests.result }}"
          BIL_VISUAL_1: "${{ needs.visual_cloud.result }}"
          BIL_VISUAL_2: "${{ needs.visual_cloud.result }}"
          BIL_LIVE_1: NOT RUN
          BIL_LIVE_2: NOT RUN
          BIL_STORE_READONLY: NOT RUN
        run: |
          remote="$(git ls-remote origin refs/heads/fix/community-sapphire-health-3033 | awk '{print $1}')"
          export BIL_BRANCH_STABLE=$([[ "$remote" == "$GITHUB_SHA" ]] && echo true || echo false)
          mkdir -p "$RUNNER_TEMP/report"
          python3 tool/release_certification/write_report.py --output "$RUNNER_TEMP/report/BIL_RELEASE_CERTIFICATION_REPORT.md" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "BIL_RELEASE_CERTIFICATION_REPORT-${{ github.sha }}", path: "${{ runner.temp }}/report/", retention-days: 90}
      - run: grep -q 'Final decision: **READY**' "$RUNNER_TEMP/report/BIL_RELEASE_CERTIFICATION_REPORT.md"
