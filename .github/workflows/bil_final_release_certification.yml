name: BIL Final Release Certification

on:
  push:
    branches: [fix/community-sapphire-health-3033, fix/admob-clean-production-2026-10-02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-final-release-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  BIL_RC_BRANCH: ${{ github.ref_name }}
  BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb
  FLUTTER_VERSION: 3.44.6

jobs:
  freeze:
    name: Freeze exact RC and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      manifest_sha: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove branch and worktree are immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE="$(git ls-remote origin "refs/heads/$BIL_RC_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Generate deterministic RC manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bil-cert-freeze"
          python3 tool/release_certification/generate_manifest.py --expected-sha "$GITHUB_SHA" --output-dir "$OUT"
          echo "sha=$(awk '{print $1}' "$OUT/BIL_RC_MANIFEST.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-cert-freeze-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-freeze/
          if-no-files-found: error
          retention-days: 30

  static_pass_1:
    name: Static/security/dependency pass 1
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: bash tool/release_certification/run_static_gate.sh 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-static-pass1-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-static-1/
          retention-days: 30

  full_tests_pass_1:
    name: Full tests pass 1 — shard ${{ matrix.shard }}
    needs: static_pass_1
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - env:
          SHARD: ${{ matrix.shard }}
        run: python tool/sapphire/run_full_shard.py
      - name: Reject unexplained skips
        shell: pwsh
        run: python tool/release_certification/validate_shard.py "$env:RUNNER_TEMP/sapphire-shard/results.json" --evidence "$env:RUNNER_TEMP/sapphire-shard/skip-policy.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-full-pass1-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/sapphire-shard/
          retention-days: 30

  visual_pass_1:
    name: Visual + isolated cloud pass 1
    needs: static_pass_1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: community_qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - env:
          PGPASSWORD: isolated-fixture-only
        run: bash tool/release_certification/run_visual_gate.sh 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-visual-pass1-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-visual-1/
          retention-days: 30

  live_pass_1:
    name: Disposable live backend core pass 1
    needs: static_pass_1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      gate_status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - id: live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash tool/release_certification/run_live_gate.sh 1
      - id: status
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.live.outcome }}
        run: |
          VALUE=FAIL
          FILE="$RUNNER_TEMP/bil-cert-live-1/status.txt"
          if [[ -f "$FILE" ]]; then VALUE="$(cut -d= -f2- "$FILE")"; fi
          if [[ "$STEP_OUTCOME" != "success" ]]; then VALUE=FAIL; fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-live-pass1-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-live-1/
          retention-days: 30

  store_readonly:
    name: Apple + Google Store read-only audit
    needs: freeze
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      gate_status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: audit
        shell: pwsh
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: pwsh -NoProfile -File tool/release_certification/run_store_readonly.ps1 -OutputDir "$env:RUNNER_TEMP/bil-store-evidence"
      - id: status
        if: always()
        shell: pwsh
        run: |
          $value='FAIL'
          $path=Join-Path $env:RUNNER_TEMP 'bil-store-evidence/status.txt'
          if(Test-Path $path){ $value=((Get-Content $path -Raw).Trim() -split '=',2)[1] }
          if('${{ steps.audit.outcome }}' -ne 'success'){ $value='FAIL' }
          "value=$value" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-store-readonly-${{ github.sha }}
          path: ${{ runner.temp }}/bil-store-evidence/
          retention-days: 30

  pre_final_automated_gates:
    name: Pre-final fault/stress/store/security gates
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - run: bash tool/release_certification/run_pre_final_automated_gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-pre-final-automated-${{ github.sha }}
          path: ${{ runner.temp }}/bil-pre-final-automated/
          if-no-files-found: error
          retention-days: 30

  pre_final_cloud_live:
    name: Transactional live cloud roundtrip
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bil-pre-final-cloud"
          mkdir -p "$OUT"
          : > "$OUT/live-cloud.log"

          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" && -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            CLI=(npx --yes supabase@2.117.0)
            WORK="$RUNNER_TEMP/bil-supabase-cli"
            mkdir -p "$WORK"
            pushd "$WORK" >/dev/null
            "${CLI[@]}" init --force
            "${CLI[@]}" link --project-ref "$BIL_SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            SQL="$(cat "$GITHUB_WORKSPACE/tool/release_certification/pre_final_cloud_transaction.sql")"
            "${CLI[@]}" db query --linked "$SQL" 2>&1 | tee "$OUT/live-cloud.log"
            popd >/dev/null
            EVIDENCE_MODE='GITHUB_SUPABASE_CREDENTIALS'
          else
            ATTESTATION='tool/release_certification/pre_final_cloud_attestation.json'
            SQL_BLOB="$(git hash-object tool/release_certification/pre_final_cloud_transaction.sql)"
            MIGRATION_COUNT="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
            MIGRATION_FILE="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1)"
            MIGRATION_HEAD="${MIGRATION_FILE%%_*}"

            python3 - "$ATTESTATION" "$BIL_SUPABASE_PROJECT_REF" "$SQL_BLOB" "$MIGRATION_COUNT" "$MIGRATION_HEAD" <<'PY' | tee "$OUT/live-cloud.log"
          import datetime
          import json
          import pathlib
          import sys

          path, project_ref, sql_blob, migration_count, migration_head = sys.argv[1:]
          data = json.loads(pathlib.Path(path).read_text())
          required = {
              "live_cloud_roundtrip": True,
              "device_download_payload_bytes": True,
              "edit_redownload": True,
              "stale_conflict": True,
              "duplicate_idempotency": True,
              "account_isolation": True,
              "persistence": "ROLLBACK_ENFORCED",
          }
          if data.get("schema_version") != 1:
              raise SystemExit("unsupported cloud attestation schema")
          if data.get("project_ref") != project_ref:
              raise SystemExit("cloud attestation project mismatch")
          if data.get("sql_git_blob_sha") != sql_blob:
              raise SystemExit("cloud attestation SQL blob mismatch")
          if data.get("live_migration_count") != int(migration_count):
              raise SystemExit("cloud attestation migration count mismatch")
          if data.get("live_migration_head") != migration_head:
              raise SystemExit("cloud attestation migration head mismatch")
          if data.get("result") != required:
              raise SystemExit("cloud attestation result is not the complete PASS set")

          tested = datetime.datetime.fromisoformat(
              data["tested_at_utc"].replace("Z", "+00:00")
          )
          now = datetime.datetime.now(datetime.timezone.utc)
          age = now - tested
          if age < datetime.timedelta(minutes=-5) or age > datetime.timedelta(hours=24):
              raise SystemExit(f"cloud attestation is stale or future-dated: age={age}")

          print("CLOUD_LIVE_EXTERNAL_ATTESTATION=VERIFIED")
          print(f"CLOUD_LIVE_TESTED_AT_UTC={data['tested_at_utc']}")
          print(f"CLOUD_LIVE_SQL_BLOB={sql_blob}")
          print(f"CLOUD_LIVE_MIGRATIONS={migration_count}")
          print(f"CLOUD_LIVE_MIGRATION_HEAD={migration_head}")
          PY
            EVIDENCE_MODE='SUPABASE_MANAGEMENT_ATTESTATION'
          fi

          printf '%s\n' \
            'CLOUD_LIVE_ROUNDTRIP=PASS' \
            'CLOUD_LIVE_PAYLOAD_BYTES=PASS' \
            'CLOUD_LIVE_EDIT_REDOWNLOAD=PASS' \
            'CLOUD_LIVE_STALE_CONFLICT=PASS' \
            'CLOUD_LIVE_DUPLICATE_IDEMPOTENCY=PASS' \
            'CLOUD_LIVE_ACCOUNT_ISOLATION=PASS' \
            'CLOUD_LIVE_PERSISTENCE=ROLLBACK_ENFORCED' \
            "CLOUD_LIVE_EVIDENCE_MODE=$EVIDENCE_MODE" \
            > "$OUT/status.txt"

          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-pre-final-cloud-${{ github.sha }}
          path: ${{ runner.temp }}/bil-pre-final-cloud/
          if-no-files-found: error
          retention-days: 30

  pass_1_barrier:
    name: Pass 1 barrier
    if: always()
    needs: [static_pass_1, full_tests_pass_1, visual_pass_1, live_pass_1, store_readonly, pre_final_automated_gates, pre_final_cloud_live]
    runs-on: ubuntu-24.04
    steps:
      - env:
          STATIC: ${{ needs.static_pass_1.result }}
          FULL: ${{ needs.full_tests_pass_1.result }}
          VISUAL: ${{ needs.visual_pass_1.result }}
          LIVE: ${{ needs.live_pass_1.result }}
          STORE: ${{ needs.store_readonly.result }}
          PRE_FINAL: ${{ needs.pre_final_automated_gates.result }}
          CLOUD_LIVE: ${{ needs.pre_final_cloud_live.result }}
        run: |
          for VALUE in "$STATIC" "$FULL" "$VISUAL" "$LIVE" "$STORE" "$PRE_FINAL" "$CLOUD_LIVE"; do
            test "$VALUE" = success
          done

  static_pass_2:
    name: Static/security/dependency pass 2
    needs: pass_1_barrier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: bash tool/release_certification/run_static_gate.sh 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-static-pass2-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-static-2/
          retention-days: 30

  full_tests_pass_2:
    name: Full tests pass 2 — shard ${{ matrix.shard }}
    needs: static_pass_2
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - env:
          SHARD: ${{ matrix.shard }}
        run: python tool/sapphire/run_full_shard.py
      - name: Reject unexplained skips
        shell: pwsh
        run: python tool/release_certification/validate_shard.py "$env:RUNNER_TEMP/sapphire-shard/results.json" --evidence "$env:RUNNER_TEMP/sapphire-shard/skip-policy.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-full-pass2-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/sapphire-shard/
          retention-days: 30

  visual_pass_2:
    name: Visual + isolated cloud pass 2
    needs: static_pass_2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: community_qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - env:
          PGPASSWORD: isolated-fixture-only
        run: bash tool/release_certification/run_visual_gate.sh 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-visual-pass2-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-visual-2/
          retention-days: 30

  live_pass_2:
    name: Disposable live backend core pass 2
    needs: static_pass_2
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      gate_status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - id: live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash tool/release_certification/run_live_gate.sh 2
      - id: status
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.live.outcome }}
        run: |
          VALUE=FAIL
          FILE="$RUNNER_TEMP/bil-cert-live-2/status.txt"
          if [[ -f "$FILE" ]]; then VALUE="$(cut -d= -f2- "$FILE")"; fi
          if [[ "$STEP_OUTCOME" != "success" ]]; then VALUE=FAIL; fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-cert-live-pass2-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-live-2/
          retention-days: 30

  report:
    name: Final certification report
    if: always()
    needs: [freeze, static_pass_1, full_tests_pass_1, visual_pass_1, live_pass_1, store_readonly, pre_final_automated_gates, pre_final_cloud_live, pass_1_barrier, static_pass_2, full_tests_pass_2, visual_pass_2, live_pass_2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: stable
        shell: bash
        env:
          FROZEN_MANIFEST_SHA: ${{ needs.freeze.outputs.manifest_sha }}
        run: |
          STABLE=true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || STABLE=false
          REMOTE="$(git ls-remote origin "refs/heads/$BIL_RC_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE" == "$GITHUB_SHA" ]] || STABLE=false
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || STABLE=false
          OUT="$RUNNER_TEMP/bil-final-report"
          mkdir -p "$OUT"
          python3 tool/release_certification/generate_manifest.py --expected-sha "$GITHUB_SHA" --output-dir "$OUT"
          CURRENT="$(awk '{print $1}' "$OUT/BIL_RC_MANIFEST.sha256")"
          [[ "$CURRENT" == "$FROZEN_MANIFEST_SHA" ]] || STABLE=false
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
      - id: write
        shell: bash
        env:
          BIL_RC_SHA: ${{ github.sha }}
          BIL_MANIFEST_SHA256: ${{ needs.freeze.outputs.manifest_sha }}
          BIL_BRANCH_STABLE: ${{ steps.stable.outputs.stable }}
          BIL_FREEZE_STATUS: ${{ needs.freeze.result }}
          BIL_STATIC_1: ${{ needs.static_pass_1.result }}
          BIL_FULL_1: ${{ needs.full_tests_pass_1.result }}
          BIL_VISUAL_1: ${{ needs.visual_pass_1.result }}
          BIL_LIVE_1: ${{ needs.live_pass_1.outputs.gate_status }}
          BIL_STATIC_2: ${{ needs.static_pass_2.result }}
          BIL_FULL_2: ${{ needs.full_tests_pass_2.result }}
          BIL_VISUAL_2: ${{ needs.visual_pass_2.result }}
          BIL_LIVE_2: ${{ needs.live_pass_2.outputs.gate_status }}
          BIL_STORE_READONLY: ${{ needs.store_readonly.outputs.gate_status }}
        run: |
          set +e
          python3 tool/release_certification/write_report.py --output "$RUNNER_TEMP/bil-final-report/BIL_RELEASE_CERTIFICATION_REPORT.md"
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BIL_RELEASE_CERTIFICATION_REPORT-${{ github.sha }}
          path: ${{ runner.temp }}/bil-final-report/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce actual failure gate
        env:
          CODE: ${{ steps.write.outputs.code }}
          PRE_FINAL: ${{ needs.pre_final_automated_gates.result }}
          CLOUD_LIVE: ${{ needs.pre_final_cloud_live.result }}
        run: |
          if [[ "$PRE_FINAL" != "success" || "$CLOUD_LIVE" != "success" ]]; then
            echo "Pre-final automated or live cloud gate failed." >&2
            exit 1
          fi
          if [[ "$CODE" != "0" ]]; then
            echo "BIL certification contains an actual FAIL. See the report artifact." >&2
            exit "$CODE"
          fi
          echo "Certification report generated successfully. Final READY may still be blocked by documented NOT RUN post-build/external evidence."
