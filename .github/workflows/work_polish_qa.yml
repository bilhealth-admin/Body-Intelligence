name: BIL work polish QA

on:
  push:
    branches:
      - work/community-reference-parity-20261003

permissions:
  contents: read

concurrency:
  group: bil-work-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify changed Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/shared/widgets/bil_premium_trust_surface.dart \
            lib/features/onboarding/onboarding_detail_steps.dart \
            lib/features/intelligence_center/presentation/intelligence_query_flow.dart \
            lib/features/intelligence_center/presentation/intelligence_conversation_viewport.dart \
            lib/features/intelligence_center/presentation/intelligence_center_widgets.dart \
            lib/shared/widgets/bil_feature_entry_splash.dart \
            lib/app/router/app_router.dart \
            lib/app/router/app_wellness_routes.dart \
            lib/features/dashboard/presentation/dashboard_preferences_page.dart \
            lib/features/dashboard/presentation/dashboard_preferences_polish.dart \
            test/features/onboarding/premium_consent_surface_contract_test.dart \
            test/shared/widgets/bil_premium_ai_consent_sheet_test.dart \
            test/features/intelligence_center/ai_coach_starter_prompts_contract_test.dart \
            test/shared/widgets/bil_feature_entry_splash_test.dart \
            test/features/dashboard/dashboard_custom_card_save_stability_test.dart
      - name: Analyze complete source
        run: flutter analyze --no-pub
      - name: Verify source-size boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [
            'lib/shared/widgets/bil_feature_entry_splash.dart',
            'lib/features/dashboard/presentation/dashboard_preferences_polish.dart',
          ]:
              lines=len(Path(path).read_text().splitlines())
              assert lines <= 700, (path, lines)
              print(path, lines)
          PY
      - name: Focused polish regressions
        run: |
          flutter test --no-pub \
            test/features/onboarding/premium_consent_surface_contract_test.dart \
            test/shared/widgets/bil_premium_ai_consent_sheet_test.dart \
            test/features/intelligence_center/remote_ai_consent_orchestration_test.dart \
            test/features/intelligence_center/ai_coach_starter_prompts_contract_test.dart \
            test/features/dashboard/dashboard_custom_card_save_stability_test.dart \
            test/shared/widgets/bil_feature_entry_splash_test.dart
      - name: Onboarding accessibility matrix
        run: |
          flutter test --no-pub \
            test/features/onboarding/onboarding_accessibility_layout_test.dart \
            --timeout 2m
