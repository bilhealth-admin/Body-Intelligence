name: BIL frozen SQL one-scope strict diagnostic
run-name: "Diagnose one original rollback-only SQL result; no grants or deployment"

on:
  push:
    branches: [qa/bil-independent-31554-20261022]
    paths:
      - .github/workflows/bil_qa_sql_diagnostic_20261022.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-frozen-sql-diagnostic
  cancel-in-progress: false

env:
  FROZEN_SHA: 31554b3e078667a38bd3c53aa105f5f1d2a4dc96
  HARNESS_SHA: 462201c3350bf8e288b4ee37098e4488577f7240
  BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb

jobs:
  original-one-scope-diagnostic:
    name: Exact original AI-consent rollback SQL, with read-only sanitized error diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          sparse-checkout: tools/qa/frozen_sql_diagnostic_20261022.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Check original source identity and test diagnostics redaction without secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FROZEN_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$HARNESS_SHA"
          python3 harness/tools/qa/frozen_sql_diagnostic_20261022.py --self-test --source source --output "$RUNNER_TEMP/bil-frozen-sql-one"
      - name: Execute exactly one original guarded SQL E2E and retain failure status
        working-directory: source
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p supabase/.temp
          printf '%s' "$BIL_SUPABASE_PROJECT_REF" > supabase/.temp/project-ref
          python3 "$GITHUB_WORKSPACE/harness/tools/qa/frozen_sql_diagnostic_20261022.py" \
            --source . --output "$RUNNER_TEMP/bil-frozen-sql-one"
      - name: Upload sanitized classification and original strict receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen31554-original-sql-one-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-frozen-sql-one/
          if-no-files-found: warn
          retention-days: 21
