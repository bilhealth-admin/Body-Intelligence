name: BIL focused golden failure diagnosis

# Evidence-only replay of the seven failing comparisons. No reference updates,
# app build, native tests, signing, deployment, store or backend credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/integration/bil-qa-media-policy-20261011'
    # Approved references were rendered with the pinned Windows Flutter engine.
    # Compare on that renderer, keeping exact pixels and all baselines unchanged.
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve the locked visual test dependencies
        run: flutter pub get --enforce-lockfile
      - name: Record the actual rendering inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa/golden-diagnosis
          flutter --version --machine > build/qa/golden-diagnosis/flutter-version.json
          git rev-parse HEAD > build/qa/golden-diagnosis/source-head.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform
          roots = {
              'sdk': Path(os.environ['FLUTTER_ROOT']) / 'bin/cache/artifacts/material_fonts',
              'project': Path('assets/fonts'),
          }
          rows = []
          for label, root in roots.items():
              for path in sorted(root.rglob('*')):
                  if path.suffix.lower() in ('.ttf', '.otf'):
                      rows.append({'scope': label, 'file': path.relative_to(root).as_posix(),
                          'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('build/qa/golden-diagnosis/rendering-inputs.json').write_text(
              json.dumps({'platform': platform.platform(), 'fonts': rows}, indent=2) + '\n')
          PY
      - name: Replay the exact seven comparisons without changing baselines
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded --concurrency 2 --timeout 5m \
            test/features/commerce/bil_store_plans_light_visual_test.dart \
            test/features/commerce/apple_review_product_screenshot_test.dart \
            2>&1 | tee build/qa/golden-diagnosis/flutter.log
      - name: Retain the actual master, raster and differences even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-golden-diagnosis-${{ github.sha }}
          path: |
            build/qa/golden-diagnosis
            test/features/commerce/failures/*.png
          if-no-files-found: error
          retention-days: 30
