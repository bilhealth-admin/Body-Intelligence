name: BIL optional ephemeral configuration boolean audit 20261020
on:
  push:
    branches: [audit/production-readiness-5775-20261020]
    paths:
      - .github/workflows/bil_ephemeral_configuration_readiness_20261020.yml
      - tool/release_certification/ephemeral_readiness/index.ts
      - tool/release_certification/ephemeral_readiness/offline_test.mjs
      - tool/release_certification/ephemeral_readiness/lifecycle.py
      - tool/release_certification/ephemeral_readiness/test_lifecycle.py
  workflow_dispatch:
    inputs:
      execute_reviewed_helper:
        type: boolean
        required: true
        default: false
        description: Create only a unique temporary helper, read boolean config, then delete exact new identity
permissions:
  contents: read
concurrency:
  group: bil-ephemeral-config-readiness-20261020
  cancel-in-progress: false
jobs:
  reviewed-ephemeral-config:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_reviewed_helper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Offline authorization and parser controls
        run: |
          python3 -m py_compile tool/release_certification/ephemeral_readiness/lifecycle.py
          python3 tool/release_certification/ephemeral_readiness/test_lifecycle.py
          node --experimental-strip-types tool/release_certification/ephemeral_readiness/offline_test.mjs
      - name: Reviewed unique create read exact cleanup lifecycle
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BIL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BIL_SUPABASE_SERVICE_ROLE_KEY }}
          BIL_SUPABASE_ANON_KEY: ${{ secrets.BIL_SUPABASE_ANON_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          READINESS_OUT: ${{ runner.temp }}/ephemeral-config-readiness
        run: python3 tool/release_certification/ephemeral_readiness/lifecycle.py --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ephemeral-config-5775-readiness-booleans
          path: ${{ runner.temp }}/ephemeral-config-readiness/*.json
          if-no-files-found: error
          retention-days: 14

