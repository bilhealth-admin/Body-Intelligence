name: BIL Apple screenshot and preview inventory read only
on:
  workflow_dispatch:
  push:
    branches: [audit/apple-assets-20261020]
    paths: [.github/workflows/bil_apple_asset_readonly_20261020.yml]
permissions:
  contents: read
jobs:
  apple-store-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tool/release_ops
      - name: Verify credential and download boundaries without network
        run: node tool/release_ops/inspect_apple_store_assets.test.mjs
      - name: Read actual Apple screenshots and preview inventory without mutation
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: node tool/release_ops/inspect_apple_store_assets.mjs "$RUNNER_TEMP/bil-apple-store-assets"
      - name: Preserve image renders and sanitized source inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-apple-store-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-apple-store-assets/
          if-no-files-found: error
          retention-days: 30
