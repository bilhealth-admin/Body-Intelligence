name: BIL iPad cold Coach stage diagnostic only

on:
  push:
    branches: [codex/bil45-ipad-coach-cold-diagnostic-20261115]

permissions:
  contents: read

concurrency:
  group: bil45-ipad-coach-cold-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipad-cold-coach-only:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out exact single-parent diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Guard exact branch, S3 parent and five changed paths before preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DIAGNOSTIC_SCOPE'
          import hashlib, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = {'lib/features/intelligence_center/presentation/coach_native_paint_gate.dart': '983bd9908f3f1fe576697b01df55e710ea23a9d434e6848711fe995c10d3437f', 'lib/features/intelligence_center/presentation/coach_native_markdown.dart': 'a210c1f303ba84ee08062341b285972806265ba543b737bb48106274a902b308', 'ios/Runner/BILCoachMarkdownBridge.swift': '77f263374c41ad869337aa0ba3881815159409334e7f22f2e06c22440918e13d', 'integration_test/native_feature_splashes_coach.dart': 'eb6a67b538c32d772d22c9077eb7522e375b29280d26e7dad5e4de295aad8d88'}
          if os.environ['GITHUB_REF'] != 'refs/heads/codex/bil45-ipad-coach-cold-diagnostic-20261115' or os.environ['GITHUB_EVENT_NAME'] != 'push':
              raise ValueError('Only the exact reviewed iPad diagnostic branch push may run')
          if git('rev-parse', 'HEAD') != os.environ['GITHUB_SHA'] or git('show', '-s', '--format=%P', 'HEAD') != 'a50ea86aa8d439510d2718108881e1b1acd1227e':
              raise ValueError('Exact single-parent S3 diagnostic checkout required')
          if set(git('diff', '--name-only', 'a50ea86aa8d439510d2718108881e1b1acd1227e', 'HEAD').splitlines()) != set(expected) | {'.github/workflows/bil45_ipad_coach_cold_diagnostic.yml'}:
              raise ValueError('Only four passive telemetry paths and this one workflow may change')
          if git('status', '--porcelain') or any(hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest for path, digest in expected.items()):
              raise ValueError('Pristine independently reviewed telemetry bytes required')
          PY_DIAGNOSTIC_SCOPE
      - name: Install the same pinned Flutter as original S3 native QA
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select the same isolated CocoaPods as original S3 native QA
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/install_isolated_cocoapods.py --output artifacts/qa/bil45-ipad-coach-cold-diagnostic/cocoapods-installation.json
      - name: Resolve the existing pinned dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_LOCKS_BEFORE'
          import hashlib, json
          from pathlib import Path
          folder = Path('artifacts/qa/bil45-ipad-coach-cold-diagnostic')
          folder.mkdir(parents=True, exist_ok=True)
          names = ['pubspec.lock', 'ios/Podfile.lock']
          before = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() if Path(name).is_file() else None for name in names}
          if before['pubspec.lock'] != 'bc3c559586313d4323233c0b5d66dde56441e0f03d7be45d00bae61efb4fa7ac' or before['ios/Podfile.lock'] is not None:
              raise ValueError('Exact S3 pub lock and SOURCE_POD_LOCK_ABSENT required before resolution')
          (folder / 'dependency-locks-before.json').write_text(json.dumps(before, indent=2), encoding='utf-8')
          PY_LOCKS_BEFORE
          flutter pub get --enforce-lockfile
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          # The pristine S3 baseline has no tracked Podfile.lock. Preserve the
          # same original pod-install operation, record its actual generated
          # lock, and never claim byte equivalence with a nonexistent source lock.
          pod install --project-directory=ios
          python3 - <<'PY_LOCKS_AFTER'
          import hashlib, json, re, shutil
          from pathlib import Path
          folder = Path('artifacts/qa/bil45-ipad-coach-cold-diagnostic')
          before = json.loads((folder / 'dependency-locks-before.json').read_text(encoding='utf-8'))
          after = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['pubspec.lock', 'ios/Podfile.lock']}
          if after['pubspec.lock'] != before['pubspec.lock']:
              raise ValueError('pubspec.lock changed despite enforced resolution')
          lock = Path('ios/Podfile.lock')
          shutil.copyfile(lock, folder / 'GENERATED_Podfile.lock')
          text = lock.read_text(encoding='utf-8')
          pods_section = text.split('DEPENDENCIES:', 1)[0]
          resolved_versions = re.findall(r'^  - (.+?)(?::)?$', pods_section, flags=re.M)
          if not resolved_versions:
              raise ValueError('Generated Pod lock must expose its actual resolved version list')
          proof = {'source_pod_lock_state': 'SOURCE_POD_LOCK_ABSENT', 'before': before, 'after': after,
              'source_pubspec_lock_preserved': True, 'pod_resolution': 'Same existing CocoaPods1.16.2 pod install baseline operation; no pod update or repo-update',
              'historical_pod_lock_byte_equivalence_proven': False,
              'historical_original_pod_lock_payload_available': False,
              'generated_pod_lock_copy': 'GENERATED_Podfile.lock', 'actual_resolved_pod_versions': resolved_versions}
          (folder / 'dependency-locks-resolution.json').write_text(json.dumps(proof, indent=2), encoding='utf-8')
          PY_LOCKS_AFTER
      - name: Run the original two-case scene in three planned cold iPad processes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_IPAD_COLD_DIAGNOSTIC'
          """One synthetic iPad job: three predeclared cold processes, original two cases.

          Diagnostic only. Native/source tests, signing/store gates and cloud are untouched.
          """
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import time

          WORKSPACE = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          OUTPUT = WORKSPACE / 'artifacts/qa/bil45-ipad-coach-cold-diagnostic'
          OUTPUT.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(WORKSPACE / '.github/scripts'))
          from bil_native_bounded_command import run_bounded

          PARENT = 'a50ea86aa8d439510d2718108881e1b1acd1227e'
          BRANCH = 'refs/heads/codex/bil45-ipad-coach-cold-diagnostic-20261115'
          WORKFLOW = '.github/workflows/bil45_ipad_coach_cold_diagnostic.yml'
          EXPECTED_FILES = {
              'lib/features/intelligence_center/presentation/coach_native_paint_gate.dart': '983bd9908f3f1fe576697b01df55e710ea23a9d434e6848711fe995c10d3437f',
              'lib/features/intelligence_center/presentation/coach_native_markdown.dart': 'a210c1f303ba84ee08062341b285972806265ba543b737bb48106274a902b308',
              'ios/Runner/BILCoachMarkdownBridge.swift': '77f263374c41ad869337aa0ba3881815159409334e7f22f2e06c22440918e13d',
              'integration_test/native_feature_splashes_coach.dart': 'eb6a67b538c32d772d22c9077eb7522e375b29280d26e7dad5e4de295aad8d88',
          }
          TARGET = 'integration_test/native_feature_splashes_test.dart'
          DRIVER = 'test_driver/native_feature_splashes_driver.dart'
          APP = WORKSPACE / 'build/ios/Debug-iphonesimulator/Runner.app'
          PUB_LOCK = 'bc3c559586313d4323233c0b5d66dde56441e0f03d7be45d00bae61efb4fa7ac'
          DEFINES = ['BIL_ENVIRONMENT=testing', 'BIL_USE_SUPABASE=false',
              'BIL_PAYMENTS_ENABLED=false', 'BIL_ADS_ENABLED=false', 'BIL_QA_IOS_SIMULATOR=true',
              'BIL_QA_DEVICE_NAME=github-bil45-ipad-coach-cold',
              'BIL_QA_NATIVE_COACH_ONLY=true', 'BIL_QA_NATIVE_SCENE=ar-light-normal',
              'BIL_QA_NATIVE_COACH_STAGE_TIMING=true', 'BIL_QA_SOURCE_HEAD=' + os.environ['GITHUB_SHA']]
          devices = []
          CONTROLLER_BUDGET_SECONDS = 3300
          controller_started = time.monotonic()
          controller_deadline = controller_started + CONTROLLER_BUDGET_SECONDS
          receipt = {'schema': 'bil.ipad-coach-cold-diagnostic.v1', 'status': 'RUNNING',
              'source_parent': PARENT, 'diagnostic_source': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'planned_cold_processes': 3,
              'probes': [{'index': index, 'status': 'NOT_STARTED', 'process_exit': None,
                          'planned_independently': True} for index in range(1, 4)],
              'controller_wall_budget_seconds': CONTROLLER_BUDGET_SECONDS,
              'per_drive_max_seconds': 600, 'original_reply_deadline_ms': 1500,
              'scope': 'Existing coach-only ar-light-normal reveal and history tests, three independently planned cold Runner processes',
              'diagnostic_only': True, 'release_acceptance': False, 'OS_font_caches_reset': False,
              'distribution_signing_or_keys_used': False, 'real_model_or_cloud_permitted': False}

          def save():
              (OUTPUT / 'diagnostic-result.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=WORKSPACE, text=True).strip()

          def stage(label, command, timeout=120, *, allow_failure=False, environment=None):
              remaining = controller_deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError('Diagnostic cumulative controller budget expired')
              timeout = min(timeout, max(1, int(remaining)))
              previous = {}
              if environment:
                  for key, value in environment.items():
                      previous[key] = os.environ.get(key)
                      os.environ[key] = value
              try:
                  log = OUTPUT / (label + '.log')
                  code = run_bounded(command, label=label, log_path=log,
                      receipt_path=OUTPUT / (label + '-command-result.json'), timeout_seconds=timeout)
                  if code != 0 and not allow_failure:
                      raise RuntimeError('Diagnostic stage failed: ' + label)
                  return code, log
              finally:
                  for key, value in previous.items():
                      if value is None:
                          os.environ.pop(key, None)
                      else:
                          os.environ[key] = value

          def lock_checkpoint(label, *, canonical=None):
              if sha(WORKSPACE / 'pubspec.lock') != PUB_LOCK:
                  raise ValueError('Exact enforced source pubspec.lock drifted')
              pod = WORKSPACE / 'ios/Podfile.lock'
              digest = sha(pod) if pod.is_file() else None
              row = {'stage': label, 'pubspec_sha256': PUB_LOCK, 'pod_sha256': digest}
              if pod.is_file():
                  shutil.copyfile(pod, OUTPUT / ('GENERATED_Podfile-' + label + '.lock'))
              if canonical is not None and digest != canonical:
                  raise ValueError('Canonical generated Pod lock changed after all native preparation')
              receipt.setdefault('dependency_lock_checkpoints', []).append(row)
              save()
              return digest

          def resolved_pods(raw):
              section = raw.decode('utf-8').split('DEPENDENCIES:', 1)[0]
              pairs = re.findall(r'^  - ([^ ]+) \(([^)\r\n]+)\)(?::)?$', section, flags=re.M)
              pods = dict(pairs)
              if not pairs or len(pods) != len(pairs):
                  raise ValueError('Actual unique top-level PODS versions are required')
              return pods

          def freeze_reconciled_dependency_locks():
              initial = json.loads((OUTPUT / 'dependency-locks-resolution.json').read_text(encoding='utf-8'))
              initial_bytes = (OUTPUT / 'GENERATED_Podfile.lock').read_bytes()
              actual_bytes = (WORKSPACE / 'ios/Podfile.lock').read_bytes()
              actual = {name: sha(WORKSPACE / name) for name in ['pubspec.lock', 'ios/Podfile.lock']}
              with (OUTPUT / 'RECONCILED_Podfile.lock').open('xb') as handle:
                  handle.write(actual_bytes)
              before_pods, after_pods = resolved_pods(initial_bytes), resolved_pods(actual_bytes)
              proof = {**initial, 'after': actual, 'initial_resolution': initial['after'],
                  'canonical_verified': False,
                  'canonical_stage': 'after ALL normal Flutter config and Debug app build preparation; before targeted native Coach tests',
                  'initial_pod_lock_copy': 'GENERATED_Podfile.lock', 'generated_pod_lock_copy': 'RECONCILED_Podfile.lock',
                  'initial_resolved_pods': before_pods, 'canonical_resolved_pods': after_pods,
                  'actual_resolved_pod_versions': [key + ' (' + value + ')' for key, value in sorted(after_pods.items())],
                  'pod_versions_changed_in_common': {key: [before_pods[key], after_pods[key]]
                      for key in before_pods.keys() & after_pods.keys() if before_pods[key] != after_pods[key]},
                  'source_pubspec_lock_preserved': actual['pubspec.lock'] == initial['before']['pubspec.lock']}
              path = OUTPUT / 'dependency-locks-reconciled.json'
              with path.open('x', encoding='utf-8') as handle:
                  json.dump(proof, handle, indent=2)
              if hashlib.sha256(initial_bytes).hexdigest() != initial['after']['ios/Podfile.lock']:
                  raise ValueError('Initial actual Pod lock evidence changed')
              if initial['before']['pubspec.lock'] != PUB_LOCK or initial['before']['ios/Podfile.lock'] is not None:
                  raise ValueError('Exact initial source pub lock and absent source Pod lock required')
              if actual['pubspec.lock'] != PUB_LOCK:
                  raise ValueError('Source pubspec.lock changed during normal native configuration')
              if set(after_pods) != {'Flutter'} or proof['pod_versions_changed_in_common']:
                  raise ValueError('Native reconciliation must leave only unchanged Flutter Pod')
              if before_pods.get('Flutter') != after_pods.get('Flutter'):
                  raise ValueError('Flutter Pod version changed during reconciliation')
              proof['canonical_verified'] = True
              path.write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
              receipt['canonical_dependency_lock_proof'] = proof
              return actual['ios/Podfile.lock']

          def create():
              _, log = stage('create-ipad-' + str(len(devices) + 1), ['xcrun', 'simctl', 'create',
                  'BIL45-ipad-cold-' + os.environ['GITHUB_RUN_ID'] + '-' + str(len(devices) + 1),
                  'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB',
                  'com.apple.CoreSimulator.SimRuntime.iOS-26-5'])
              device = log.read_text().strip()
              if re.fullmatch(r'[0-9A-Fa-f-]{36}', device) is None:
                  raise ValueError('A new owned synthetic iPad identity is required')
              devices.append(device)
              return device

          def collect_device_fixture(device, folder):
              _, log = stage('container-' + folder.name, ['xcrun', 'simctl', 'get_app_container',
                  device, 'com.bilhealth.bodyintelligencelog', 'data'], timeout=30)
              container = Path(log.read_text().strip()).resolve()
              expected = Path.home() / 'Library/Developer/CoreSimulator/Devices' / device / 'data/Containers/Data/Application'
              container.relative_to(expected.resolve())
              generated = container / 'Documents/feature-splashes-native'
              if generated.is_dir():
                  shutil.copytree(generated, folder / 'device-fixture-originals')

          try:
              save()
              if sys.platform != 'darwin' or os.environ['GITHUB_EVENT_NAME'] != 'push' or os.environ['GITHUB_REF'] != BRANCH:
                  raise ValueError('Exact reviewed macOS diagnostic branch push required')
              if git('rev-parse', 'HEAD') != os.environ['GITHUB_SHA'] or git('show', '-s', '--format=%P', 'HEAD') != PARENT:
                  raise ValueError('Single-parent S3 diagnostic source required')
              if set(git('diff', '--name-only', PARENT, 'HEAD').splitlines()) != set(EXPECTED_FILES) | {WORKFLOW}:
                  raise ValueError('Only four passive telemetry paths and one workflow may differ')
              if any(sha(WORKSPACE / name) != digest for name, digest in EXPECTED_FILES.items()):
                  raise ValueError('Actual telemetry source bytes differ from independent review')
              receipt['source_tree'] = git('rev-parse', 'HEAD^{tree}')
              receipt['source_scope_hashes'] = {name: sha(WORKSPACE / name) for name in [*EXPECTED_FILES, WORKFLOW, TARGET, DRIVER]}
              DEFINES.append('BIL_QA_SOURCE_FINGERPRINT=' + receipt['source_tree'])
              _, log = stage('xcode-version', ['xcodebuild', '-version'])
              if log.read_text().strip() != 'Xcode 26.6\nBuild version 17F113':
                  raise ValueError('Exact original Xcode26.6/17F113 required')
              _, log = stage('simulator-sdk', ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'])
              if log.read_text().strip() != '26.5':
                  raise ValueError('Exact original Simulator SDK26.5 required')
              _, log = stage('flutter-version', ['flutter', '--version', '--machine'])
              if json.loads(log.read_text()).get('frameworkVersion') != '3.44.6':
                  raise ValueError('Exact original Flutter3.44.6 required')
              _, log = stage('pods-version', ['pod', '--version'])
              if log.read_text().strip() != '1.16.2':
                  raise ValueError('Exact isolated CocoaPods1.16.2 required')
              _, log = stage('runtimes', ['xcrun', 'simctl', 'list', 'runtimes', 'available', '-j'])
              runtimes = json.loads(log.read_text())['runtimes']
              if len([v for v in runtimes if v.get('identifier') == 'com.apple.CoreSimulator.SimRuntime.iOS-26-5'
                      and v.get('buildversion') == '23F77' and v.get('isAvailable') is True]) != 1:
                  raise ValueError('Exact original iOS26.5/23F77 runtime required')
              stage('native-preflight', ['python3', '.github/scripts/bil_ios_native_preflight.py',
                  '--workspace', str(WORKSPACE), '--output', str(OUTPUT)], timeout=900)
              stage('flutter-native-config', ['flutter', '--verbose', 'build', 'ios', '--config-only', '--simulator',
                  '--debug', '--no-codesign', '--no-pub', '--build-number', '39', '--target', TARGET,
                  *['--dart-define=' + value for value in DEFINES]], timeout=900)
              lock_checkpoint('after-flutter-native-config')
              first = create()
              stage('native-simulator-build', ['python3', '.github/scripts/bil_ios_simulator_adhoc_sign.py',
                  '--qa-simulator-only', '--build-number', '39', '--workspace', str(WORKSPACE), '--app', str(APP),
                  '--output', str(OUTPUT / 'simulator-signature.json'), '--target', TARGET,
                  '--source-head', os.environ['GITHUB_SHA'], '--source-tree', receipt['source_tree'], '--device', first], timeout=1800)
              # Canonical dependency evidence begins only after ALL normal native config
              # and build preparation. Earlier generated locks remain original evidence.
              canonical = freeze_reconciled_dependency_locks()
              lock_checkpoint('canonical-post-native-build', canonical=canonical)
              text = (WORKSPACE / 'ios/Podfile.lock').read_text()
              receipt['actual_canonical_resolved_pods'] = re.findall(r'^  - (.+?)(?::)?$', text.split('DEPENDENCIES:', 1)[0], re.M)
              for index in range(1, 4):
                  pending = 4 - index
                  fair_drive_budget = min(600, int((controller_deadline - time.monotonic() - 90 * pending) / pending))
                  if fair_drive_budget < 360:
                      for row in receipt['probes'][index - 1:]:
                          row['status'] = 'NOT_RUN_INSUFFICIENT_CONTROLLER_BUDGET'
                      save()
                      raise TimeoutError('Insufficient budget for the remaining independently planned cold probes')
                  device = first if index == 1 else create()
                  folder = OUTPUT / ('cold-process-' + str(index))
                  folder.mkdir()
                  stage('boot-' + str(index), ['xcrun', 'simctl', 'boot', device])
                  stage('bootstatus-' + str(index), ['xcrun', 'simctl', 'bootstatus', device, '-b'], timeout=180)
                  stage('appearance-' + str(index), ['xcrun', 'simctl', 'ui', device, 'appearance', 'light'])
                  probe = receipt['probes'][index - 1]
                  probe.update({'device': device,
                      'host_context_before': {'loadavg': list(os.getloadavg()), 'cpu_count': os.cpu_count()},
                      'drive_budget_seconds': fair_drive_budget,
                      'original_1500ms_assertions_unchanged': True, 'status': 'RUNNING'})
                  save()
                  code, _ = stage('drive-cold-' + str(index), ['python3', '.github/scripts/bil39_simulator_vm_attach.py',
                      '--qa-simulator-only', '--device', device, '--app', str(APP), '--output', str(folder / 'transport'),
                      '--target', TARGET, '--driver', DRIVER, '--label', 'ipad-coach-cold-' + str(index),
                      '--log', str(folder / 'native-feature-splashes.log'), '--receipt', str(folder / 'native-drive-result.json')],
                      timeout=fair_drive_budget, allow_failure=True, environment={'BIL_NATIVE_CAPTURE_DEVICE_ID': device,
                          'BIL_FEATURE_NATIVE_OUTPUT': str(folder / 'host-fixture-originals')})
                  probe['process_exit'] = code
                  probe['status'] = 'DRIVE_RESULT_PRESERVED_EVIDENCE_PENDING'
                  save()
                  try:
                      collect_device_fixture(device, folder)
                      reveal_path = folder / 'device-fixture-originals/coach-reveal-ar-light-normal-metadata.json'
                      reveal = json.loads(reveal_path.read_text()) if reveal_path.is_file() else {}
                      timing = reveal.get('qa_stage_timings', {})
                      dart_rows = timing.get('dart', {}).get('rows', [])
                      native_streams = timing.get('native', [])
                      telemetry = (timing.get('collection_after_original_observation') is True
                          and timing.get('dart', {}).get('enabled') is True
                          and {'reply_release', 'markdown_init', 'platform_created'}.issubset({r.get('stage') for r in dart_rows})
                          and len(native_streams) == 1 and native_streams[0].get('enabled') is True
                          and len(native_streams[0].get('rows', [])) > 0)
                      probe['original_reveal_completed'] = reveal.get('completed')
                      probe['passive_stage_telemetry_available'] = telemetry
                      probe['actual_reveal_metadata_sha256'] = sha(reveal_path) if reveal_path.is_file() else None
                      transport = json.loads((folder / 'transport/attachment-receipt.json').read_text())
                      probe['native_process_pid'] = transport.get('pid')
                      probe['status'] = ('PASS_ORIGINAL_TWO_CASES' if code == 0 and telemetry
                          else 'FAIL_ORIGINAL_VERDICT_PRESERVED' if code != 0 else 'FAIL_DIAGNOSTIC_TELEMETRY_MISSING')
                  except Exception as evidence_error:
                      probe['status'] = 'FAIL_EVIDENCE_COLLECTION_OR_READ'
                      probe['evidence_error_type'] = type(evidence_error).__name__
                  finally:
                      probe['host_context_after'] = {'loadavg': list(os.getloadavg()), 'cpu_count': os.cpu_count()}
                      save()
                  lock_checkpoint('after-cold-' + str(index), canonical=canonical)
                  stage('shutdown-' + str(index), ['xcrun', 'simctl', 'shutdown', device], timeout=30)
                  save()
              if len(receipt['probes']) != 3 or any(p['status'] != 'PASS_ORIGINAL_TWO_CASES' for p in receipt['probes']):
                  raise RuntimeError('One or more predeclared cold processes failed; later passes cannot rescue them')
              if len({p.get('native_process_pid') for p in receipt['probes']}) != 3 or any(type(p.get('native_process_pid')) is not int for p in receipt['probes']):
                  raise ValueError('Three distinct actual native process identities required')
              receipt['status'] = 'ALL3_ORIGINAL_TARGETED_CASES_PASS_DIAGNOSTIC_ONLY_NOT_RELEASE_ACCEPTANCE'
          except Exception as error:
              receipt.update(status='FAIL_DIAGNOSTIC', failure_type=type(error).__name__, failure=str(error))
              for probe in receipt['probes']:
                  if probe['status'] in {'NOT_STARTED', 'RUNNING', 'DRIVE_RESULT_PRESERVED_EVIDENCE_PENDING'}:
                      probe['status'] = 'NOT_COMPLETED_DUE_TO_CONTROLLER_FAILURE'
              raise
          finally:
              receipt['controller_elapsed_seconds'] = time.monotonic() - controller_started
              save()
              for device in devices:
                  for operation in ('shutdown', 'delete'):
                      run_bounded(['xcrun', 'simctl', operation, device], label='cleanup-' + operation,
                          log_path=OUTPUT / ('cleanup-' + operation + '-' + device + '.log'),
                          receipt_path=OUTPUT / ('cleanup-' + operation + '-' + device + '-result.json'), timeout_seconds=30)
          PY_IPAD_COLD_DIAGNOSTIC
      - name: Preserve actual stage metadata and native originals on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil45-ipad-coach-cold-diagnostic-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/qa/bil45-ipad-coach-cold-diagnostic
          if-no-files-found: error
          retention-days: 14
