name: BIL Android33 immutable S3 recovery controller
run-name: "Android33 app S3; separate controller provenance; no Play submission"
on:
  push:
    branches: [codex/bil-android33-recovery-controller-20261106]
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: bil-android33-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  BIL_TESTED_SOURCE_SHA: 4c23f40391362b73ae7f6fe850bbdb7f70037130
  BIL_SIGNING_ORCHESTRATION_SHA: ${{ github.sha }}
  BIL_RELEASE_BRANCH: codex/bil41-android33-release-20261106
  BIL_RELEASE_CONFIGURATION_PATH: docs/release/BIL_ANDROID33_CONFIGURATION_20261106.md
  BIL_ORIGINAL_SHA: 0c94cf2a75c01ebb7cbea74704a18a8109831194
jobs:
  signed-android-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the immutable tested application source S3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c23f40391362b73ae7f6fe850bbdb7f70037130
          fetch-depth: 0
          persist-credentials: false
      - name: Prove separate controller and pristine S3; require original live all10 gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/controller_manifest.py" <<'PY_CONTROLLER'
          """Source-pinned Android33 controller provenance; never changes app source."""
          from __future__ import annotations
          
          import argparse
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          
          sys.dont_write_bytecode = True
          APP_SOURCE = '4c23f40391362b73ae7f6fe850bbdb7f70037130'
          REPOSITORY = 'bilhealth-admin/Body-Intelligence'
          CONTROLLER_BRANCH = 'codex/bil-android33-recovery-controller-20261106'
          WORKFLOW = '.github/workflows/bil_android33_recovery_controller_20261106.yml'
          GATE = 'tools/qa/bil41_internal_build_ci.py'
          RENDERER = 'tools/qa/bil41_internal_signing_manifest.py'
          PINNED_TOOLS = {
              GATE: '48c29e7860c6f04ead8653ca7be2f64231146712f53b17255dfaae68b4166e16',
              RENDERER: '7724f4fa7fa0e1d410aeb894b507faabba8de1acfe5359184404d51d1cacd964',
          }
          
          
          def git(root: Path, *args: str) -> str:
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
          
          
          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def positive(raw: str, name: str) -> int:
              if not re.fullmatch('[1-9][0-9]*', raw):
                  raise ValueError('Positive actual GitHub ' + name + ' required')
              return int(raw)
          
          
          def verify_provenance(root: Path, env: dict, *, source: str = APP_SOURCE) -> dict:
              """The source override exists for isolated Git-graph tests, not the CLI."""
              controller = env.get('GITHUB_SHA', '')
              ref = 'refs/heads/' + CONTROLLER_BRANCH
              if (not re.fullmatch('[0-9a-f]{40}', source)
                      or not re.fullmatch('[0-9a-f]{40}', controller) or controller == source
                      or env.get('GITHUB_REPOSITORY') != REPOSITORY
                      or env.get('GITHUB_EVENT_NAME') != 'push'
                      or env.get('GITHUB_REF') != ref
                      or env.get('GITHUB_REF_NAME') != CONTROLLER_BRANCH
                      or env.get('GITHUB_WORKFLOW_SHA') != controller
                      or env.get('GITHUB_WORKFLOW_REF') != REPOSITORY + '/' + WORKFLOW + '@' + ref):
                  raise ValueError('Actual controller SHA, workflow and push branch are required')
              run = positive(env.get('GITHUB_RUN_ID', ''), 'run id')
              attempt = positive(env.get('GITHUB_RUN_ATTEMPT', ''), 'run attempt')
              if git(root, 'rev-parse', 'HEAD') != source:
                  raise ValueError('Checkout must be the exact original application source')
              if git(root, 'status', '--porcelain=v1', '--untracked-files=all'):
                  raise ValueError('Application checkout must be pristine before prerequisites')
              if git(root, 'rev-parse', controller + '^{commit}') != controller:
                  raise ValueError('The controller must be a real available commit')
              if git(root, 'show', '-s', '--format=%P', controller).split() != [source]:
                  raise ValueError('The sole controller parent must be the application source')
              changed = git(root, 'diff-tree', '--no-commit-id', '--name-status',
                            '--no-renames', '-r', source, controller)
              if changed != 'A\t' + WORKFLOW:
                  raise ValueError('Controller may only add its single expected workflow')
              tree = git(root, 'ls-tree', controller, '--', WORKFLOW)
              if not re.fullmatch(r'100644 blob [0-9a-f]{40}\t' + re.escape(WORKFLOW), tree):
                  raise ValueError('Controller workflow must be one regular non-executable file')
              return {'status': 'STRICT_CONTROLLER_PROVENANCE_PASS', 'source_sha': source,
                      'workflow_sha': controller, 'controller_parent_sha': source,
                      'controller_branch': CONTROLLER_BRANCH, 'controller_workflow': WORKFLOW,
                      'controller_workflow_blob': tree.split()[2],
                      'controller_diff': changed, 'event': 'push', 'checkout_clean': True,
                      'run_id': run, 'run_attempt': attempt}
          
          
          def source_contract(root: Path) -> dict:
              for name, expected in PINNED_TOOLS.items():
                  if digest(root / name) != expected:
                      raise ValueError('Pinned source tool changed: ' + name)
              folder = str(root / 'tools/qa')
              sys.path.insert(0, folder)
              try:
                  spec = importlib.util.spec_from_file_location('original_source_ci_gate', root / GATE)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
              finally:
                  sys.path.remove(folder)
              if module.REPOSITORY != REPOSITORY or len(module.WORKFLOWS) != 10:
                  raise ValueError('Original ten-workflow source contract required')
              return {'branch': module.BRANCH, 'cloud_source': module.CLOUD_SOURCE,
                      'workflows': module.WORKFLOWS, 'repository': module.REPOSITORY}
          
          
          def validate_source_receipt(receipt: dict, contract: dict, *, source: str = APP_SOURCE) -> None:
              """Preserve every source-receipt check from the pinned original renderer.
          
              Its source==orchestration assumption is replaced by verify_provenance,
              never by a synthetic workflow_sha or a changed GitHub environment.
              """
              if (not re.fullmatch('[0-9a-f]{40}', source)
                      or receipt.get('source_sha') != source
                      or receipt.get('source_branch') != contract['branch']
                      or receipt.get('platform') != 'android'
                      or receipt.get('status') != 'INTERNAL_BUILD_PREREQUISITES_PASS'
                      or type(receipt.get('build')) is not int or receipt['build'] != 33
                      or receipt.get('app_store_submission_approved') is not False
                      or receipt.get('public_release_approved') is not False
                      or receipt.get('physical_device_acceptance') != 'PENDING_INSTALLATION_OF_NEW_ARTIFACT'
                      or receipt.get('signed_artifact_identity') != 'MUST_PASS_AFTER_BUILD'):
                  raise ValueError('Exact original-source internal Android33 prerequisites required')
              cloud = receipt.get('cloud_source_parity', {})
              if (cloud.get('status') != 'RECORDED_DEPLOYED_SOURCE_PARITY_PASS'
                      or cloud.get('source_commit') != contract['cloud_source']
                      or cloud.get('runtime_file_count') != 15 or cloud.get('deployed_version') != 134
                      or cloud.get('new_model_requests') != 0
                      or cloud.get('live_model_health') != 'NOT_TESTED_BY_THIS_GATE'
                      or not re.fullmatch('[0-9a-f]{64}', cloud.get('receipt_sha256', ''))):
                  raise ValueError('Separate recorded deployed-source parity is required')
              ci = receipt.get('ci')
              expected = contract['workflows']
              if (not isinstance(ci, list) or len(ci) != len(expected)
                      or {row.get('workflow') for row in ci} != set(expected)):
                  raise ValueError('All distinct ten exact-source workflows are required')
              run_ids = set()
              for row in ci:
                  run, jobs = row.get('run_id'), row.get('required_jobs')
                  if (type(run) is not int or run <= 0 or run in run_ids
                          or row.get('source_sha') != source
                          or row.get('source_branch') != contract['branch']
                          or row.get('status') != 'PASS'
                          or row.get('url') != f'https://github.com/{REPOSITORY}/actions/runs/{run}'
                          or not isinstance(jobs, list) or len(jobs) != len(set(jobs))
                          or set(jobs) != expected[row['workflow']]):
                      raise ValueError('Mismatched original source, run, job coverage or outcome')
                  run_ids.add(run)
          
          
          def output_paths(root: Path, env: dict, provenance: dict, paths: list[Path]) -> None:
              temp = Path(env.get('RUNNER_TEMP', '')).resolve(strict=True)
              if not temp.is_dir() or temp.is_relative_to(root.resolve()):
                  raise ValueError('Runner-private output directory must be outside the app checkout')
              suffix = f'-r{provenance["run_id"]}-a{provenance["run_attempt"]}'
              resolved = []
              for path in paths:
                  target = path.resolve()
                  if (target.parent != temp or target.exists() or path.is_symlink()
                          or not target.stem.endswith(suffix)):
                      raise ValueError('New direct RUNNER_TEMP outputs with run/attempt suffix are required')
                  resolved.append(target)
              if len(set(resolved)) != len(paths):
                  raise ValueError('Receipt, manifest and proof must have distinct new paths')
          
          
          def render(receipt: dict, contract: dict, provenance: dict) -> str:
              validate_source_receipt(receipt, contract)
              if (provenance.get('status') != 'STRICT_CONTROLLER_PROVENANCE_PASS'
                      or provenance.get('source_sha') != APP_SOURCE
                      or provenance.get('controller_parent_sha') != APP_SOURCE
                      or provenance.get('controller_diff') != 'A\t' + WORKFLOW
                      or not re.fullmatch('[0-9a-f]{40}', provenance.get('workflow_sha', ''))
                      or provenance['workflow_sha'] == APP_SOURCE):
                  raise ValueError('Independently verified distinct controller provenance required')
              lines = [
                  '# Android33 exact-source internal prerequisites; separate controller', '',
                  'ACCEPTANCE_SCOPE: INTERNAL_ANDROID_ARTIFACT_ONLY',
                  'STAGING_MANIFEST_COMPLETE: YES', 'CANDIDATE_FROZEN_OR_ACCEPTED: YES',
                  'UNRESOLVED_REVIEW_COUNT: 0', 'RELEASE_VERSION: 1.0.0',
                  'RELEASE_BUILD_NUMBER: 33', 'SOURCE_SHA: ' + APP_SOURCE,
                  'SIGNING_ORCHESTRATION_SHA: ' + provenance['workflow_sha'],
                  'CONTROLLER_PARENT_SHA: ' + APP_SOURCE,
                  'CONTROLLER_WORKFLOW: ' + WORKFLOW,
                  'CONTROLLER_RUN_ID: ' + str(provenance['run_id']),
                  'CONTROLLER_RUN_ATTEMPT: ' + str(provenance['run_attempt']),
                  'PUBLIC_RELEASE_APPROVED: NO', 'APP_STORE_SUBMISSION_APPROVED: NO',
                  'PHYSICAL_ARTIFACT_ACCEPTANCE: PENDING_INSTALLATION',
                  'SIGNED_ARTIFACT_ACCEPTANCE: MUST_PASS_AFTER_BUILD',
                  'STAGING_ENVIRONMENT_CREATED: NO',
                  'DEPLOYED_COACH_SOURCE_COMMIT: ' + contract['cloud_source'],
                  'DEPLOYED_COACH_VERSION: 134', 'LIVE_MODEL_HEALTH: NOT_TESTED_BY_THIS_GATE', '',
                  'The application checkout and all ten CI runs are the immutable source above.',
                  'The different controller commit only adds the named workflow to that source.',
                  'The legacy staging marker describes this prerequisite record, not deployment.',
                  'Physical acceptance, signed binary identity and store delivery remain pending.', '',
              ]
              lines += [f'- {r["workflow"]}: {r["url"]} (PASS, source {APP_SOURCE})'
                        for r in sorted(receipt['ci'], key=lambda row: row['workflow'])]
              return '\n'.join(lines) + '\n'
          
          
          def run_source_gate(root: Path, receipt: Path) -> None:
              subprocess.run([sys.executable, str(root / GATE), '--sha', APP_SOURCE,
                              '--branch', 'codex/bil41-android33-release-20261106',
                              '--platform', 'android', '--output', str(receipt)], cwd=root, check=True)
          
          
          def execute(root: Path, env: dict, receipt_path: Path, manifest_path: Path,
                      proof_path: Path) -> dict:
              root = root.resolve(strict=True)
              provenance = verify_provenance(root, env)
              output_paths(root, env, provenance, [receipt_path, manifest_path, proof_path])
              contract = source_contract(root)
              # Production main cannot opt out or select a different gate implementation.
              run_source_gate(root, receipt_path)
              if verify_provenance(root, env) != provenance:
                  raise ValueError('Source/controller changed while original CI gate ran')
              raw = receipt_path.read_bytes()
              receipt = json.loads(raw)
              text = render(receipt, contract, provenance)
              with manifest_path.open('xb') as stream:
                  stream.write(text.encode('utf-8'))
              proof = {**provenance, 'platform': 'android', 'build': 33,
                       'pre_signing_receipt_sha256': hashlib.sha256(raw).hexdigest(),
                       'manifest_sha256': digest(manifest_path), 'scope': 'INTERNAL_BUILD_ONLY',
                       'all10_original_source_runs_verified_by_live_gate': True,
                       'public_release_approved': False, 'app_store_submission_approved': False,
                       'physical_device_acceptance': 'PENDING',
                       'source_tools': PINNED_TOOLS, 'controller_only_change': True}
              with proof_path.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(proof, indent=2) + '\n')
              return proof
          
          
          def main() -> None:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--app-root', type=Path, required=True)
              parser.add_argument('--receipt-output', type=Path, required=True)
              parser.add_argument('--manifest-output', type=Path, required=True)
              parser.add_argument('--proof-output', type=Path, required=True)
              args = parser.parse_args()
              env = dict(os.environ)
              temp = Path(env['RUNNER_TEMP']).resolve(strict=True)
              github_env = Path(env['GITHUB_ENV'])
              if (github_env.is_symlink() or not github_env.resolve().is_relative_to(temp)
                      or not github_env.is_file()):
                  raise ValueError('Actual runner-private GITHUB_ENV command file required')
              proof = execute(args.app_root, env, args.receipt_output,
                              args.manifest_output, args.proof_output)
              with github_env.open('a', encoding='utf-8') as stream:
                  for key, value in {
                      'BIL_RELEASE_MANIFEST_PATH': str(args.manifest_output.resolve()),
                      'BIL_AUDITED_FREEZE_MANIFEST_SHA256': proof['manifest_sha256'],
                      'BIL_CONTROLLER_CI_RECEIPT_PATH': str(args.receipt_output.resolve()),
                      'BIL_CONTROLLER_PROOF_PATH': str(args.proof_output.resolve()),
                  }.items():
                      stream.write(key + '=' + value + '\n')
              print('SOURCE_S3_CI_AND_SEPARATE_CONTROLLER_PROVENANCE=PASS; NO_PUBLIC_APPROVAL')
          
          
          if __name__ == '__main__':
              main()
          PY_CONTROLLER
          python3 "$RUNNER_TEMP/controller_manifest.py" \
            --app-root "$GITHUB_WORKSPACE" \
            --receipt-output "$RUNNER_TEMP/BIL33-pre-signing-ci-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json" \
            --manifest-output "$RUNNER_TEMP/BIL-android33-internal-acceptance-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.md" \
            --proof-output "$RUNNER_TEMP/BIL-android33-controller-provenance-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
          cp "$RUNNER_TEMP/BIL33-pre-signing-ci-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json" BIL33-pre-signing-ci.json
          cp "$RUNNER_TEMP/BIL-android33-controller-provenance-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json" BIL-android33-controller-provenance.json
          cp "$RUNNER_TEMP/BIL-android33-internal-acceptance-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.md" BIL-android33-internal-acceptance.md

      - name: Preflight actual Ubuntu apksigner API on authenticated existing S3 debug APK; no app build
        id: apk_signer_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          APKSIGNER_JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -s "$APKSIGNER_JAR"
          mkdir "$RUNNER_TEMP/bil-apk-der-classes"
          cat > "$RUNNER_TEMP/VerifyApkCertificate.java" <<'JAVA_DER'
          import com.android.apksig.ApkVerifier;
          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.MessageDigest;
          import java.security.cert.X509Certificate;
          import java.util.HexFormat;
          import java.util.LinkedHashSet;
          import java.util.Set;
          
          /** Verifies APK signatures and DER identities; CLI presentation is not a trust input. */
          public final class VerifyApkCertificate {
              private static String digest(X509Certificate certificate) throws Exception {
                  return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                          .digest(certificate.getEncoded()));
              }
          
              private static void require(boolean condition, String code) {
                  if (!condition) throw new IllegalStateException(code);
              }
          
              public static void main(String[] args) {
                  try {
                      require(args.length == 3, "ARGUMENTS");
                      String expected = System.getenv("EXPECTED_UPLOAD_CERT_SHA256");
                      require(expected != null, "EXPECTED_CERT_MISSING");
                      boolean discoverDebugOnly = args[2].equals("debug-preflight")
                              && expected.equals("DISCOVER_VERIFIED_DEBUG_IDENTITY_ONLY");
                      expected = expected.replaceAll("[:\\s]", "").toLowerCase(java.util.Locale.ROOT);
                      require(discoverDebugOnly || expected.matches("[0-9a-f]{64}"), "EXPECTED_CERT_FORMAT");
                      File apk = new File(args[0]);
                      Path output = Path.of(args[1]);
                      require(apk.isFile() && apk.length() > 0 && !Files.exists(output), "INPUT_OUTPUT");
                      require(args[2].equals("release") || args[2].equals("debug-preflight"), "SCOPE");
                      ApkVerifier.Result result = new ApkVerifier.Builder(apk).build().verify();
                      require(result.isVerified() && !result.containsErrors(), "APK_SIGNATURE_INVALID");
                      require(result.getSignerCertificates().size() == 1, "APK_SIGNER_COUNT");
                      if (discoverDebugOnly) expected = digest(result.getSignerCertificates().get(0));
                      Set<String> identities = new LinkedHashSet<>();
                      identities.add(digest(result.getSignerCertificates().get(0)));
                      for (var signer : result.getV1SchemeSigners()) {
                          require(!signer.containsErrors(), "V1_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV2SchemeSigners()) {
                          require(!signer.containsErrors(), "V2_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV3SchemeSigners()) {
                          require(!signer.containsErrors(), "V3_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV31SchemeSigners()) {
                          require(!signer.containsErrors(), "V31_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      for (var signer : result.getV4SchemeSigners()) {
                          require(!signer.containsErrors(), "V4_SIGNER_ERROR");
                          identities.add(digest(signer.getCertificate()));
                      }
                      require(identities.size() == 1 && identities.contains(expected), "APK_CERTIFICATE_MISMATCH");
                      String json = "{\n"
                              + "  \"status\": \"VERIFIED_APK_SIGNATURE_AND_DER_IDENTITY\",\n"
                              + "  \"scope\": \"" + args[2] + "\",\n"
                              + "  \"apk_signature_verified\": true,\n"
                              + "  \"current_signer_count\": 1,\n"
                              + "  \"distinct_verified_scheme_leaf_certificates\": 1,\n"
                              + "  \"certificate_sha256\": \"" + expected + "\",\n"
                              + "  \"verified_v1\": " + result.isVerifiedUsingV1Scheme() + ",\n"
                              + "  \"verified_v2\": " + result.isVerifiedUsingV2Scheme() + ",\n"
                              + "  \"verified_v3\": " + result.isVerifiedUsingV3Scheme() + ",\n"
                              + "  \"verified_v31\": " + result.isVerifiedUsingV31Scheme() + ",\n"
                              + "  \"verified_v4\": " + result.isVerifiedUsingV4Scheme() + ",\n"
                              + "  \"play_delivery_proven\": false\n}\n";
                      Files.writeString(output, json, StandardCharsets.UTF_8,
                              java.nio.file.StandardOpenOption.CREATE_NEW);
                      System.out.println("APK_SIGNATURE_AND_DER_CERTIFICATE=PASS");
                  } catch (Exception exception) {
                      // Neither tool exceptions nor environment values belong in diagnostic artifacts.
                      System.err.println("APK_SIGNATURE_AND_DER_CERTIFICATE=FAIL");
                      System.exit(1);
                  }
              }
          }
          JAVA_DER
          javac --release 17 -cp "$APKSIGNER_JAR" -d "$RUNNER_TEMP/bil-apk-der-classes" "$RUNNER_TEMP/VerifyApkCertificate.java"
          {
            echo "BIL_APKSIGNER=$APKSIGNER"
            echo "BIL_APKSIGNER_JAR=$APKSIGNER_JAR"
            echo "BIL_DER_VERIFIER_CLASSES=$RUNNER_TEMP/bil-apk-der-classes"
          } >> "$GITHUB_ENV"
          "$APKSIGNER" version > BIL-apksigner-tool-version.txt
          sha256sum "$APKSIGNER_JAR" > BIL-apksigner-tool-jar.sha256
          gh api repos/bilhealth-admin/Body-Intelligence/actions/artifacts/13470321068 > "$RUNNER_TEMP/debug-artifact-metadata.json"
          python3 - <<'PY_DEBUG_META'
          import json,pathlib,os
          meta=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'debug-artifact-metadata.json').read_text())
          receipt=json.loads(pathlib.Path('BIL33-pre-signing-ci.json').read_text())
          native=[r for r in receipt['ci'] if r['workflow']=='bil_codeql_security_extended.yml']
          assert len(native)==1 and native[0]['run_id']==42144515551
          assert meta['id']==13470321068 and meta['expired'] is False
          assert meta['name']=='bil-android-codeql-apk-4c23f40391362b73ae7f6fe850bbdb7f70037130-1'
          assert meta['digest']=='sha256:2c5b7f393edd90da87d2cfab68ebbcd8bf0f83cfd9b8862a3e33e6f0a1611075'
          assert meta['workflow_run']['id']==42144515551 and meta['workflow_run']['head_sha']==os.environ['BIL_TESTED_SOURCE_SHA']
          assert meta['workflow_run']['head_branch']=='codex/bil41-android33-release-20261106'
          pathlib.Path('BIL-apksigner-preflight-artifact.json').write_text(json.dumps({'artifact_id':meta['id'],'name':meta['name'],'zip_digest':meta['digest'],'run_id':42144515551,'source_sha':os.environ['BIL_TESTED_SOURCE_SHA'],'scope':'DEBUG_APK_TOOL_PREFLIGHT_ONLY_NOT_UPLOAD_CERTIFICATE_PROOF'},indent=2)+'\n')
          PY_DEBUG_META
          gh api repos/bilhealth-admin/Body-Intelligence/actions/artifacts/13470321068/zip > "$RUNNER_TEMP/bil-s3-debug-apk.zip"
          echo "2c5b7f393edd90da87d2cfab68ebbcd8bf0f83cfd9b8862a3e33e6f0a1611075  $RUNNER_TEMP/bil-s3-debug-apk.zip" | sha256sum --check -
          python3 - <<'PY_DEBUG_ZIP'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'bil-s3-debug-apk.zip') as archive:
              candidates=[i for i in archive.infolist() if not i.is_dir() and pathlib.PurePosixPath(i.filename).name=='app-debug.apk']
              assert len(candidates)==1
              with archive.open(candidates[0]) as source,(root/'bil-s3-debug.apk').open('xb') as target:
                  import shutil
                  shutil.copyfileobj(source,target)
          PY_DEBUG_ZIP
