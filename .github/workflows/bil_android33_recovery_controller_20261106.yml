          import hashlib,json,os,pathlib,re,subprocess
          def digest(path):
              with pathlib.Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream,'sha256').hexdigest()
          identity=json.loads(pathlib.Path('BIL-android-recording-apk-der-certificate.json').read_text())
          expected=re.sub(r'[:\s]','',os.environ['EXPECTED_UPLOAD_CERT_SHA256']).lower()
          assert re.fullmatch('[0-9a-f]{64}',expected)
          assert identity['status']=='VERIFIED_APK_SIGNATURE_AND_DER_IDENTITY' and identity['scope']=='release'
          assert identity['apk_signature_verified'] is True and identity['current_signer_count']==1
          assert identity['distinct_verified_scheme_leaf_certificates']==1 and identity['certificate_sha256']==expected
          aab=digest('build/app/outputs/bundle/release/app-release.aab')
          assert pathlib.Path('BIL-android-aab.sha256').read_text().split()[0]==aab
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['BIL_TESTED_SOURCE_SHA'] and re.fullmatch('[0-9a-f]{40}',source)
          controller=json.loads(pathlib.Path('BIL-android33-controller-provenance.json').read_text())
          assert controller['workflow_sha']==os.environ['GITHUB_SHA']==os.environ['BIL_SIGNING_ORCHESTRATION_SHA']
          assert controller['source_sha']==source
          receipt={'status':'VERIFIED_DERIVED_SIGNED_QA_APK','source_sha':source,'signing_orchestration_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'build':33,'package':'com.bilhealth.bodyintelligencelog','aab_sha256':aab,'apk_sha256':digest('build/app/outputs/recording-apk/BIL-Android33-derived-universal.apk'),'certificate_sha256':expected,'installation_source':'not_installed','scope':'Universal APK derived from the verified final AAB and signed with the upload certificate. Not Play-delivered, not proof of Play App Signing, billing or Integrity recognition.','app_recompiled':False,'play_upload_performed':False}
          pathlib.Path('BIL-android-recording-apk-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('DERIVED_SIGNED_ANDROID33_QA_APK_IDENTITY=PASS;PLAY_DELIVERY=NOT_PROVEN')
          PY

      - name: Record code and physical-device gate boundary
