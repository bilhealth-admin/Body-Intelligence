name: BIL exact source checkpoint QA
on:
  push:
    branches: [qa/coach-community-next-20261005]
    paths: [.github/workflows/bil_source_checkpoint_qa.yml]
permissions:
  contents: read
jobs:
  source-checkpoint:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/coach-community-next-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve exact UTF-8 snapshot and Git identities without fonts or credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p /tmp/bil-source-checkpoint
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile, zlib
          source = os.environ['GITHUB_SHA']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          blocked = {'.ttf', '.otf', '.ttc', '.woff', '.woff2', '.eot', '.dfont', '.pfa', '.pfb', '.p12', '.p8', '.pem', '.key', '.jks', '.keystore', '.mobileprovision'}
          rows, excluded = [], []
          output = pathlib.Path('/tmp/bil-source-checkpoint/source.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for entry in subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', source]).split(b'\0'):
                  if not entry:
                      continue
                  meta, name = entry.split(b'\t', 1)
                  mode, kind, oid = meta.decode().split()
                  name = name.decode('utf-8')
                  path = pathlib.Path(name)
                  if kind != 'blob' or mode == '120000' or path.suffix.lower() in blocked or path.name.startswith('.env'):
                      excluded.append(name)
                      continue
                  data = path.read_bytes()
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      excluded.append(name)
                      continue
                  if b'\0' in data or b'-----BEGIN PRIVATE KEY-----' in data or b'-----BEGIN RSA PRIVATE KEY-----' in data:
                      excluded.append(name)
                      continue
                  raw = b'blob ' + str(len(data)).encode() + b'\0' + data
                  if hashlib.sha1(raw).hexdigest() != oid:
                      raise RuntimeError('Tracked source drift: ' + name)
                  archive.writestr('source/' + name, data)
                  rows.append({'path': name, 'git_blob': oid, 'sha256': hashlib.sha256(data).hexdigest(), 'mode': mode})
              # Metadata-only Git objects identify the exact snapshot. Binary
              # asset blobs are deliberately absent; this is not a full clone.
              pending, seen = [(source, 'commit'), (tree, 'tree')], set()
              while pending:
                  oid, kind = pending.pop()
                  if oid in seen:
                      continue
                  seen.add(oid)
                  data = subprocess.check_output(['git', 'cat-file', kind, oid])
                  raw = (kind + ' ' + str(len(data)) + '\0').encode() + data
                  if hashlib.sha1(raw).hexdigest() != oid:
                      raise RuntimeError('Git object drift')
                  archive.writestr('git-metadata/objects/' + oid[:2] + '/' + oid[2:], zlib.compress(raw))
                  if kind == 'tree':
                      for row in subprocess.check_output(['git', 'ls-tree', '-z', oid]).split(b'\0'):
                          if row:
                              parts = row.split(b'\t', 1)[0].split()
                              if parts[1] == b'tree':
                                  pending.append((parts[2].decode(), 'tree'))
              manifest = {'source_commit': source, 'source_tree': tree, 'files': rows, 'excluded': excluded, 'scope': 'Exact tracked UTF-8 source and Git metadata only. Binary assets and fonts excluded. Not a complete checkout or test clearance.'}
              archive.writestr('SOURCE_SNAPSHOT.json', json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({'source_commit': source, 'source_tree': tree, 'files': len(rows), 'excluded': len(excluded), 'sha256': hashlib.sha256(output.read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-source-checkpoint-${{ github.sha }}
          path: /tmp/bil-source-checkpoint
          retention-days: 1
          if-no-files-found: error
