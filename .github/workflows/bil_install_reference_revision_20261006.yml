name: BIL isolated reference revision installation
on:
  push:
    branches: [qa/coach-community-next-20261005]
    paths:
      - tool/qa_next/install_reference_revision_20261006.py
      - .github/workflows/bil_install_reference_revision_20261006.yml
permissions:
  contents: write
concurrency:
  group: bil-isolated-reference-installation
  cancel-in-progress: false
jobs:
  materialize-test:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/coach-community-next-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve unchanged locked packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/bil-installed
          flutter --version --machine > /tmp/bil-installed/toolchain.json
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Materialize bounded source revision
        id: apply
        run: |
          set -euo pipefail
          python3 tool/qa_next/install_reference_revision_20261006.py 2>&1 | tee /tmp/bil-installed/apply.log
          git diff --exit-code -- supabase ios android pubspec.yaml pubspec.lock
      - name: Commit actual application source to the isolated QA branch only
        id: commit
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          branch='refs/heads/qa/coach-community-next-20261005'
          expected=os.environ['GITHUB_SHA']
          if os.environ['GITHUB_REF']!=branch: raise RuntimeError('QA branch only')
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          files=sorted(set(changed+[p for p in untracked if p.endswith('.dart')]))
          allowed={
            'lib/features/community/presentation/community_notifications_page.dart',
            'lib/features/community/presentation/community_notifications_rendering.dart',
            'lib/features/community/presentation/community_visible_activity_scope.dart',
            'lib/features/community/presentation/community_notification_read_receipts.dart',
            'test/features/community/community_visible_activity_scope_test.dart',
            'test/features/community/community_activity_auto_read_test.dart',
          }
          required={
            'lib/features/community/presentation/community_notifications_page.dart',
            'lib/features/community/presentation/community_notifications_rendering.dart',
            'lib/features/community/presentation/community_notification_read_receipts.dart',
          }
          if not required.issubset(files) or not set(files).issubset(allowed): raise RuntimeError('Unexpected R4 scope')
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','config','user.name','BIL isolated QA'],check=True)
          subprocess.run(['git','config','user.email','qa@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(qa-only): persist visible Community activity with cursor-safe readback'],check=True)
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::'+auth)
          git=['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth]
          remote=subprocess.check_output(git+['ls-remote','origin',branch],text=True).split()[0]
          if remote!=expected: raise RuntimeError('QA head advanced; refusing overwrite')
          subprocess.run(git+['push','origin','HEAD:'+branch],check=True)
          rows=[{'path':p,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in files]
          pathlib.Path('/tmp/bil-installed/source.json').write_text(json.dumps({'source_commit':actual,'parent_commit':expected,'files':rows,'production_modified':False,'store_build_created':False},indent=2)+'\n')
          PY
      - name: Analyze committed source
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: set -o pipefail; flutter analyze --no-pub 2>&1 | tee /tmp/bil-installed/analyze.log
      - name: Test automatic read scope and actual inbox integration
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded --concurrency 1 \
            test/features/community/community_visible_activity_scope_test.dart \
            test/features/community/community_activity_auto_read_test.dart \
            test/features/community/community_inbox_resume_regression_test.dart \
            test/features/community/community_activity_pagination_test.dart \
            test/features/community/community_notification_resilience_test.dart \
            test/features/community/community_visible_read_receipts_test.dart \
            test/features/community/community_deep_link_test.dart \
            test/architecture_source_file_size_guard_test.dart \
            --timeout 2m 2>&1 | tee /tmp/bil-installed/r4-notifications.log
      - name: Recheck earlier Community regression and account ownership cases
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded --concurrency 1 \
            test/features/community/community_review_regression_test.dart \
            test/features/community/community_session_switch_test.dart \
            test/features/community/community_post_moderation_test.dart \
            test/features/community/community_multi_image_v1_contract_test.dart \
            test/features/community/community_social_v2_ui_test.dart \
            test/features/community/community_post_gallery_behavior_test.dart \
            --timeout 2m 2>&1 | tee /tmp/bil-installed/r3-regression.log
      - name: Capture actual Community widgets
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          BIL_COMMUNITY_CAPTURE_DIR: /tmp/bil-installed/community
        run: set -o pipefail; flutter test --no-pub --reporter expanded test/features/community/community_polish_visual_test.dart --timeout 2m 2>&1 | tee /tmp/bil-installed/community.log
      - name: Export exact changed text source and unchanged-source proof
        if: ${{ always() && steps.commit.outcome == 'success' }}
        run: |
          git diff --exit-code
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          changed=subprocess.check_output(['git','diff','--name-only','8f42b54027580dcaab8a0e702c5a174e8145d15a','HEAD'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/bil-installed/source-delta.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in changed:
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in ('.dart','.py','.yml','.json','.md') and p.parts[0] in ('lib','test','tool','.github','docs') and not p.is_symlink(): z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-installed-reference-${{ github.sha }}
          path: /tmp/bil-installed
          retention-days: 1
          if-no-files-found: error
