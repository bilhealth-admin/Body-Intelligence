name: BIL finalize new-release lint fixes

on:
  push:
    branches: [fix/community-sapphire-health-3033]
    paths:
      - .github/workflows/bil_finalize_lint.yml

permissions:
  contents: write

jobs:
  finalize-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/community-sapphire-health-3033
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply only the reported interpolation lint fix
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply --code=prefer_interpolation_to_compose_strings
          dart format             test/launch_readiness/deferred_ios_simple_barcode_scanner_plugin_test.dart             tool/release/defer_ios_simple_barcode_scanner.dart
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'test/launch_readiness/deferred_ios_simple_barcode_scanner_plugin_test.dart',
              'tool/release/defer_ios_simple_barcode_scanner.dart',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected dart fix files: {sorted(unexpected)}')
          if not changed:
              raise SystemExit('Expected interpolation fixes were not produced.')
          PY
          flutter analyze --no-pub

      - name: Commit lint-only closure and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bil_finalize_lint.yml
          git add             test/launch_readiness/deferred_ios_simple_barcode_scanner_plugin_test.dart             tool/release/defer_ios_simple_barcode_scanner.dart             .github/workflows/bil_finalize_lint.yml
          git diff --cached --check
          git config user.name 'bil-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'style: close final release lint findings'
          git push origin HEAD:fix/community-sapphire-health-3033
