name: BIL Community parts format probe

on:
  push:
    branches:
      - staging/community-final-qa-20261003

permissions:
  contents: write

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format repository parts
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/community/data/community_repository_connections_messaging_mixin.dart \
            lib/features/community/data/community_repository_discovery_mixin.dart \
            lib/features/community/data/community_repository_profile_moderation_mixin.dart \
            lib/features/community/data/community_repository_publishing_mixin.dart
          git diff -- \
            lib/features/community/data/community_repository_connections_messaging_mixin.dart \
            lib/features/community/data/community_repository_discovery_mixin.dart \
            lib/features/community/data/community_repository_profile_moderation_mixin.dart \
            lib/features/community/data/community_repository_publishing_mixin.dart
      - name: Upload formatted parts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-parts-formatted-${{ github.sha }}
          path: |
            lib/features/community/data/community_repository_connections_messaging_mixin.dart
            lib/features/community/data/community_repository_discovery_mixin.dart
            lib/features/community/data/community_repository_profile_moderation_mixin.dart
            lib/features/community/data/community_repository_publishing_mixin.dart
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact formatted parts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            lib/features/community/data/community_repository_connections_messaging_mixin.dart \
            lib/features/community/data/community_repository_discovery_mixin.dart \
            lib/features/community/data/community_repository_profile_moderation_mixin.dart \
            lib/features/community/data/community_repository_publishing_mixin.dart; then
            echo "Repository parts already match Dart 3.44.6 formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/community/data/community_repository_connections_messaging_mixin.dart \
            lib/features/community/data/community_repository_discovery_mixin.dart \
            lib/features/community/data/community_repository_profile_moderation_mixin.dart \
            lib/features/community/data/community_repository_publishing_mixin.dart
          git commit -m "style(community): format split repository parts"
          git push origin HEAD:staging/community-final-qa-20261003
