name: BIL UX format two regression tests (one-shot)
on:
  push:
    branches: [qa/bil-premium-visual-2026]
    paths:
      - .github/workflows/bil_ux_format_regression_once.yml
permissions:
  contents: write
concurrency:
  group: bil-ux-regression-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/bil-premium-visual-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scoped branch
        uses: actions/checkout@v4
        with:
          ref: qa/bil-premium-visual-2026
          persist-credentials: true
      - name: Install Dart via Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only failing two regression test sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'test/fasting_reference_introduction_contract_test.dart'
            'test/features/settings/help_center_extended_locale_test.dart'
          )
          dart format "${files[@]}"
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "style(ux): apply canonical Dart formatter to fasting and Help tests"
            git pull --rebase origin qa/bil-premium-visual-2026
            git push origin HEAD:refs/heads/qa/bil-premium-visual-2026
          fi
          echo 'Formatting complete; no releases, billing, or protected code changed.'
