name: build18-one-shot-profile-golden

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913

permissions:
  contents: write

concurrency:
  group: build18-one-shot-profile-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install release Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Reproduce only the intended profile golden delta
        continue-on-error: true
        run: >
          flutter test --no-pub
          test/epic15_store_screenshot_golden_test.dart
          --plain-name "iphone_69 Arabic RTL store screenshots"

      - name: Replace only the profile golden with generated test image
        shell: pwsh
        run: |
          $source = "test/failures/epic15_iphone_69_ar_07_profile_testImage.png"
          $target = "test/goldens/epic15_iphone_69_ar_07_profile.png"
          if (-not (Test-Path $source)) {
            throw "Expected profile golden failure image was not generated."
          }
          Copy-Item $source $target -Force
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $target) {
            Write-Host "Unexpected changed files:"
            $changed | ForEach-Object { Write-Host $_ }
            throw "Golden refresh changed more than the intended profile master."
          }

      - name: Commit exact profile golden
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/goldens/epic15_iphone_69_ar_07_profile.png
          git commit -m "test(profile): refresh DST-correct store golden"
          git push origin HEAD:codex/build18-ai-coach-no-loading-flash-20260913
