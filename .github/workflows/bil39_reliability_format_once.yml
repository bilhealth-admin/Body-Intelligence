name: BIL39 temporary reliability SDK formatter

on:
  push:
    branches:
      - bil39/reliability-20261025
    paths:
      - .github/workflows/bil39_reliability_format_once.yml

permissions:
  contents: write

concurrency:
  group: bil39-reliability-format-once
  cancel-in-progress: false

jobs:
  format-reliability:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/bil39/reliability-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Apply formatter, self-remove diagnostic and safely push
        shell: bash
        run: |
          set -euo pipefail
          readonly BRANCH="bil39/reliability-20261025"
          dart format \
            lib/features/profile/profile_summary_page.dart \
            lib/features/smart_plan/presentation/bil_smart_plan_page.dart \
            lib/features/smart_plan/presentation/bil_smart_plan_load_failure.dart \
            test/features/profile/profile_primary_loading_notice_test.dart \
            test/features/profile/profile_summary_partial_loading_contract_test.dart \
            test/features/profile/profile_summary_partial_loading_widget_test.dart \
            test/features/smart_plan/bil_smart_plan_load_failure_test.dart
          git rm -- .github/workflows/bil39_reliability_format_once.yml
          git diff --check
          git config user.name "BIL39 isolated QA formatter"
          git config user.email "bil39-qa-format@users.noreply.github.com"
          git add -- \
            lib/features/profile/profile_summary_page.dart \
            lib/features/smart_plan/presentation/bil_smart_plan_page.dart \
            lib/features/smart_plan/presentation/bil_smart_plan_load_failure.dart \
            test/features/profile/profile_primary_loading_notice_test.dart \
            test/features/profile/profile_summary_partial_loading_contract_test.dart \
            test/features/profile/profile_summary_partial_loading_widget_test.dart \
            test/features/smart_plan/bil_smart_plan_load_failure_test.dart
          git diff --cached --check
          git commit -m "style(reliability): apply exact Flutter 3.44.6 Dart formatter"
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          parent="$(git rev-parse HEAD^)"
          remote="$(git rev-parse "refs/remotes/origin/$BRANCH")"
          if [[ "$parent" != "$remote" ]]; then
            echo "::error::Branch moved; refuse to push over concurrent changes"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
