name: BIL39 signed internal TestFlight
run-name: BIL39 exact-source signed internal TestFlight; no App Store submission
on:
  push:
    branches: [bil39/internal-testflight-20261025]
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: bil39-internal-testflight
  cancel-in-progress: false
env:
  BIL_VALIDATION_MODE: all_exact_source_ci
  BIL_TESTED_SOURCE_SHA: ${{ github.sha }}
  BIL_TESTED_SOURCE: ${{ github.sha }}
  BIL_RELEASE_MANIFEST_PATH: docs/release/BIL_IOS39_INTERNAL_CONFIGURATION_20261025.md
  BIL_ORIGINAL_SHA: 155b079696430919f8272df934371f033fb11be2
jobs:
  signed-ios-release:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout the immutable candidate accepted by final CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require all final exact-source CI and verified cloud before credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BIL39_VERIFIED_CLOUD_SOURCE_SHA: ${{ vars.BIL39_VERIFIED_CLOUD_SOURCE_SHA }}
        run: |
          set -euo pipefail
          python3 tools/qa/bil39_internal_build_ci.py --sha "$GITHUB_SHA" --output BIL39-pre-signing-ci.json
          echo "BIL_AUDITED_FREEZE_MANIFEST_SHA256=$(python3 -c 'import hashlib,pathlib,os;print(hashlib.sha256(pathlib.Path(os.environ["BIL_RELEASE_MANIFEST_PATH"]).read_bytes()).hexdigest())')" >> "$GITHUB_ENV"
      - name: Verify selected Xcode 26+ and iOS SDK 26+
        id: apple_toolchain_gate
        shell: bash
        run: |
          set -euo pipefail
          # Do not guess or switch Xcode installations. The runner-selected
          # toolchain itself must satisfy the store gate.
          python3 tool/release/verify_apple_release_toolchain.py \
            --text-evidence BIL-apple-release-toolchain.txt \
            --json-evidence BIL-apple-release-toolchain.json

      - name: Upload Apple toolchain version evidence
        if: ${{ always() && steps.apple_toolchain_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios39-preview-toolchain-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BIL-apple-release-toolchain.txt
            BIL-apple-release-toolchain.json

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Validate release build number and Apple team
        shell: bash
        env:
          BUILD_NUMBER: '39'
          UPLOAD_TO_TESTFLIGHT: 'false'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo 'build_number must be a positive integer.' >&2
            exit 1
          }
          (( BUILD_NUMBER == 39 )) || {
            echo 'build_number must be exactly 39 for the iOS release candidate; build 36 and earlier must never be selected.' >&2
            exit 1
          }
          [[ "$UPLOAD_TO_TESTFLIGHT" == 'true' || "$UPLOAD_TO_TESTFLIGHT" == 'false' ]] || {
            echo 'upload_to_testflight must be a boolean.' >&2
            exit 1
          }
          test -n "${APPLE_TEAM_ID:-}" || {
            echo 'OWNER_INPUT_REQUIRED: APPLE_TEAM_ID' >&2
            exit 1
          }
          grep -Eq "DEVELOPMENT_TEAM = \"?${APPLE_TEAM_ID}\"?;" \
            ios/Runner.xcodeproj/project.pbxproj || {
              echo 'Xcode DEVELOPMENT_TEAM does not match APPLE_TEAM_ID.' >&2
              exit 1
            }

      - name: Require Apple signing inputs
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
        run: |
          set -euo pipefail
          test -n "${CERTIFICATE_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_DISTRIBUTION_CERTIFICATE_BASE64'; exit 1; }
          test -n "${CERTIFICATE_PASSWORD:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD'; exit 1; }
          test -n "${PROVISIONING_PROFILE_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_PROVISIONING_PROFILE_BASE64'; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APPLE_TEAM_ID'; exit 1; }
          [[ "${MOBILE_INTEGRITY_BACKEND_RELEASE_ID:-}" =~ [^[:space:]] ]] || { echo 'OWNER_INPUT_REQUIRED: BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID (set only after the migration, app-attest/play-integrity functions, guarded functions, and production server configuration are verified)'; exit 1; }

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/BIL.mobileprovision"
          python3 - "$PROFILE" <<'PY'
          import base64
          import binascii
          import os
          import pathlib
          import sys

          try:
              decoded = base64.b64decode(os.environ['PROFILE_BASE64'], validate=True)
          except (KeyError, ValueError, binascii.Error) as error:
              raise SystemExit(f'Invalid provisioning-profile Base64: {error}')
          pathlib.Path(sys.argv[1]).write_bytes(decoded)
          PY
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/BIL-profile.plist"
          python3 - "$RUNNER_TEMP/BIL-profile.plist" "$APPLE_TEAM_ID" <<'PY'
          import datetime as dt
          import plistlib
          import sys

          profile_path, team_id = sys.argv[1:]
          with open(profile_path, 'rb') as handle:
              profile = plistlib.load(handle)
          entitlements = profile.get('Entitlements', {})
          expected_app_id = f'{team_id}.com.bilhealth.bodyintelligencelog'
          if entitlements.get('application-identifier') != expected_app_id:
              raise SystemExit('Provisioning profile has the wrong application identifier.')
          if entitlements.get('com.apple.developer.healthkit') is not True:
              raise SystemExit('Provisioning profile does not authorize HealthKit.')
          if 'Default' not in entitlements.get('com.apple.developer.applesignin', []):
              raise SystemExit('Provisioning profile does not authorize Sign in with Apple.')
          associated_domains = entitlements.get(
              'com.apple.developer.associated-domains',
              [],
          )
          if isinstance(associated_domains, str):
              associated_domain_values = {associated_domains}
          elif isinstance(associated_domains, list):
              associated_domain_values = {
                  value for value in associated_domains if isinstance(value, str)
              }
          else:
              associated_domain_values = set()
          if not (
              '*' in associated_domain_values
              or 'applinks:www.bilhealth.com' in associated_domain_values
          ):
              raise SystemExit(
                  'Provisioning profile does not authorize '
                  'applinks:www.bilhealth.com.'
              )
          if entitlements.get('aps-environment') != 'production':
              raise SystemExit('Provisioning profile does not authorize production push.')
          app_attest = entitlements.get(
              'com.apple.developer.devicecheck.appattest-environment'
          )
          if isinstance(app_attest, str):
              app_attest_environments = {app_attest}
          elif isinstance(app_attest, list):
              app_attest_environments = {
                  value for value in app_attest if isinstance(value, str)
              }
          else:
              app_attest_environments = set()
          if 'production' not in app_attest_environments:
              raise SystemExit(
                  'Provisioning profile does not authorize production App Attest.'
              )
          if entitlements.get('get-task-allow', False) is not False:
              raise SystemExit('Provisioning profile unexpectedly enables get-task-allow.')
          expiry = profile.get('ExpirationDate')
          now = dt.datetime.now(dt.timezone.utc)
          if expiry is None or expiry.replace(tzinfo=dt.timezone.utc) <= now:
              raise SystemExit('Provisioning profile is expired.')
          print('APPLE_PROVISIONING_PROFILE_GATE=PASS')
          PY

      - name: Resolve and validate source
        env:
          BIL_RELEASE_PRODUCTION: true
          BIL_RELEASE_PLATFORM: ios
          BIL_RELEASE_APPLICATION_ID: com.bilhealth.bodyintelligencelog
          BIL_USE_SUPABASE: true
          SUPABASE_URL: https://tgmanzhqulksykhslrzb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_eMoUVfgwfU0RpQOwPJr-yw_ZgtStgld
          BIL_RECEIPT_SERVER_URL: https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/verify-store-purchase
          BIL_PAYMENTS_ENABLED: true
          BIL_STORE_CONFIGURED: true
          BIL_FACEBOOK_REQUIRED: true
          BIL_FACEBOOK_LOGIN_ENABLED: true
          BIL_FACEBOOK_LOGIN_READY: true
          BIL_ADS_ENABLED: true
          BIL_AD_PROVIDER_READY: true
          BIL_ADMOB_PRODUCTION_READY: true
          BIL_ADMOB_PUBLISHER_ID: pub-9688223318643509
          BIL_ADMOB_ANDROID_APP_ID: ca-app-pub-9688223318643509~2357875410
          BIL_ADMOB_ANDROID_BANNER_ID: ca-app-pub-9688223318643509/9430375211
          BIL_ADMOB_IOS_APP_ID: ca-app-pub-9688223318643509~4090504347
          BIL_ADMOB_IOS_BANNER_ID: ca-app-pub-9688223318643509/6445204944
          BIL_PUSH_ENABLED: true
          BIL_PUSH_PROVIDER_READY: true
          BIL_MOBILE_INTEGRITY_REQUIRED: true
          BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
          BIL_SOURCE_COMMIT: ${{ github.sha }}
          BIL_AUDITED_SOURCE_COMMIT: ${{ github.sha }}
          BIL_COUNTERPART_AUDITED_SOURCE_COMMIT: ${{ github.sha }}
          BIL_RELEASE_EXPECTED_BUILD_NUMBER: '39'
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/release/validate_release_configuration.dart

          flutter test --no-pub \
            test/launch_readiness/system_crypto_export_compliance_contract_test.dart \
            --timeout 2m
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerDebug.entitlements

      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output BIL-ios-cocoapods-installation.json

      - name: Upload isolated CocoaPods installation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios39-preview-pods-${{ github.run_id }}
          path: BIL-ios-cocoapods-installation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record native cryptography already verified on this exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test -s BIL39-pre-signing-ci.json
          printf '%s\n' 'NATIVE_CRYPTO_RUNTIME_GATE=PASS' \
            'NATIVE_CRYPTO_RUNTIME_SCOPE=EXACT_SHA_FINAL_CI_IPHONE_IPAD_ANDROID' \
            > BIL-ios-native-crypto-gate.txt

      - name: Preserve production AdMob plugin and validate configuration
        shell: bash
        env:
          BIL_ADMOB_PRODUCTION_READY: true
          BIL_ADMOB_PUBLISHER_ID: pub-9688223318643509
          BIL_ADMOB_ANDROID_APP_ID: ca-app-pub-9688223318643509~2357875410
          BIL_ADMOB_ANDROID_BANNER_ID: ca-app-pub-9688223318643509/9430375211
          BIL_ADMOB_IOS_APP_ID: ca-app-pub-9688223318643509~4090504347
          BIL_ADMOB_IOS_BANNER_ID: ca-app-pub-9688223318643509/6445204944
        run: |
          set -euo pipefail
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios
          python3 tool/release/test_validate_admob_production_configuration.py
          python3 tool/release/validate_admob_production_configuration.py \
            | tee BIL-ios-production-admob-source.txt
          printf '%s\n' \
            'BIL_ADMOB_IOS_APP_ID=ca-app-pub-9688223318643509~4090504347' \
            > ios/Flutter/ReleaseAdMob.xcconfig
          grep -Fqx $'\t<key>GADApplicationIdentifier</key>' ios/Runner/Info.plist
          grep -Fqx $'\t<string>$(BIL_ADMOB_IOS_APP_ID)</string>' ios/Runner/Info.plist
          grep -Fq 'google_mobile_ads' .flutter-plugins-dependencies
          # GeneratedPluginRegistrant.m is checked after flutter build ipa,
          # where Flutter/Xcode must actually regenerate it.

      - name: Configure manual App Store distribution signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_PLIST="$RUNNER_TEMP/BIL-profile.plist"
          EXPORT_OPTIONS="$RUNNER_TEMP/BIL-export-options.plist"
          test -s "$PROFILE_PLIST" || {
            echo 'Decoded provisioning-profile metadata is missing.' >&2
            exit 1
          }
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          test -n "$PROFILE_NAME" || {
            echo 'Provisioning profile name is missing.' >&2
            exit 1
          }
          test -n "$PROFILE_UUID" || {
            echo 'Provisioning profile UUID is missing.' >&2
            exit 1
          }

          {
            printf '\n// CI App Store distribution signing\n'
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution\n'
            printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID"
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$PROFILE_NAME"
            printf 'PROVISIONING_PROFILE = %s\n' "$PROFILE_UUID"
          } >> ios/Flutter/Release.xcconfig

          python3 - "$EXPORT_OPTIONS" "$APPLE_TEAM_ID" "$PROFILE_UUID" <<'PY'
          import pathlib
          import plistlib
          import sys

          output_path, team_id, profile_uuid = sys.argv[1:]
          options = {
              'method': 'app-store-connect',
              'signingStyle': 'manual',
              'teamID': team_id,
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  'com.bilhealth.bodyintelligencelog': profile_uuid,
              },
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
              'stripSwiftSymbols': True,
          }
          with pathlib.Path(output_path).open('wb') as handle:
              plistlib.dump(options, handle, sort_keys=True)
          PY
          plutil -lint "$EXPORT_OPTIONS"

          # Do not invoke `xcodebuild -showBuildSettings` here. Immediately
          # before this step the deferred-plugin graph is intentionally
          # sanitized; Xcode 26 aborts while resolving that transient graph.
          # `flutter build ipa` regenerates the graph in the next step and is
          # the authoritative resolved-settings and signing gate.
          grep -Fqx 'CODE_SIGN_STYLE = Manual' ios/Flutter/Release.xcconfig
          grep -Fqx 'CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution' ios/Flutter/Release.xcconfig
          grep -Fqx "DEVELOPMENT_TEAM = $APPLE_TEAM_ID" ios/Flutter/Release.xcconfig
          grep -Fqx "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" ios/Flutter/Release.xcconfig
          grep -Fqx "PROVISIONING_PROFILE = $PROFILE_UUID" ios/Flutter/Release.xcconfig
          test "$(/usr/libexec/PlistBuddy -c 'Print :signingStyle' "$EXPORT_OPTIONS")" = 'manual'
          test "$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$EXPORT_OPTIONS")" = "$APPLE_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:com.bilhealth.bodyintelligencelog' "$EXPORT_OPTIONS")" = "$PROFILE_UUID"
          printf '%s\n' 'IOS_MANUAL_DISTRIBUTION_SIGNING_GATE=PASS'

      - name: Build signed archive
        env:
          BUILD_NUMBER: '39'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BIL_ADMOB_IOS_APP_ID: ca-app-pub-9688223318643509~4090504347
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --target lib/main.dart \
            --export-options-plist "$RUNNER_TEMP/BIL-export-options.plist" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=BIL_ENVIRONMENT=production \
            --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=true \
            --dart-define=BIL_SMART_PLAN_CLOUD_ENABLED=true --dart-define=BIL_PAYMENTS_ENABLED=true \
            --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms \
            --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy \
            --dart-define=BIL_MEAL_VISION_ENDPOINT=https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/analyze-meal \
            --dart-define=BIL_WELLNESS_MANIFEST_URL=https://workouts.bilhealth.com/v2/manifest/wellness-workouts-v2-af6082ff28856f9154216067f16fe6a7147548c9a29f8e205b43bb81bc34efe8.json \
            --dart-define=BIL_RECIPE_IMAGE_DELIVERY_ENABLED=true \
            --dart-define=BIL_FACEBOOK_LOGIN_ENABLED=true \
            --dart-define=BIL_FACEBOOK_LOGIN_READY=true \
            --dart-define=BIL_PUSH_ENABLED=true \
            --dart-define=BIL_PUSH_PROVIDER_READY=true \
            --dart-define=BIL_ADS_ENABLED=true \
            --dart-define=BIL_AD_PROVIDER_READY=true \
            --dart-define=BIL_ADMOB_PUBLISHER_ID=pub-9688223318643509 \
            --dart-define=BIL_ADMOB_ANDROID_APP_ID=ca-app-pub-9688223318643509~2357875410 \
            --dart-define=BIL_ADMOB_ANDROID_BANNER_ID=ca-app-pub-9688223318643509/9430375211 \
            --dart-define=BIL_ADMOB_IOS_APP_ID=ca-app-pub-9688223318643509~4090504347 \
            --dart-define=BIL_ADMOB_IOS_BANNER_ID=ca-app-pub-9688223318643509/6445204944 \
            --dart-define=BIL_ENABLE_CATALOG_TEST_ACCESS=false

      - name: Verify regenerated iOS production AdMob plugin graph
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'google_mobile_ads' .flutter-plugins-dependencies
          grep -Fq 'FLTGoogleMobileAdsPlugin' ios/Runner/GeneratedPluginRegistrant.m
          printf '%s\n' 'ADMOB_IOS_NATIVE_SDK_GRAPH_GATE=PASS' \
            | tee BIL-ios-production-admob-plugin-graph.txt

      - name: Capture signed IPA evidence
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: '39'
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -s "$IPA"

          SIGNED_IPA_DIR="$(mktemp -d "$RUNNER_TEMP/bil-final-signed-ipa.XXXXXX")"
          unzip -qq "$IPA" -d "$SIGNED_IPA_DIR"
          SIGNED_APP_COUNT="$(find "$SIGNED_IPA_DIR/Payload" \
            -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d '[:space:]')"
          test "$SIGNED_APP_COUNT" = 1 || {
            echo "Expected exactly one application in final IPA Payload; found $SIGNED_APP_COUNT." >&2
            exit 1
          }
          SIGNED_APP="$(find "$SIGNED_IPA_DIR/Payload" \
            -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$SIGNED_APP"

          BIL_ADMOB_PRODUCTION_READY=true \
          BIL_ADMOB_PUBLISHER_ID=pub-9688223318643509 \
          BIL_ADMOB_ANDROID_APP_ID=ca-app-pub-9688223318643509~2357875410 \
          BIL_ADMOB_ANDROID_BANNER_ID=ca-app-pub-9688223318643509/9430375211 \
          BIL_ADMOB_IOS_APP_ID=ca-app-pub-9688223318643509~4090504347 \
          BIL_ADMOB_IOS_BANNER_ID=ca-app-pub-9688223318643509/6445204944 \
          python3 tool/release/validate_admob_production_configuration.py \
            --ios-info-plist "$SIGNED_APP/Info.plist" \
            | tee BIL-ios-production-admob.txt

          codesign --verify --deep --strict --verbose=4 "$SIGNED_APP" \
            2>&1 | tee BIL-ios-codesign-verify.txt
          printf '%s\n' 'SIGNED_IPA_CODESIGN_GATE=PASS' \
            | tee -a BIL-ios-codesign-verify.txt
          codesign -dv --verbose=4 "$SIGNED_APP" 2> BIL-ios-codesign.txt
          codesign --display --entitlements - --xml \
            "$SIGNED_APP" \
            | plutil -convert xml1 -o BIL-ios-entitlements.plist -
          test -s BIL-ios-entitlements.plist

          EMBEDDED_PROFILE="$SIGNED_APP/embedded.mobileprovision"
          test -s "$EMBEDDED_PROFILE" || {
            echo 'Final IPA app has no embedded provisioning profile.' >&2
            exit 1
          }
          security cms -D -i "$EMBEDDED_PROFILE" \
            > BIL-ios-embedded-profile.plist
          plutil -lint BIL-ios-embedded-profile.plist
          python3 tool/release/verify_signed_ios_entitlements.py \
            --entitlements BIL-ios-entitlements.plist \
            --embedded-profile BIL-ios-embedded-profile.plist \
            --team-id "$APPLE_TEAM_ID" \
            --bundle-id com.bilhealth.bodyintelligencelog
          python3 -m unittest discover -s tool/release \
            -p test_verify_final_artifact_identity.py -v
          python3 tool/release/verify_final_artifact_identity.py \
            --ipa "$IPA" \
            --package com.bilhealth.bodyintelligencelog \
            --version 1.0.0 --build "$BUILD_NUMBER" \
            --output BIL-ios-final-artifact-inventory.json
          python3 tool/release/verify_ios_app_icon.py --ipa "$IPA" --output BIL-ios-final-icon-inventory.json
          shasum -a 256 "$IPA" | tee BIL-ios-ipa.sha256
          stat -f '%z' "$IPA" | tee BIL-ios-ipa.size
          git rev-parse HEAD | tee BIL-source-head.txt
          printf '%s\n' "BUILD_NUMBER=$BUILD_NUMBER" > BIL-build-number.txt

      - name: Reject forbidden bundled crypto implementations in signed IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          SCAN_DIR="$RUNNER_TEMP/bil-ios-crypto-scan"
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          unzip -qq "$IPA" -d "$SCAN_DIR"
          if find "$SCAN_DIR/Payload" -type f -perm -0111 \
            -exec strings {} + 2>/dev/null \
            | grep -Eiq 'pointycastle|PcAESEngine|PcPBKDF2KeyDerivator|PcHMac|GCMBlockCipher|ZipCrypto'; then
            echo 'Forbidden non-OS crypto implementation marker found in signed IPA.' >&2
            exit 1
          fi
          printf '%s\n' 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' \
            | tee BIL-ios-crypto-scan.txt

      - name: Record code and physical-device gate boundary
        shell: bash
        run: |
          printf '%s\n' \
            'CODE_GATE=SIGNED_IPA_ARTIFACT_ONLY' \
            'FACEBOOK_LOGIN_COMPILED_GATE=SUPABASE_BROWSER_OAUTH_SOURCE_PRESENT' \
            'FACEBOOK_LOGIN_SIGNED_DEVICE_GATE=REQUIRED' \
            'ADS_COMPILED_GATE=ENABLED_PRODUCTION' \
            'ADMOB_IOS_PRODUCTION_CONFIGURATION_GATE=PASS' \
            'ADMOB_IOS_UMP_CONFIGURATION_GATE=SOURCE_CONFIG_VALIDATED' \
            'ADMOB_IOS_NATIVE_SDK_ARTIFACT_GATE=NOT_VERIFIED_IN_IPA_BY_THIS_JOB' \
            'IOS_STARTUP_DEVICE_GATE=REQUIRED_AFTER_OWNER_INSTALL_OR_UPLOAD' \
            'MOBILE_INTEGRITY_CLIENT_GATE=ENABLED' \
            'MOBILE_INTEGRITY_BACKEND_GATE=OWNER_EVIDENCE_PRESENT_NOT_LIVE_VERIFIED' \
            'PHYSICAL_DEVICE_GATE=REQUIRED' \
            'PHYSICAL_DEVICE_SCOPE=Facebook OAuth browser flow and Supabase token exchange,App Attest JIT registration/assertion/replay denial,HealthKit,Apple Watch via HealthKit,fitness BLE,StoreKit sandbox,AdMob consent and served ad review' \
            'TESTFLIGHT=NOT_RUN' \
            > BIL-ios-gate-status.txt

      - name: Generate signed IPA-only receipt after codesign and entitlements PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIL_TESTED_SOURCE_SHA"
          grep -Fq 'SIGNED_IPA_CODESIGN_GATE=PASS' BIL-ios-codesign-verify.txt
          grep -Fq 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' BIL-ios-crypto-scan.txt
          test -s BIL-ios-final-artifact-inventory.json
          test -s BIL-ios-entitlements.plist
          test -s BIL-ios-embedded-profile.plist
          test -s BIL-ios-ipa.sha256
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          files=list(pathlib.Path('build/ios/ipa').glob('*.ipa'))
          if len(files)!=1 or not files[0].is_file() or files[0].stat().st_size<=0:
              raise SystemExit('Exactly one signed IPA required')
          digest=hashlib.sha256(files[0].read_bytes()).hexdigest()
          if pathlib.Path('BIL-ios-ipa.sha256').read_text().split()[0]!=digest:
              raise SystemExit('IPA hash readback mismatch')
          githead=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if githead!=os.environ['BIL_TESTED_SOURCE_SHA']:
              raise SystemExit('Built source differs from audited candidate')
          native_status='PASS'
          if ('NATIVE_CRYPTO_RUNTIME_GATE='+native_status) not in pathlib.Path('BIL-ios-native-crypto-gate.txt').read_text():
              raise SystemExit('Native runtime evidence scope mismatch')
          pathlib.Path('BIL-ios-build-only-receipt.json').write_text(json.dumps({
              'status':'SIGNED_IPA_BUILT_AND_LOCALLY_VERIFIED','source_sha':githead,
              'workflow_sha':os.environ['GITHUB_SHA'],'build':39,
              'validation_mode':os.environ['BIL_VALIDATION_MODE'],'public_release_approved':False,
              'native_crypto_runtime_status':native_status,
              'ipa_sha256':digest,'ipa_bytes':files[0].stat().st_size,
              'testflight_upload':'NOT_RUN','app_store_connect':'NOT_RUN',
              'production_deploy':'NOT_RUN','physical_device':'NOT_RUN',
              'release_certification':'NOT_CLAIMED'
          },indent=2)+'\n')
          print('SIGNED_IPA_BUILD_ONLY_PASS; NO_TESTFLIGHT_UPLOAD')
          PY

      - name: Upload signed IPA and validation evidence
        id: signed_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios39-signed-only-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/ipa/*.ipa
            BIL-ios-codesign.txt
            BIL-ios-codesign-verify.txt
            BIL-ios-entitlements.plist
            BIL-ios-final-artifact-inventory.json
            BIL-ios-final-icon-inventory.json
            BIL-ios-embedded-profile.plist
            BIL-ios-ipa.sha256
            BIL-ios-ipa.size
            BIL-ios-crypto-scan.txt
            BIL-ios-native-crypto-gate.txt
            BIL-ios-production-admob-source.txt
            BIL-ios-production-admob.txt
            BIL-ios-production-admob-plugin-graph.txt
            BIL-ios-gate-status.txt
            BIL-build-number.txt
            BIL-source-head.txt
            BIL-ios-build-only-receipt.json
            BIL39-pre-signing-ci.json
            BIL-apple-release-toolchain.txt
            BIL-apple-release-toolchain.json

      - name: Remove temporary Apple distribution profile and export options
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/BIL.mobileprovision"
          rm -f "$RUNNER_TEMP/BIL-profile.plist" "$RUNNER_TEMP/BIL-export-options.plist"

      - name: Bind promotion to this exact signed IPA
        shell: bash
        env:
          BIL_SIGNED_RUN: ${{ github.run_id }}
          BIL_SIGNED_ARTIFACT: ${{ steps.signed_artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('BIL-ios-build-only-receipt.json').read_text())
          assert r['build']==39 and r['source_sha']==os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('BIL_IPA_SHA256='+r['ipa_sha256']+'\n')
              stream.write('BIL_SIGNED_RUN='+os.environ['BIL_SIGNED_RUN']+'\n')
              stream.write('BIL_SIGNED_ARTIFACT='+os.environ['BIL_SIGNED_ARTIFACT']+'\n')
          PY
      - name: Verify exact bytes, IPA identity and original signing receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, zipfile
          root=pathlib.Path('.')
          def unique(name):
              matches=list(root.rglob(name))
              assert len(matches)==1, 'Missing or ambiguous evidence: '+name
              return matches[0]
          ipa=unique('*.ipa')
          digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest==os.environ['BIL_IPA_SHA256'], 'IPA bytes differ from signed run'
          receipt=json.loads(unique('BIL-ios-build-only-receipt.json').read_text())
          assert receipt['status']=='SIGNED_IPA_BUILT_AND_LOCALLY_VERIFIED'
          assert receipt['source_sha']==os.environ['BIL_TESTED_SOURCE'] and receipt['build']==39
          assert receipt.get('validation_mode','all_exact_source_ci')==os.environ['BIL_VALIDATION_MODE']
          native_status='PASS'
          assert receipt['native_crypto_runtime_status']==native_status
          assert ('NATIVE_CRYPTO_RUNTIME_GATE='+native_status) in unique('BIL-ios-native-crypto-gate.txt').read_text()
          assert receipt['ipa_sha256']==digest and receipt['ipa_bytes']==ipa.stat().st_size
          assert unique('BIL-source-head.txt').read_text().strip()==os.environ['BIL_TESTED_SOURCE']
          assert 'SIGNED_IPA_CODESIGN_GATE=PASS' in unique('BIL-ios-codesign-verify.txt').read_text()
          assert 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' in unique('BIL-ios-crypto-scan.txt').read_text()
          inventory=json.loads(unique('BIL-ios-final-artifact-inventory.json').read_text())
          assert inventory['status']=='FINAL_ARTIFACT_IDENTITY_PASS' and inventory['build']=='39'
          assert inventory['package']=='com.bilhealth.bodyintelligencelog' and inventory['version']=='1.0.0'
          with zipfile.ZipFile(ipa) as archive:
              infos=[n for n in archive.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and len(n.split('/'))==3]
              assert len(infos)==1
              info=plistlib.loads(archive.read(infos[0]))
          assert info['CFBundleIdentifier']=='com.bilhealth.bodyintelligencelog'
          assert info['CFBundleVersion']=='39' and info['CFBundleShortVersionString']=='1.0.0'
          identity={'source_sha':os.environ['BIL_TESTED_SOURCE'],'build':39,'ipa_sha256':digest,
                    'uses_non_exempt_encryption':info.get('ITSAppUsesNonExemptEncryption'),
                    'physical_device_verified':False,'release_approved':False}
          pathlib.Path('evidence/identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('BIL_IPA_PATH='+str(ipa.resolve())+'\n')
          print('EXACT_SIGNED_IPA_39_BYTES_AND_SOURCE=PASS')
          PY
          BIL_IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          python3 tool/release/verify_final_artifact_identity.py \
            --ipa "$BIL_IPA_PATH" --package com.bilhealth.bodyintelligencelog \
            --version 1.0.0 --build 39 --output evidence/final-artifact-inventory.json
          python3 tool/release/verify_ios_app_icon.py --ipa "$BIL_IPA_PATH" --output evidence/final-icon-inventory.json
      - name: Prepare ephemeral Apple API key and processing verifier
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          assert all(os.environ.get(k) for k in ('ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY_BASE64'))
          folder=pathlib.Path.home()/'.appstoreconnect/private_keys'
          folder.mkdir(parents=True,exist_ok=True)
          key=folder/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          raw=base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'],validate=True)
          assert b'-----BEGIN PRIVATE KEY-----' in raw
          key.write_bytes(raw); key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('ASC_PRIVATE_KEY_PATH='+str(key)+'\n')
          PY
          cat > evidence/asc-processing.mjs <<'JS'
          import fs from 'node:fs';
          import { clientFromEnvironment } from '../tool/apple_store_connect/asc_catalog_sync.mjs';
          const client=clientFromEnvironment();
          const APP='6805349703';
          const mode=process.argv[2];
          const write=(name,data)=>fs.writeFileSync(`evidence/${name}.json`,JSON.stringify(data,null,2)+'\n');
          const matching=async version=>{
            const response=await client.request('GET',`/v1/builds?filter[app]=${APP}&filter[version]=${version}&include=preReleaseVersion&limit=100`);
            return response.data.filter(b=>response.included?.some(v=>v.id===b.relationships.preReleaseVersion.data?.id&&v.attributes.version==='1.0.0'&&v.attributes.platform==='IOS'));
          };
          const internalGroupsForBuild=async buildId=>{
            const result=[];
            for(const group of await client.all(`/v1/apps/${APP}/betaGroups?limit=200`)){
              if(group.attributes.isInternalGroup!==true) continue;
              const builds=await client.all(`/v1/betaGroups/${group.id}/builds?limit=200`);
              if(builds.some(b=>b.id===buildId)) result.push(group);
            }
            return result;
          };
          if(mode==='preflight'){
            const app=await client.request('GET',`/v1/apps/${APP}`);
            if(app.data.attributes.bundleId!=='com.bilhealth.bodyintelligencelog') throw Error('ASC app identity mismatch');
            if((await matching('39')).length) throw Error('Build 39 already exists: upload is blocked to prevent duplication; inspect its identity before proceeding');
            const previous=await matching('38');
            const internal=new Map();
            for(const build of previous){
              for(const group of await internalGroupsForBuild(build.id)){
                if(group.attributes.isInternalGroup===true) internal.set(group.id,{id:group.id,name:group.attributes.name});
              }
            }
            write('asc-preflight',{app_id:APP,build39_absent:true,previous_internal_groups:[...internal.values()]});
            console.log(`ASC_PREFLIGHT=PASS; BUILD39_ABSENT; EXISTING_INTERNAL_GROUPS=${internal.size}`);
          }else if(mode==='processing'){
            const identity=JSON.parse(fs.readFileSync('evidence/identity.json'));
            let build;
            for(let attempt=0;attempt<31;attempt++){
              const matches=await matching('39');
              if(matches.length>1) throw Error('Ambiguous build 39 records');
              build=matches[0];
              const state=build?.attributes.processingState??'NOT_VISIBLE_YET';
              write('apple-processing',{build_id:build?.id??null,processing_state:state,attempt,source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256});
              console.log(`APPLE_PROCESSING=${state}; CHECK=${attempt+1}`);
              if(['FAILED','INVALID'].includes(state)) throw Error('Apple rejected binary processing; preserve upload receipt and do not re-upload');
              if(state==='VALID') break;
              if(attempt<30) await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(build?.attributes.processingState!=='VALID'){
              console.log('TESTFLIGHT_UPLOAD_ACCEPTED; APPLE_PROCESSING_PENDING; DO_NOT_REUPLOAD');
              process.exit(0);
            }
            if(build.attributes.usesNonExemptEncryption==null&&identity.uses_non_exempt_encryption===false){
              await client.request('PATCH',`/v1/builds/${build.id}`,{data:{type:'builds',id:build.id,attributes:{usesNonExemptEncryption:false}}});
            }
            const preflight=JSON.parse(fs.readFileSync('evidence/asc-preflight.json'));
            const current=await internalGroupsForBuild(build.id);
            const known=new Set(current.map(g=>g.id));
            for(const group of preflight.previous_internal_groups){
              if(!known.has(group.id)) await client.request('POST',`/v1/betaGroups/${group.id}/relationships/builds`,{data:[{type:'builds',id:build.id}]});
            }
            const groups=await internalGroupsForBuild(build.id);
            const detail=await client.request('GET',`/v1/builds/${build.id}/buildBetaDetail`);
            const internal=groups.filter(g=>g.attributes.isInternalGroup===true);
            write('testflight-ready',{build_id:build.id,version:'1.0.0',build:39,processing_state:'VALID',
              internal_build_state:detail.data?.attributes.internalBuildState,internal_groups:internal.map(g=>({id:g.id,name:g.attributes.name})),
              source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256,physical_device_verified:false,release_approved:false});
            console.log(`TESTFLIGHT_BUILD39_PROCESSING=VALID; INTERNAL_STATE=${detail.data?.attributes.internalBuildState}; INTERNAL_GROUPS=${internal.length}; DEVICE_ACCEPTANCE=PENDING`);
          }else throw Error('Unknown ASC operation');
          JS
          node --check evidence/asc-processing.mjs
      - name: Verify Apple access and prevent an accidental duplicate upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs preflight
      - name: Validate this exact IPA with Apple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-validation.log
      - name: Upload the original signed IPA to TestFlight once
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          xcrun altool --upload-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-upload.log
          python3 - <<'PY'
          import datetime,json,pathlib,os
          identity=json.loads(pathlib.Path('evidence/identity.json').read_text())
          identity.update(status='UPLOAD_ACCEPTED',processing_verified=False,
                          uploaded_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),signed_run=int(os.environ['BIL_SIGNED_RUN']),signed_artifact=int(os.environ['BIL_SIGNED_ARTIFACT']))
          pathlib.Path('evidence/upload-receipt.json').write_text(json.dumps(identity,indent=2)+'\n')
          print('EXACT_ORIGINAL_IPA39_UPLOAD=ACCEPTED')
          PY
      - name: Verify Apple processing and reuse existing internal testing groups
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs processing
      - name: Preserve upload, processing and artifact identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios39-testflight-promotion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 21
      - name: Remove ephemeral Apple private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_PRIVATE_KEY_PATH:-}" && "$ASC_PRIVATE_KEY_PATH" == "$HOME/.appstoreconnect/private_keys/"* ]]; then
            rm -f "$ASC_PRIVATE_KEY_PATH"
          fi
