name: BIL targeted visual golden refresh
# Refresh trigger: current complete-image UI references after scroll-test cleanup.

on:
  push:
    branches: [fix/community-sapphire-health-3033]
    paths:
      - .github/workflows/bil_targeted_golden_refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact committed bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Refresh only approved visual references
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          flutter test --no-pub --update-goldens test/features/onboarding/onboarding_visual_golden_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          flutter test --no-pub --update-goldens test/premium_dashboard_benchmark_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          flutter test --no-pub --update-goldens test/visual_closure/actual_data_pages_golden_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          flutter test --no-pub --update-goldens test/epic15_store_screenshot_golden_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject any non-reference mutation
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $bad = @()
          foreach ($path in $changed) {
            $allowed =
              $path.StartsWith('test/features/onboarding/goldens/onboarding_2026/') -or
              $path.StartsWith('test/goldens/premium_dashboard_') -or
              $path.StartsWith('test/visual_closure/goldens/visual_closure_dashboard_') -or
              ($path.StartsWith('test/goldens/epic15_') -and
                ($path.EndsWith('_00_onboarding.png') -or
                 $path.EndsWith('_01_dashboard.png')))
            if (-not $allowed) { $bad += $path }
          }
          if ($bad.Count -gt 0) {
            Write-Host 'Unexpected golden refresh mutations:'
            $bad | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host 'TARGETED_GOLDEN_SCOPE=PASS'

      - name: Commit refreshed references
        shell: pwsh
        run: |
          git config user.name 'BIL visual reference maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/features/onboarding/goldens/onboarding_2026
          git add test/goldens/premium_dashboard_*.png
          git add test/visual_closure/goldens/visual_closure_dashboard_*.png
          git add test/goldens/epic15_*_00_onboarding.png
          git add test/goldens/epic15_*_01_dashboard.png
          if (git diff --cached --quiet) {
            Write-Host 'No golden changes required.'
            exit 0
          }
          git commit -m 'test(visual): refresh approved current UI references'
          git fetch origin fix/community-sapphire-health-3033
          git rebase origin/fix/community-sapphire-health-3033
          git push origin HEAD:fix/community-sapphire-health-3033
