name: BIL bounded offline host tooling
on:
  push:
    branches: [qa/coach-community-next-20261005]
    paths: [.github/workflows/bil_extract_bounded_host_tooling.yml]
permissions:
  contents: read
  actions: read
jobs:
  extract:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/coach-community-next-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reuse pinned tooling with strictly bounded optional assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,urllib.request,urllib.parse,zipfile
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  new=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if new and urllib.parse.urlparse(newurl).hostname!=urllib.parse.urlparse(req.full_url).hostname: new.remove_header('Authorization')
                  return new
          opener=urllib.request.build_opener(SafeRedirect())
          root=pathlib.Path('/tmp/bil-bounded');root.mkdir()
          api='https://api.github.com/repos/bilhealth-admin/Body-Intelligence/actions/artifacts/11385694788'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with opener.open(urllib.request.Request(api,headers=headers)) as res: meta=json.load(res)
          if meta['workflow_run']['head_sha']!='330df98baf34b74943de0025af0144355544e3a3': raise RuntimeError('Wrong artifact')
          with opener.open(urllib.request.Request(api+'/zip',headers=headers)) as res,open('/tmp/input.zip','wb') as dst: shutil.copyfileobj(res,dst,1024*1024)
          with open('/tmp/input.zip','rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          if digest!='1cdaa5049705e2fea9882de87b4af931020c38450c1fc9828251a548ae977d6a': raise RuntimeError('Digest mismatch')
          with zipfile.ZipFile('/tmp/input.zip') as z:
              for name,folder in [('flutter-host-no-fonts.zip','sdk'),('pub-cache-no-fonts.zip','pub')]:
                  d=root/folder;d.mkdir()
                  with z.open(name) as src,open(d/name,'wb') as dst: shutil.copyfileobj(src,dst)
                  if (d/name).stat().st_size>490*1024*1024: raise RuntimeError('Size mismatch')
              with z.open('runtime-assets-no-fonts.zip') as src,open('/tmp/assets.zip','wb') as dst: shutil.copyfileobj(src,dst)
          d=root/'assets';d.mkdir();rows=[];skipped=[];total=0
          suffix={'.png','.jpg','.jpeg','.webp','.svg','.json','.so','.yaml','.yml','.txt'}
          prefer=('assets/images/commerce/','assets/images/community/','assets/images/professional/mediterranean_protein_bowl.png','assets/images/brand/','assets/branding/','.dart_tool/')
          with zipfile.ZipFile('/tmp/assets.zip') as src,zipfile.ZipFile(d/'visual-assets-and-package-config.zip','w',zipfile.ZIP_DEFLATED) as dst:
              infos=sorted(src.infolist(),key=lambda i:(not i.filename.startswith(prefer),i.file_size))
              for info in infos:
                  p=pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts: raise RuntimeError('Invalid path')
                  if p.suffix.lower() not in suffix or info.file_size>4*1024*1024 or total+info.file_size>96*1024*1024:
                      skipped.append(info.filename);continue
                  data=src.read(info)
                  if data[:4] in {b'\x00\x01\x00\x00',b'OTTO',b'ttcf',b'wOFF',b'wOF2',b'true',b'typ1'}: raise RuntimeError('Font data rejected')
                  dst.writestr(info.filename,data);total+=len(data)
                  rows.append({'path':info.filename,'sha256':hashlib.sha256(data).hexdigest()})
          (d/'manifest.json').write_text(json.dumps({'files':rows,'not_exported':skipped,'font_files_excluded':True,'partial_assets':True},indent=2)+'\n')
          for p in root.rglob('*.zip'): print(p.name,p.stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-bounded-sdk-${{ github.sha }}
          path: /tmp/bil-bounded/sdk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-bounded-pub-${{ github.sha }}
          path: /tmp/bil-bounded/pub
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-bounded-assets-${{ github.sha }}
          path: /tmp/bil-bounded/assets
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
