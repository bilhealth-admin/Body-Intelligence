name: BIL single-commit Codex handoff targeted QA
on:
  push:
    branches:
      - handoff/bil-20261018-unified-codex-reconciliation
permissions:
  contents: read
concurrency:
  group: bil-codex-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Require committed Dart formatting, not hidden CI rewrites
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          git diff --check
      - name: Analyze full Flutter application
        run: flutter analyze --no-pub
  camera_food_more:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Real camera, meal search, permission and mobile-admin contracts
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/daily_log/diary_search_race_test.dart \
            test/features/daily_log/diary_search_detail_25_locale_test.dart \
            test/features/daily_log/meal_search_prefix_matrix_test.dart \
            test/features/daily_log/daily_log_food_add_flow_test.dart \
            test/features/daily_log/meal_detail_add_button_regression_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/features/daily_log/meal_photo_initial_action_test.dart \
            test/shared/widgets/bil_permission_recovery_dialog_test.dart \
            test/app/router/mobile_admin_removal_contract_test.dart \
            test/features/settings/more_section_headings_test.dart \
            test/features/settings/more_premium_polish_contract_test.dart
  paid_cloud_coach_community:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Verified Free grant revocation, no-double-store-celebration and owner isolation
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/commerce/admin_revocation_verified_free_regression_test.dart \
            test/features/commerce/store_confirmation_journal_test.dart \
            test/features/cloud_platform/cloud_manual_sync_outcome_copy_test.dart \
            test/features/community/community_feed_cache_test.dart \
            test/features/community/community_channels_safety_action_test.dart \
            test/features/intelligence_center/ai_coach_failure_surface_regression_test.dart
  postgres_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.7
      - name: PGlite synthetic user/channel abuse and moderation contract only
        run: |
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          deno test --allow-read --allow-env --no-lock \
            supabase/tests/bil07_community_channels_isolated_pglite_test.ts
