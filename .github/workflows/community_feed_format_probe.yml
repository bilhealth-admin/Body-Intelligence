name: BIL Community feed format probe

on:
  push:
    branches:
      - staging/community-final-qa-20261003

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Emit exact feed formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/community/data/community_feed_repository_mixin.dart
          git diff -- lib/features/community/data/community_feed_repository_mixin.dart
