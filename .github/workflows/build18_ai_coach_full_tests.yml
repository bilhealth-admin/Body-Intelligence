name: build18-ai-coach-full-tests
run-name: "AI Coach QA — ${{ inputs.focused_repair_only == true && 'focused repair checks' || 'complete Flutter suite' }}"

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913
  workflow_dispatch:
    inputs:
      focused_repair_only:
        description: Verify Coach and purchase fixture repairs only; this is not a complete suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build18-ai-coach-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Configure Git LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out Build 18 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze complete source
        if: ${{ inputs.focused_repair_only != true }}
        run: flutter analyze --no-pub

      - name: Run AI Coach regression tests
        run: >
          flutter test --no-pub
          test/features/commerce/ai_coach_credit_access_policy_test.dart
          test/features/settings/more_ai_coach_route_contract_test.dart

      - name: Verify purchase confirmation fixtures with their required configuration
        if: ${{ inputs.focused_repair_only == true }}
        run: >
          flutter test --no-pub --concurrency=2
          --dart-define=BIL_PAYMENTS_ENABLED=true
          --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms
          --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy
          test/features/commerce/app_purchase_confirmation_test.dart
          test/features/commerce/app_subscription_confirmation_test.dart

      - name: Run complete test suite including goldens
        if: ${{ inputs.focused_repair_only != true }}
        # Configure the existing commerce fixtures while retaining every test file.
        # Keep the full inventory: no file exclusions or weakened assertions.
        run: >
          flutter test --no-pub --concurrency=2
          --dart-define=BIL_PAYMENTS_ENABLED=true
          --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms
          --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy

      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build18-golden-failure-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test/failures/
            test/visual_closure/failures/
