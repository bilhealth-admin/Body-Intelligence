name: Build BIL iOS Test IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout BIL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign

      - name: Validate Runner application
        run: |
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/Info.plist

      - name: Package unsigned IPA
        run: |
          rm -rf Payload BIL-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry BIL-unsigned.ipa Payload
          unzip -l BIL-unsigned.ipa | head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BIL-unsigned-ios
          path: BIL-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
