name: BIL Vision premium review - scoped apply and QA
on:
  push:
    branches: [qa/bil-quality-ux-integration-20261009]
    paths: [.github/vision_payload.part09.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bil-vision-premium-review-20261010
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/bil-quality-ux-integration-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and unpack locked source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/vision_payload.part*.txt | base64 -d > /tmp/bil_vision_payload.tar.xz
          echo '2c7eb0221fa1f0df755c5607fa15a137bf4cf50f3f8152eb9af25af78ba72de2  /tmp/bil_vision_payload.tar.xz' | sha256sum -c -
          tar -tJf /tmp/bil_vision_payload.tar.xz
          tar -xJf /tmp/bil_vision_payload.tar.xz -C .
          python3 apply_bil_vision.py
          rm apply_bil_vision.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format scoped Dart changes
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/nutrition/presentation/meal_image_review_dialog.dart lib/features/nutrition/presentation/meal_vision_premium_review.dart lib/features/nutrition/presentation/meal_vision_premium_match.dart lib/features/daily_log/food_log_actions.dart lib/features/daily_log/daily_log_capture_actions.dart test/features/nutrition/meal_vision_premium_review_test.dart
          git diff --check
      - id: commit
        name: Commit scoped Vision files to QA, never main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BIL Vision QA'
          git config user.email 'bil-vision-qa@users.noreply.github.com'
          git add -- lib/features/nutrition/presentation/meal_image_review_dialog.dart lib/features/nutrition/presentation/meal_vision_premium_review.dart lib/features/nutrition/presentation/meal_vision_premium_match.dart lib/features/daily_log/food_log_actions.dart lib/features/daily_log/daily_log_capture_actions.dart test/features/nutrition/meal_vision_premium_review_test.dart docs/qa_next/BIL_VISION_20261010_IMPLEMENTATION.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'feat(vision): premium review, explicit eaten portions and trusted nutrition'
          git push origin HEAD:refs/heads/qa/bil-quality-ux-integration-20261009
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  analyze:
    needs: integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
  targeted:
    needs: integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - test/features/nutrition/meal_vision_premium_review_test.dart
          - test/features/nutrition/meal_image_unified_review_contract_test.dart
          - test/features/nutrition/meal_vision_domain_contract_test.dart
          - test/features/nutrition/epic6_voice_vision_gateway_test.dart
          - test/features/daily_log/meal_photo_initial_action_test.dart
          - test/features/nutrition/meal_declared_unit_commit_test.dart
          - test/features/daily_log/daily_log_nutrition_evidence_test.dart
          - test/features/nutrition/meal_item_evidence_snapshot_test.dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --timeout=2m ${{ matrix.suite }}
  android:
    needs: [integrate, analyze, targeted]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
  ios:
    needs: [integrate, analyze, targeted]
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign --no-pub
