name: BIL frozen SQL migration-aware scope QA
run-name: "Five unchanged rollback programs with exact known Auth cleanup trigger"

on:
  push:
    branches: [qa/bil-independent-31554-20261022]
    paths:
      - .github/workflows/bil_qa_guarded_sql_trigger_recovery_20261022.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-frozen-sql-migration-guard
  cancel-in-progress: false

env:
  FROZEN_SHA: 31554b3e078667a38bd3c53aa105f5f1d2a4dc96
  QA_HARNESS_SHA: 5fb2b54ab80cb4f2a6c5dcbc9820744b930b9ffa
  BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb

jobs:
  validate-original-hashes-and-updated-guard:
    name: Prove all original SQL hashes, rollback gates and exact trigger allowlist offline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QA_HARNESS_SHA }}
          path: harness
          sparse-checkout: tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compile and check all five modified SQL guards without a database
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FROZEN_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$QA_HARNESS_SHA"
          python3 -m py_compile harness/tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py
          for scope in ai_consent_receipt cloud_sync_consent community_collaborator_privacy community_policy_20261019 community_prebuild; do
            python3 harness/tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py \
              --self-test --scope "$scope" --source source \
              --output "$RUNNER_TEMP/bil-sql-trigger-qa/$scope"
          done
          test -z "$(git -C source diff --name-only HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: frozen31554-sql-trigger-overlay-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-sql-trigger-qa/
          if-no-files-found: warn
          retention-days: 21

  run-each-original-rollback-program:
    name: "Original strict SQL checks with migration-locked trigger - ${{ matrix.scope }}"
    needs: validate-original-hashes-and-updated-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scope:
          - ai_consent_receipt
          - cloud_sync_consent
          - community_collaborator_privacy
          - community_policy_20261019
          - community_prebuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QA_HARNESS_SHA }}
          path: qa-harness
          sparse-checkout: tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Run only this reviewed original rollback-only SQL audit
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QA_SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$FROZEN_SHA"
          mkdir -p supabase/.temp
          printf '%s' "$BIL_SUPABASE_PROJECT_REF" > supabase/.temp/project-ref
          export GITHUB_SHA="$FROZEN_SHA"
          python3 qa-harness/tools/qa/frozen_guarded_sql_trigger_overlay_20261022.py \
            --source . --scope "$QA_SCOPE" \
            --output "$RUNNER_TEMP/bil-sql-trigger-qa/$QA_SCOPE"
          test "$(git rev-parse HEAD)" = "$FROZEN_SHA"
          test -z "$(git diff --name-only HEAD)"
      - name: Store exact-source, updated-guard, strict result, and independent residue evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: frozen31554-sql-${{ matrix.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-sql-trigger-qa/${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 21
