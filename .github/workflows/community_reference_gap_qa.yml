name: BIL onboarding consent regression QA
on:
  push:
    branches: [work/community-reference-parity-20261003]
permissions:
  contents: write
concurrency:
  group: bil-requested-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onboarding-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Guarded repair of three obsolete direct modal taps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'test/features/onboarding/onboarding_flow_widget_test.dart': 1,
              'test/features/onboarding/onboarding_review_mode_test.dart': 2,
          }
          needle = "await tester.tap(find.byKey(const Key('onboarding-ai-consent-accept')));"
          for name, expected in targets.items():
              p = Path(name)
              source = p.read_text()
              assert source.count(needle) == expected, (name, 'inspect changed test source')
              result = []
              for line in source.splitlines(keepends=True):
                  if needle not in line:
                      result.append(line)
                      continue
                  indent = line[:len(line)-len(line.lstrip())]
                  for statement in [
                      "final accept = find.byKey(const Key('onboarding-ai-consent-accept'));",
                      'await tester.ensureVisible(accept);',
                      'await tester.pumpAndSettle();',
                      'expect(accept.hitTestable(), findsOneWidget);',
                      'await tester.tap(accept);',
                  ]:
                      result.append(indent + statement + '\n')
              p.write_text(''.join(result))
              print(name, expected, 'real hit-tested modal taps; expectations preserved')
          PY
      - name: Exact formatting and source checkpoint
        run: |
          set -euo pipefail
          dart format test/features/onboarding/onboarding_flow_widget_test.dart test/features/onboarding/onboarding_review_mode_test.dart
          git diff --check
          git config user.name bil-community-qa
          git config user.email actions@users.noreply.github.com
          git add test/features/onboarding/onboarding_flow_widget_test.dart test/features/onboarding/onboarding_review_mode_test.dart
          git commit -m "test(onboarding): scroll and hit-test real consent actions"
          git push origin HEAD:work/community-reference-parity-20261003
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          dart format --output=none --set-exit-if-changed test/features/onboarding/onboarding_flow_widget_test.dart test/features/onboarding/onboarding_review_mode_test.dart
      - name: Full source analysis
        run: flutter analyze --no-pub
      - name: Changed onboarding consent and review flows
        run: |
          flutter test --no-pub --reporter expanded \
            test/features/onboarding/onboarding_flow_widget_test.dart \
            test/features/onboarding/onboarding_review_mode_test.dart --timeout 2m
