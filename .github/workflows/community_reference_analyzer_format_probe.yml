name: Community reference analyzer-fix format probe
on:
  push:
    branches:
      - work/community-reference-parity-20261003
permissions:
  contents: write
concurrency:
  group: community-reference-analyzer-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format changed Dart
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only 9389fbb569bbadeb5d127b71a553f24bb7b1159d HEAD -- '*.dart' | while read -r path; do test -f "$path" && printf '%s\n' "$path"; done)
          if [ "${#paths[@]}" -gt 0 ]; then dart format "${paths[@]}"; fi
          git diff --check
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "bil-community-qa"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style(community): format analyzer fixes"
          git push origin HEAD:work/community-reference-parity-20261003
