name: BIL iOS +8 dual simulator QA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Exact audited simulator build number; build 7 is forbidden
        required: true
        default: '8'
        type: string

permissions:
  contents: read

concurrency:
  group: bil-ios-plus8-dual-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dual-simulator-qa:
    name: iPhone and iPad simulator evidence (+8 only)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BIL_APP_ID: com.bilhealth.bodyintelligencelog
      BIL_EVIDENCE_DIR: artifacts/release/ios_plus8_dual_simulator
      BIL_QA_SUSPEND_REASON: ios-plus8-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize runner-local QA state path
        shell: bash
        run: printf 'BIL_QA_STATE_PATH=%s/bil-ios-plus8-private-state.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout the selected accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject every build except the audited +8 source
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          AUDITED_SOURCE_SHA: ${{ vars.BIL_PLUS8_AUDITED_SOURCE_SHA }}
          AUDITED_MANIFEST_SHA256: ${{ vars.BIL_PLUS8_STAGING_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" == '8' ]] || {
            echo 'This workflow is fail-closed to build 8. Build 7 must never be built or tested here.' >&2
            exit 1
          }
          grep -Eq '^version:[[:space:]]+1\.0\.0\+8[[:space:]]*$' pubspec.yaml || {
            echo 'pubspec.yaml is not the frozen 1.0.0+8 source.' >&2
            exit 1
          }
          test -n "${AUDITED_SOURCE_SHA:-}" || {
            echo 'BIL_PLUS8_AUDITED_SOURCE_SHA is not frozen.' >&2
            exit 1
          }
          test -n "${AUDITED_MANIFEST_SHA256:-}" || {
            echo 'BIL_PLUS8_STAGING_MANIFEST_SHA256 is not frozen.' >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$AUDITED_SOURCE_SHA" || {
            echo 'The selected checkout is not the independently audited +8 SHA.' >&2
            exit 1
          }
          ACTUAL_MANIFEST_SHA256="$(shasum -a 256 \
            docs/release/BIL_PLUS8_FROZEN_SOURCE_MANIFEST_2026-09-06.md \
            | awk '{print $1}')"
          test "$ACTUAL_MANIFEST_SHA256" = "$AUDITED_MANIFEST_SHA256" || {
            echo 'The accepted +8 manifest digest does not match.' >&2
            exit 1
          }
          mkdir -p "$BIL_EVIDENCE_DIR"
          git rev-parse HEAD > "$BIL_EVIDENCE_DIR/source-head.txt"
          printf '%s\n' 'BUILD_NUMBER=8' > "$BIL_EVIDENCE_DIR/build-number.txt"

      - name: Require the private QA inputs before consuming macOS build time
        shell: bash
        env:
          OWNER_EMAIL: ${{ secrets.BIL_IOS_QA_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.BIL_IOS_QA_OWNER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BIL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BIL_SUPABASE_SERVICE_ROLE_KEY }}
          BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
        run: |
          set -euo pipefail
          test -n "${OWNER_EMAIL:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_IOS_QA_OWNER_EMAIL'; exit 1; }
          test -n "${OWNER_PASSWORD:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_IOS_QA_OWNER_PASSWORD'; exit 1; }
          test -n "${ASC_KEY_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_KEY_ID'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_ISSUER_ID'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_PRIVATE_KEY_BASE64'; exit 1; }
          test -n "${BIL_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_SUPABASE_SERVICE_ROLE_KEY'; exit 1; }
          test -n "${BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID'; exit 1; }
          printf '%s\n' 'PRIVATE_QA_INPUT_PRESENCE=PASS' \
            > "$BIL_EVIDENCE_DIR/private-qa-input-status.txt"

      - name: Install Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve dependencies and run the iOS and iPad code gates
        shell: bash
        env:
          BIL_RELEASE_PRODUCTION: true
          BIL_RELEASE_PLATFORM: ios
          BIL_RELEASE_APPLICATION_ID: com.bilhealth.bodyintelligencelog
          BIL_USE_SUPABASE: true
          SUPABASE_URL: https://tgmanzhqulksykhslrzb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_eMoUVfgwfU0RpQOwPJr-yw_ZgtStgld
          BIL_RECEIPT_SERVER_URL: https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/verify-store-purchase
          BIL_PAYMENTS_ENABLED: true
          BIL_STORE_CONFIGURED: true
          BIL_FACEBOOK_REQUIRED: true
          BIL_FACEBOOK_LOGIN_ENABLED: true
          BIL_FACEBOOK_LOGIN_READY: true
          BIL_PUSH_ENABLED: false
          BIL_PUSH_PROVIDER_READY: false
          BIL_MOBILE_INTEGRITY_REQUIRED: true
          BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
          BIL_SOURCE_COMMIT: ${{ github.sha }}
          BIL_AUDITED_SOURCE_COMMIT: ${{ vars.BIL_PLUS8_AUDITED_SOURCE_SHA }}
          BIL_RELEASE_EXPECTED_BUILD_NUMBER: 8
          BIL_RELEASE_MANIFEST_PATH: docs/release/BIL_PLUS8_FROZEN_SOURCE_MANIFEST_2026-09-06.md
          BIL_AUDITED_FREEZE_MANIFEST_SHA256: ${{ vars.BIL_PLUS8_STAGING_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub
          dart run tool/release/validate_release_configuration.dart
          node tool/release/ios_plus8_canary_runtime_test.mjs
          node --test tool/release/ios_plus8_reviewer_entitlement_test.mjs
          bash tool/release/ios_plus8_secret_scope_test.sh
          flutter test --no-pub \
            test/responsive_shell_test.dart \
            test/premium_profile_page_contract_test.dart \
            test/location_settings_contract_test.dart \
            test/platform_readiness/mobile_release_configuration_contract_test.dart \
            test/platform_readiness/native_profile_photo_entry_points_contract_test.dart \
            test/platform_readiness/platform_native_navigation_contract_test.dart \
            test/platform_readiness/recoverable_image_picker_test.dart \
            test/apple_preparation/apple_preparation_contract_test.dart \
            test/apple_preparation/ios_native_runtime_safety_contract_test.dart \
            test/apple_preparation/ios_return_to_app_link_contract_test.dart \
            test/features/auth/apple_credential_lifecycle_test.dart \
            test/features/auth/facebook_oauth_platform_contract_test.dart \
            test/features/ads/admob_and_policy_test.dart \
            test/features/commerce/final_store_market_policy_alignment_test.dart \
            test/features/admin/admin_notification_backend_contract_test.dart \
            test/features/admin/admin_notification_controls_test.dart \
            test/features/admin/ai_coach_global_reset_test.dart \
            test/features/admin/ai_coach_reset_token_grants_contract_test.dart \
            test/features/admin/community_member_access_admin_contract_test.dart \
            test/features/admin/community_moderator_admin_contract_test.dart \
            test/features/community/community_deep_link_test.dart \
            test/features/notifications/ios_notification_navigation_test.dart \
            test/launch_readiness/apple_release_boundary_contract_test.dart \
            test/launch_readiness/deep_link_exhaustive_source_contract_test.dart \
            test/launch_readiness/ios_plus8_dual_simulator_workflow_contract_test.dart \
            test/launch_readiness/ios_manual_signing_workflow_contract_test.dart \
            --timeout 10m
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerDebug.entitlements

      - name: Verify the simulator project targets both iPhone and iPad
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/bil-ios-simulator-build-settings.txt"
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings > "$SETTINGS"
          grep -Eq 'TARGETED_DEVICE_FAMILY = ("?1,2"?|1 2)' "$SETTINGS" || {
            echo 'The simulator target does not advertise both iPhone and iPad.' >&2
            exit 1
          }
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' "$SETTINGS"
          xcodebuild -version > "$BIL_EVIDENCE_DIR/xcode-version.txt"
          xcrun simctl list runtimes available \
            > "$BIL_EVIDENCE_DIR/available-runtimes.txt"

      - name: Build the production-shaped +8 simulator application
        shell: bash
        run: |
          set -euo pipefail
          # App Attest cannot produce production assertions in Simulator. Keep
          # every other release-facing define aligned with the signed workflow,
          # and record this one deliberate boundary in the evidence manifest.
          flutter build ios --simulator --debug --no-codesign --no-pub \
            --build-number 8 \
            --dart-define=BIL_ENVIRONMENT=production \
            --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=false \
            --dart-define=BIL_PAYMENTS_ENABLED=true \
            --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms \
            --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy \
            --dart-define=BIL_MEAL_VISION_ENDPOINT=https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/analyze-meal \
            --dart-define=BIL_WELLNESS_MANIFEST_URL=https://workouts.bilhealth.com/v2/manifest/wellness-workouts-v2-af6082ff28856f9154216067f16fe6a7147548c9a29f8e205b43bb81bc34efe8.json \
            --dart-define=BIL_RECIPE_IMAGE_DELIVERY_ENABLED=true \
            --dart-define=BIL_FACEBOOK_LOGIN_ENABLED=true \
            --dart-define=BIL_FACEBOOK_LOGIN_READY=true \
            --dart-define=BIL_ADS_ENABLED=false \
            --dart-define=BIL_AD_PROVIDER_READY=false \
            --dart-define=BIL_ENABLE_CATALOG_TEST_ACCESS=false
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '8'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BIL_APP_ID"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          families = set(info.get('UIDeviceFamily', []))
          if families != {1, 2}:
              raise SystemExit(f'UIDeviceFamily must be exactly iPhone+iPad, got {sorted(families)}')
          PY
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "$BIL_EVIDENCE_DIR/BIL-plus8-iOS-Simulator.app.zip"

      - name: Select the pinned Python runtime for the iOS interaction bridge
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: tool/release/ios_plus8_idb_requirements.lock

      - name: Install the checksum-locked iOS interaction bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bil-idb-bin"
          curl --fail --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz \
            --output "$RUNNER_TEMP/idb-companion.tar.gz"
          test "$(shasum -a 256 "$RUNNER_TEMP/idb-companion.tar.gz" \
            | awk '{print $1}')" \
            = '3b72cc6a9a5b1a22a188205a84090d3a294347a846180efd755cf1a3c848e3e7' || {
              echo 'Pinned idb companion checksum mismatch.' >&2
              exit 1
            }
          tar -xzf "$RUNNER_TEMP/idb-companion.tar.gz" \
            -C "$RUNNER_TEMP/bil-idb-bin"
          chmod +x \
            "$RUNNER_TEMP/bil-idb-bin/idb-companion.universal/bin/idb_companion"
          python3 -m venv "$RUNNER_TEMP/bil-idb-venv"
          "$RUNNER_TEMP/bil-idb-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r tool/release/ios_plus8_idb_requirements.lock
          "$RUNNER_TEMP/bil-idb-venv/bin/python" -m pip check
          "$RUNNER_TEMP/bil-idb-venv/bin/idb" --help >/dev/null
          echo "$RUNNER_TEMP/bil-idb-bin/idb-companion.universal/bin" \
            >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bil-idb-venv/bin" >> "$GITHUB_PATH"

      - name: Create two independent clean simulator sessions
        id: simulators
        shell: bash
        run: |
          set -euo pipefail
          read -r RUNTIME IPHONE_TYPE IPAD_TYPE < <(python3 - <<'PY'
          import json
          import re
          import subprocess

          runtimes = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'runtimes', 'available', '-j'],
          ))['runtimes']
          ios = [
              item for item in runtimes
              if item.get('isAvailable')
              and item.get('identifier', '').startswith(
                  'com.apple.CoreSimulator.SimRuntime.iOS-',
              )
          ]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')

          def version(item):
              return tuple(int(value) for value in re.findall(r'\d+', item.get('version', '0')))

          runtime = max(ios, key=version)
          types = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devicetypes', '-j'],
          ))['devicetypes']
          iphones = [item for item in types if item['name'].startswith('iPhone')]
          ipads = [item for item in types if item['name'].startswith('iPad')]
          if not iphones or not ipads:
              raise SystemExit('Both an iPhone and an iPad device type are required')

          def preferred(items, names):
              by_name = {item['name']: item for item in items}
              for name in names:
                  if name in by_name:
                      return by_name[name]
              return items[-1]

          iphone = preferred(iphones, ['iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro'])
          ipad = preferred(ipads, [
              'iPad Pro 13-inch (M4)',
              'iPad Pro (13-inch) (M4)',
              'iPad Pro (12.9-inch) (6th generation)',
          ])
          print(runtime['identifier'], iphone['identifier'], ipad['identifier'])
          PY
          )
          IPHONE_UDID="$(xcrun simctl create \
            "BIL-plus8-iPhone-${GITHUB_RUN_ID}" "$IPHONE_TYPE" "$RUNTIME")"
          IPAD_UDID="$(xcrun simctl create \
            "BIL-plus8-iPad-${GITHUB_RUN_ID}" "$IPAD_TYPE" "$RUNTIME")"
          echo "iphone_udid=$IPHONE_UDID" >> "$GITHUB_OUTPUT"
          echo "ipad_udid=$IPAD_UDID" >> "$GITHUB_OUTPUT"
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            xcrun simctl erase "$UDID"
            xcrun simctl boot "$UDID"
          done
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl bootstatus "$IPAD_UDID" -b
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            xcrun simctl ui "$UDID" appearance light
            if ! xcrun simctl status_bar "$UDID" override \
              --time 09:41 --batteryState charged --batteryLevel 100 \
              --wifiBars 3 --cellularBars 4; then
              echo 'Status-bar normalization is unavailable on this runtime.'
            fi
            xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          done

      - name: Launch, deep-link, relaunch, and capture both simulator sessions
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.simulators.outputs.iphone_udid }}
          IPAD_UDID: ${{ steps.simulators.outputs.ipad_udid }}
        run: |
          set -euo pipefail
          mkdir -p "$BIL_EVIDENCE_DIR/iphone" "$BIL_EVIDENCE_DIR/ipad"

          launch_and_capture() {
            local udid="$1"
            local evidence="$2"
            xcrun simctl launch "$udid" "$BIL_APP_ID" \
              -AppleLanguages '(en)' -AppleLocale 'en_US' \
              | tee "$evidence/launch.txt"
            sleep 12
            xcrun simctl io "$udid" screenshot "$evidence/01-cold-launch.png"
            idb ui describe-all --udid "$udid" --json \
              > "$evidence/01-cold-launch-accessibility.json"

            xcrun simctl openurl "$udid" 'bil://login'
            sleep 5
            xcrun simctl io "$udid" screenshot "$evidence/02-login-deep-link.png"
            idb ui describe-all --udid "$udid" --json \
              > "$evidence/02-login-accessibility.json"

            xcrun simctl terminate "$udid" "$BIL_APP_ID"
            xcrun simctl launch "$udid" "$BIL_APP_ID" \
              -AppleLanguages '(en)' -AppleLocale 'en_US' \
              | tee "$evidence/relaunch.txt"
            sleep 8
            xcrun simctl io "$udid" screenshot "$evidence/03-relaunch.png"
          }

          launch_and_capture "$IPHONE_UDID" "$BIL_EVIDENCE_DIR/iphone"
          launch_and_capture "$IPAD_UDID" "$BIL_EVIDENCE_DIR/ipad"

          capture_log() {
            local udid="$1"
            local evidence="$2"
            xcrun simctl spawn "$udid" log show \
              --style compact --last 5m \
              --predicate 'process == "Runner"' \
              > "$evidence/runner.log"
            test -s "$evidence/runner.log"
          }
          capture_log "$IPHONE_UDID" "$BIL_EVIDENCE_DIR/iphone"
          capture_log "$IPAD_UDID" "$BIL_EVIDENCE_DIR/ipad"

          mkdir -p "$HOME/Library/Logs/DiagnosticReports"
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            CRASHES="$(find "$HOME/Library/Logs/DiagnosticReports" \
              -maxdepth 1 -type f -name 'Runner*' -newermt '-10 minutes' \
              -print)"
            test -z "$CRASHES" || {
              echo "Runner crash report detected after simulator lifecycle exercise." >&2
              exit 1
            }
            xcrun simctl get_app_container "$UDID" "$BIL_APP_ID" app >/dev/null
          done
          printf '%s\n' \
            'IPHONE_COLD_LAUNCH=PASS' \
            'IPAD_COLD_LAUNCH=PASS' \
            'CUSTOM_LOGIN_LINK_BOTH=CAPTURED' \
            'TERMINATE_RELAUNCH_BOTH=PASS' \
            'IPAD_LANDSCAPE_WIDGET_CONTRACT=PASS' \
            'IPAD_LANDSCAPE_SIMULATOR_RUNTIME=NOT_EXECUTED' \
            'RUNNER_LOGS_BOTH=CAPTURED' \
            > "$BIL_EVIDENCE_DIR/runtime-status.txt"

      - name: Run the fail-closed owner-iPhone and reviewer-iPad canary
        id: cross_account_canary
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.simulators.outputs.iphone_udid }}
          IPAD_UDID: ${{ steps.simulators.outputs.ipad_udid }}
          OWNER_EMAIL: ${{ secrets.BIL_IOS_QA_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.BIL_IOS_QA_OWNER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BIL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BIL_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash tool/release/ios_plus8_dual_simulator_ui.sh

      - name: Restore and remove every backend canary artifact
        id: backend_cleanup
        if: always()
        shell: bash
        env:
          BIL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BIL_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node tool/release/ios_plus8_dual_account_canary.mjs cleanup

      - name: Record the simulator and signed-device evidence boundary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANARY_OUTCOME: ${{ steps.cross_account_canary.outcome }}
          BACKEND_CLEANUP_OUTCOME: ${{ steps.backend_cleanup.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$BIL_EVIDENCE_DIR"
          CANARY_RESULT=FAIL
          if [[ "$CANARY_OUTCOME" == 'success' && \
                "$BACKEND_CLEANUP_OUTCOME" == 'success' ]]; then
            CANARY_RESULT=PASS
          fi
          printf '%s\n' \
            "WORKFLOW_STATUS=$JOB_STATUS" \
            "CROSS_ACCOUNT_CANARY_STEP=$CANARY_OUTCOME" \
            "BACKEND_CLEANUP_STEP=$BACKEND_CLEANUP_OUTCOME" \
            "AUTHENTICATED_CANARY_RESULT=$CANARY_RESULT" \
            'CANDIDATE_BUILD=1.0.0+8_ONLY' \
            'SIMULATOR_BINARY=UNSIGNED_DEBUG_APP' \
            'SIMULATOR_ATTEMPT_SCOPE=build,install,cold-launch,custom-link-routing,iPhone-layout,iPad-portrait,iPad-landscape-widget-contract,terminate-relaunch,owner-and-reviewer-email-login,reviewer-backend-entitlement-and-ai-no-paywall-and-zero-reward,friend-request-and-accept,bidirectional-message,reviewer-post-reject-and-author-visibility,disposable-post-approve-plus-five-and-reviewer-visibility,disposable-block-and-write-denial,disposable-individual-reset-and-exact-message-and-2500-grant,disposable-target-notification,disposable-moderator-add-remove,disposable-suspend-and-write-denial-and-reinstate,owner-protection,fail-closed-disposable-account-deletion' \
            'AUTHENTICATED_UI_REQUIRED=true' \
            'SIMULATOR_INTEGRITY_BOUNDARY=If the production server requires App Attest, Simulator cannot mint a production assertion; authenticated mutations must fail and the signed-device gate remains open.' \
            'IPAD_LANDSCAPE_BOUNDARY=Flutter widget tests cover landscape and split widths; fb-idb 1.1.7 has no supported rotation command, so landscape simulator runtime is not claimed.' \
            'SIGNED_PHYSICAL_OR_TESTFLIGHT_STILL_REQUIRED=Sign in with Apple credential sheet and revocation,App Attest production assertion,Facebook provider callback and universal-link association,StoreKit purchase and restore,HealthKit and Apple Watch,push delivery,camera hardware' \
            'APPLE_REVIEWER_IMMUTABLE_REWARD_EFFECT=none;reviewer post is rejected and approved post belongs to deleted disposable account' \
            'APPLE_REVIEWER_POST_APPROVAL_EXCLUDED=immutable five-token receipt would pollute the real review account;not claimed' \
            'SIMULATOR_NO_ADS_EVIDENCE=static no-ad policy contract plus sampled coach UI only;exhaustive signed UI absence is not claimed' \
            'WATCHDOG_BOUNDARY=independent exact-run cleanup executes after runner failure when the GitHub control plane can schedule the pinned watchdog job;platform-wide cancellation or outage cannot be claimed away' \
            'PRODUCTION_WIDE_ADMIN_ACTIONS_NOT_RUN=global reset and general notification are covered by isolated widget/server/SQL contract tests only because production audience mutation is forbidden' \
            > "$BIL_EVIDENCE_DIR/evidence-boundary.txt"

      - name: Scan the upload set for private account data and bearer tokens
        id: privacy_scan
        if: always() && steps.backend_cleanup.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tool/release/ios_plus8_dual_account_canary.mjs scan-evidence
          rm -f "$BIL_QA_STATE_PATH" "$BIL_QA_STATE_PATH.started"

      - name: Upload +8 simulator evidence
        if: always() && steps.cross_account_canary.outcome == 'success' && steps.backend_cleanup.outcome == 'success' && steps.privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-ios-plus8-dual-simulator-${{ github.sha }}
          path: ${{ env.BIL_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove both disposable simulator sessions
        if: always()
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.simulators.outputs.iphone_udid }}
          IPAD_UDID: ${{ steps.simulators.outputs.ipad_udid }}
        run: |
          set -euo pipefail
          simulator_exists() {
            local udid="$1"
            xcrun simctl list devices -j | python3 -c '
          import json, sys
          wanted = sys.argv[1]
          payload = json.load(sys.stdin)
          raise SystemExit(0 if any(
              device.get("udid") == wanted
              for devices in payload.get("devices", {}).values()
              for device in devices
          ) else 1)
          ' "$udid"
          }
          simulator_booted() {
            local udid="$1"
            xcrun simctl list devices -j | python3 -c '
          import json, sys
          wanted = sys.argv[1]
          payload = json.load(sys.stdin)
          raise SystemExit(0 if any(
              device.get("udid") == wanted and device.get("state") == "Booted"
              for devices in payload.get("devices", {}).values()
              for device in devices
          ) else 1)
          ' "$udid"
          }
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            if [[ -n "${UDID:-}" ]] && simulator_exists "$UDID"; then
              if xcrun simctl get_app_container "$UDID" "$BIL_APP_ID" app >/dev/null 2>&1; then
                xcrun simctl uninstall "$UDID" "$BIL_APP_ID"
              fi
              if simulator_booted "$UDID"; then
                xcrun simctl shutdown "$UDID"
              fi
              xcrun simctl delete "$UDID"
              simulator_exists "$UDID" && {
                echo 'Disposable simulator deletion postcondition failed.' >&2
                exit 1
              }
            fi
          done
          rm -rf build "$RUNNER_TEMP/bil-private-ui" "$RUNNER_TEMP/bil-ios-plus8-private-state.json" "$RUNNER_TEMP/bil-ios-plus8-private-state.json.started"

  reinstate-watchdog:
    name: Independent exact-run backend cleanup watchdog
    needs: dual-simulator-qa
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BIL_QA_SUSPEND_REASON: ios-plus8-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize runner-local watchdog paths
        shell: bash
        run: |
          printf 'BIL_EVIDENCE_DIR=%s/bil-ios-plus8-watchdog-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BIL_QA_STATE_PATH=%s/bil-ios-plus8-watchdog-state.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout the exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Re-authenticate and remove exact-run suspension and social residue
        shell: bash
        env:
          OWNER_EMAIL: ${{ secrets.BIL_IOS_QA_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.BIL_IOS_QA_OWNER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BIL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BIL_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OWNER_EMAIL:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_IOS_QA_OWNER_EMAIL'; exit 1; }
          test -n "${OWNER_PASSWORD:-}" || { echo 'OWNER_INPUT_REQUIRED: BIL_IOS_QA_OWNER_PASSWORD'; exit 1; }
          test -n "${ASC_KEY_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_KEY_ID'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_ISSUER_ID'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'OWNER_INPUT_REQUIRED: APP_STORE_CONNECT_PRIVATE_KEY_BASE64'; exit 1; }
          bash tool/release/ios_plus8_reinstate_watchdog.sh
