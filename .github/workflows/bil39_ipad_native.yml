name: BIL iPad native source QA

on:
  push:
    branches: [main, integration/bil-qa-media-policy-20261011, bil39/integration-20261025, codex/bil40-device-fixes-20261028, codex/bil41-android33-release-20261106, codex/bil-full-fix-batch-20261106, codex/bil43-android35-verified-20261108, codex/bil44-android36-verified-20261115, codex/bil45-android37-inactive-catalog-20261115, codex/bil46-android38-reviewer-fixes-20261116, codex/bil47-android39-subscription-stability-20261116, codex/bil48-android40-passive-reconciliation-20261117, codex/bil-release-ios38-android33-20261022]
  pull_request:
    branches: [main, integration/bil-qa-media-policy-20261011]
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: bil39-ipad-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/bil39_ios_native_reusable.yml
    with:
      device: ipad
