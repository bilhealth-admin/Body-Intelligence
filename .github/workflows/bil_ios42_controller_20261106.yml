              stream.write('BIL_IPA_SHA256='+r['ipa_sha256']+'\n')
              stream.write('BIL_SIGNED_RUN='+os.environ['BIL_SIGNED_RUN']+'\n')
              stream.write('BIL_SIGNED_ARTIFACT='+os.environ['BIL_SIGNED_ARTIFACT']+'\n')
          PY
      - name: Verify exact bytes, IPA identity and original signing receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, zipfile
          root=pathlib.Path('.')
          def unique(name):
              matches=list(root.rglob(name))
              assert len(matches)==1, 'Missing or ambiguous evidence: '+name
              return matches[0]
          ipa=unique('*.ipa')
          digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest==os.environ['BIL_IPA_SHA256'], 'IPA bytes differ from signed run'
          receipt=json.loads(unique('BIL-ios-build-only-receipt.json').read_text())
          assert receipt['status']=='SIGNED_IPA_BUILT_AND_LOCALLY_VERIFIED'
          assert receipt['source_sha']==os.environ['BIL_TESTED_SOURCE'] and receipt['build']==42
          assert receipt['workflow_sha']==os.environ['GITHUB_SHA']==os.environ['BIL_SIGNING_ORCHESTRATION_SHA']
          assert receipt.get('validation_mode','all_exact_source_ci')==os.environ['BIL_VALIDATION_MODE']
          native_status='PASS'
          assert receipt['native_crypto_runtime_status']==native_status
          assert ('NATIVE_CRYPTO_RUNTIME_GATE='+native_status) in unique('BIL-ios-native-crypto-gate.txt').read_text()
          assert receipt['ipa_sha256']==digest and receipt['ipa_bytes']==ipa.stat().st_size
          assert unique('BIL-source-head.txt').read_text().strip()==os.environ['BIL_TESTED_SOURCE']
          assert 'SIGNED_IPA_CODESIGN_GATE=PASS' in unique('BIL-ios-codesign-verify.txt').read_text()
          assert 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' in unique('BIL-ios-crypto-scan.txt').read_text()
          inventory=json.loads(unique('BIL-ios-final-artifact-inventory.json').read_text())
          assert inventory['status']=='FINAL_ARTIFACT_IDENTITY_PASS' and inventory['build']=='42'
          assert inventory['package']=='com.bilhealth.bodyintelligencelog' and inventory['version']=='1.0.0'
          with zipfile.ZipFile(ipa) as archive:
              infos=[n for n in archive.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and len(n.split('/'))==3]
              assert len(infos)==1
              info=plistlib.loads(archive.read(infos[0]))
          assert info['CFBundleIdentifier']=='com.bilhealth.bodyintelligencelog'
          assert info['CFBundleVersion']=='42' and info['CFBundleShortVersionString']=='1.0.0'
          identity={'source_sha':os.environ['BIL_TESTED_SOURCE'],'build':42,'ipa_sha256':digest,
                    'workflow_sha':os.environ['GITHUB_SHA'],'signed_run':int(os.environ['BIL_SIGNED_RUN']),
                    'signed_artifact':int(os.environ['BIL_SIGNED_ARTIFACT']),
                    'uses_non_exempt_encryption':info.get('ITSAppUsesNonExemptEncryption'),
                    'physical_device_verified':False,'release_approved':False}
          pathlib.Path('evidence/identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('BIL_IPA_PATH='+str(ipa.resolve())+'\n')
          print('EXACT_SIGNED_IPA_42_BYTES_AND_SOURCE=PASS')
          PY
          BIL_IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          python3 tool/release/verify_final_artifact_identity.py \
            --ipa "$BIL_IPA_PATH" --package com.bilhealth.bodyintelligencelog \
            --version 1.0.0 --build 42 --output evidence/final-artifact-inventory.json
          python3 tool/release/verify_ios_app_icon.py --ipa "$BIL_IPA_PATH" --output evidence/final-icon-inventory.json
      - name: Prepare ephemeral Apple API key and processing verifier
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          assert all(os.environ.get(k) for k in ('ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY_BASE64'))
          folder=pathlib.Path.home()/'.appstoreconnect/private_keys'
          folder.mkdir(parents=True,exist_ok=True)
          key=folder/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          raw=base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'],validate=True)
          assert b'-----BEGIN PRIVATE KEY-----' in raw
          key.write_bytes(raw); key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('ASC_PRIVATE_KEY_PATH='+str(key)+'\n')
          PY
          cat > evidence/asc-processing.mjs <<'JS'
          import fs from 'node:fs';
          import { clientFromEnvironment } from '../tool/apple_store_connect/asc_catalog_sync.mjs';
          const client=clientFromEnvironment();
          const APP='6805349703';
          const mode=process.argv[2];
          const write=(name,data)=>fs.writeFileSync(`evidence/${name}.json`,JSON.stringify(data,null,2)+'\n');
          const matching=async version=>{
            const response=await client.request('GET',`/v1/builds?filter[app]=${APP}&filter[version]=${version}&include=preReleaseVersion&limit=100`);
            return response.data.filter(b=>response.included?.some(v=>v.id===b.relationships.preReleaseVersion.data?.id&&v.attributes.version==='1.0.0'&&v.attributes.platform==='IOS'));
          };
          const internalGroupsForBuild=async buildId=>{
            const result=[];
            for(const group of await client.all(`/v1/apps/${APP}/betaGroups?limit=200`)){
              if(group.attributes.isInternalGroup!==true) continue;
              const builds=await client.all(`/v1/betaGroups/${group.id}/builds?limit=200`);
              if(builds.some(b=>b.id===buildId)) result.push(group);
            }
            return result;
          };
          if(mode==='preflight'){
            const app=await client.request('GET',`/v1/apps/${APP}`);
            if(app.data.attributes.bundleId!=='com.bilhealth.bodyintelligencelog') throw Error('ASC app identity mismatch');
            if((await matching('42')).length) throw Error('Build 42 already exists: upload is blocked to prevent duplication; inspect its identity before proceeding');
            const previous=await matching('41');
            const internal=new Map();
            for(const build of previous){
              for(const group of await internalGroupsForBuild(build.id)){
                if(group.attributes.isInternalGroup===true) internal.set(group.id,{id:group.id,name:group.attributes.name});
              }
            }
            write('asc-preflight',{app_id:APP,build42_absent:true,previous_internal_groups:[...internal.values()]});
            if(internal.size===0) throw Error('No existing internal testing group was verified; upload is blocked');
            console.log(`ASC_PREFLIGHT=PASS; BUILD42_ABSENT; EXISTING_INTERNAL_GROUPS=${internal.size}`);
          }else if(mode==='processing'){
            const identity=JSON.parse(fs.readFileSync('evidence/identity.json'));
            const preflight=JSON.parse(fs.readFileSync('evidence/asc-preflight.json'));
            const expectedGroups=preflight.previous_internal_groups;
            if(!Array.isArray(expectedGroups)||expectedGroups.length===0) throw Error('At least one verified internal group is required before promotion');
            let build;
            for(let attempt=0;attempt<31;attempt++){
              const matches=await matching('42');
              if(matches.length>1) throw Error('Ambiguous build 42 records');
              build=matches[0];
              const state=build?.attributes.processingState??'NOT_VISIBLE_YET';
              write('apple-processing',{build_id:build?.id??null,processing_state:state,attempt,source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256});
              console.log(`APPLE_PROCESSING=${state}; CHECK=${attempt+1}`);
              if(['FAILED','INVALID'].includes(state)) throw Error('Apple rejected binary processing; preserve upload receipt and do not re-upload');
              if(state==='VALID') break;
              if(attempt<30) await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(build?.attributes.processingState!=='VALID'){
              write('testflight-pending',{status:'APPLE_PROCESSING_PENDING',build_id:build?.id??null,
                processing_state:build?.attributes.processingState??'NOT_VISIBLE_YET',
                source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256,do_not_reupload:true});
              throw Error('Upload accepted but Apple processing is pending; readiness was not verified. Do not re-upload');
            }
            if(build.attributes.usesNonExemptEncryption==null&&identity.uses_non_exempt_encryption===false){
              await client.request('PATCH',`/v1/builds/${build.id}`,{data:{type:'builds',id:build.id,attributes:{usesNonExemptEncryption:false}}});
            }
            const current=await internalGroupsForBuild(build.id);
            const known=new Set(current.map(g=>g.id));
            for(const group of expectedGroups){
              if(!known.has(group.id)) await client.request('POST',`/v1/betaGroups/${group.id}/relationships/builds`,{data:[{type:'builds',id:build.id}]});
            }
            // Apple InternalBetaState availability values; processing VALID alone
            // does not establish internal testing or group association.
            // https://developer.apple.com/documentation/appstoreconnectapi/internalbetastate
            const availableStates=new Set(['READY_FOR_BETA_TESTING','IN_BETA_TESTING']);
            let ready=false;
            for(let attempt=0;attempt<13;attempt++){
              const internal=await internalGroupsForBuild(build.id);
              const detail=await client.request('GET',`/v1/builds/${build.id}/buildBetaDetail`);
              const state=detail.data?.attributes.internalBuildState??'NOT_AVAILABLE_YET';
              const associated=new Set(internal.map(g=>g.id));
              const missing=expectedGroups.filter(g=>!associated.has(g.id)).map(g=>g.id);
              ready=availableStates.has(state)&&missing.length===0;
              const result={status:ready?'INTERNAL_TESTFLIGHT_READY':'INTERNAL_AVAILABILITY_PENDING',
                build_id:build.id,version:'1.0.0',build:42,processing_state:'VALID',
                internal_build_state:state,internal_groups:internal.map(g=>({id:g.id,name:g.attributes.name})),
                expected_internal_groups:expectedGroups,missing_internal_group_ids:missing,attempt,
                source_sha:identity.source_sha,ipa_sha256:identity.ipa_sha256,
                physical_device_verified:false,release_approved:false,do_not_reupload:true};
              write(ready?'testflight-ready':'testflight-pending',result);
              console.log(`TESTFLIGHT_BUILD42_PROCESSING=VALID; INTERNAL_STATE=${state}; MISSING_INTERNAL_GROUPS=${missing.length}; READINESS_CHECK=${attempt+1}`);
              if(ready){
                console.log('TESTFLIGHT_BUILD42_INTERNAL_AVAILABILITY=VERIFIED; DEVICE_ACCEPTANCE=PENDING');
                break;
              }
              if(['PROCESSING_EXCEPTION','EXPIRED'].includes(state)) throw Error('Apple internal testing is unavailable: '+state+'; do not re-upload');
              if(attempt<12) await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if(!ready) throw Error('Upload accepted but internal testing availability or group readback remains pending; do not re-upload');
          }else throw Error('Unknown ASC operation');
          JS
          node --check evidence/asc-processing.mjs
      - name: Verify Apple access and prevent an accidental duplicate upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs preflight
      - name: Validate this exact IPA with Apple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-validation.log
      - name: Upload the original signed IPA to TestFlight once
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          xcrun altool --upload-app -f "$BIL_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee evidence/apple-upload.log
          python3 - <<'PY'
          import datetime,json,pathlib,os
          identity=json.loads(pathlib.Path('evidence/identity.json').read_text())
          identity.update(status='UPLOAD_ACCEPTED',processing_verified=False,
                          uploaded_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),signed_run=int(os.environ['BIL_SIGNED_RUN']),signed_artifact=int(os.environ['BIL_SIGNED_ARTIFACT']))
          pathlib.Path('evidence/upload-receipt.json').write_text(json.dumps(identity,indent=2)+'\n')
          print('EXACT_ORIGINAL_IPA42_UPLOAD=ACCEPTED')
          PY
      - name: Verify Apple processing and reuse existing internal testing groups
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: node evidence/asc-processing.mjs processing
      - name: Record failure-safe signing stage evidence without credentials
        if: always()
        env:
          BIL_SIGNING_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY2'
          import json, os, pathlib, subprocess
          record={'source_sha':os.environ['BIL_TESTED_SOURCE_SHA'],
                  'workflow_sha':os.environ['GITHUB_SHA'], 'job_status':os.environ['BIL_SIGNING_JOB_STATUS'],
                  'actual_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'signed_receipt_exists':pathlib.Path('BIL-ios-build-only-receipt.json').is_file(),
                  'upload_receipt_exists':pathlib.Path('evidence/upload-receipt.json').is_file(),
                  'public_release_approved':False}
          pathlib.Path('evidence/signing-stage-status.json').write_text(json.dumps(record,indent=2)+'\n')
          PY2
      - name: Preserve upload, processing and artifact identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-ios42-testflight-promotion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 21
      - name: Remove ephemeral Apple private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_PRIVATE_KEY_PATH:-}" && "$ASC_PRIVATE_KEY_PATH" == "$HOME/.appstoreconnect/private_keys/"* ]]; then
            rm -f "$ASC_PRIVATE_KEY_PATH"
          fi
