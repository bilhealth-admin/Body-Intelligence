name: BIL QA fast P0 regression gate

# Narrow regression only. No eight-shard full-suite run here.
on:
  push:
    branches:
      - qa/bil-quality-ux-integration-20261009
    paths:
      - .github/workflows/bil_qa_p0_fast_20261010.yml
      - lib/data/repositories/meal_repository.dart
      - lib/data/repositories/meal_repository_validation.dart
      - lib/features/daily_log/food_log_page.dart
      - lib/features/daily_log/food_log_tile_widgets.dart
      - lib/features/nutrition/presentation/meal_vision_premium_review.dart
      - lib/features/nutrition/presentation/meal_vision_premium_match.dart
      - lib/features/nutrition/presentation/meal_vision_premium_visuals.dart
      - test/features/nutrition/coach_food_commit_test.dart
      - test/features/nutrition/coach_meal_commit_boundary_test.dart
      - test/features/nutrition/meal_vision_premium_review_test.dart
      - test/features/nutrition/meal_vision_flutter_capture_test.dart
      - test/parallel/bil02/coach_media_page_overlay_test.dart
      - test/features/intelligence_center/coach_image_source_regression_test.dart
      - test/features/nutrition/meal_image_language_regression_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-qa-fast-p0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: source-format-and-analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Strict formatting for all edited QA sources and tests
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/data/repositories/meal_repository.dart \
            lib/data/repositories/meal_repository_validation.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/daily_log/food_log_tile_widgets.dart \
            lib/features/nutrition/presentation/meal_vision_premium_review.dart \
            lib/features/nutrition/presentation/meal_vision_premium_match.dart \
            test/features/nutrition/coach_food_commit_test.dart \
            test/features/nutrition/coach_food_journal_cases.dart \
            test/features/nutrition/coach_meal_commit_boundary_test.dart \
            test/features/nutrition/coach_meal_journal_cases.dart \
            test/features/nutrition/meal_vision_premium_review_test.dart \
            test/features/nutrition/meal_vision_flutter_capture_test.dart \
            test/parallel/bil02/coach_media_page_overlay_test.dart \
            test/features/intelligence_center/coach_image_source_regression_test.dart \
            test/features/nutrition/meal_image_language_regression_test.dart
      - name: Flutter Analyze — full source
        run: flutter analyze --no-pub

  p0:
    name: critical (${{ matrix.suite }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - suite: food-owner-atomic
            path: test/features/nutrition/coach_food_commit_test.dart
          - suite: meal-owner-atomic
            path: test/features/nutrition/coach_meal_commit_boundary_test.dart
          - suite: first-food-commit
            path: test/data/repositories/first_food_milestone_commit_test.dart
          - suite: vision-review
            path: test/features/nutrition/meal_vision_premium_review_test.dart
          - suite: vision-capture
            path: test/features/nutrition/meal_vision_flutter_capture_test.dart
          - suite: architecture
            path: test/architecture_source_file_size_guard_test.dart
          - suite: coach-photo-bridge
            path: test/parallel/bil02/coach_media_page_overlay_test.dart
          - suite: coach-image-source
            path: test/features/intelligence_center/coach_image_source_regression_test.dart
          - suite: vision-arabic
            path: test/features/nutrition/meal_image_language_regression_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Isolated P0 suite — never suppress assertion failures
        run: flutter test --no-pub --timeout=3m "${{ matrix.path }}"
      - name: Export actual widget renderings for human review
        if: ${{ always() && matrix.suite == 'vision-capture' }}
        uses: actions/upload-artifact@v4
        with:
          name: bil-p0-vision-png-${{ github.sha }}
          path: build/vision-captures/*.png
          if-no-files-found: ignore
          retention-days: 7

  p0-aggregate:
    name: p0-aggregate
    if: always()
    needs: [source, p0]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and all critical tests to succeed
        env:
          SOURCE: ${{ needs.source.result }}
          P0: ${{ needs.p0.result }}
        run: |
          echo "Source: $SOURCE; P0: $P0"
          test "$SOURCE" = "success"
          test "$P0" = "success"
