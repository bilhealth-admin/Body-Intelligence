name: BIL Codex consolidated mobile candidate QA
on:
  push:
    branches:
      - qa/bil-codex-handoff-candidate-20261018
      - fix/bil-codex-reviewed-mobile-ready-20261018
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Strict committed source formatter
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/community/channels/ \
            lib/features/commerce/repositories/server_entitlement_repository.dart \
            test/features/community/community_channels_safety_action_test.dart \
            test/features/commerce/admin_revocation_verified_free_regression_test.dart \
            test/features/settings/more_premium_polish_contract_test.dart \
            test/features/settings/more_section_headings_test.dart
          git diff --check
      - name: Full source and test analysis
        run: flutter analyze --no-pub
  owner_payments_channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Identity, owner, report, entitlement, Sync and Coach contract matrix
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/community/community_channels_safety_action_test.dart \
            test/features/community/community_chat_auth_session_test.dart \
            test/features/community/community_owner_refresh_transport_test.dart \
            test/features/community/community_policy_acceptance_ui_test.dart \
            test/features/community/community_feed_cache_test.dart \
            test/features/commerce/admin_revocation_verified_free_regression_test.dart \
            test/features/commerce/store_confirmation_journal_test.dart \
            test/features/cloud_platform/cloud_manual_sync_outcome_copy_test.dart \
            test/features/intelligence_center/ai_coach_failure_surface_regression_test.dart
  diary_more:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Saved food, camera/Quick Add, native consent, More and no AI admin route
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/daily_log/diary_search_race_test.dart \
            test/features/daily_log/daily_log_food_add_flow_test.dart \
            test/features/daily_log/meal_detail_add_button_regression_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/features/settings/more_section_headings_test.dart \
            test/features/settings/more_premium_polish_contract_test.dart \
            test/app/router/mobile_admin_removal_contract_test.dart \
            test/shared/widgets/bil_permission_recovery_dialog_test.dart
