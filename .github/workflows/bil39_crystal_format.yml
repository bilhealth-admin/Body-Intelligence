name: Temporary BIL39 Crystal Dart Formatter

on:
  push:
    branches:
      - bil39/crystal-20261025
    paths:
      - .github/workflows/bil39_crystal_format.yml
      - lib/app/theme/bil_navigation_press_style.dart
      - lib/shared/widgets/bil_crystal_arrow.dart
      - lib/shared/widgets/secondary_page_app_bar.dart
      - test/bil_crystal_arrow_test.dart

permissions:
  contents: write

concurrency:
  group: bil39-crystal-format
  cancel-in-progress: false

jobs:
  format-scoped-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format only BIL39 crystal Dart files
        run: dart format lib/app/theme/bil_navigation_press_style.dart lib/shared/widgets/bil_crystal_arrow.dart lib/shared/widgets/secondary_page_app_bar.dart test/bil_crystal_arrow_test.dart
      - name: Commit formatter output only when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/app/theme/bil_navigation_press_style.dart lib/shared/widgets/bil_crystal_arrow.dart lib/shared/widgets/secondary_page_app_bar.dart test/bil_crystal_arrow_test.dart; then
            echo "Scoped Dart files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/app/theme/bil_navigation_press_style.dart lib/shared/widgets/bil_crystal_arrow.dart lib/shared/widgets/secondary_page_app_bar.dart test/bil_crystal_arrow_test.dart
          git commit -m "style: format BIL39 crystal arrow changes"
          git push origin HEAD:bil39/crystal-20261025
