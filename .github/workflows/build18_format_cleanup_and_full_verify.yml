name: build18-format-cleanup-and-full-verify

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build18-format-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out Build 18 candidate
        uses: actions/checkout@v4
        with:
          ref: codex/build18-ai-coach-no-loading-flash-20260913
          fetch-depth: 0

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply Dart formatting to complete source
        shell: pwsh
        run: |
          $targets = @('lib', 'test')
          if (Test-Path integration_test) { $targets += 'integration_test' }
          dart format @targets

      - name: Commit inherited formatting cleanup if needed
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No formatting changes required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if (Test-Path integration_test) { git add integration_test }
          git commit -m "style: normalize inherited Dart formatting before Build 18"
          git push origin HEAD:codex/build18-ai-coach-no-loading-flash-20260913

      - name: Verify formatting is clean
        shell: pwsh
        run: |
          $targets = @('lib', 'test')
          if (Test-Path integration_test) { $targets += 'integration_test' }
          dart format --output=none --set-exit-if-changed @targets

      - name: Analyze complete source
        run: flutter analyze --no-pub

      - name: Run complete test suite including goldens
        run: flutter test --no-pub
