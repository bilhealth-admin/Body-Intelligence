name: BIL RC mobile test builds

on:
  push:
    branches: [fix/community-sapphire-health-3033]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bil-rc-mobile-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6
  BIL_APP_ID: com.bilhealth.bodyintelligencelog
  BIL_TEST_BUILD_NUMBER: '8'

jobs:
  android-emulator-artifact:
    name: Android APK/AAB + emulator evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies and release build contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub             test/launch_readiness/android_release_build_contract_test.dart             test/launch_readiness/system_crypto_export_compliance_contract_test.dart             test/platform_readiness/native_permission_dialog_contract_test.dart             test/launch_readiness/deep_link_exhaustive_source_contract_test.dart             --timeout 5m

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo 'storeFile=app/upload-keystore.jks'
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub             --build-number "$BIL_TEST_BUILD_NUMBER"             --dart-define=BIL_ENVIRONMENT=qa             --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=false             --dart-define=BIL_PAYMENTS_ENABLED=false             --dart-define=BIL_ADS_ENABLED=false

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android native integration and lifecycle matrix
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash -lc '
              set -euo pipefail
              EVIDENCE=artifacts/release/rc_mobile_test/android
              mkdir -p "$EVIDENCE"
              flutter test --no-pub integration_test/system_crypto_bridge_integration_test.dart -d emulator-5554 --timeout 10m
              flutter test --no-pub integration_test/native_settings_polish_test.dart -d emulator-5554 --timeout 10m
              APK=build/app/outputs/flutter-apk/app-debug.apk
              adb install -r "$APK"
              adb shell pm clear "$BIL_APP_ID"
              adb shell monkey -p "$BIL_APP_ID" -c android.intent.category.LAUNCHER 1
              sleep 8
              adb exec-out screencap -p > "$EVIDENCE/01-cold-launch.png"
              adb shell uiautomator dump /sdcard/bil-ui.xml >/dev/null
              adb pull /sdcard/bil-ui.xml "$EVIDENCE/01-cold-launch.xml" >/dev/null
              adb shell am start -W -a android.intent.action.VIEW -d "bil://login"
              sleep 3
              adb exec-out screencap -p > "$EVIDENCE/02-login-deep-link.png"
              adb shell input keyevent 3
              sleep 2
              adb shell am force-stop "$BIL_APP_ID"
              adb shell monkey -p "$BIL_APP_ID" -c android.intent.category.LAUNCHER 1
              sleep 5
              adb exec-out screencap -p > "$EVIDENCE/03-relaunch.png"
              adb shell settings put system accelerometer_rotation 0
              adb shell settings put system user_rotation 1
              sleep 2
              adb exec-out screencap -p > "$EVIDENCE/04-landscape.png"
              adb shell settings put system user_rotation 0
              for PERM in android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.POST_NOTIFICATIONS; do
                adb shell pm revoke "$BIL_APP_ID" "$PERM" || true
                adb shell pm grant "$BIL_APP_ID" "$PERM" || true
              done
              adb logcat -d > "$EVIDENCE/logcat.txt"
              printf "%s\n"                 "ANDROID_EMULATOR_INSTALL=PASS"                 "ANDROID_COLD_LAUNCH=PASS"                 "ANDROID_DEEP_LINK=PASS"                 "ANDROID_BACKGROUND_FORCE_STOP_RELAUNCH=PASS"                 "ANDROID_ROTATION=PASS"                 "ANDROID_NATIVE_CRYPTO=PASS"                 "ANDROID_NATIVE_SETTINGS_UI=PASS"                 > "$EVIDENCE/gate-status.txt"
            '

      - name: Sanitize dev-only Android plugins for release
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=android

      - name: Build Android release AAB for offline inspection only
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub             --build-number "$BIL_TEST_BUILD_NUMBER"             --dart-define=BIL_ENVIRONMENT=production             --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=true             --dart-define=BIL_PAYMENTS_ENABLED=true             --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms             --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy             --dart-define=BIL_MEAL_VISION_ENDPOINT=https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/analyze-meal             --dart-define=BIL_RECIPE_IMAGE_DELIVERY_ENABLED=true             --dart-define=BIL_FACEBOOK_LOGIN_ENABLED=true             --dart-define=BIL_FACEBOOK_LOGIN_READY=true             --dart-define=BIL_PUSH_ENABLED=true             --dart-define=BIL_PUSH_PROVIDER_READY=true             --dart-define=BIL_ADS_ENABLED=false             --dart-define=BIL_AD_PROVIDER_READY=false             --dart-define=BIL_ENABLE_CATALOG_TEST_ACCESS=false

      - name: Inspect Android artifacts
        shell: bash
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          EVIDENCE=artifacts/release/rc_mobile_test/android
          mkdir -p "$EVIDENCE"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          sha256sum "$APK" "$AAB" > "$EVIDENCE/SHA256SUMS.txt"
          stat --printf='%n %s\n' "$APK" "$AAB" > "$EVIDENCE/sizes.txt"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          printf 'ANDROID_RELEASE_SIGNING=%s\n' "$SIGNING_AVAILABLE" > "$EVIDENCE/signing-status.txt"
          if [[ "$SIGNING_AVAILABLE" == 'true' ]]; then
            jarsigner -verify -verbose -certs "$AAB" > "$EVIDENCE/jarsigner.txt"
            echo 'SIGNED_AAB_VERIFY=PASS' >> "$EVIDENCE/signing-status.txt"
          else
            echo 'SIGNED_AAB_VERIFY=NOT_RUN_MISSING_SIGNING_SECRETS' >> "$EVIDENCE/signing-status.txt"
          fi

      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bil-rc-android-test-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
            artifacts/release/rc_mobile_test/android
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties

  ios-simulator-artifact:
    name: iOS simulator + unsigned IPA evidence
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies and iOS contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub             test/platform_readiness/native_permission_dialog_contract_test.dart             test/connected_health/apple_health_permission_flow_test.dart             test/features/notifications/apple_notification_permission_timing_test.dart             test/launch_readiness/deep_link_exhaustive_source_contract_test.dart             --timeout 10m
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerDebug.entitlements

      - name: Build iOS simulator application
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-codesign --no-pub             --build-number "$BIL_TEST_BUILD_NUMBER"             --dart-define=BIL_ENVIRONMENT=qa             --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=false             --dart-define=BIL_PAYMENTS_ENABLED=false             --dart-define=BIL_ADS_ENABLED=false
          test -d build/ios/iphonesimulator/Runner.app

      - name: Build unsigned production-shaped iOS device application
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub             --build-number "$BIL_TEST_BUILD_NUMBER"             --dart-define=BIL_ENVIRONMENT=production             --dart-define=BIL_MOBILE_INTEGRITY_REQUIRED=true             --dart-define=BIL_PAYMENTS_ENABLED=true             --dart-define=BIL_TERMS_URL=https://www.bilhealth.com/terms             --dart-define=BIL_PRIVACY_URL=https://www.bilhealth.com/privacy             --dart-define=BIL_MEAL_VISION_ENDPOINT=https://tgmanzhqulksykhslrzb.supabase.co/functions/v1/analyze-meal             --dart-define=BIL_RECIPE_IMAGE_DELIVERY_ENABLED=true             --dart-define=BIL_FACEBOOK_LOGIN_ENABLED=true             --dart-define=BIL_FACEBOOK_LOGIN_READY=true             --dart-define=BIL_PUSH_ENABLED=true             --dart-define=BIL_PUSH_PROVIDER_READY=true             --dart-define=BIL_ADS_ENABLED=false             --dart-define=BIL_AD_PROVIDER_READY=false             --dart-define=BIL_ENABLE_CATALOG_TEST_ACCESS=false
          test -d build/ios/iphoneos/Runner.app
          rm -rf Payload BIL-unsigned-RC.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry BIL-unsigned-RC.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent             build/ios/iphonesimulator/Runner.app             build/ios/iphonesimulator/BIL-RC-Simulator.app.zip

      - name: Install checksum-locked iOS interaction bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bil-idb-bin"
          curl --fail --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz \
            --output "$RUNNER_TEMP/idb-companion.tar.gz"
          test "$(shasum -a 256 "$RUNNER_TEMP/idb-companion.tar.gz" | awk '{print $1}')" \
            = '3b72cc6a9a5b1a22a188205a84090d3a294347a846180efd755cf1a3c848e3e7'
          tar -xzf "$RUNNER_TEMP/idb-companion.tar.gz" -C "$RUNNER_TEMP/bil-idb-bin"
          chmod +x "$RUNNER_TEMP/bil-idb-bin/idb-companion.universal/bin/idb_companion"
          brew install python@3.11
          "$(brew --prefix python@3.11)/bin/python3.11" -m venv "$RUNNER_TEMP/bil-idb-venv"
          "$RUNNER_TEMP/bil-idb-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r tool/release/ios_plus8_idb_requirements.lock
          "$RUNNER_TEMP/bil-idb-venv/bin/python" -m pip check
          "$RUNNER_TEMP/bil-idb-venv/bin/idb" --help >/dev/null
          echo "$RUNNER_TEMP/bil-idb-bin/idb-companion.universal/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bil-idb-venv/bin" >> "$GITHUB_PATH"

      - name: Create iPhone and iPad simulator sessions
        id: sims
        shell: bash
        run: |
          set -euo pipefail
          read -r RUNTIME IPHONE_TYPE IPAD_TYPE < <(python3 - <<'PY'
          import json, re, subprocess
          runtimes=json.loads(subprocess.check_output(
              ['xcrun','simctl','list','runtimes','available','-j']
          ))['runtimes']
          ios=[r for r in runtimes if r.get('isAvailable') and
               r.get('identifier','').startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime')
          def version(r):
              return tuple(int(x) for x in re.findall(r'\d+', r.get('version','0')))
          runtime=max(ios,key=version)
          types=json.loads(subprocess.check_output(
              ['xcrun','simctl','list','devicetypes','-j']
          ))['devicetypes']
          iphones=[d for d in types if d['name'].startswith('iPhone')]
          ipads=[d for d in types if d['name'].startswith('iPad')]
          def preferred(items, names):
              by_name={item['name']: item for item in items}
              for name in names:
                  if name in by_name:
                      return by_name[name]
              return None
          iphone=preferred(iphones, [
              'iPhone 17 Pro',
              'iPhone 17',
              'iPhone 16 Pro',
              'iPhone 16',
              'iPhone 15 Pro',
          ])
          ipad=preferred(ipads, [
              'iPad Pro 13-inch (M4)',
              'iPad Pro (13-inch) (M4)',
              'iPad Pro 11-inch (M4)',
              'iPad Pro (11-inch) (M4)',
              'iPad Pro (12.9-inch) (6th generation)',
          ])
          if iphone is None or ipad is None:
              raise SystemExit('No audited modern iPhone/iPad simulator type is available')
          print(runtime['identifier'], iphone['identifier'], ipad['identifier'])
          PY
          )
          IPHONE="$(xcrun simctl create "BIL-RC-iPhone-${GITHUB_RUN_ID}" "$IPHONE_TYPE" "$RUNTIME")"
          IPAD="$(xcrun simctl create "BIL-RC-iPad-${GITHUB_RUN_ID}" "$IPAD_TYPE" "$RUNTIME")"
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          for UDID in "$IPHONE" "$IPAD"; do
            xcrun simctl erase "$UDID"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance light
            if ! xcrun simctl status_bar "$UDID" override \
              --time 09:41 --batteryState charged --batteryLevel 100 \
              --wifiBars 3 --cellularBars 4; then
              echo 'Status-bar normalization unavailable; runtime evidence remains valid.'
            fi
            xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          done

      - name: Run iOS native integration tests
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.sims.outputs.iphone }}
        run: |
          set -euo pipefail
          flutter test --no-pub             integration_test/system_crypto_bridge_integration_test.dart             -d "$IPHONE_UDID" --timeout 10m
          flutter test --no-pub             integration_test/native_settings_polish_test.dart             -d "$IPHONE_UDID" --timeout 10m

      - name: Reinstall QA app after integration harness
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.sims.outputs.iphone }}
          IPAD_UDID: ${{ steps.sims.outputs.ipad }}
        run: |
          set -euo pipefail
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl uninstall "$UDID" "$BIL_APP_ID" >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
            xcrun simctl get_app_container "$UDID" "$BIL_APP_ID" app >/dev/null
          done

      - name: Run verified iPhone and iPad lifecycle/deep-link matrix
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.sims.outputs.iphone }}
          IPAD_UDID: ${{ steps.sims.outputs.ipad }}
        run: |
          set -euo pipefail
          EVIDENCE=artifacts/release/rc_mobile_test/ios
          export PRIVATE_UI_DIR="$RUNNER_TEMP/bil-rc-lifecycle-accessibility"
          rm -rf "$PRIVATE_UI_DIR"
          mkdir -p "$EVIDENCE/iphone" "$EVIDENCE/ipad" "$PRIVATE_UI_DIR"
          source tool/release/ios_plus8_simulator_ui/accessibility.sh
          LIFECYCLE_START="$RUNNER_TEMP/bil-rc-lifecycle-start"
          touch "$LIFECYCLE_START"

          exact_open_button_center() {
            local udid="$1"
            tree_for "$udid"
            python3 - "$PRIVATE_UI_DIR/$udid.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          stack = list(payload if isinstance(payload, list) else [payload])
          matches = []
          while stack:
              item = stack.pop()
              if not isinstance(item, dict):
                  continue
              for value in item.values():
                  if isinstance(value, dict):
                      stack.append(value)
                  elif isinstance(value, list):
                      stack.extend(value)
              values = [
                  str(item.get(key) or '').strip()
                  for key in ('AXLabel', 'AXValue', 'title', 'value', 'label')
              ]
              frame = item.get('frame')
              if 'Open' not in values or not isinstance(frame, dict):
                  continue
              width = float(frame.get('width', 0))
              height = float(frame.get('height', 0))
              if width <= 0 or height <= 0:
                  continue
              matches.append((
                  float(frame.get('x', 0)) + width / 2,
                  float(frame.get('y', 0)) + height / 2,
                  width * height,
              ))
          if not matches:
              raise SystemExit('exact_open_button_missing')
          x, y, _ = min(matches, key=lambda item: item[2])
          print(round(x), round(y))
          PY
          }

          dismiss_scheme_confirmation() {
            local udid="$1"
            if has_marker "$udid" 'Open in'; then
              local point
              point="$(exact_open_button_center "$udid")"
              read -r x y <<< "$point"
              idb ui tap --udid "$udid" "$x" "$y"
              sleep 4
            fi
            if has_marker "$udid" 'Open in'; then
              echo 'iOS custom-scheme confirmation remained visible after Open.' >&2
              return 1
            fi
          }

          save_accessibility() {
            local udid="$1"
            local target="$2"
            tree_for "$udid"
            cp "$PRIVATE_UI_DIR/$udid.json" "$target"
            test -s "$target"
          }

          capture_verified() {
            local udid="$1"
            local dir="$2"
            local stem="$3"
            if has_marker "$udid" 'Open in'; then
              echo "System Open confirmation obscured $stem." >&2
              return 1
            fi
            xcrun simctl io "$udid" screenshot "$dir/$stem.png"
            save_accessibility "$udid" "$dir/$stem-accessibility.json"
            test -s "$dir/$stem.png"
          }

          wait_gateway() {
            wait_marker "$1" 'Continue without an account' 60
            if has_marker "$1" 'BODY INTELLIGENCE LOG' && ! has_marker "$1" 'Continue without an account'; then
              echo 'Startup remained on the splash surface.' >&2
              return 1
            fi
          }

          open_verified_link() {
            local udid="$1"
            local url="$2"
            xcrun simctl openurl "$udid" "$url"
            sleep 3
            dismiss_scheme_confirmation "$udid"
          }

          exercise_device() {
            local name="$1"
            local udid="$2"
            local dir="$EVIDENCE/$name"

            xcrun simctl launch "$udid" "$BIL_APP_ID" \
              -AppleLanguages '(en)' -AppleLocale 'en_US' \
              | tee "$dir/launch.txt"
            wait_gateway "$udid"
            capture_verified "$udid" "$dir" '01-cold-account-gateway'

            open_verified_link "$udid" 'bil://login'
            wait_marker "$udid" 'Store reviewer access' 30
            wait_marker "$udid" 'Email address' 30
            capture_verified "$udid" "$dir" '02-login-deep-link'

            open_verified_link "$udid" 'bil://connected-health'
            wait_marker "$udid" 'Apps & Devices' 30
            wait_marker "$udid" 'Health Hub' 30
            capture_verified "$udid" "$dir" '03-connected-health-deep-link'

            xcrun simctl terminate "$udid" "$BIL_APP_ID"
            xcrun simctl launch "$udid" "$BIL_APP_ID" \
              -AppleLanguages '(en)' -AppleLocale 'en_US' \
              | tee "$dir/relaunch.txt"
            wait_gateway "$udid"
            capture_verified "$udid" "$dir" '04-terminate-relaunch'

            xcrun simctl ui "$udid" appearance dark
            sleep 2
            wait_gateway "$udid"
            capture_verified "$udid" "$dir" '05-dark-account-gateway'

            xcrun simctl ui "$udid" appearance light
            xcrun simctl ui "$udid" content_size accessibility-extra-extra-extra-large
            sleep 2
            wait_gateway "$udid"
            capture_verified "$udid" "$dir" '06-large-text-account-gateway'

            xcrun simctl get_app_container "$udid" "$BIL_APP_ID" app >/dev/null
            xcrun simctl spawn "$udid" log show \
              --style compact --last 8m \
              --predicate 'process == "Runner"' \
              > "$dir/runner.log" || true
            if grep -Eiq \
              'Unhandled Exception|RenderFlex overflowed|EXC_CRASH|SIGABRT|fatal error' \
              "$dir/runner.log"; then
              echo "Runner runtime error marker found for $name." >&2
              return 1
            fi
          }

          exercise_device iphone "$IPHONE_UDID"
          exercise_device ipad "$IPAD_UDID"

          CRASHES="$(find "$HOME/Library/Logs/DiagnosticReports" \
            -maxdepth 1 -type f -name 'Runner*' -newer "$LIFECYCLE_START" -print)"
          test -z "$CRASHES" || {
            echo 'Runner crash report detected during verified lifecycle matrix.' >&2
            printf '%s\n' "$CRASHES" >&2
            exit 1
          }

          xcodebuild -version > "$EVIDENCE/xcode-version.txt"
          xcrun simctl list runtimes available > "$EVIDENCE/runtimes.txt"
          shasum -a 256 BIL-unsigned-RC.ipa \
            build/ios/iphonesimulator/BIL-RC-Simulator.app.zip \
            > "$EVIDENCE/SHA256SUMS.txt"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          printf '%s\n' \
            'IOS_SIMULATOR_BUILD=PASS' \
            'IOS_UNSIGNED_DEVICE_BUILD=PASS_TEST_ONLY_EXPECTED_NO_CODESIGN' \
            'IOS_IPHONE_COLD_ACCOUNT_GATEWAY=PASS' \
            'IOS_IPAD_COLD_ACCOUNT_GATEWAY=PASS' \
            'IOS_CUSTOM_SCHEME_CONFIRMATION_HANDLED=PASS' \
            'IOS_LOGIN_DEEP_LINK_ACTUAL_PAGE=PASS' \
            'IOS_CONNECTED_HEALTH_DEEP_LINK_ACTUAL_PAGE=PASS' \
            'IOS_TERMINATE_RELAUNCH_ACTUAL_PAGE=PASS' \
            'IOS_DARK_MODE_ACTUAL_APP_UI=PASS' \
            'IOS_LARGE_TEXT_ACTUAL_APP_UI=PASS' \
            'IOS_ACCESSIBILITY_TREES=PASS' \
            'IOS_RUNTIME_CRASH_SCAN=PASS' \
            'IOS_NATIVE_CRYPTO=PASS' \
            'IOS_NATIVE_SETTINGS_UI=PASS' \
            'IOS_SCREENSHOT_DISPLAY=DEFAULT_LCD' \
            'IOS_IPAD_LANDSCAPE_RUNTIME=NOT_CLAIMED_WIDGET_CONTRACT_ONLY' \
            'IOS_APP_ATTEST_GENUINE=PHYSICAL_DEVICE_REQUIRED' \
            'IOS_HEALTHKIT_GENUINE=PHYSICAL_DEVICE_REQUIRED' \
            'IOS_STOREKIT_SANDBOX_GENUINE=PHYSICAL_DEVICE_OR_STORE_SANDBOX_REQUIRED' \
            > "$EVIDENCE/gate-status.txt"

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bil-rc-ios-test-${{ github.sha }}
          path: |
            BIL-unsigned-RC.ipa
            build/ios/iphonesimulator/BIL-RC-Simulator.app.zip
            artifacts/release/rc_mobile_test/ios
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable simulators
        if: always()
        shell: bash
        env:
          IPHONE_UDID: ${{ steps.sims.outputs.iphone }}
          IPAD_UDID: ${{ steps.sims.outputs.ipad }}
        run: |
          set +e
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            [[ -z "${UDID:-}" ]] && continue
            xcrun simctl terminate "$UDID" "$BIL_APP_ID"
            xcrun simctl uninstall "$UDID" "$BIL_APP_ID"
            xcrun simctl shutdown "$UDID"
            xcrun simctl delete "$UDID"
          done
          rm -rf Payload
