name: BIL Google signed RC native recording only
run-name: "Google recording only; signed Android33 ${{ inputs.expected_source_sha }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact final Android33 source SHA, not capture-control SHA
        required: true
        type: string
      signed_run_id:
        description: Successful bil_android_release_candidate.yml run ID
        required: true
        type: string
      signed_artifact_id:
        description: Exact non-expired signed AAB artifact ID from that run
        required: true
        type: string
      synthetic_account_ack:
        description: Enter DEDICATED_REVIEW_ACCOUNT_ONLY
        required: true
        type: string
      expected_reviewer_email_sha256:
        description: SHA256 of normalized approved Google reviewer email; prevents using a purchase-test account
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: bil-google-native-capture
  cancel-in-progress: false
jobs:
  record-real-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout audited capture control only; do not build BIL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require dedicated Google review credentials without exporting them
        env:
          REVIEWER_EMAIL: ${{ secrets.BIL_GOOGLE_REVIEWER_EMAIL }}
          REVIEWER_PASSWORD: ${{ secrets.BIL_GOOGLE_REVIEWER_PASSWORD }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          ACK: ${{ inputs.synthetic_account_ack }}
          EXPECTED_EMAIL_SHA256: ${{ inputs.expected_reviewer_email_sha256 }}
        run: |
          python3 - <<'PY'
          import os,hashlib,re
          assert os.environ.get('ACK') == 'DEDICATED_REVIEW_ACCOUNT_ONLY', 'Dedicated synthetic account acknowledgement is required'
          assert os.environ.get('REVIEWER_EMAIL') and len(os.environ.get('REVIEWER_PASSWORD','')) >= 8, 'Dedicated Google reviewer secrets are missing'
          assert os.environ.get('EXPECTED_UPLOAD_CERT_SHA256'), 'Expected upload certificate fingerprint is missing'
          expected=os.environ.get('EXPECTED_EMAIL_SHA256','')
          assert re.fullmatch('[a-f0-9]{64}',expected) and hashlib.sha256(os.environ['REVIEWER_EMAIL'].strip().lower().encode()).hexdigest()==expected, 'Configured identity differs from the approved Google reviewer; do not substitute a purchase-test or Apple account'
          print('DEDICATED_GOOGLE_REVIEWER_SECRET_PRESENCE=PASS;credentials_exported=false')
          PY
      - name: Verify existing signed RC Android job and derive APK without recompilation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$SOURCE_SHA" = 1b23d4d4bb73d467f9c3cf1425b2eb2d8cc78c2d
          python3 tools/qa/google_native_capture/prepare_verified_rc.py
      - name: Verify real APK signature and package before emulator access
        env:
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/bil-google-signed-input/BIL-Android33-derived-universal.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/bil-google-signed-input/verified-apk-signature.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$RUNNER_TEMP/bil-google-signed-input/verified-apk-manifest.xml"
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil-google-signed-input'
          signatures=re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F:]+)',(p/'verified-apk-signature.txt').read_text(),re.M)
          assert signatures and {x.replace(':','').lower() for x in signatures}=={os.environ['EXPECTED_UPLOAD_CERT_SHA256'].replace(':','').lower()}, 'APK signing certificate mismatch'
          import sys
          sys.path.insert(0,'tools/qa/google_native_capture')
          from native_capture import validate_manifest
          validate_manifest((p/'verified-apk-manifest.xml').read_text())
          PY
      - name: Install SHA512-pinned static native-video probe
        timeout-minutes: 3
        run: python3 tools/qa/google_native_capture/install_capture_probe.py
      - name: Enable disposable hosted KVM only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record actual native reviewer route; preserve honest blocking state
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          BIL_GOOGLE_REVIEWER_EMAIL: ${{ secrets.BIL_GOOGLE_REVIEWER_EMAIL }}
          BIL_GOOGLE_REVIEWER_PASSWORD: ${{ secrets.BIL_GOOGLE_REVIEWER_PASSWORD }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          BIL_CAPTURE_SYNTHETIC_ACCOUNT_ACK: ${{ inputs.synthetic_account_ack }}
          BIL_EXPECTED_REVIEWER_EMAIL_SHA256: ${{ inputs.expected_reviewer_email_sha256 }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none
          script: python3 tools/qa/google_native_capture/native_capture.py capture --source "$SOURCE_SHA" --inputs "$RUNNER_TEMP/bil-google-signed-input" --output artifacts/google-native-capture --serial emulator-5554
      - name: Preserve restricted native recording and sanitized receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-google-native-recording-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/google-native-capture/assets/raw/*.mp4
            artifacts/google-native-capture/*.json
            artifacts/google-native-capture/*.xml
            ${{ runner.temp }}/bil-google-signed-input/producer-identity.json
            ${{ runner.temp }}/bil-google-signed-input/BIL-android-recording-apk-receipt.json
      - name: Summarize boundary
        if: always()
        run: |
          printf '%s\n' 'Native recording may be partial or blocked. No final video, Play delivery, billing, Integrity recognition or appeal submission is certified by this job.' >> "$GITHUB_STEP_SUMMARY"
