name: BIL iOS 36 verified IPA to TestFlight (one-shot)

# Explicit owner-directed TestFlight submission. No new app build, full suite,
# branch promotion, Production changes, or Google Play upload.
on:
  push:
    branches:
      - fix/rc33-36-commerce-fixtures-20261016
    paths:
      - .github/workflows/bil_ios36_upload_verified_ipa_to_testflight.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: bil-ios36-one-shot-testflight-submission
  cancel-in-progress: false

jobs:
  await-signed-candidate:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/fix/rc33-36-commerce-fixtures-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Wait for exact existing iOS 36 signed build to complete successfully
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: '38842962877'
          SIGNED_WORKFLOW_SHA: '3d2fd915324288948971e77029fd49febf7cef5f'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN" \
              --jq '[.status, (.conclusion // "null"), .head_sha, .head_branch, .event] | join("|")')"
            IFS='|' read -r STATUS CONCLUSION HEAD_SHA HEAD_BRANCH EVENT <<< "$RESPONSE"
            test "$HEAD_SHA" = "$SIGNED_WORKFLOW_SHA" || { echo 'Signed build workflow SHA mismatch'; exit 1; }
            test "$HEAD_BRANCH" = 'fix/rc33-36-commerce-fixtures-20261016' || { echo 'Signed build branch mismatch'; exit 1; }
            test "$EVENT" = 'push' || { echo 'Signed build event mismatch'; exit 1; }
            if [[ "$STATUS" == 'completed' ]]; then
              [[ "$CONCLUSION" == 'success' ]] || { echo "Signed iOS build did not pass: $CONCLUSION"; exit 1; }
              echo "Existing validated signed IPA build is successful: $SIGNED_RUN"
              exit 0
            fi
            sleep 30
          done
          echo 'Signed build did not complete within the bounded wait'; exit 1

  deliver-validated-ipa:
    needs: await-signed-candidate
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Download IPA evidence from exactly the accepted signed run
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: '38842962877'
          AUDITED_SOURCE: 'a6f0a9a15188aabca0dcb739269ab17079ed4504'
          EXPECTED_ARTIFACT: 'bil-ios-signed-ipa-a6f0a9a15188aabca0dcb739269ab17079ed4504'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bil-ios36-testflight"
          gh run download "$SIGNED_RUN" \
            -R "$GITHUB_REPOSITORY" \
            --name "$EXPECTED_ARTIFACT" \
            --dir "$RUNNER_TEMP/bil-ios36-testflight"
          cd "$RUNNER_TEMP/bil-ios36-testflight"
          test -s BIL-source-head.txt
          test "$(tr -d '\r\n' < BIL-source-head.txt)" = "$AUDITED_SOURCE" || { echo 'IPA audited source does not match'; exit 1; }
          test "$(tr -d '\r\n' < BIL-build-number.txt)" = 'BUILD_NUMBER=36' || { echo 'IPA build number is not 36'; exit 1; }
          test -s BIL-ios-codesign-verify.txt
          grep -Fq 'SIGNED_IPA_CODESIGN_GATE=PASS' BIL-ios-codesign-verify.txt
          test -s BIL-ios-crypto-scan.txt
          grep -Fq 'SIGNED_IPA_FORBIDDEN_CRYPTO_MARKERS=0' BIL-ios-crypto-scan.txt
          test -s BIL-ios-gate-status.txt
          grep -Fqx 'CODE_GATE=PASS' BIL-ios-gate-status.txt
          mapfile_ipa="$(find . -type f -name '*.ipa' -print)"
          test "$(printf '%s\n' "$mapfile_ipa" | sed '/^$/d' | wc -l | tr -d ' ')" = '1' || { echo 'Expected exactly one IPA'; exit 1; }
          test -s "$mapfile_ipa"
          EXPECTED_SHA="$(awk 'NR==1 {print $1}' BIL-ios-ipa.sha256)"
          ACTUAL_SHA="$(shasum -a 256 "$mapfile_ipa" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA" || { echo 'Signed IPA SHA256 mismatch'; exit 1; }
          EXPECTED_SIZE="$(tr -d '\r\n ' < BIL-ios-ipa.size)"
          ACTUAL_SIZE="$(stat -f '%z' "$mapfile_ipa")"
          test -n "$EXPECTED_SIZE" && test "$EXPECTED_SIZE" = "$ACTUAL_SIZE" || { echo 'Signed IPA size mismatch'; exit 1; }
          printf '%s\n' 'SIGNED_IPA_ARTIFACT_SOURCE_AND_SHA256=PASS' 'TARGET=TESTFLIGHT_ONLY' \
            "SIGNED_RUN=$SIGNED_RUN" "AUDITED_SOURCE=$AUDITED_SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate with App Store Connect and upload iOS 36 to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "${ASC_KEY_ID:-}" =~ ^[A-Z0-9]+$ ]] || { echo 'App Store Connect key ID unavailable or invalid'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'App Store Connect issuer ID missing'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'App Store Connect private key missing'; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          python3 - "$KEY_PATH" <<'PY'
          import base64
          import os
          import pathlib
          import sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'], validate=True))
          PY
          chmod 600 "$KEY_PATH"
          IPA="$(find "$RUNNER_TEMP/bil-ios36-testflight" -type f -name '*.ipa' -print -quit)"
          test -s "$IPA"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'iOS build 36 accepted for upload by App Store Connect; processing and TestFlight availability are Apple-controlled.' >> "$GITHUB_STEP_SUMMARY"
