name: BIL public site deploy

on:
  workflow_dispatch:
  push:
    branches:
      - fix/community-sapphire-health-3033
    paths:
      - 'public_site/**'
      - 'wrangler.site.jsonc'
      - 'tool/release/bilhealth_site_worker.mjs'
      - '.github/workflows/bil_public_site_deploy.yml'

permissions:
  contents: read

concurrency:
  group: bil-public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'OWNER_INPUT_REQUIRED: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'OWNER_INPUT_REQUIRED: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Validate app-ads authorization
        shell: bash
        run: |
          set -euo pipefail
          expected='google.com, pub-2630393550537588, DIRECT, f08c47fec0942fa0'
          actual="$(tr -d '\r' < public_site/app-ads.txt | sed '/^[[:space:]]*$/d')"
          test "$actual" = "$expected" || {
            echo 'app-ads.txt does not match the owner-confirmed AdMob publisher record.' >&2
            exit 1
          }

      - name: Preserve current production app-link association documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_site/.well-known
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          candidates = (
              'https://www.bilhealth.com',
              'https://bilhealth.com',
          )
          required = (
              'apple-app-site-association',
              'assetlinks.json',
          )

          chosen = None
          payloads = {}
          for base in candidates:
              current = {}
              ok = True
              for name in required:
                  url = f'{base}/.well-known/{name}'
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={'User-Agent': 'BIL-release-verifier/1.0'},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200 or response.geturl() != url:
                              ok = False
                              break
                          body = response.read()
                          parsed = json.loads(body.decode('utf-8'))
                          if not isinstance(parsed, (dict, list)):
                              ok = False
                              break
                          current[name] = body
                  except Exception:
                      ok = False
                      break
              if ok:
                  chosen = base
                  payloads = current
                  break

          if chosen is None:
              raise SystemExit(
                  'LIVE_ASSOCIATION_PRESERVATION_FAILED: current production '
                  '.well-known files could not be read directly; refusing deploy.'
              )

          root = pathlib.Path('public_site/.well-known')
          for name, body in payloads.items():
              (root / name).write_bytes(body)

          pathlib.Path('/tmp/bil-site-origin.txt').write_text(chosen + '\n')
          print(f'LIVE_ASSOCIATION_SOURCE={chosen}')
          print('LIVE_ASSOCIATION_PRESERVATION=PASS')
          PY

      - name: Verify site worker contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/release/generate_app_link_associations.py --self-test
          node --test tool/release/bilhealth_site_worker.test.mjs

      - name: Deploy bilhealth.com static assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config wrangler.site.jsonc

      - name: Verify production app-ads and preserved associations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request

          base = pathlib.Path('/tmp/bil-site-origin.txt').read_text().strip()
          expected_ads = b'google.com, pub-2630393550537588, DIRECT, f08c47fec0942fa0\n'
          well_known = pathlib.Path('public_site/.well-known')

          def get_direct(url):
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'BIL-release-verifier/1.0'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200 or response.geturl() != url:
                      raise RuntimeError(f'non-direct response for {url}')
                  return response.headers, response.read()

          last_error = None
          for attempt in range(12):
              try:
                  _, ads = get_direct(f'{base}/app-ads.txt')
                  if ads.replace(b'\r\n', b'\n') != expected_ads:
                      raise RuntimeError('app-ads.txt content mismatch')
                  for name in ('apple-app-site-association', 'assetlinks.json'):
                      headers, body = get_direct(f'{base}/.well-known/{name}')
                      json.loads(body.decode('utf-8'))
                      local = (well_known / name).read_bytes()
                      if hashlib.sha256(body).digest() != hashlib.sha256(local).digest():
                          raise RuntimeError(f'{name} changed during deploy')
                  print('PUBLIC_SITE_DEPLOYMENT_VERIFICATION=PASS')
                  raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  if attempt == 11:
                      break
                  time.sleep(10)

          raise SystemExit(f'PUBLIC_SITE_DEPLOYMENT_VERIFICATION=FAIL: {last_error}')
          PY
