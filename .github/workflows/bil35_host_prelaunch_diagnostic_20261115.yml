name: BIL35 credential-free prelaunch diagnostic
run-name: "SDK prelaunch cause only; no app, login, guest boot or rebuild"
on:
  push:
    branches: [codex/bil35-host-diagnostic-20261115]
permissions:
  contents: read
concurrency:
  group: bil35-host-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prelaunch-cause:
    if: github.repository == 'bilhealth-admin/Body-Intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require isolated credential-free diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_OS" = Linux
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = bilhealth-admin/Body-Intelligence
          test "$GITHUB_REF_NAME" = codex/bil35-host-diagnostic-20261115
          test -z "${BIL_GOOGLE_REVIEWER_EMAIL+x}"
          test -z "${BIL_GOOGLE_REVIEWER_PASSWORD+x}"
          mkdir -p artifacts/host-prelaunch-safe
      - name: Prepare frozen diagnostic bytes 1 of 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_DIAGNOSTIC_TRANSPORT'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          def check(value):
              if not value: raise ValueError('DIAGNOSTIC_TRANSPORT_INTEGRITY_FAILED')
          records = json.loads("[{\"name\":\"pinned_emulator_install.py\",\"raw_bytes\":13918,\"raw_sha256\":\"2866a426da596012d20a88750f441238c8123c11469d1c6ba9d83350998d2195\",\"compressed_base64\":\"\",\"compressed_sha256\":\"4b1f4d0037e343ae0c3dedba2aca002bdcb42ff29b9f814140da9c9caebff44b\"},{\"name\":\"read_only_emulator_host.py\",\"raw_bytes\":7355,\"raw_sha256\":\"7e89dcf27db83d6f774a93375e41b6c988248e7c09f693d155e8221011306354\",\"compressed_base64\":\"\",\"compressed_sha256\":\"c6875a7db522ff8915833ea9aab741923f1fd6c9f5118cc57b03d0851e0819f9\"}]")
          allowed = ('pinned_emulator_install.py', 'read_only_emulator_host.py')
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          check(root.is_dir())
          prepared, seen = [], set()
          for record in records:
              check(set(record) == {'name','raw_bytes','raw_sha256','compressed_base64','compressed_sha256'})
              name = record['name']
              check(name in allowed and name not in seen)
              seen.add(name)
              check(type(record['raw_bytes']) is int and 0 < record['raw_bytes'] <= 512 * 1024)
              compressed = base64.b64decode(record['compressed_base64'], validate=True)
              check(hashlib.sha256(compressed).hexdigest() == record['compressed_sha256'])
              decoder = zlib.decompressobj()
              raw = decoder.decompress(compressed, record['raw_bytes'] + 1)
              check(decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail)
              check(len(raw) == record['raw_bytes'])
              check(hashlib.sha256(raw).hexdigest() == record['raw_sha256'])
              path = root / name
              check(not path.exists() and not path.is_symlink())
              prepared.append((path, raw))
          check(seen == set(allowed))
          for path, raw in prepared:
              with path.open('xb') as output: output.write(raw)
          PY_DIAGNOSTIC_TRANSPORT
      - name: Prepare frozen diagnostic bytes 2 of 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_DIAGNOSTIC_TRANSPORT'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          def check(value):
              if not value: raise ValueError('DIAGNOSTIC_TRANSPORT_INTEGRITY_FAILED')
          records = json.loads("[{\"name\":\"pinned_emulator_guard.py\",\"raw_bytes\":7092,\"raw_sha256\":\"e63c4d7f4b31613aa2c45eae9a7218aee7e1b6a82b52af7bffc5244128c79795\",\"compressed_base64\":\"\",\"compressed_sha256\":\"106796bcc8a3bad06fb51cc98830854a60db1d60c08dd1db3a5eae61ccf53221\"},{\"name\":\"diagnose_prelaunch.py\",\"raw_bytes\":7739,\"raw_sha256\":\"f397caa7c0e028ff505e38e94661792fbf0c4e564a3ffec02255b5856d518b59\",\"compressed_base64\":\"\",\"compressed_sha256\":\"73875a35b005120a7dfd1dd0c98c4e366df5bae8d1e4aad4e20d53a764334205\"}]")
          allowed = ('pinned_emulator_guard.py', 'diagnose_prelaunch.py')
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          check(root.is_dir())
          prepared, seen = [], set()
          for record in records:
              check(set(record) == {'name','raw_bytes','raw_sha256','compressed_base64','compressed_sha256'})
              name = record['name']
              check(name in allowed and name not in seen)
              seen.add(name)
              check(type(record['raw_bytes']) is int and 0 < record['raw_bytes'] <= 512 * 1024)
              compressed = base64.b64decode(record['compressed_base64'], validate=True)
              check(hashlib.sha256(compressed).hexdigest() == record['compressed_sha256'])
              decoder = zlib.decompressobj()
              raw = decoder.decompress(compressed, record['raw_bytes'] + 1)
              check(decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail)
              check(len(raw) == record['raw_bytes'])
              check(hashlib.sha256(raw).hexdigest() == record['raw_sha256'])
              path = root / name
              check(not path.exists() and not path.is_symlink())
              prepared.append((path, raw))
          check(seen == set(allowed))
          for path, raw in prepared:
              with path.open('xb') as output: output.write(raw)
          PY_DIAGNOSTIC_TRANSPORT
      - name: Provide the original SDK emulator prerequisite without creating a guest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SDK_PREREQUISITE'
          import json, os, pathlib, subprocess, sys
          env = dict(os.environ)
          if not (sys.platform == 'linux' and env.get('GITHUB_ACTIONS') == 'true'
                  and env.get('RUNNER_OS') == 'Linux'
                  and env.get('GITHUB_REPOSITORY') == 'bilhealth-admin/Body-Intelligence'
                  and env.get('GITHUB_EVENT_NAME') == 'push'
                  and not any(key in env for key in ('BIL_GOOGLE_REVIEWER_EMAIL', 'BIL_GOOGLE_REVIEWER_PASSWORD'))):
              print('SDK_PREREQUISITE_CREDENTIAL_FREE_CI_SCOPE_REQUIRED')
              raise SystemExit(1)
          try:
              sdk = pathlib.Path(env['ANDROID_HOME']).resolve(strict=True)
              expected = pathlib.Path('/usr/local/lib/android/sdk').resolve(strict=True)
              if not sdk.is_dir() or sdk != expected:
                  raise ValueError('SDK_ROOT_NOT_CANONICAL')
              target = sdk / 'emulator' / 'emulator'
              already_present = target.is_file()
              code = None
              if not already_present:
                  manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
                  if not manager.is_file() or not manager.resolve(strict=True).is_relative_to(sdk):
                      raise ValueError('SDK_MANAGER_NOT_SCOPED')
                  process = subprocess.run([str(manager), '--install', 'emulator'],
                      env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, timeout=180, check=False)
                  code = process.returncode
                  if code != 0:
                      print(json.dumps({'status':'SDK_EMULATOR_PREREQUISITE_BLOCKED','returncode':code}))
                      raise SystemExit(1)
              if not target.is_file():
                  raise ValueError('SDK_EMULATOR_PREREQUISITE_MISSING')
              print(json.dumps({'status':'SDK_EMULATOR_PREREQUISITE_PRESENT',
                  'already_present':already_present,'sdkmanager_returncode':code,
                  'guest_or_system_image_or_application_launched':False}))
          except Exception as error:
              allowed = {'SDK_ROOT_NOT_CANONICAL','SDK_MANAGER_NOT_SCOPED','SDK_EMULATOR_PREREQUISITE_MISSING'}
              reason = str(error) if isinstance(error, ValueError) and str(error) in allowed else 'SDK_PREREQUISITE_PREPARATION_FAILED'
              print(json.dumps({'status':'SDK_EMULATOR_PREREQUISITE_BLOCKED',
                  'error_class':type(error).__name__,'reason':reason}))
              raise SystemExit(1)
          PY_SDK_PREREQUISITE
      - name: Diagnose unchanged prelaunch without guest boot or application launch
        shell: bash
        run: env -u BIL_GOOGLE_REVIEWER_EMAIL -u BIL_GOOGLE_REVIEWER_PASSWORD python3 "$RUNNER_TEMP/diagnose_prelaunch.py" --evidence "$GITHUB_WORKSPACE/artifacts/host-prelaunch-safe"
      - name: Preserve bounded safe phase diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil35-prelaunch-cause-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/host-prelaunch-safe/*.json
          if-no-files-found: error
          retention-days: 14
