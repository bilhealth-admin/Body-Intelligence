        run: |
          python3 tool/release/generate_app_link_associations.py --self-test
          node --test tool/release/bilhealth_site_worker.test.mjs
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Targeted regression tests
        run: |
          flutter test --no-pub \
            test/features/community/community_attention_test.dart \
            test/features/community/community_activity_v2_contract_test.dart \
