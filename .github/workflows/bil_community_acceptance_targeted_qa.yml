name: BIL community acceptance targeted QA

concurrency:
  group: bil-community-targeted-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/community-acceptance-notifications-20261003

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/app/router/app_router.dart \
            lib/features/community/domain/community_attention.dart \
            lib/features/community/domain/community_models.dart \
            lib/features/community/domain/community_rewards.dart \
            lib/features/community/domain/community_referral.dart \
            lib/features/community/domain/community_topics.dart \
            lib/features/community/domain/community_circles.dart \
            lib/features/community/domain/community_feed_modes.dart \
            lib/features/community/domain/community_polls.dart \
            lib/features/community/data/community_repository.dart \
            lib/features/community/data/community_post_cloud_store.dart \
            lib/features/community/data/community_feed_repository_mixin.dart \
            lib/features/community/presentation/bil_gold_coin.dart \
            lib/features/community/presentation/community_attention_scope.dart \
            lib/features/community/presentation/community_notifications_page.dart \
            lib/features/community/presentation/community_poll_panel.dart \
            lib/features/community/presentation/community_rewards_page.dart \
            lib/features/community/presentation/community_invite_landing_page.dart \
            lib/features/community/presentation/community_topics_page.dart \
            lib/features/community/presentation/community_circles_page.dart \
            lib/features/community/presentation/community_taxonomy_sheet.dart \
            lib/features/community/presentation/community_post_composer_page.dart \
            lib/features/community/presentation/community_post_card.dart \
            lib/features/community/presentation/community_post_detail_page.dart \
            lib/features/community/presentation/community_gold_balance_action.dart \
            lib/features/community/presentation/community_account_widgets.dart \
            lib/features/community/presentation/community_my_posts_page.dart \
            lib/features/community/presentation/community_member_profile_page.dart \
            lib/features/community/presentation/community_profile_page.dart \
            lib/features/community/presentation/community_people_page.dart \
            lib/features/community/presentation/community_bil_code_page.dart \
            lib/features/community/presentation/community_navigation_sheet.dart \
