name: BIL community acceptance targeted QA

on:
  push:
    branches:
      - fix/community-acceptance-notifications-20261003

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: |
          dart format             lib/features/community/domain/community_attention.dart             lib/features/community/data/community_repository.dart             lib/features/community/presentation/community_attention_scope.dart             lib/features/community/presentation/community_notifications_page.dart             lib/features/notifications/domain/community_deep_link.dart             lib/features/notifications/domain/notification_delivery_preferences.dart             lib/features/notifications/services/community_push_service.dart             lib/features/notifications/presentation/community_push_registration_coordinator.dart             lib/features/notifications/presentation/notification_settings_actions.dart             lib/features/notifications/presentation/notification_settings_page.dart             test/features/community/community_attention_test.dart             test/features/community/community_activity_v2_contract_test.dart             test/features/community/community_activity_v2_client_contract_test.dart             test/features/community/community_friend_acceptance_cloud_contract_test.dart             test/features/community/community_friend_acceptance_notification_contract_test.dart             test/features/community/community_gold_ledger_contract_test.dart             test/features/community/community_reputation_xp_contract_test.dart             test/features/notifications/community_push_registration_contract_test.dart             test/features/notifications/ios_notification_navigation_test.dart
          if ! git diff --quiet; then
            git config user.name "BIL Community QA"
            git config user.email "actions@users.noreply.github.com"
            git add lib/features/community/domain/community_attention.dart lib/features/community/presentation/community_notifications_page.dart
            git commit -m "style(community): format Activity v2 client"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Targeted regression tests
        run: |
          flutter test --no-pub             test/features/community/community_attention_test.dart             test/features/community/community_activity_v2_contract_test.dart             test/features/community/community_activity_v2_client_contract_test.dart             test/features/community/community_authenticated_interaction_test.dart             test/features/community/community_friend_acceptance_cloud_contract_test.dart             test/features/community/community_friend_acceptance_notification_contract_test.dart             test/features/community/community_gold_ledger_contract_test.dart             test/features/community/community_reputation_xp_contract_test.dart             test/features/community/community_connections_contract_test.dart             test/features/notifications/community_push_registration_contract_test.dart             test/features/notifications/ios_notification_navigation_test.dart             test/features/notifications/notification_settings_runtime_contract_test.dart             test/features/notifications/phone_notification_delivery_contract_test.dart
