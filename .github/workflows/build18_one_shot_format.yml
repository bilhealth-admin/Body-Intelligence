name: build18-one-shot-format

on:
  push:
    branches:
      - codex/build18-ai-coach-no-loading-flash-20260913

permissions:
  contents: write

concurrency:
  group: build18-one-shot-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install release Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Format only Build 18 edited test files
        run: |
          dart format             test/epic15_store_screenshot_golden_test.dart             test/features/global_platform/atomic_cas_migration_integrity_test.dart

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --             test/epic15_store_screenshot_golden_test.dart             test/features/global_platform/atomic_cas_migration_integrity_test.dart; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             test/epic15_store_screenshot_golden_test.dart             test/features/global_platform/atomic_cas_migration_integrity_test.dart
          git commit -m "style(build18): apply Dart 3.44.6 formatter"
          git push origin HEAD:codex/build18-ai-coach-no-loading-flash-20260913
