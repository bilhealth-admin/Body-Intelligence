name: BIL untouched baseline diagnostics
on:
  push:
    branches: [fix/community-sapphire-health-3033]
    paths: ['.github/workflows/bil_sapphire_baseline_diagnostics.yml', 'tool/sapphire/run_baseline_diagnostics.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: tool/sapphire
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 59839c7deb4d1cc860275b9e69578e299cc24d0a
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Reproduce baseline without changing a test assertion or golden
        working-directory: baseline
        run: |
          set -euo pipefail
          flutter pub get
          python3 ../tooling/tool/sapphire/run_baseline_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sapphire-baseline-59839-${{ github.run_id }}
          path: /tmp/sapphire-baseline/
          retention-days: 14
