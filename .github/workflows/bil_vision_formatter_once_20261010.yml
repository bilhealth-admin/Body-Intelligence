name: BIL Vision one-shot scoped Flutter formatter
on:
  push:
    branches: [qa/bil-quality-ux-integration-20261009]
    paths:
      - .github/workflows/bil_vision_formatter_once_20261010.yml
permissions:
  contents: write
concurrency:
  group: bil-vision-format-20261010
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/bil-quality-ux-integration-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Format changed Vision Dart sources only
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/nutrition/presentation/meal_vision_premium_review.dart lib/features/nutrition/presentation/meal_vision_premium_visuals.dart lib/features/nutrition/presentation/meal_vision_premium_match.dart test/features/nutrition/meal_vision_premium_review_test.dart
          git diff --check
          git config user.name 'BIL Vision QA formatter'
          git config user.email 'bil-vision-qa@users.noreply.github.com'
          git add -- lib/features/nutrition/presentation/meal_vision_premium_review.dart lib/features/nutrition/presentation/meal_vision_premium_visuals.dart lib/features/nutrition/presentation/meal_vision_premium_match.dart test/features/nutrition/meal_vision_premium_review_test.dart
          if git diff --cached --quiet; then
            echo 'Already formatted; no new commit needed.'
          else
            git commit -m 'style(vision): apply Flutter 3.44.6 formatter to scoped UI and tests'
            git push origin HEAD:refs/heads/qa/bil-quality-ux-integration-20261009
          fi
