name: BIL39 cold Arabic reply measurement diagnostics only

on:
  push:
    branches: [codex/bil39-ipad-reveal-discovery-20261027]

permissions:
  contents: read

concurrency:
  group: bil39-cold-reply-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Original cold Arabic reveal and history; no release acceptance
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Check out exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Select exact CocoaPods in an isolated job gem home
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_install_isolated_cocoapods.py -v
          python3 .github/scripts/install_isolated_cocoapods.py \
            --output artifacts/qa/bil39-cold-ipad/cocoapods-installation.json
      - name: Validate direct VM attachment input boundaries
        run: python3 -m unittest discover -s .github/scripts -p test_bil39_simulator_vm_attach.py -v
      - name: Resolve existing dependencies and native pods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/release/sanitize_flutter_release_plugins.dart --platform=ios --preserve-dev-native-plugins
          pod install --project-directory=ios
      - name: Type-check the actual SwiftUI platform bridge against Flutter and iOS
        shell: bash
        run: |
          flutter precache --ios
          framework=$(python3 - <<'PY'
          import os, pathlib, platform, plistlib
          root = pathlib.Path(os.environ['FLUTTER_ROOT']) / 'bin/cache/artifacts/engine/ios/Flutter.xcframework'
          data = plistlib.loads((root / 'Info.plist').read_bytes())
          matches = [entry for entry in data['AvailableLibraries']
                     if entry.get('SupportedPlatformVariant') == 'simulator'
                     and platform.machine() in entry['SupportedArchitectures']]
          if len(matches) != 1:
              raise RuntimeError('Exact Flutter simulator framework is unavailable')
          print(root / matches[0]['LibraryIdentifier'])
          PY
          )
          xcrun swiftc -typecheck -swift-version 5 \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target "$(uname -m)-apple-ios15.0-simulator" -F "$framework" \
            ios/Runner/BILCoachMarkdownDocument.swift \
            ios/Runner/BILCoachMarkdownView.swift \
            ios/Runner/BILCoachMarkdownBridge.swift
      - name: Exercise original cold Arabic scene on dedicated iPad
        env:
          BIL_NATIVE_DEVICE: ipad
        run: bash .github/scripts/bil39_cold_reveal_diagnostic.sh
      - name: Exercise actual known-width SwiftUI measurement after the cold app
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SWIFT'
          import pathlib,os,shutil,subprocess
          root=pathlib.Path.cwd()
          package=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil39-known-width-package'
          sources=package/'Sources/BILCoachPresentation'
          tests=package/'Tests/BILCoachPresentationTests'
          sources.mkdir(parents=True)
          tests.mkdir(parents=True)
          for name in ['BILCoachMarkdownDocument.swift','BILCoachMarkdownView.swift']:
              shutil.copy2(root/'ios/Runner'/name,sources/name)
          shutil.copy2(root/'tools/qa/swift/coach_presentation/Package.swift',package/'Package.swift')
          shutil.copy2(root/'tools/qa/swift/coach_presentation/CoachMarkdownTests.swift',tests/'CoachMarkdownTests.swift')
          import json
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          device=next(d for runtime,items in devices.items() if '.iOS-' in runtime for d in items if d['name'].startswith('iPad') and d['isAvailable'])
          if device['state']!='Booted':subprocess.run(['xcrun','simctl','boot',device['udid']],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',device['udid'],'-b'],check=True)
          out=root/'artifacts/qa/bil39-cold-ipad'
          with (out/'known-width-swiftui.log').open('wb') as log:
              subprocess.run(['xcodebuild','-scheme','BILCoachPresentation','-destination','platform=iOS Simulator,id='+device['udid'],
                '-derivedDataPath',str(package/'DerivedData'),'-resultBundlePath',str(out/'KnownWidth.xcresult'),
                '-only-testing:BILCoachPresentationTests/CoachMarkdownTests/testKnownWidthPreparesTheRealLongBodyBeforeItsFirstWindowFrame',
                'CODE_SIGNING_ALLOWED=NO','test'],cwd=package,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=900)
          PY_SWIFT
      - name: Upload exact cold reply diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bil39-cold-reply-diagnostics-${{ github.sha }}
          path: artifacts/qa/bil39-cold-ipad
          if-no-files-found: error
          retention-days: 14
