name: BIL guarded association recovery 20261020

on:
  push:
    branches: [ops/site-association-recovery-20261020]
    paths: [.github/workflows/bil_site_association_recovery_20261020.yml]
  workflow_dispatch:
    inputs:
      execute_recovery:
        description: Reapply reviewed visible6bf asset config and exact restoration after every gate; false is read-only preflight
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: bil-public-site-production
  cancel-in-progress: false

jobs:
  guarded-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: tool/release_ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bf23994712ffbdcb2d8179defec5852e5d08ae1
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public_site/
            /tool/release/
            /wrangler.site.jsonc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify controller negative controls without network
        working-directory: controller/tool/release_ops
        run: python3 -m unittest -v test_public_site_diagnosis.py test_site_recovery_20261020.py
      - name: Preserve current version and compare every proposed reachable asset before any mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 controller/tool/release_ops/site_recovery_20261020.py prepare candidate recovery-evidence
      - name: Install pinned Wrangler and its official exported asset collector without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/bil-site-toolchain"
          evidence="$GITHUB_WORKSPACE/recovery-evidence/npm-toolchain"
          mkdir -p "$toolchain" "$evidence"
          cp controller/tool/release_ops/site-recovery-toolchain-package.json "$toolchain/package.json"
          cp "$toolchain/package.json" "$evidence/package.json"
          touch "$toolchain/npm-user-config" "$toolchain/npm-global-config"
          node --version > "$evidence/node-version.txt"
          npm --version > "$evidence/npm-version.txt"
          npm_status=0
          (
            cd "$toolchain"
            NPM_CONFIG_USERCONFIG="$toolchain/npm-user-config" NPM_CONFIG_GLOBALCONFIG="$toolchain/npm-global-config" \
              npm install --ignore-scripts --workspaces=false --no-audit --no-fund \
              --registry=https://registry.npmjs.org/ --cache "$RUNNER_TEMP/bil-site-npm-cache"
          ) > "$evidence/install.log" 2>&1 || npm_status=$?
          if test -f "$toolchain/package-lock.json"; then
            cp "$toolchain/package-lock.json" "$evidence/package-lock.json"
          fi
          python3 - "$RUNNER_TEMP/bil-site-npm-cache/_logs" "$evidence/npm-diagnostic.json" "$npm_status" <<'PY'
          import json, pathlib, re, sys
          logs = pathlib.Path(sys.argv[1])
          reports = []
          for path in sorted(logs.glob("*-debug-*.log")) if logs.is_dir() else []:
              value = path.read_text(encoding="utf-8", errors="replace")
              frames = []
              for line in value.splitlines():
                  if "verbose stack" not in line:
                      continue
                  match = re.search(r"\bat ([A-Za-z0-9_.$<>#]+).*?[/\\]([A-Za-z0-9_.-]+\.js):(\d+):(\d+)", line)
                  if match:
                      frames.append({"function": match[1], "file": match[2], "line": int(match[3]), "column": int(match[4])})
              reports.append({"log_name": path.name, "null_edges_out": "Cannot read properties of null (reading 'edgesOut')" in value,
                  "error_codes": sorted(set(re.findall(r"^\d+ error code ([A-Z0-9_-]+)$", value, flags=re.M))),
                  "stack_frames": frames[:30]})
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"npm_exit_code": int(sys.argv[3]), "debug_summaries": reports,
              "raw_debug_logs_retained": False, "secret_or_environment_values_included": False}, indent=2) + "\n")
          PY
          if test "$npm_status" -ne 0; then
            cat "$evidence/install.log"
            exit "$npm_status"
          fi
      - name: Run complete existing Worker, merge, public policy and generator tests on frozen source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/release/generate_app_link_associations.py --self-test
          node --test tool/release/bilhealth_site_worker.test.mjs tool/release/merge_site_associations.test.mjs tool/release/public_policy_pages.test.mjs
          node ../controller/tool/release_ops/validate_recovered_site.mjs . ../recovery-evidence
      - name: Verify pinned Wrangler dry-run with both restored association files in the local upload inventory
        working-directory: candidate
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/bil-site-toolchain/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.site.jsonc --no-bundle --keep-vars --dry-run --outdir ../recovery-evidence/wrangler-dry-run > ../recovery-evidence/wrangler-dry-run.log 2>&1
          node ../controller/tool/release_ops/verify_official_site_inventory.mjs . ../recovery-evidence "$RUNNER_TEMP/bil-site-toolchain"
      - name: Upload immutable prechange backup before deployment is possible
        id: backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-site-recovery-backup-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Recheck current actor/source/public state and deploy only exact frozen restoration
        if: ${{ success() && inputs.execute_recovery == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 992830d7894ba09161ff0a411fe4154b
          BIL_BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BIL_BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 controller/tool/release_ops/site_recovery_20261020.py deploy candidate recovery-evidence
      - name: Preserve final evidence and any actual failed postchecks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-site-recovery-result-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 30

