name: BIL final source verification and Apple preparation
run-name: Save source-aligned Apple preparation text only
on:
  workflow_dispatch:
  push:
    branches: [ops/store-preparation-20261020]
    paths: [.github/workflows/bil_store_preparation_20261020.yml]
permissions:
  contents: read
env:
  SOURCE_SHA: 6bf23994712ffbdcb2d8179defec5852e5d08ae1
jobs:
  start-requested-checks:
    if: false
    name: Start exact candidate audits and stop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: integration/bil-qa-media-policy-20261011
    steps:
      - name: Start all scoped test workflows without release signing or submission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['TARGET_BRANCH']
          expected=os.environ['SOURCE_SHA']
          specifications=[('full-analysis-and-root-tests', 'bil_owner_comprehensive_validation.yml', {}), ('full-policy-lint-and-fail-closed-certification', 'bil_apple_google_policy_gate.yml', {'evidence_scope': 'full-with-android-lint', 'certify_release': True}), ('android-java-and-apple-swift-native', 'bil_codeql_security_extended.yml', {'android_only': True, 'ios_only': True}), ('isolated-full-auth-rls-storage-realtime-and-deno', 'bil_codeql_security_extended.yml', {'supabase_only': True}), ('reviewer-login-and-credits', 'bil_reviewer_access_preflight.yml', {})]
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil-started-audits'
          out.mkdir(parents=True,exist_ok=True)
          records=[]
          for role,workflow,inputs in specifications:
            identity=subprocess.run(['gh','api',f'repos/{repo}/git/ref/heads/{branch}'],text=True,capture_output=True)
            if identity.returncode or json.loads(identity.stdout)['object']['sha']!=expected:
              records.append({'role':role,'status':'BLOCKED_SOURCE_MOVED'});break
            payload={'ref':branch,'inputs':inputs}
            result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/workflows/{workflow}/dispatches','--input','-'],input=json.dumps(payload),text=True,capture_output=True)
            # Never print credentials or a raw failure body.
            records.append({'role':role,'workflow':workflow,'inputs':inputs,'source_sha':expected,'status':'DISPATCH_ACCEPTED_NOT_PASS' if result.returncode==0 else 'DISPATCH_FAILED'})
            (out/'dispatch-receipts.json').write_text(json.dumps(records,indent=2)+'\n')
          runs=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?head_sha={expected}&event=workflow_dispatch&per_page=100'],text=True,capture_output=True)
          if runs.returncode==0:
            safe=[{k:r.get(k) for k in ('id','name','head_sha','head_branch','status','conclusion','html_url','created_at','path')} for r in json.loads(runs.stdout).get('workflow_runs',[])]
            (out/'observed-runs.json').write_text(json.dumps(safe,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
            stream.write('## Requested checks started; no release action\n\n')
            stream.write(f'Frozen app source: `{expected}`. This controller only dispatches tests. No release signing, upload, rollout, store submission or email send.\n\n')
            for record in records:stream.write(f"- {record['role']}: **{record['status']}**\n")
            stream.write('\nThe owner will inspect results before authorizing the next operation. A green dispatch is not a passed test or store approval.\n')
          if len(records)!=len(specifications) or any(r['status']!='DISPATCH_ACCEPTED_NOT_PASS' for r in records):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-audit-start-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-started-audits/
          if-no-files-found: error
          retention-days: 30
  apple-preparation:
    name: Test guarded writer and inspect live Apple preparation fields
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify all writer safety and exact readback cases offline
        run: node tool/release_ops/align_apple_metadata.test.mjs
      - name: Save only review preparation notes and accurate description with guarded readback
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BIL_APPLE_EXPECTED_SOURCE: 6bf23994712ffbdcb2d8179defec5852e5d08ae1
          BIL_APPLE_METADATA_APPLY: SAVE_REVIEW_PREPARATION_ONLY
          BIL_EXPECTED_NOTE_SHA256: b275bbdb28f4a7174d1ff0dae4ee23c661ec0a31261f043184907d35544bcddd
        run: node tool/release_ops/align_apple_metadata.mjs tool/release_ops/apple-metadata-plan.json "$RUNNER_TEMP/bil-apple-alignment"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bil-apple-alignment-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-apple-alignment/
          if-no-files-found: error
          retention-days: 30
  signing-input-readiness:
    if: false
    name: Signing input presence and immutable source binding readback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report booleans only; never export signing material
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERTIFICATE_SHA256: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID: ${{ secrets.BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID }}
          IOS_AUDITED_SOURCE: ${{ vars.BIL_IOS_V37_AUDITED_SOURCE_SHA }}
          ANDROID_AUDITED_SOURCE: ${{ vars.BIL_ANDROID_V33_AUDITED_SOURCE_SHA }}
          IOS_MANIFEST_DIGEST: ${{ vars.BIL_IOS_V37_STAGING_MANIFEST_SHA256 }}
          ANDROID_MANIFEST_DIGEST: ${{ vars.BIL_ANDROID_V33_STAGING_MANIFEST_SHA256 }}
          PLAY_PROJECT_NUMBER: ${{ vars.BIL_PLAY_INTEGRITY_PROJECT_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bil-signing-inputs"
          python3 - <<'PY'
          import os,json,pathlib,re
          names=['APPLE_DISTRIBUTION_CERTIFICATE_BASE64','APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD','APPLE_PROVISIONING_PROFILE_BASE64','APPLE_TEAM_ID','ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD','ANDROID_UPLOAD_CERTIFICATE_SHA256','BIL_MOBILE_INTEGRITY_BACKEND_RELEASE_ID']
          report={'source':os.environ['SOURCE_SHA'],'secretPresence':{n:bool(os.environ.get(n)) for n in names},'iosAuditedSource':os.environ.get('IOS_AUDITED_SOURCE'),'androidAuditedSource':os.environ.get('ANDROID_AUDITED_SOURCE'),'iosBindingMatchesCurrent':os.environ.get('IOS_AUDITED_SOURCE')==os.environ['SOURCE_SHA'],'androidBindingMatchesCurrent':os.environ.get('ANDROID_AUDITED_SOURCE')==os.environ['SOURCE_SHA'],'iosManifestDigestConfigured':bool(re.fullmatch('[0-9a-f]{64}',os.environ.get('IOS_MANIFEST_DIGEST',''))),'androidManifestDigestConfigured':bool(re.fullmatch('[0-9a-f]{64}',os.environ.get('ANDROID_MANIFEST_DIGEST',''))),'playProjectNumberConfigured':bool(re.fullmatch('[1-9][0-9]+',os.environ.get('PLAY_PROJECT_NUMBER',''))),'signedArtifactCreated':False}
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bil-signing-inputs'/'readiness.json';p.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil-signing-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/bil-signing-inputs/
          if-no-files-found: error
          retention-days: 30

  start-exact-source-live-contracts:
    name: Start final exact-source cloud contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Require exact audited branch and start existing live contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/integration/bil-qa-media-policy-20261011" --jq .object.sha)"
          test "$OBSERVED" = "$SOURCE_SHA"
          gh workflow run bil_live_service_contracts.yml --repo "$GITHUB_REPOSITORY" --ref integration/bil-qa-media-policy-20261011
          echo 'LIVE_CONTRACTS_DISPATCH_ACCEPTED_NOT_PASS' >> "$GITHUB_STEP_SUMMARY"
