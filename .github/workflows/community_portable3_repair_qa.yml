name: BIL Community portable3 repair QA
# Retry after completing the isolated fixture import.

on:
  push:
    branches:
      - work/community-reference-parity-20261003

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Exact formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            test/features/community/community_feed_redesign_regression_test.dart \
            test/features/community/community_review_regression_test.dart
      - name: Full analyze
        run: flutter analyze --no-pub
      - name: Exact failed portable regressions
        run: |
          flutter test --no-pub --reporter expanded \
            test/features/community/community_feed_redesign_regression_test.dart \
            test/features/community/community_review_regression_test.dart
