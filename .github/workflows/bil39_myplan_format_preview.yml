name: BIL39 MyPlan official Dart formatter and focused preview
on:
  push:
    branches:
      - bil39/myplan-20261025
    paths:
      - .github/workflows/bil39_myplan_format_preview.yml
permissions:
  contents: read
concurrency:
  group: bil39-myplan-format-${{ github.sha }}
  cancel-in-progress: false
jobs:
  format-preview:
    name: Exact Dart 3.12 formatter patch and focused tests
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve locked Flutter dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile
      - name: Emit formatter-only patch without committing or pushing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'lib/features/smart_plan/presentation/bil_smart_plan_panel.dart',
            'lib/features/smart_plan/presentation/bil_smart_plan_sections.dart',
            'test/features/smart_plan/bil_smart_plan_visual_surface_test.dart'
          )
          New-Item -ItemType Directory -Force artifacts/qa/bil39-myplan | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw 'SOURCE_SHA_MISMATCH' }
          dart format @targets
          if ($LASTEXITCODE -ne 0) { throw 'DART_FORMATTER_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'FORMATTED_DIFF_INVALID' }
          git diff -- @targets | Out-File -Encoding utf8 artifacts/qa/bil39-myplan/official-format.patch
          '=== Official Dart SDK formatter diff ==='
          git diff -- @targets
          '=== End official formatter diff ==='
          '=== Changed files ==='
          git diff --name-only -- @targets
          '=== SHA ==='
          $actual
      - name: Execute isolated My Plan widget and visual regressions on formatted preview
        shell: pwsh
        run: |
          flutter test --no-pub --concurrency=1 --timeout=5m --reporter expanded `
            test/features/smart_plan/bil_smart_plan_visual_surface_test.dart `
            test/features/smart_plan/bil_smart_plan_page_test.dart `
            test/features/smart_plan/bil_smart_plan_states_visual_test.dart `
            test/features/smart_plan/bil_smart_plan_session_test.dart `
            test/features/smart_plan/bil_smart_plan_overview_finish_test.dart
          exit $LASTEXITCODE
      - name: Upload official patch and limited test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bil39-myplan-format-preview-${{ github.sha }}
          path: artifacts/qa/bil39-myplan/
          if-no-files-found: warn
          retention-days: 10
