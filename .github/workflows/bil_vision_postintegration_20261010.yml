name: BIL Vision post-integration validation
on:
  push:
    branches: [qa/bil-quality-ux-integration-20261009]
    paths:
      - lib/features/nutrition/presentation/meal_vision_premium_review.dart
      - lib/features/nutrition/presentation/meal_vision_premium_visuals.dart
      - lib/features/nutrition/presentation/meal_vision_premium_match.dart
      - test/features/nutrition/meal_vision_premium_review_test.dart
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-vision-postintegration-20261010
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Enforce Dart formatting for scoped Vision files
        run: dart format --output=none --set-exit-if-changed lib/features/nutrition/presentation/meal_vision_premium_review.dart lib/features/nutrition/presentation/meal_vision_premium_visuals.dart lib/features/nutrition/presentation/meal_vision_premium_match.dart test/features/nutrition/meal_vision_premium_review_test.dart
      - run: flutter analyze --no-pub
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - test/features/nutrition/meal_vision_premium_review_test.dart
                    - test/features/nutrition/meal_image_unified_review_contract_test.dart
          - test/features/nutrition/meal_vision_domain_contract_test.dart
          - test/features/nutrition/meal_declared_unit_commit_test.dart
          - test/features/nutrition/meal_item_evidence_snapshot_test.dart
          - test/features/daily_log/meal_photo_initial_action_test.dart
          - test/features/daily_log/daily_log_nutrition_evidence_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --timeout=2m ${{ matrix.suite }}
  baseline-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Audit only. The existing 716/726-line Food Log and meal repository
    # exceed the historic ceiling; this is reported separately, never skipped.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --timeout=2m test/architecture_source_file_size_guard_test.dart
  android:
    needs: [analyze, focused]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
  ios:
    needs: [analyze, focused]
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign --no-pub
