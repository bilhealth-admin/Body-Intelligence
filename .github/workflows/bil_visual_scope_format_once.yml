name: BIL UX scoped Dart format (one-shot)
on:
  push:
    branches: [qa/bil-premium-visual-2026]
    paths:
      - .github/workflows/bil_visual_scope_format_once.yml
permissions:
  contents: write
concurrency:
  group: bil-ux-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/bil-premium-visual-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only working branch with write credentials
        uses: actions/checkout@v4
        with:
          ref: qa/bil-premium-visual-2026
          persist-credentials: true
      - name: Install Flutter formatter only (NO build or release)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Canonical format only modified BIL UX Dart files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'lib/features/analytics/analytics_page.dart'
            'lib/features/analytics/nutrition_analytics_page.dart'
            'lib/features/analytics/weekly_report_page.dart'
            'lib/features/connected_health/connected_health_page.dart'
            'lib/features/connected_health/steps_history_page.dart'
            'lib/features/connected_health/steps_settings_page.dart'
            'lib/features/daily_log/daily_log_meal_search.dart'
            'lib/features/daily_log/daily_log_page.dart'
            'lib/features/daily_log/daily_water_page.dart'
            'lib/features/daily_log/food_log_page.dart'
            'lib/features/history/history_page.dart'
            'lib/features/history/progress_page.dart'
            'lib/features/history/progress_page_components.dart'
            'lib/features/notifications/presentation/notification_settings_page.dart'
            'lib/features/nutrition/food_page.dart'
            'lib/features/nutrition/presentation/food_barcode_scanner_page.dart'
            'lib/features/nutrition/presentation/meal_image_guide_page.dart'
            'lib/features/nutrition/presentation/meal_image_guide_widgets.dart'
            'lib/features/nutrition/presentation/meals_recipes_foods_page.dart'
            'lib/features/onboarding/onboarding_page.dart'
            'lib/features/profile/premium_profile_page.dart'
            'lib/features/profile/profile_summary_page.dart'
            'lib/features/settings/account_deletion_page.dart'
            'lib/features/settings/health_information_sources_page.dart'
            'lib/features/settings/help_center_page.dart'
            'lib/features/settings/language_settings_page.dart'
            'lib/features/settings/legal_document_page.dart'
            'lib/features/settings/location_settings_page.dart'
            'lib/features/settings/reference_goals_page.dart'
            'lib/features/settings/reference_preferences_pages.dart'
            'lib/features/settings/reference_settings_home_page.dart'
            'lib/features/settings/settings_page.dart'
            'lib/features/settings/settings_page_polish.dart'
            'lib/features/settings/sharing_privacy_settings_page.dart'
            'lib/features/settings/trust_support_page.dart'
            'lib/features/visual_2026/bil_calm_visual_scope.dart'
            'lib/features/wellness/presentation/bil_workout_routines_list.dart'
            'lib/features/wellness/presentation/bil_workout_routines_page.dart'
            'lib/features/wellness/presentation/fasting_timer_page.dart'
            'lib/features/wellness/presentation/recipe_library_card.dart'
            'lib/features/wellness/presentation/recipe_library_page.dart'
            'lib/features/wellness/presentation/sleep_tracker_experience.dart'
            'lib/features/wellness/presentation/sleep_tracker_page.dart'
            'lib/features/wellness/presentation/wellness_library_page.dart'
            'lib/features/wellness/presentation/wellness_tools_pages.dart'
            'lib/features/wellness/presentation/workout_library_page.dart'
            'test/premium_ui/bil_calm_visual_scope_test.dart'
            'test/semantic_icon_badge_spacing_test.dart'
          )
          dart format "${files[@]}"
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "style(ux): Dart-format every modified non-protected Flutter file"
            git pull --rebase origin qa/bil-premium-visual-2026
            git push origin HEAD:refs/heads/qa/bil-premium-visual-2026
          fi
          echo "One-shot source format only; NO build or release."
