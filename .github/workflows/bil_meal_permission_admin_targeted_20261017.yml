name: BIL inline meal search and permission UX targeted QA
on:
  push:
    branches:
      - fix/bil-meal-permissions-search-admin-ready-20261017
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Install locked dependencies
        run: flutter pub get
      - name: Format touched files in CI working copy only
        run: |
          dart format \
            lib/features/daily_log/daily_log_page.dart \
            lib/features/daily_log/daily_log_meal_entry.dart \
            lib/features/daily_log/daily_log_meal_search.dart \
            lib/features/daily_log/daily_log_navigation_actions.dart \
            lib/features/daily_log/daily_log_capture_actions.dart \
            lib/features/daily_log/presentation/daily_log_meal_detail_items.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/daily_log/food_log_actions.dart \
            lib/features/nutrition/services/meal_voice_input_service.dart \
            lib/features/nutrition/presentation/food_barcode_scanner_page.dart \
            lib/features/nutrition/presentation/meal_vision_consent_gate.dart \
            lib/features/settings/settings_page.dart \
            lib/app/router/app_router.dart \
            lib/shared/widgets/bil_permission_recovery_dialog.dart \
            test/features/daily_log/diary_search_race_test.dart \
            test/features/daily_log/diary_search_detail_25_locale_test.dart \
            test/features/daily_log/meal_search_prefix_matrix_test.dart \
            test/features/daily_log/daily_log_food_add_flow_test.dart \
            test/features/daily_log/meal_detail_add_button_regression_test.dart \
            test/shared/widgets/bil_permission_recovery_dialog_test.dart \
            test/app/router/mobile_admin_removal_contract_test.dart
          git diff --check
      - name: Analyze touched sources
        run: |
          flutter analyze --no-pub \
            lib/features/daily_log/daily_log_page.dart \
            lib/features/daily_log/daily_log_meal_entry.dart \
            lib/features/daily_log/daily_log_meal_search.dart \
            lib/features/daily_log/daily_log_navigation_actions.dart \
            lib/features/daily_log/daily_log_capture_actions.dart \
            lib/features/daily_log/presentation/daily_log_meal_detail_items.dart \
            lib/features/daily_log/food_log_page.dart \
            lib/features/daily_log/food_log_actions.dart \
            lib/features/nutrition/services/meal_voice_input_service.dart \
            lib/features/nutrition/presentation/food_barcode_scanner_page.dart \
            lib/features/nutrition/presentation/meal_vision_consent_gate.dart \
            lib/features/settings/settings_page.dart \
            lib/app/router/app_router.dart \
            lib/shared/widgets/bil_permission_recovery_dialog.dart \
            test/features/daily_log/diary_search_race_test.dart \
            test/features/daily_log/diary_search_detail_25_locale_test.dart \
            test/features/daily_log/meal_search_prefix_matrix_test.dart \
            test/features/daily_log/daily_log_food_add_flow_test.dart \
            test/features/daily_log/meal_detail_add_button_regression_test.dart \
            test/shared/widgets/bil_permission_recovery_dialog_test.dart \
            test/app/router/mobile_admin_removal_contract_test.dart
      - name: Run focused search, camera, permissions and entry regressions
        run: |
          flutter test --no-pub --concurrency=1 --timeout 8m --reporter expanded \
            test/features/daily_log/diary_search_race_test.dart \
            test/features/daily_log/diary_search_detail_25_locale_test.dart \
            test/features/daily_log/meal_search_prefix_matrix_test.dart \
            test/features/daily_log/daily_log_food_add_flow_test.dart \
            test/features/daily_log/meal_detail_add_button_regression_test.dart \
            test/shared/widgets/bil_permission_recovery_dialog_test.dart \
            test/app/router/mobile_admin_removal_contract_test.dart \
            test/features/daily_log/quick_add_meal_camera_contract_test.dart \
            test/features/daily_log/meal_photo_initial_action_test.dart \
            test/features/nutrition/voice_shared_purpose_behavior_test.dart \
            test/features/nutrition/meal_voice_25_locale_copy_test.dart
      - name: Report formatted source delta for final handoff
        if: always()
        run: |
          git diff --check
          git diff --stat
