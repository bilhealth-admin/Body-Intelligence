name: BIL39 reliability recovery-copy goldens (one-shot)
on:
  push:
    branches:
      - bil39/reliability-20261025
    paths:
      - .github/workflows/bil39-reliability-golden-refresh.yml

permissions:
  contents: write

jobs:
  refresh-recovery-copy-goldens:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Configure reproducible line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out only this Reliability branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Install exact verified Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Regenerate only reviewed My Plan error-recovery snapshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'e2895a684575724dc399d65e4f4c14d0c2c57f8b'
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($parent -ne $expected) { throw "Branch advanced unexpectedly; refusing golden update: $parent" }
          if ($env:GITHUB_REF -ne 'refs/heads/bil39/reliability-20261025') { throw "Unexpected branch $env:GITHUB_REF" }
          flutter --version
          flutter test --no-pub --timeout=3m --update-goldens --plain-name="error real" test/features/smart_plan/bil_smart_plan_states_visual_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Recovery error visual tests failed; no golden baselines committed.' }
          $goldens = @(
            'test/features/smart_plan/goldens/smart_plan_error_en_light.png',
            'test/features/smart_plan/goldens/smart_plan_error_en_dark.png',
            'test/features/smart_plan/goldens/smart_plan_error_ar_light.png',
            'test/features/smart_plan/goldens/smart_plan_error_ar_dark.png'
          )
          $changed = @(git diff --name-only HEAD -- 'test/features/smart_plan/goldens/' | Where-Object { $_.Trim() })
          $outside = @($changed | Where-Object { $goldens -notcontains $_.Replace('\','/') })
          if ($outside.Count -gt 0) { throw "Unreviewed golden changes: $($outside -join ', ')" }
          foreach ($file in $goldens) {
            if (-not (Test-Path $file)) { throw "Expected golden missing: $file" }
            if ($changed -notcontains $file) { throw "Expected recovery-copy golden did not change: $file" }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $goldens
          git rm -- .github/workflows/bil39-reliability-golden-refresh.yml
          git diff --cached --stat
          git commit -m 'test(bil39-reliability): approve localized recovery copy goldens'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:refs/heads/bil39/reliability-20261025
          if ($LASTEXITCODE -ne 0) { throw 'Non-fast-forward or permission denied; do not force push.' }
