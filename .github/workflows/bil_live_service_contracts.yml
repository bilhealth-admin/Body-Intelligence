name: BIL current cloud and independent admin live contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-contracts:
    if: github.ref == 'refs/heads/integration/bil-qa-media-policy-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb
    steps:
      - name: Initialize controlled live-service evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          source = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('Invalid live-service source SHA')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil-cert-live-1'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'live-service-receipt.json').write_text(json.dumps({
              'schema': 'bil.qa.live-service-outcome.v1', 'source_sha': source,
              'status': 'STARTED', 'stage': 'workflow_setup',
              'actual_live_backend_pass': False,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify ledger guard detects source and deployment drift
        run: python3 -m unittest discover -s tool/release_certification -p test_check_cloud_deployment_ledger.py -v
      - name: Real PostgreSQL cache reservation and refund ordering regression
        run: |
          npm ci --prefix supabase/tests --ignore-scripts
          node supabase/tests/vision_cache_reservation_test.mjs
      - name: Actual deployed service roundtrips with disposable fixtures and cleanup
        id: roundtrips
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bil-cert-live-1"
          mkdir -p "$OUT"
          preserve_exit() {
            local code=$?
            trap - EXIT
            printf '%s\n' "$code" > "$OUT/roundtrip-exit-code.txt" || true
            exit "$code"
          }
          trap preserve_exit EXIT
          printf '%s\n' 'live_gate_command' > "$OUT/roundtrip-stage.txt"
          bash tool/release_certification/run_live_gate.sh 1 2>&1 | tee "$OUT/live-gate.log"
          printf '%s\n' 'require_actual_live_pass' > "$OUT/roundtrip-stage.txt"
          grep -Fx 'LIVE_BACKEND_CORE=PASS' "$OUT/status.txt"
      - name: Preserve actual live-service outcome
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          ROUNDTRIP_OUTCOME: ${{ steps.roundtrips.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil-cert-live-1'
          output.mkdir(parents=True, exist_ok=True)
          source = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('Invalid live-service source SHA')
          def read(name):
              path = output / name
              return path.read_text(encoding='utf-8').strip() if path.is_file() else ''
          raw_code = read('roundtrip-exit-code.txt')
          code = int(raw_code) if re.fullmatch('[0-9]{1,3}', raw_code) else None
          stage = read('roundtrip-stage.txt')
          if stage not in ('live_gate_command', 'require_actual_live_pass'):
              stage = 'workflow_setup'
          status = read('status.txt')
          backend = {'LIVE_BACKEND_CORE=PASS': 'PASS', 'LIVE_BACKEND_CORE=FAIL': 'FAIL',
                     'LIVE_BACKEND_CORE=NOT RUN': 'NOT_RUN'}.get(status, 'ABSENT_OR_INVALID')
          prior = os.environ.get('PRIOR_JOB_STATUS', '')
          outcome = os.environ.get('ROUNDTRIP_OUTCOME', '')
          log_present = (output / 'live-gate.log').is_file()
          passed = (prior == 'success' and outcome == 'success' and code == 0 and backend == 'PASS'
                    and stage == 'require_actual_live_pass' and log_present)
          report = {'schema': 'bil.qa.live-service-outcome.v1', 'source_sha': source,
                    'status': 'PASS' if passed else 'FAIL', 'stage': stage,
                    'roundtrip_exit_code': code, 'live_backend_core': backend,
                    'roundtrip_log_present': log_present,
                    'actual_live_backend_pass': passed}
          (output / 'live-service-receipt.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report))
          if prior == 'success' and not passed:
              raise SystemExit('Live-service outcome is not an actual completed PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-live-service-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-live-1/
          if-no-files-found: error
          retention-days: 14

  transactional-cloud-roundtrip:
    name: Transactional live cloud roundtrip
    if: github.ref == 'refs/heads/integration/bil-qa-media-policy-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize controlled transactional cloud evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          source = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('Invalid transactional cloud source SHA')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil-transactional-cloud'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'transactional-cloud-receipt.json').write_text(json.dumps({
              'schema': 'bil.qa.transactional-cloud-roundtrip.v1', 'source_sha': source,
              'status': 'STARTED', 'stage': 'workflow_setup',
              'actual_live_cloud_roundtrip': False, 'rollback_readback_verified': False,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject false CLI success and unproved rollback using offline fixtures
        shell: pwsh
        run: ./tool/release_certification/test_transactional_cloud_roundtrip.ps1
      - name: Execute the exact rollback-only SQL and require actual cleanup readback
        id: transaction
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: ./tool/release_certification/run_transactional_cloud_roundtrip.ps1 -OutputDir "$env:RUNNER_TEMP/bil-transactional-cloud"
      - name: Preserve actual transactional cloud outcome
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          TRANSACTION_OUTCOME: ${{ steps.transaction.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bil-transactional-cloud'
          output.mkdir(parents=True, exist_ok=True)
          path = output / 'transactional-cloud-receipt.json'
          try:
              report = json.loads(path.read_text(encoding='utf-8-sig'))
          except (OSError, ValueError):
              report = {'stage': 'workflow_setup', 'status': 'FAIL'}
          prior, outcome = os.environ['PRIOR_JOB_STATUS'], os.environ['TRANSACTION_OUTCOME']
          passed = (prior == 'success' and outcome == 'success'
                    and report.get('source_sha') == os.environ['GITHUB_SHA']
                    and report.get('status') == 'PASS' and report.get('stage') == 'completed'
                    and report.get('actual_live_cloud_roundtrip') is True
                    and report.get('rollback_readback_verified') is True)
          if not passed:
              report.update(status='FAIL', actual_live_cloud_roundtrip=False)
          report.update(job_prior_status=prior, transaction_step_outcome=outcome)
          path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if prior == 'success' and not passed:
              raise SystemExit('Transactional cloud outcome is not an actual completed PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-transactional-cloud-${{ github.sha }}
          path: ${{ runner.temp }}/bil-transactional-cloud/
          if-no-files-found: error
          retention-days: 14

  guarded-policy-cloud-e2e:
    name: Guarded policy and cloud SQL E2E with independent residue
    needs: live-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exercise SQL outcome and cleanup failure handling without network
        run: python3 -m unittest discover -s tools/qa -p test_bil_release_cloud_e2e.py -v
      - name: Execute all existing synthetic rollback audits, preserving body and ACL guards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p supabase/.temp
          printf '%s' tgmanzhqulksykhslrzb > supabase/.temp/project-ref
          python3 tools/qa/bil_release_cloud_e2e.py --output "$RUNNER_TEMP/bil-policy-cloud-e2e"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-policy-cloud-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/bil-policy-cloud-e2e/
          if-no-files-found: error
          retention-days: 14
