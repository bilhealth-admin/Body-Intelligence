name: BIL current cloud and independent admin live contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-contracts:
    if: github.ref == 'refs/heads/integration/bil-qa-media-policy-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BIL_SUPABASE_PROJECT_REF: tgmanzhqulksykhslrzb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Verify ledger guard detects source and deployment drift
        run: python3 -m unittest discover -s tool/release_certification -p test_check_cloud_deployment_ledger.py -v
      - name: Real PostgreSQL cache reservation and refund ordering regression
        run: |
          npm ci --prefix supabase/tests --ignore-scripts
          node supabase/tests/vision_cache_reservation_test.mjs
      - name: Actual deployed service roundtrips with disposable fixtures and cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          bash tool/release_certification/run_live_gate.sh 1
          grep -Fx 'LIVE_BACKEND_CORE=PASS' "$RUNNER_TEMP/bil-cert-live-1/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bil-live-service-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/bil-cert-live-1/
          if-no-files-found: error
          retention-days: 14
