name: BIL reference native candidate
on:
  workflow_dispatch:
  push:
    branches: [qa/coach-community-next-20261005]
    paths:
      - lib/features/community/presentation/**
      - lib/features/intelligence_center/presentation/**
      - lib/shared/widgets/bil_reference_bottom_bar.dart
      - test/qa_next/**
      - .github/workflows/bil_reference_native_candidate.yml
permissions:
  contents: read
concurrency:
  group: bil-reference-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-and-test:
    if: github.repository == 'bilhealth-admin/Body-Intelligence' && github.ref == 'refs/heads/qa/coach-community-next-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Resolve original locked packages
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bil-reference
          flutter --version --machine > /tmp/bil-reference/toolchain.json
          flutter pub get --enforce-lockfile 2>&1 | tee /tmp/bil-reference/pub.log
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Record exact tracked source without transformations
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/qa_next/apply_reference_visual_candidate.py
          git diff --exit-code
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('/tmp/bil-reference')
          files=subprocess.check_output(['git','diff','--name-only','3f0085e6e6686f2e87e9cf14789e9e578ea64159','HEAD'],text=True).splitlines()
          rows=[{'path':p,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in files if pathlib.Path(p).is_file() and pathlib.Path(p).suffix=='.dart']
          root.joinpath('effective-source.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_manifest':rows,'reference_parity_verified':False,'store_build_created':False,'production_connected':False},indent=2)+'\n')
          root.joinpath('scope.txt').write_text('Actual Flutter host-rendered widgets from the exact tracked commit. Synthetic fixtures and disposable SQLite. Not a physical-device or live-production E2E claim. No store build or deployment.\n')
          PY
      - name: Disclose bounded formatter proposal without changing tested source
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/qa_next/format_proposal.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('/tmp/bil-next-qa/formatter-proposal.patch').read_bytes()
          Path('/tmp/bil-reference/formatter-proposal.patch').write_bytes(data)
          print('Formatter proposal SHA256: ' + hashlib.sha256(data).hexdigest())
          print(data[:40000].decode('utf-8', errors='replace'))
          if len(data) > 40000:
              print('Proposal display truncated; complete patch is in artifact.')
          PY
          git diff --exit-code
      - name: Analyze exact source
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: set -o pipefail; flutter analyze --no-pub 2>&1 | tee /tmp/bil-reference/analyze.log
      - name: Exercise actual shared dock and Community Quick Add navigation
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: set -o pipefail; flutter test --no-pub --reporter expanded test/qa_next/reference_navigation_behavior_test.dart --timeout 2m 2>&1 | tee /tmp/bil-reference/navigation-tests.log
      - name: Render and exercise actual Coach widgets
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          BIL_REFERENCE_CAPTURE_DIR: /tmp/bil-reference/coach
        shell: bash
        run: set -o pipefail; flutter test --no-pub --reporter expanded test/qa_next/coach_reference_workspace_capture_test.dart --timeout 2m 2>&1 | tee /tmp/bil-reference/coach-tests.log
      - name: Render actual Community surfaces and large-text states
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          BIL_COMMUNITY_CAPTURE_DIR: /tmp/bil-reference/community
        shell: bash
        run: set -o pipefail; flutter test --no-pub --reporter expanded test/features/community/community_polish_visual_test.dart --timeout 2m 2>&1 | tee /tmp/bil-reference/community-tests.log
      - name: Preserve behavior accessibility and translation contracts
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/community/community_inbox_resume_regression_test.dart test/features/community/community_reference_composer_v1_test.dart test/features/intelligence_center/ai_coach_tool_execution_behavior_test.dart test/features/intelligence_center/coach_page_lifecycle_regression_test.dart test/architecture_source_file_size_guard_test.dart test/qa_next/next_workspace_locale_test.dart test/localization/bil_25_locale_fallback_closure_test.dart --timeout 2m 2>&1 | tee /tmp/bil-reference/behavior-tests.log
      - name: Verify renderer never changed source
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        run: git diff --exit-code
      - name: Upload actual Flutter PNGs and failure logs, never fonts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bil-reference-native-${{ github.sha }}
          path: /tmp/bil-reference
          retention-days: 1
          if-no-files-found: error
