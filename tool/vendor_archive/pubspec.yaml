name: archive
version: 4.0.9
publish_to: none
description: >-
  BIL compatibility fork for unencrypted archives. Password encryption and
  embedded cryptographic implementations are deliberately disabled.
repository: https://github.com/brendan-duncan/archive
topics:
  - archive
  - zip
  - tar
  - gzip
  - xz
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  path: ^1.8.0
  posix: ^6.0.2

dev_dependencies:
  build_runner: ^2.4.14
  build_web_compilers: ^4.1.0
  http: ^1.1.0
  lints: ^4.0.0
  test: ^1.24.6
  web: ^1.1.0
