name: body_intelligence_log
description: "Private, explainable body intelligence and nutrition tracking."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.4.0
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.3
  archive: ^4.0.7
  pdf: ^3.11.3
  supabase_flutter: ^2.16.0
  supabase: ^2.14.0
  flutter_svg: ^2.2.0
  share_plus: ^13.2.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  country_picker: ^2.0.28
  flutter_timezone: ^5.1.0
  mobile_scanner: ^7.4.0
  simple_barcode_scanner: ^0.6.0
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  image: ^4.9.1
  camera: ^0.12.0+2
  camera_windows: ^0.2.6+4
  flutter_local_notifications: ^22.2.0
  permission_handler: ^12.0.3
  timezone: ^0.11.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11
  in_app_review: ^2.0.12
  app_links: ^7.0.0
  video_player: ^2.13.0
  google_mobile_ads: ^9.1.0
  # 7.1+ references the iOS 26-only NWPath.isUltraConstrained symbol at
  # compile time. Keep the cloud/release Xcode matrix compatible until the
  # minimum Apple toolchain includes that SDK.
  connectivity_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.0.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

# Keep Supabase deep links on the audited current release. Its Android module
# uses AGP 9.2, matching the app toolchain configured under android/.
dependency_overrides:
  app_links:
    path: tool/vendor_app_links

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/branding/bil_wordmark_registered_blue.svg
    - assets/branding/bil_wordmark_registered_white.svg
    - assets/branding/bil_splash_identity.png
    - assets/branding/bil_splash_motion.mp4
    - assets/branding/google_g.svg
    # Ship only recipe art consumed by the app. The generated source-image
    # archive remains in the repository but must not inflate the APK/AAB.
    - assets/images/professional/mediterranean_protein_bowl.png
    - assets/images/professional/strength_training_cover.png
    - assets/images/professional/recipes/bean_corn_salad.jpg
    - assets/images/professional/recipes/chicken_shawarma_bowl.jpg
    - assets/images/professional/recipes/chicken_sweet_potato.jpg
    - assets/images/professional/recipes/chickpea_herb_salad.jpg
    - assets/images/professional/recipes/grilled_fish_vegetables.jpg
    - assets/images/professional/recipes/hummus_falafel_plate.jpg
    - assets/images/professional/recipes/lentil_soup.jpg
    - assets/images/professional/recipes/mediterranean_chicken_bowl.jpg
    - assets/images/professional/recipes/overnight_oats_figs.jpg
    - assets/images/professional/recipes/quinoa_tabbouleh.jpg
    - assets/images/professional/recipes/roasted_quinoa_bowl.jpg
    - assets/images/professional/recipes/salmon_avocado_bowl.jpg
    - assets/images/professional/recipes/shakshuka.jpg
    - assets/images/professional/recipes/shrimp_rice_bowl.jpg
    - assets/images/professional/recipes/spinach_omelet.jpg
    - assets/images/professional/recipes/tofu_vegetable_stir_fry.jpg
    - assets/images/professional/recipes/vegetable_lentil_stew.jpg
    - assets/images/professional/recipes/yogurt_oat_bowl.jpg
    - assets/images/professional/workouts/
    - assets/images/brand/generated/
    - assets/images/workouts/
    - assets/images/nutrition_plans/
    - assets/images/dashboard/
    - assets/images/daily_context/
    # Spring lifestyle art for the half-height Quick Add glass surface.
    - assets/images/quick_add/
    - assets/images/commerce/
    - assets/images/ai_coach/
    - assets/catalogs/bil_food_core.sqlite
    # Release catalogs are metadata-only runtime assets. Workout media remains
    # blocked until an independently reviewed, hash-verified content pack is
    # installed. The recipe index is parsed off the UI isolate and full records
    # are loaded from bounded, hash-verified shards on demand. Recipe pixels are
    # deliberately not bundled here.
    - assets/catalogs/recipes/v1/
    - assets/catalogs/recipes/v1/shards/
    - artifacts/workout_media/workout_release_bundle_registry_v1.json
    - artifacts/workout_media/workout_release_bundle_home_v1.json
    - artifacts/workout_media/workout_release_bundle_gym_six_month_v1.json
    - artifacts/workout_media/workout_owner_approval_home_200.json
    - artifacts/workout_media/workout_owner_approval_gym_102.json
    - assets/images/v10_master/bil_hologram_master.png
    - assets/images/v10_master/bil_hdr_starfield_master.png
    - assets/images/dashboard/bil_body_profile.svg
    - assets/images/connected_health/bil_medical_hub.png
    - assets/images/flagship/bil_body_intelligence_journey_v1.png
    - assets/images/flagship/bil_meal_discovery_v1.png
    - assets/images/flagship/bil_meal_discovery_v2.png
    - assets/images/flagship/bil_sleep_insights_v2.png
    - assets/images/flagship/bil_movement_v1.png
    - assets/images/flagship/bil_fasting_rhythm_v1.png
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/fonts/OFL.txt
    - lib/l10n/app_en.arb
    - lib/l10n/app_ar.arb
    - lib/l10n/app_fr.arb
    - lib/l10n/app_es.arb
    - lib/l10n/app_tr.arb
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  fonts:
    - family: BILArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/bil_app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: assets/branding/bil_app_icon.png
  adaptive_icon_foreground_inset: 8
  web:
    generate: true
    image_path: assets/branding/bil_app_icon.png
    background_color: "#050505"
    theme_color: "#050505"
  windows:
    generate: true
    image_path: assets/branding/bil_app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/bil_app_icon.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
